<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Voting Charts</title>
  <!-- The voting charts moved (2026-10-21): each Total Drama season's chart is
       in its own Vote History tab (season_ref.html?season=N#history, drawn by
       js/vote-chart.js; seasons 1-9 from data/vote-charts.json). This page only
       sends old links there: ?season=N goes to that season, anything else to
       the season list. -->
  <script>
    (function () {
      var n = new URLSearchParams(location.search).get('season');
      location.replace(/^\d+$/.test(n || '') ? 'season_ref.html?season=' + n + '#history' : 'seasons.html');
    })();
  </script>
</head>
<body>
  <p>The voting charts are now in each season's <a href="seasons.html">Vote History</a>.</p>
</body>
</html>
