<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramagram</title>
<!--
  DRAMAGRAM — the directory.

  Design: docs/superpowers/specs/2026-08-18-dramagram-design.md
  Model:  js/dramagram.js

  Step 1 of the build order: the grid, and nothing else. No posts yet. It is
  useful on its own and it proves the derived follower model against real data
  before anything depends on it.

  ── ITS OWN PAGE, NOT A THIRD PANE IN social.html ──

  Birdie and ChatAlumni are EPISODE-SCOPED: that page is driven by season and
  episode pickers and social-page.js is eleven hundred lines of feed engine.
  Dramagram is a directory of people across all time, which is a different shape
  entirely. It gets a third button in that app switcher and lives here, so the
  feed engine is not entangled with something that has no episode at all.

  ── ITS OWN LOOK ──

  Birdie is paper white and slate; ChatAlumni is cream and bottle green. Neither
  shares a colour, a typeface or a corner radius with the other, deliberately.
  This is the third: near-black, photo-first, one warm accent, square corners.
  No borrowed brand.
-->
<link rel="stylesheet" href="styles.css">
<style>
  #dg{
    --dg-bg:#0c0c0e; --dg-card:#141416; --dg-line:#26262b;
    --dg-ink:#f2f0ee; --dg-dim:#8b8781; --dg-hot:#ff7a4d;
    --dg-live:#3ddc84; --dg-seq:#5b6070;
    background:var(--dg-bg); color:var(--dg-ink);
    font:15px/1.5 ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    padding:22px 20px 70px;
  }
  #dg *{box-sizing:border-box}
  .dg-wrap{max-width:1140px;margin:0 auto}
  .dg-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
  .dg-logo{font-size:27px;font-weight:800;letter-spacing:-.03em;
    background:linear-gradient(92deg,var(--dg-hot),#ffc14d);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .dg-sub{color:var(--dg-dim);font-size:13.5px}
  /* The app switcher, in this app's language rather than the other two's. */
  .dg-apps{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
  .dg-apps a,.dg-apps span{display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:2px;font-size:13.5px;font-weight:700;
    text-decoration:none;border:1px solid var(--dg-line);color:var(--dg-dim)}
  .dg-apps a:hover{color:var(--dg-ink);border-color:var(--dg-dim)}
  .dg-apps span{color:var(--dg-bg);background:var(--dg-hot);border-color:var(--dg-hot)}
  .dg-back{color:var(--dg-hot);text-decoration:none;font-weight:600;font-size:13px}
  /* `display:flex` on the bar and the grid beats the hidden ATTRIBUTE, so
     hiding them in JS did nothing visible — the search bar sat over the
     profile it could not search. One rule, for every element on the page. */
  [hidden]{display:none !important}
  .dg-return{display:inline-block;margin:0 0 14px}
  .dg-pager{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:16px;
    padding:18px 0 6px;color:var(--dg-dim);font-size:13px}
  .dg-pager button{background:none;border:1px solid var(--dg-line);color:var(--dg-ink);
    padding:8px 16px;border-radius:2px;font:inherit;font-size:13px;cursor:pointer}
  .dg-pager button:disabled{opacity:.35;cursor:default}
  .dg-pager button:not(:disabled):hover{border-color:var(--dg-dim)}
  /* Mood cards: the register is the colour. */
  .dg-mood[data-mood="flex"]{background:linear-gradient(160deg,#2a1a08,#171006)}
  .dg-mood[data-mood="flirty"]{background:linear-gradient(160deg,#2a0f1d,#170810)}
  .dg-mood[data-mood="soft"]{background:linear-gradient(160deg,#122016,#0a130d)}
  .dg-mood[data-mood="low"]{background:linear-gradient(160deg,#14171f,#0b0d12)}
  .dg-mood[data-mood="sharp"]{background:linear-gradient(160deg,#220a0a,#130606)}
  .dg-mood[data-mood="chaos"]{background:linear-gradient(160deg,#1f1226,#110a15)}
  .dg-mood[data-mood="nostalgic"]{background:linear-gradient(160deg,#1e1a10,#12100a)}
  .dg-libit select.mood{position:absolute;left:4px;bottom:4px;right:4px;width:calc(100% - 8px);
    background:rgba(0,0,0,.75);color:var(--dg-ink);border:1px solid var(--dg-line);
    font-size:10.5px;padding:2px 3px;border-radius:2px}
  .dg-libit.posted img{opacity:.55}
  .dg-postedtag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.75);
    color:var(--dg-dim);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:2px 6px;border-radius:2px}
  .dg-return:hover{text-decoration:underline}
  .dg-rel{display:inline-flex;align-items:center;gap:5px;color:var(--dg-hot);font-weight:600}

  .dg-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 16px}
  .dg-in,.dg-sel{background:var(--dg-card);border:1px solid var(--dg-line);color:var(--dg-ink);
    border-radius:2px;padding:9px 12px;font:inherit;font-size:14px}
  .dg-in{min-width:250px;flex:1}
  .dg-in::placeholder{color:var(--dg-dim)}
  .dg-chip{background:none;border:1px solid var(--dg-line);color:var(--dg-dim);
    border-radius:2px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .dg-chip[aria-pressed=true]{color:var(--dg-bg);background:var(--dg-ink);border-color:var(--dg-ink)}
  .dg-count{color:var(--dg-dim);font-size:13px;margin-left:auto}

  .dg-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .dg-cell{background:var(--dg-card);border:1px solid var(--dg-line);border-radius:2px;
    overflow:hidden;text-decoration:none;color:inherit;display:block;
    transition:border-color .12s,transform .12s}
  .dg-cell:hover{border-color:var(--dg-hot);transform:translateY(-2px)}
  .dg-pic{position:relative;aspect-ratio:1;background:#1b1b1f;display:block;width:100%}
  .dg-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .dg-pic .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:#3a3a42;letter-spacing:-.04em}
  /* The dot. Sequestered is not "offline" — it is a houseguest with no phone,
     so it reads as a distinct state rather than as absence. */
  .dg-dot{position:absolute;left:9px;bottom:9px;width:11px;height:11px;border-radius:50%;
    border:2px solid var(--dg-card);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .dg-dot[data-s=active]{background:var(--dg-live)}
  .dg-dot[data-s=quiet]{background:#4a4a52}
  .dg-dot[data-s=sequestered]{background:var(--dg-seq);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 4px rgba(91,96,112,.25)}
  .dg-meta{padding:9px 11px 11px}
  .dg-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dg-tick{color:#4db2ff;flex:0 0 auto}
  .dg-foll{color:var(--dg-dim);font-size:12.5px;margin-top:2px}
  .dg-foll b{color:var(--dg-ink);font-weight:700}
  .dg-delta{font-size:11px;font-weight:700;margin-left:6px}
  .dg-delta.up{color:var(--dg-live)} .dg-delta.down{color:#ff6b6b}
  .dg-seqline{color:var(--dg-seq);font-size:11.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;margin-top:3px}
  .dg-empty{color:var(--dg-dim);text-align:center;padding:60px 20px}

  /* ── the profile ── */
  .dg-prof{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 26px}
  .dg-prof-pic{width:132px;height:132px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:2px solid var(--dg-line);background:#1b1b1f}
  .dg-prof-pic.fb{display:flex;align-items:center;justify-content:center;font-size:44px;
    font-weight:800;color:#3a3a42}
  .dg-prof-body{flex:1;min-width:260px}
  .dg-prof-name{font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px}
  .dg-stats{display:flex;gap:24px;margin:12px 0 10px;flex-wrap:wrap}
  .dg-stat b{font-size:17px;font-weight:800}
  .dg-stat span{color:var(--dg-dim);font-size:13px;margin-left:5px}
  .dg-bio{color:var(--dg-dim);font-size:13.5px;line-height:1.6;max-width:60ch}
  .dg-bio b{color:var(--dg-ink);font-weight:600}

  .dg-posts{display:grid;gap:4px;grid-template-columns:repeat(3,1fr);margin-top:8px}
  @media(max-width:640px){.dg-posts{gap:2px}}
  .dg-post{position:relative;aspect-ratio:1;overflow:hidden;background:#141416;
    border:0;padding:0;cursor:pointer;display:block;width:100%;font:inherit;color:inherit;text-align:left}
  .dg-post img{width:100%;height:100%;object-fit:cover;display:block}
  /* The card a post becomes when no photograph fits. Designed rather than
     blank: the grid has to stay a grid. */
  .dg-card{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:14px;gap:6px}
  .dg-card .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(0,0,0,.45)}
  .dg-card .t{font-size:13.5px;font-weight:700;line-height:1.3;color:rgba(0,0,0,.82)}
  .dg-card[data-sig=major]{background:linear-gradient(150deg,#ffb36b,#ff7a4d)}
  .dg-card[data-sig=notable]{background:linear-gradient(150deg,#9fd9c7,#6fb9a5)}
  .dg-card[data-sig=minor]{background:linear-gradient(150deg,#3a3a42,#2a2a31)}
  .dg-card[data-sig=minor] .k{color:rgba(255,255,255,.40)}
  .dg-card[data-sig=minor] .t{color:rgba(255,255,255,.80)}
  .dg-post .when{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;font-size:10.5px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.65))}

  .dg-open{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:60}
  .dg-open-in{background:var(--dg-card);border:1px solid var(--dg-line);max-width:520px;width:100%;
    max-height:86vh;overflow:auto}
  .dg-open-media{aspect-ratio:1;background:#111}
  .dg-open-media img{width:100%;height:100%;object-fit:cover;display:block}
  .dg-open-body{padding:15px 17px 18px}
  .dg-open-cap{font-size:15px;line-height:1.55}
  .dg-open-meta{color:var(--dg-dim);font-size:12px;margin-top:10px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:700}
  /* What they said, then what happened, then the room. */
  .dg-open-fact{color:var(--dg-dim);font-size:12.5px;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--dg-line);line-height:1.5}
  .dg-comments{margin-top:12px;display:grid;gap:7px}
  .dg-c{font-size:13.5px;line-height:1.45}
  .dg-c b{font-weight:700;margin-right:5px}
  .dg-c[data-rel=rival]{color:var(--dg-dim)}
  /* -- curation -- */
  .dg-manage{margin:22px 0 0;border-top:1px solid var(--dg-line);padding-top:18px}
  .dg-manage h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dg-dim);
    margin:0 0 12px;font-weight:800}
  .dg-drop{border:1px dashed var(--dg-line);border-radius:2px;padding:20px;text-align:center;
    color:var(--dg-dim);font-size:13.5px;cursor:pointer;transition:border-color .12s,color .12s}
  .dg-drop:hover,.dg-drop.over{border-color:var(--dg-hot);color:var(--dg-ink)}
  .dg-drop.busy{opacity:.6;pointer-events:none}
  .dg-fill{margin:10px 0 0;background:none;border:1px solid var(--dg-line);color:var(--dg-ink);
    padding:9px 16px;border-radius:2px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .dg-fill:hover{border-color:var(--dg-hot);color:var(--dg-hot)}
  .dg-fill:disabled{opacity:.5;cursor:default}
  .dg-lib{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));margin-top:12px}
  .dg-libit{position:relative;aspect-ratio:1;background:#1b1b1f;overflow:hidden}
  .dg-libit img{width:100%;height:100%;object-fit:cover;display:block}
  .dg-libit button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
    border:0;background:rgba(0,0,0,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer}
  .dg-libit button:hover{background:#ff6b6b}
  .dg-libit .pin{position:absolute;left:4px;bottom:4px;top:auto;right:auto;width:auto;height:auto;
    background:rgba(0,0,0,.72);color:#fff;border-radius:2px;font-size:10px;font-weight:800;
    letter-spacing:.06em;padding:3px 6px;text-transform:uppercase}
  .dg-libit .pin.on{background:var(--dg-hot);color:#111}
  .dg-libit .pin:hover{background:var(--dg-hot);color:#111}
  .dg-note{color:var(--dg-dim);font-size:12.5px;margin-top:10px;line-height:1.5}
  .dg-close{margin-top:14px;background:none;border:1px solid var(--dg-line);color:var(--dg-dim);
    padding:8px 14px;border-radius:2px;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header class="modern-header" id="modernHeader">
  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="brand-section" aria-label="Go to home">
        <div class="brand-icon"><span class="brand-logo-text">⚡</span></div>
        <div class="brand-content">
          <h1>DC <span class="brand-gradient">Franchise</span> Database</h1>
          <p class="brand-subtitle">Dramagram</p>
        </div>
      </a>
    </div>
    <nav class="header-nav" aria-label="Primary navigation"><ul class="nav-list"></ul></nav>
  </div>
</header>

<div id="dg">
  <div class="dg-wrap">
    <div class="dg-head">
      <span class="dg-logo">Dramagram</span>
      <span class="dg-sub" id="dg-now"></span>
    </div>

    <!-- THE SAME THREE APPS, FROM HERE TOO.
         There was only a one-way link back, so Dramagram was somewhere you
         could arrive at and not leave by the way you came. Birdie and
         ChatAlumni live on social.html and take an ?app= parameter; this one is
         the page you are on, so it is marked rather than linked. -->
    <nav class="dg-apps" aria-label="Choose an app">
      <a href="social.html?app=birdie">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 15c4-1 6-4 7-7 1 3 4 5 8 5-1 4-5 7-9 7H4l2-3z" fill="currentColor"/></svg>
        Birdie
      </a>
      <a href="social.html?app=chatalumni">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        ChatAlumni
      </a>
      <!-- A SPAN ON THE DIRECTORY, A LINK EVERYWHERE ELSE.
           Marked as the current page is right when you are looking at the
           directory and wrong when you are two clicks into somebody's profile:
           it was the one control that looked like the way home and did nothing
           when pressed. Swapped for a link by the boot code below. -->
      <span id="dg-here" aria-current="page">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
        Dramagram
      </span>
    </nav>

    <div class="dg-bar">
      <input class="dg-in" id="dg-q" type="search" placeholder="Search by name…" aria-label="Search by name">
      <select class="dg-sel" id="dg-sort" aria-label="Sort">
        <option value="followers">Most followers</option>
        <option value="followers-asc">Fewest followers</option>
        <option value="name">Name A–Z</option>
        <option value="recent">Recently active</option>
      </select>
      <!-- No show filter here on purpose: the site header already carries a
           global one, and two filters for the same idea on one page is the
           worst version of both. This page listens to that one. -->
      <span class="dg-count" id="dg-count"></span>
    </div>

    <div class="dg-grid" id="dg-grid"></div>
    <div id="dg-profile" hidden></div>
  </div>
</div>

<script type="module" src="js/site-header.js"></script>
<script type="module">
import { directory, short, postsFor, followerHistory, tiesFor, relationshipStatus }
  from './js/dramagram.js';
import { lineFor } from './js/life-events.js';
import { captionFor, commentsFor, momentCaption, momentComments, MOODS }
  from './js/dramagram-voice.js';
import { socialGraph } from './js/life-resolver.js';
// The gallery IO, shared with player.html: one slot allocator, one encoder,
// and one place that knows the listing cache rule.
import { uploadMany, deleteImage, imageUrl, GALLERY_MAX,
  galleryFull, setImageMeta, postPhoto, fetchPins }
  from './js/gallery-io.js';
import { fillFromWiki } from './js/wiki-art.js';
import { careersIn } from './js/records.js';
import { airLabel, latestAired } from './js/franchise-calendar.js';
import { currentShow } from './js/show-switcher.js';

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let rows = [];
let show = 'all';

const initials = n => String(n).split(/[\s-]+/).map(w => w[0] || '').join('').slice(0,2).toUpperCase();

function cell(d) {
  const delta = d.lastDelta
    ? `<span class="dg-delta ${d.lastDelta > 0 ? 'up' : 'down'}">${
        d.lastDelta > 0 ? '+' : '−'}${short(Math.abs(d.lastDelta))}</span>` : '';
  const face = pinsBySlug[d.slug]
    ? imageUrl(d.slug, pinsBySlug[d.slug])
    : `assets/avatars/${encodeURIComponent(d.slug)}.png`;
  return `<a class="dg-cell" href="dramagram.html?player=${encodeURIComponent(d.slug)}">
    <span class="dg-pic">
      <img src="${esc(face)}" alt="" loading="lazy"
        onerror="this.outerHTML='<span class=\\'fb\\'>${esc(initials(d.name))}</span>'">
      <span class="dg-dot" data-s="${d.status}" title="${esc(d.statusLabel)}"></span>
    </span>
    <span class="dg-meta">
      <span class="dg-name">${esc(d.name)}${d.verified
        ? '<svg class="dg-tick" width="13" height="13" viewBox="0 0 24 24" aria-label="verified">'
          + '<path fill="currentColor" d="M12 2l2.4 2.1 3.2-.4 1 3 2.8 1.6-1.2 3 1.2 3-2.8 1.6-1 3-3.2-.4L12 22l-2.4-2.1-3.2.4-1-3L2.6 15.7l1.2-3-1.2-3 2.8-1.6 1-3 3.2.4z"/>'
          + '<path fill="#141416" d="M10.8 15.4l-3-3 1.3-1.3 1.7 1.7 4-4 1.3 1.3z"/></svg>'
        : ''}</span>
      <span class="dg-foll"><b>${short(d.followers)}</b> followers${delta}</span>
      ${d.status === 'sequestered' ? '<span class="dg-seqline">in the house</span>' : ''}
    </span>
  </a>`;
}

function render() {
  const q = $('#dg-q').value.trim().toLowerCase();
  const sort = $('#dg-sort').value;
  let list = rows.filter(d => (show === 'all' || d.shows.includes(show))
    && (!q || d.name.toLowerCase().includes(q)));
  if (sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'followers-asc') list = list.slice().sort((a, b) => a.followers - b.followers);
  if (sort === 'recent') {
    const rank = { active: 0, sequestered: 1, quiet: 2 };
    list = list.slice().sort((a, b) => rank[a.status] - rank[b.status] || b.followers - a.followers);
  }
  $('#dg-count').textContent = `${list.length} profile${list.length === 1 ? '' : 's'}`;
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (page >= pages) page = pages - 1;
  const shown = list.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
  const pager = pages > 1
    ? `<div class="dg-pager">
        <button data-pg="-1" ${page === 0 ? 'disabled' : ''}>← Previous</button>
        <span>Page ${page + 1} of ${pages}</span>
        <button data-pg="1" ${page === pages - 1 ? 'disabled' : ''}>Next →</button>
      </div>`
    : '';
  $('#dg-grid').innerHTML = shown.length
    ? shown.map(cell).join('') + pager
    : '<p class="dg-empty">Nobody by that name.</p>';
  $('#dg-grid').querySelectorAll('[data-pg]').forEach(b => {
    b.onclick = () => {
      page += Number(b.dataset.pg);
      render();
      // A new page starts at its top; keeping the old scroll shows its bottom.
      $('#dg-grid').scrollIntoView({ block: 'start', behavior: 'instant' });
    };
  });
}

/**
 * One profile: the header, and their approved life events as a grid.
 *
 * A post takes a photograph when the folder has an unused one and otherwise
 * renders as a designed card — the galleries are character art and there is no
 * wedding photo of anybody, so nothing here claims a picture is of the thing it
 * sits beside.
 */
async function renderProfile(slug) {
  viewing = slug;
  const d = rows.find(x => x.slug === slug);
  $('#dg-grid').hidden = true;
  // The search and the sort belong to the DIRECTORY. On a profile they were
  // still sitting there, offering to sort a list that is not on screen.
  $('.dg-bar').hidden = true;
  // And the app chip stops claiming you are already where it would take you.
  const here = $('#dg-here');
  if (here && here.tagName === 'SPAN') {
    here.outerHTML = here.outerHTML
      .replace('<span id="dg-here" aria-current="page">', '<a id="dg-here" href="dramagram.html">')
      .replace(/<\/span>$/, '</a>');
  }
  const host = $('#dg-profile');
  host.hidden = false;
  if (!d) { host.innerHTML = '<p class="dg-empty">No such profile.</p>'; return; }

  const gal = await galleryFull(slug, { fresh: true }).catch(() => ({ images: [], posted: [] }));
  const posts = postsFor(slug, {
    events: allEvents, seasons: allSeasons, gallery: gal,
    career: allCareers.find(c => c.id === slug) || null,
    archetype: archetypeBySlug[slug] || '',
  });
  const h = followerHistory(slug, { careers: allCareers, seasons: allSeasons, events: allEvents });
  const bio = d.bio || {};
  // Read off the same approved events as the posts, so the two cannot disagree:
  // the post that says they moved in together is what makes this say "Living
  // with Owen".
  const rel = relationshipStatus(slug, { events: allEvents, seasons: allSeasons, names: namesBySlug });
  const bioLine = [bio.occupation, bio.hometown].filter(Boolean).join(' · ');

  host.innerHTML = `
    <!-- THE WAY BACK. Opening a profile is a real navigation, so the browser
         button always worked — but the page itself had no visible way out once
         the app switcher replaced the old link, and a page you can only leave
         by browser chrome is one you are stuck on. -->
    <a class="dg-back dg-return" href="dramagram.html">← All profiles</a>
    <div class="dg-prof">
      <img class="dg-prof-pic" src="${esc(pinnedOf(gal)
        ? imageUrl(slug, pinnedOf(gal))
        : 'assets/avatars/' + encodeURIComponent(slug) + '.png')}" alt=""
        onerror="this.outerHTML='<div class=&quot;dg-prof-pic fb&quot;>${esc(initials(d.name))}</div>'">
      <div class="dg-prof-body">
        <div class="dg-prof-name">${esc(d.name)}${d.verified ? tick() : ''}</div>
        <div class="dg-stats">
          <span class="dg-stat"><b>${posts.length}</b><span>posts</span></span>
          <span class="dg-stat"><b>${short(d.followers)}</b><span>followers</span></span>
          <span class="dg-stat"><b>${d.seasonsPlayed}</b><span>season${d.seasonsPlayed === 1 ? '' : 's'}</span></span>
          ${d.wins ? `<span class="dg-stat"><b>${d.wins}</b><span>win${d.wins === 1 ? '' : 's'}</span></span>` : ''}
        </div>
        <div class="dg-bio">
          ${bioLine ? `<b>${esc(bioLine)}</b><br>` : ''}
          ${rel.stage === 'single' ? ''
            : `<span class="dg-rel">${heart()}${esc(rel.label)}</span><br>`}
          ${d.status === 'sequestered' ? 'Currently in the house.'
            : d.status === 'quiet' ? 'Has been quiet for a while.' : 'Around.'}
          ${h.steps.length ? `<br>${esc(followerStory(h))}` : ''}
        </div>
      </div>
    </div>
    ${posts.length ? `<div class="dg-posts">${posts.map(postTile).join('')}</div>`
      : `<p class="dg-empty">No posts yet.<br>Life events become posts once you approve them in
         <a class="dg-back" href="life.html">Life</a>.</p>`}`;

  host.querySelectorAll('[data-post]').forEach(el => {
    el.onclick = () => openPost(posts[Number(el.dataset.post)], d);
  });

  // ── THE CLAIM BECOMES PERMANENT ──
  //
  // Posts above may have taken photos from the numbered queue. With a token,
  // each one is moved to posted/<post id> now: the key itself records which
  // photo belongs to which post, the numbered slot frees up for the next dump,
  // and no later reshuffle of the queue can hand this post a different picture.
  //
  // Silent and token-gated: a visitor without the token sees the same feed
  // (the claim is deterministic) — the archive just has not happened yet.
  archivePosted(slug, posts);

  renderManage(slug, gal);
}

/** The status heart. Drawn, not an emoji — nothing else on this page is one. */
function heart() {
  return '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">'
    + '<path d="M12 20s-7-4.6-7-9.5A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.5C19 15.4 12 20 12 20z"'
    + ' fill="currentColor"/></svg>';
}

/**
 * Curation: the photographs this character has, and how to change them.
 *
 * Built on js/gallery-io.js, which player.html also uses -- the slot allocator,
 * the encoder and the cache rule are shared rather than written twice. What is
 * NOT shared is this interface: a drop zone under a profile and a strip under a
 * stat sheet are different things and should look it.
 *
 * The token is kept under the same localStorage key the player page uses, so
 * authorising in one place authorises in both.
 */
function renderManage(slug, gal) {
  const host = $('#dg-profile');
  const box = document.createElement('div');
  box.className = 'dg-manage';
  box.innerHTML = [
    '<h3>Photo queue &mdash; ' + gal.images.length + ' of ' + GALLERY_MAX
      + (gal.posted.length ? ' &middot; ' + gal.posted.length + ' posted' : '') + '</h3>',
    '<div class="dg-drop" id="dg-drop">Drop images here, or click to choose. ',
    'Several at once is fine.</div>',
    '<input type="file" id="dg-file" accept="image/*" multiple hidden>',
    // The same search player.html has: the article, the portraits, the pose
    // cap. One shared implementation in js/wiki-art.js, asked in this page's
    // own voice.
    '<button class="dg-fill" id="dg-fill">Fill from wiki</button>',
    '<div class="dg-lib" id="dg-lib"></div>',
    '<p class="dg-note" id="dg-note">Pin one as the profile picture, set a mood ',
    'to tell the captions what a picture is, and new posts claim photos from ',
    'this queue &mdash; a claimed photo moves to the posted pile and its slot ',
    'frees up for the next dump.</p>',
  ].join('');
  host.appendChild(box);
  const fillBtn = box.querySelector('#dg-fill');
  fillBtn.onclick = async () => {
    const t = token();
    if (!t) return;
    const name = namesBySlug[slug] || slug.replace(/-/g, ' ');
    fillBtn.disabled = true;
    try {
      const r = await fillFromWiki(slug, name, t, {
        say: txt => { fillBtn.textContent = txt; },
        pickCandidate: async (wikiName, candidates) => {
          const list = candidates.map((x, n) => (n + 1) + '. ' + x).join('\n');
          const pick = prompt(wikiName + ' wiki has ' + candidates.length
            + ' articles starting with "' + name + '".\n\n' + list
            + '\n\nType a number, or leave blank to skip this wiki:', '1');
          const n = parseInt(pick, 10);
          return (n && candidates[n - 1]) || null;
        },
        askExact: async (wanted, why) => prompt('No art found for "' + wanted + '".\n\n'
          + why.join('\n') + '\n\nType the EXACT article title to look it up directly:', wanted),
      });
      const note = $('#dg-note');
      if (note) {
        note.textContent = r.added
          ? 'Added ' + r.added + ' from "' + r.foundTitle + '" (' + r.wikiName + ' wiki). Nothing already here was touched.'
          : !r.free ? 'The queue is already full — post or delete something first.'
          : 'Nothing found. ' + r.why.join(' · ');
      }
      if (r.added) await renderProfile(slug);
    } catch (err) {
      const note = $('#dg-note');
      if (note) note.textContent = 'Fill failed — ' + err.message;
    } finally {
      fillBtn.disabled = false;
      fillBtn.textContent = 'Fill from wiki';
    }
  };
  drawLibrary(slug);

  const zone = box.querySelector('#dg-drop');
  const input = box.querySelector('#dg-file');
  zone.onclick = () => input.click();
  input.onchange = () => { doUpload(slug, [...input.files]); input.value = ''; };
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => {
    e.preventDefault();
    zone.classList.remove('over');
    doUpload(slug, [...(e.dataTransfer ? e.dataTransfer.files : [])]
      .filter(f => f.type.startsWith('image/')));
  };
}

async function drawLibrary(slug) {
  const lib = $('#dg-lib');
  if (!lib) return;
  let gal = { images: [], posted: [] };
  try { gal = await galleryFull(slug, { fresh: true }); } catch { /* renders empty */ }
  const item = (f, posted) => [
    '<div class="dg-libit' + (posted ? ' posted' : '') + '">',
    '<img src="' + esc(imageUrl(slug, f.file)) + '" alt="" loading="lazy">',
    '<button data-del="' + esc(f.file) + '" title="Delete">&times;</button>',
    '<button class="pin' + (f.pinned ? ' on' : '') + '" data-pin="' + esc(f.file) + '"',
    ' data-on="' + (f.pinned ? '1' : '') + '" title="Use as profile picture">'
      + (f.pinned ? 'profile' : 'pin') + '</button>',
    // The MOOD is the photograph's own fact — what this picture is — and a
    // moment that claims it posts in that register instead of the derived one.
    '<select class="mood" data-mood="' + esc(f.file) + '" title="What this picture is">',
    '<option value="">mood: auto</option>',
    ...MOODS.map(mo => '<option value="' + mo + '"' + (f.mood === mo ? ' selected' : '') + '>' + mo + '</option>'),
    '</select>',
    posted ? '<span class="dg-postedtag">posted</span>' : '',
    '</div>',
  ].join('');
  lib.innerHTML = (gal.images.map(f => item(f, false)).join('')
    + (gal.posted.length
      ? '<p class="dg-note" style="flex-basis:100%">Already posted — out of the queue, still theirs:</p>'
        + gal.posted.map(f => item(f, true)).join('')
      : ''))
    || '<p class="dg-note">No photographs yet.</p>';

  lib.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => doDelete(slug, b.dataset.del);
  });
  lib.querySelectorAll('[data-pin]').forEach(b => {
    b.onclick = async () => {
      const t = token();
      if (!t) return;
      try {
        await setImageMeta(slug, b.dataset.pin, { pinned: !b.dataset.on }, t);
        await renderProfile(slug);   // the face changed; the whole header follows
      } catch (err) { const n = $('#dg-note'); if (n) n.textContent = 'Pin failed — ' + err.message; }
    };
  });
  lib.querySelectorAll('[data-mood]').forEach(sel => {
    sel.onchange = async () => {
      const t = token();
      if (!t) { sel.value = ''; return; }
      try {
        await setImageMeta(slug, sel.dataset.mood, { mood: sel.value || null }, t);
      } catch (err) { const n = $('#dg-note'); if (n) n.textContent = 'Mood failed — ' + err.message; }
    };
  });
}

const TOKEN_KEY = 'studio_api_token';
function token() {
  let t = '';
  try { t = localStorage.getItem(TOKEN_KEY) || ''; } catch { /* storage blocked */ }
  if (t) return t;
  t = (prompt('Studio token (stored in this browser only):') || '').trim();
  if (t) { try { localStorage.setItem(TOKEN_KEY, t); } catch { /* storage blocked */ } }
  return t;
}

async function doUpload(slug, files) {
  if (!files.length) return;
  const t = token();
  if (!t) return;
  const zone = $('#dg-drop');
  const note = $('#dg-note');
  zone && zone.classList.add('busy');
  try {
    const r = await uploadMany(slug, files, t, {
      onProgress: (n, of) => { if (zone) zone.textContent = 'Uploading ' + n + ' of ' + of + '...'; },
    });
    // Reported in place rather than as an alert: a page that shouts at you for
    // uploading four of five images is worse than one that just tells you.
    const bits = [];
    if (r.done.length) bits.push(r.done.length + ' uploaded');
    if (r.skipped) bits.push(r.skipped + ' skipped, only ' + GALLERY_MAX + ' slots exist');
    if (r.failed.length) bits.push(r.failed.length + ' failed: ' + r.failed[0]);
    if (note) note.textContent = bits.join(' · ') || 'Nothing to do.';
    await drawLibrary(slug);
  } catch (err) {
    if (note) note.textContent = 'Upload failed — ' + err.message;
  } finally {
    zone && zone.classList.remove('busy');
    if (zone) zone.textContent = 'Drop images here, or click to choose. Several at once is fine.';
  }
}

async function doDelete(slug, file) {
  if (!confirm('Delete ' + file + '?\n\nThis removes it from the bucket. There is no other copy.')) return;
  const t = token();
  if (!t) return;
  try {
    await deleteImage(slug, file, t);
    await drawLibrary(slug);
  } catch (err) {
    const note = $('#dg-note');
    if (note) note.textContent = 'Delete failed — ' + err.message;
  }
}

/** The pinned face, straight off the gallery document — R2 metadata, not a
 *  per-browser preference. */
function pinnedOf(gal) {
  return ([...(gal.images || []), ...(gal.posted || [])].find(o => o.pinned) || {}).file || null;
}

/** A silent token read: never prompts. Archiving must not ambush a visitor. */
function storedToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
}

let _archiving = false;
async function archivePosted(slug, posts) {
  const t = storedToken();
  if (!t || _archiving) return;
  const due = posts.filter(p => p.queueFile);
  if (!due.length) return;
  _archiving = true;
  try {
    for (const p of due) {
      // 409 means another session archived it first — that is a success.
      await postPhoto(slug, p.queueFile, p.id, t).catch(err => {
        if (!/already has a photo/.test(err.message)) throw err;
      });
    }
    // Redraw once so the feed reads from the archive it just made. The guard
    // above stops this recursing: the second pass finds nothing due.
    await renderProfile(slug);
  } catch { /* the queue copy still renders; next visit tries again */ }
  finally { _archiving = false; }
}

/** "Up 120k after winning Carnival of Chaos" -- the number, explained. */
function followerStory(h) {
  const big = h.steps.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  if (!big) return '';
  const when = big.season ? (big.season.title || big.season.seasonId) : '';
  const verb = big.delta > 0 ? 'Up' : 'Down';
  return `${verb} ${short(Math.abs(big.delta))} ${big.why === 'won' ? 'for winning' : `after ${big.why}`}${when ? ` ${when}` : ''}.`;
}

const tick = () => '<svg class="dg-tick" width="15" height="15" viewBox="0 0 24 24" aria-label="verified">'
  + '<path fill="currentColor" d="M12 2l2.4 2.1 3.2-.4 1 3 2.8 1.6-1.2 3 1.2 3-2.8 1.6-1 3-3.2-.4L12 22l-2.4-2.1-3.2.4-1-3L2.6 15.7l1.2-3-1.2-3 2.8-1.6 1-3 3.2.4z"/>'
  + '<path fill="#141416" d="M10.8 15.4l-3-3 1.3-1.3 1.7 1.7 4-4 1.3 1.3z"/></svg>';

function postTile(p, i) {
  const when = p.season ? airLabel(p.season) : '';
  // A moment is a post about nothing: a photo when one is theirs, a mood card
  // when not. Its caption comes from the mood bank, never from an event.
  if (p.isMoment) {
    const caption = momentCaption(p.moment, { archetype: archetypeBySlug[viewing] });
    if (p.photo) {
      return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
        <img src="${esc(p.photo)}" alt="" loading="lazy">
        ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
    }
    return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
      <span class="dg-card dg-mood" data-mood="${esc(p.mood)}">
        <span class="k">${esc(p.mood)}</span>
        <span class="t">${esc(caption)}</span>
      </span>
      ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
  }
  // TOLD FROM THIS PROFILE'S SIDE. A two-person event is stored once and
  // carries whichever half it was written from, so passing event.player put
  // "Bowie and Hicks fell out publicly" on HICKS'S OWN page. The reader is
  // whoever's profile this is.
  // THE CAPTION, NOT THE WIKI LINE. lineFor writes the encyclopedia sentence —
  // third person, past tense — which is right for an article and wrong on a
  // photo. This is the same fact in the character's own voice.
  const caption = captionFor(p.event, {
    archetype: archetypeBySlug[viewing], names: namesBySlug,
    season: p.season ? (p.season.title || '') : '',
  }) || lineFor(p.event, namesBySlug, viewing, gendersBySlug);
  if (p.photo) {
    return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
      <img src="${esc(p.photo)}" alt="" loading="lazy">
      ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
  }
  return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
    <span class="dg-card" data-sig="${p.significance}">
      <span class="k">${esc(p.track)}</span>
      <span class="t">${esc(caption)}</span>
    </span>
    ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
}

function openPost(p, d) {
  if (p.isMoment) {
    const caption = momentCaption(p.moment, { archetype: archetypeBySlug[viewing] });
    const comments = momentComments(p.moment, { ties: tiesFor(viewing, graph), names: namesBySlug });
    const wrap = document.createElement('div');
    wrap.className = 'dg-open';
    wrap.innerHTML = `<div class="dg-open-in">
      ${p.photo ? `<div class="dg-open-media"><img src="${esc(p.photo)}" alt=""></div>` : ''}
      <div class="dg-open-body">
        <div class="dg-open-cap"><b>${esc(d.name)}</b> ${esc(caption)}</div>
        ${comments.length ? `<div class="dg-comments">${comments.map(c =>
          `<div class="dg-c" data-rel="${c.relation}"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`
        ).join('')}</div>` : ''}
        <div class="dg-open-meta">${esc(p.season ? airLabel(p.season) : '')} · ${esc(p.mood)}</div>
        <button class="dg-close">Close</button>
      </div>
    </div>`;
    wrap.onclick = e => { if (e.target === wrap || e.target.classList.contains('dg-close')) wrap.remove(); };
    document.body.appendChild(wrap);
    return;
  }
  const caption = captionFor(p.event, {
    archetype: archetypeBySlug[viewing], names: namesBySlug,
    season: p.season ? (p.season.title || '') : '',
  }) || lineFor(p.event, namesBySlug, viewing, gendersBySlug);
  // What actually happened, under what they said about it. The two registers
  // sit together rather than one replacing the other.
  const fact = lineFor(p.event, namesBySlug, viewing, gendersBySlug);
  const comments = commentsFor(p.event, { ties: tiesFor(viewing, graph), names: namesBySlug });
  const wrap = document.createElement('div');
  wrap.className = 'dg-open';
  wrap.innerHTML = `<div class="dg-open-in">
    ${p.photo ? `<div class="dg-open-media"><img src="${esc(p.photo)}" alt=""></div>` : ''}
    <div class="dg-open-body">
      <!-- No name prefix: lineFor already opens with it, and the first build
           read "Alejandro Alejandro and Lindsay broke up." -->
      <div class="dg-open-cap"><b>${esc(d.name)}</b> ${esc(caption)}</div>
      <div class="dg-open-fact">${esc(fact)}${p.event.detail ? ` ${esc(p.event.detail)}` : ''}</div>
      ${comments.length ? `<div class="dg-comments">${comments.map(c =>
        `<div class="dg-c" data-rel="${c.relation}"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`
      ).join('')}</div>` : ''}
      <div class="dg-open-meta">${esc(p.season ? airLabel(p.season) : '')} · ${esc(p.track)}</div>
      <button class="dg-close">Close</button>
    </div>
  </div>`;
  wrap.onclick = e => { if (e.target === wrap || e.target.classList.contains('dg-close')) wrap.remove(); };
  document.body.appendChild(wrap);
}

let allEvents = []; let allSeasons = []; let allCareers = []; let namesBySlug = {};
// slug -> gender, off the authored roster: the only place it lives, and what
// keeps a caption saying "Cody changed their hair" off Cody's own page.
let gendersBySlug = new Map();
// slug -> pinned photo file, one Worker request for the whole directory. The
// pin used to live in localStorage, which made it a per-browser opinion —
// pinned here, unpinned on your phone. It is R2 metadata on the photo now.
let pinsBySlug = {};
// Which directory page is showing. 152 avatars in one render was the whole
// cast's worth of image requests before anybody scrolled.
let page = 0;
const PAGE_SIZE = 50;
let graph = null; let archetypeBySlug = {};
/** Whose profile is open — the side every caption is told from. */
let viewing = null;

(async () => {
  const [pdb, sdb, life, live, roster] = await Promise.all([
    fetch('players_database.json').then(r => r.json()).catch(() => ({ players: [] })),
    fetch('seasons_database.json').then(r => r.json()).catch(() => ({ seasons: [] })),
    fetch('life_events.json').then(r => r.json()).catch(() => ({ events: [] })),
    // The live season comes from the Worker, the same endpoint player.html and
    // devotees.html read — not a file. Optional: no season airing means every
    // dot is simply not sequestered.
    fetch('https://dc-studio.yannari19.workers.dev/api/live-season')
      .then(r => r.json()).then(j => (j && j.ok && j.airing) ? j : null).catch(() => null),
    fetch('franchise_roster.json').then(r => r.json()).catch(() => ({ players: [] })),
  ]);
  const seasons = sdb.seasons || [];
  allSeasons = seasons;
  allEvents = life.events || [];
  allCareers = careersIn(pdb, 'all');
  namesBySlug = Object.fromEntries((pdb.players || []).map(p => [p.id, p.name]));
  // Who knows whom, so a comment section is made of people who actually do.
  graph = socialGraph(allCareers);
  // Tone comes from the archetype: a villain does not caption a wedding the way
  // a hero does. Read from the published roster, which is where it is authored.
  const rosterList = Array.isArray(roster) ? roster : (roster.players || []);
  archetypeBySlug = Object.fromEntries(rosterList.map(r => [r.slug, r.archetype]));
  gendersBySlug = new Map(rosterList.filter(r => r && r.slug).map(r => [r.slug, r.gender]));
  rows = directory({ careers: allCareers, seasons, events: allEvents, live });

  const now = latestAired(seasons);
  $('#dg-now').textContent = now ? airLabel(now) : '';
  pinsBySlug = await fetchPins();

  // ONE ACCOUNT, SEEN FROM EVERY SHOW.
  //
  // Filtering is a lens on one directory — somebody who played both appears
  // under both, never as two profiles. The lens is the site's own switcher,
  // which every other page already obeys; a second one here would be two
  // controls for one idea, and the first build had exactly that.
  show = currentShow() || 'all';
  window.addEventListener('showchange', e => {
    show = e.detail?.show || 'all';
    render();
  });

  $('#dg-q').oninput = () => { page = 0; render(); };
  $('#dg-sort').onchange = () => { page = 0; render(); };

  // ?player=<slug> is a profile; anything else is the directory. One page, two
  // views, so a link from the grid is a normal href and the back button works.
  const who = new URLSearchParams(location.search).get('player');
  if (who) { await renderProfile(who); } else { render(); }
})();
</script>
</body>
</html>
