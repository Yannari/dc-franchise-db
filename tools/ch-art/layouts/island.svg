<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- BLUE LAGOON: the island, seen from above and a little from the south (Total Drama's map grammar). -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb6d6"/><stop offset="1" stop-color="#1f8fb8"/></linearGradient>
    <radialGradient id="lag" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7ee7ef"/><stop offset="1" stop-color="#3cc6d9"/></radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sea)"/>
  <!-- reef ring -->
  <path d="M260 880 C 200 700, 260 420, 460 300 C 660 170, 1060 120, 1360 190 C 1640 250, 1780 430, 1760 640 C 1740 850, 1560 990, 1260 1010 C 960 1030, 520 1010, 260 880 Z" fill="none" stroke="#bff3f7" stroke-width="10" stroke-dasharray="4 22" opacity="0.8"/>
  <!-- island -->
  <path d="M330 800 C 300 640, 380 460, 560 360 C 760 250, 1080 220, 1330 280 C 1560 335, 1680 470, 1660 640 C 1640 800, 1500 900, 1300 920 C 1180 932, 1080 900, 1000 860 C 920 890, 800 930, 660 920 C 500 910, 360 880, 330 800 Z" fill="#f2d79b"/>
  <path d="M370 780 C 350 640, 420 490, 590 395 C 780 290, 1080 265, 1310 320 C 1520 372, 1620 490, 1605 640 C 1590 780, 1470 860, 1300 875 C 1190 885, 1100 850, 1010 815 C 920 845, 800 885, 670 878 C 520 870, 395 850, 370 780 Z" fill="#6fbf5a"/>
  <!-- the lagoon (south bay, the island's name) -->
  <path d="M860 905 C 880 820, 980 760, 1090 780 C 1190 800, 1230 870, 1200 940 C 1150 1000, 920 1000, 860 905 Z" fill="url(#lag)" stroke="#f2d79b" stroke-width="14"/>
  <!-- the mountain / volcano (north) -->
  <path d="M1000 470 L 1120 250 L 1170 245 L 1300 480 Z" fill="#7d6a5a" stroke="#4e4036" stroke-width="4"/>
  <path d="M1110 268 L 1180 262 L 1165 300 L 1125 302 Z" fill="#e2552a"/>
  <!-- the river and the waterfall gorge -->
  <path d="M1150 470 C 1120 540, 1060 580, 1000 620 C 950 655, 940 720, 980 790" fill="none" stroke="#4fc2dc" stroke-width="16" stroke-linecap="round"/>
  <!-- jungle masses -->
  <g fill="#3f8f46" opacity="0.85">
    <ellipse cx="760" cy="520" rx="190" ry="110"/><ellipse cx="1350" cy="560" rx="170" ry="120"/>
    <ellipse cx="600" cy="680" rx="120" ry="70"/><ellipse cx="1240" cy="740" rx="110" ry="60"/>
  </g>
  <!-- paths -->
  <g fill="none" stroke="#e9c785" stroke-width="9" stroke-dasharray="2 14" stroke-linecap="round">
    <path d="M540 760 C 640 720, 700 640, 760 600 C 820 560, 860 520, 900 500"/>
    <path d="M900 500 C 960 470, 1020 440, 1080 400 C 1110 370, 1130 320, 1140 280"/>
    <path d="M540 760 C 640 820, 760 860, 900 880"/>
    <path d="M1200 920 C 1300 880, 1400 830, 1480 760"/>
    <path d="M760 600 C 820 660, 900 700, 980 720"/>
    <path d="M1480 760 C 1520 640, 1500 520, 1440 430"/>
  </g>
  <!-- ZONES: label boxes mark where each place is; the painter keeps the place there, the boxes are not painted. -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g><rect x="420" y="700" width="240" height="120" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#ff6a1a" stroke-width="4"/>
      <text x="540" y="750" fill="#222">THE VILLA</text><text x="540" y="780" font-size="16" font-weight="400" fill="#333">on the cliff, infinity pool</text><text x="540" y="802" font-size="16" font-weight="400" fill="#333">over the lagoon</text></g>
    <g><rect x="930" y="955" width="220" height="70" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#1f8fb8" stroke-width="4"/>
      <text x="1040" y="990" fill="#222">BLUE LAGOON</text><text x="1040" y="1013" font-size="16" font-weight="400" fill="#333">the bay, reef ring</text></g>
    <g><rect x="760" y="900" width="150" height="70" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#7a5230" stroke-width="4"/>
      <text x="835" y="935" fill="#222">THE DOCK</text><text x="835" y="957" font-size="15" font-weight="400" fill="#333">boats in and out</text></g>
    <g><rect x="1180" y="900" width="200" height="70" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#c03be0" stroke-width="4"/>
      <text x="1280" y="935" fill="#222">BEACH CLUB</text><text x="1280" y="957" font-size="15" font-weight="400" fill="#333">nights out</text></g>
    <g><rect x="1420" y="700" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#f2b705" stroke-width="4"/>
      <text x="1530" y="735" fill="#222">BEACH FIELD</text><text x="1530" y="760" font-size="15" font-weight="400" fill="#333">daily challenge site</text></g>
    <g><rect x="250" y="540" width="200" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#f2b705" stroke-width="4"/>
      <text x="350" y="575" fill="#222">THE CLIFFS</text><text x="350" y="600" font-size="15" font-weight="400" fill="#333">daily: jumps, heights</text></g>
    <g><rect x="900" y="640" width="210" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#f2b705" stroke-width="4"/>
      <text x="1005" y="675" fill="#222">THE GORGE</text><text x="1005" y="700" font-size="15" font-weight="400" fill="#333">waterfall, water course</text></g>
    <g><rect x="780" y="430" width="230" height="90" rx="14" fill="#1b1b1b" fill-opacity="0.85" stroke="#ff3b1a" stroke-width="5"/>
      <text x="895" y="468" fill="#ff8a3d" font-size="26">THE ARENA</text><text x="895" y="495" font-size="15" font-weight="400" fill="#eee">old quarry in the jungle</text></g>
    <g><rect x="1390" y="380" width="200" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#7a7a7a" stroke-width="4"/>
      <text x="1490" y="415" fill="#222">AIRSTRIP</text><text x="1490" y="440" font-size="15" font-weight="400" fill="#333">arrivals by plane</text></g>
    <g><rect x="1180" y="560" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#2c7a3a" stroke-width="4"/>
      <text x="1290" y="595" fill="#222">OVERNIGHT CAMP</text><text x="1290" y="620" font-size="15" font-weight="400" fill="#333">the final, night one</text></g>
    <g><rect x="1060" y="160" width="240" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#e2552a" stroke-width="4"/>
      <text x="1180" y="195" fill="#222">THE SUMMIT</text><text x="1180" y="220" font-size="15" font-weight="400" fill="#333">volcano, the final's finish</text></g>
    <g><rect x="560" y="300" width="220" height="80" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#2c7a3a" stroke-width="4"/>
      <text x="670" y="335" fill="#222">JUNGLE TRAIL</text><text x="670" y="360" font-size="15" font-weight="400" fill="#333">the final's route</text></g>
    <g><rect x="370" y="850" width="180" height="70" rx="14" fill="#ffffff" fill-opacity="0.75" stroke="#2c7a3a" stroke-width="4"/>
      <text x="460" y="885" fill="#222">THE LOOKOUT</text><text x="460" y="907" font-size="15" font-weight="400" fill="#333">a quiet bench</text></g>
  </g>
  <text x="40" y="60" font-size="30" font-weight="800" fill="#ffffff">BLUE LAGOON — island layout (zones only; paint without the boxes and words)</text>
</svg>
