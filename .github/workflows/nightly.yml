name: Nightly simulation tests

# The 42 tests that play whole seasons.
#
# They are the only thing in this project that catches an event which is
# written, registered, wired up and still unreachable — so they are not
# optional. They are also 103 of the 119 minutes `npm test` used to take, which
# is why they no longer run on every push: one Studio save is three pushes, so
# a character created at midday cost six hours of runner time and blocked the
# Pages deployment behind it.
#
# Once a night, and whenever you ask. A regression here is found the next
# morning instead of never — which is what was actually happening on
# 2026-08-18, when no run ever finished at all.
#
# The file list lives in vitest.slow.js, shared with vitest.config.js so the
# two halves cannot disagree about which side a test is on.
#
# ── 2026-09-04: IT RAN EVERY NIGHT AND NOBODY COULD USE IT ────────────
#
# This workflow executed faithfully and FAILED on every one of the eight runs
# from 2026-08-28 to 2026-09-04 — 9 of 77 files red. A job that is red every
# morning carries the same information as one that is switched off, and it
# showed: a genuine regression landed on the 3rd and was invisible against a
# week of existing red.
#
# So the step below is no longer `npm run test:sim` but the gate around it. It
# fails on a file that is NOT in tests/nightly-known-failures.json, and also on
# a file listed there that has started passing — which is what stops the list
# becoming a permanent amnesty. The known failures are printed every run, so
# they read as the outstanding work rather than as noise.

on:
  schedule:
    # 04:00 UTC. Nothing else in this repo is scheduled, so there is nothing to
    # collide with, and it lands well before a European morning.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    # Measured at 103 minutes. Three hours leaves room for a slower runner
    # without letting a genuine hang sit for six.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The gate runs vitest itself, with --reporter=verbose (the per-file
      # timings printed here are how vitest.slow.js gets re-derived when it
      # rots) AND --reporter=json, which is what it compares against the
      # baseline. `npm run test:sim` is still the way to run the suite by hand
      # without the gate.
      - run: npm run test:nightly
      # The machine-readable result, kept whatever the verdict was, so a red
      # morning can be diffed against the one before it rather than re-run.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: .nightly/results.json
          if-no-files-found: warn
