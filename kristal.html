<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristal-talKs</title>
<!--
  KRISTAL-TALKS — the exit-interview podcast.

  Design: docs/superpowers/specs/2026-08-21-kristal-talks-v2-design.md
  Model:  js/kristal.js (episodes) + js/kristal-voice.js (every word)

  A reader, like Dramagram: episodes are derived from the published record and
  the approved life log, so nothing here writes anything.

  ── BUILT LIKE A PODCAST APP ──

  Periods are the podcast's seasons: a tab rail of off-seasons, and each tab is
  that gap's slate. An episode opens into a player — artwork, a scrub bar,
  timestamps — with the full transcript underneath: cold open, the pressed
  exchanges, rapid fire, the viral clip, and the listener comments, where the
  person the episode was about always turns up.
-->
<link rel="stylesheet" href="styles.css">
<style>
  #kt{
    --kt-bg:#120a14; --kt-card:#1c1120; --kt-line:#33203a;
    --kt-ink:#f5eef7; --kt-dim:#9c86a4; --kt-hot:#e84393;
    --kt-gold:#f0a500; --kt-deep:#0d060f;
    background:var(--kt-bg); color:var(--kt-ink);
    font:15px/1.55 ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    padding:22px 20px 70px; min-height:60vh;
  }
  .kt-wrap{max-width:820px;margin:0 auto}
  .kt-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .kt-cover{width:84px;height:84px;border-radius:18px;object-fit:cover;
    border:2px solid var(--kt-hot);box-shadow:0 6px 24px rgba(232,67,147,.25)}
  .kt-logo{font-size:30px;font-weight:900;letter-spacing:-.5px}
  .kt-logo b{color:var(--kt-hot)}
  .kt-tag{color:var(--kt-dim);font-size:13px;margin-top:2px}
  .kt-stats{color:var(--kt-dim);font-size:12.5px;margin-top:6px}
  .kt-stats b{color:var(--kt-ink)}

  .kt-apps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
  .kt-apps a,.kt-apps span{display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;
    text-decoration:none;border:1px solid var(--kt-line);color:var(--kt-dim)}
  .kt-apps a:hover{color:var(--kt-ink);border-color:var(--kt-dim)}
  .kt-apps span{color:#fff;background:var(--kt-hot);border-color:var(--kt-hot)}

  /* ── the podcast's seasons: one tab per off-season ── */
  .kt-periods{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:thin}
  .kt-periods button{flex:none;background:var(--kt-card);border:1px solid var(--kt-line);
    color:var(--kt-dim);border-radius:12px;padding:9px 14px;font:inherit;font-size:12.5px;
    font-weight:700;cursor:pointer;text-align:left}
  .kt-periods button small{display:block;font-weight:500;font-size:10.5px;margin-top:2px;opacity:.8}
  .kt-periods button[aria-pressed="true"]{background:var(--kt-hot);border-color:var(--kt-hot);color:#fff}
  .kt-slate{color:var(--kt-dim);font-size:12.5px;margin:8px 2px 14px}
  .kt-slate b{color:var(--kt-ink)}
  .kt-remix{margin-left:10px;background:none;border:1px solid var(--kt-line);color:var(--kt-hot);
    border-radius:999px;padding:3px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
  .kt-remix:hover{border-color:var(--kt-hot)}

  /* ── the episode rows ── */
  .kt-ep{background:var(--kt-card);border:1px solid var(--kt-line);border-radius:16px;
    margin-bottom:12px;overflow:hidden}
  .kt-ep-row{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;
    background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit}
  .kt-ep-row:hover{background:rgba(232,67,147,.06)}
  .kt-play{flex:none;width:34px;height:34px;border-radius:50%;background:var(--kt-hot);
    display:flex;align-items:center;justify-content:center;color:#fff}
  .kt-ep.open .kt-play{background:var(--kt-gold)}
  .kt-art{position:relative;flex:none;width:54px;height:54px}
  .kt-art img{width:40px;height:40px;border-radius:10px;object-fit:cover;position:absolute}
  .kt-art .host{left:0;top:0;z-index:1;border:2px solid var(--kt-hot)}
  .kt-art .guest{right:0;bottom:0;z-index:2;border:2px solid var(--kt-card)}
  .kt-ep-meta{flex:1;min-width:0}
  .kt-ep-num{font-size:10px;letter-spacing:1.6px;color:var(--kt-dim)}
  .kt-ep-title{font-weight:800;font-size:15px}
  .kt-ep-sub{color:var(--kt-dim);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .kt-tier{font-size:9.5px;letter-spacing:1.2px;font-weight:800;padding:3px 8px;border-radius:999px}
  .kt-tier[data-t="viral"]{background:rgba(232,67,147,.18);color:var(--kt-hot)}
  .kt-tier[data-t="solid"]{background:rgba(240,165,0,.14);color:var(--kt-gold)}
  .kt-tier[data-t="quiet"]{background:rgba(255,255,255,.06);color:var(--kt-dim)}
  .kt-wave{display:flex;gap:2px;align-items:flex-end;height:26px;flex:none}
  .kt-wave i{width:3px;border-radius:2px;background:var(--kt-hot);opacity:.75}
  .kt-ep[data-t="quiet"] .kt-wave i{background:var(--kt-dim)}
  .kt-ep[data-t="solid"] .kt-wave i{background:var(--kt-gold)}

  /* ── the player: what an open episode becomes ── */
  .kt-body{display:none;background:var(--kt-deep)}
  .kt-ep.open .kt-body{display:block}
  .kt-now{padding:16px 18px 12px;border-top:1px solid var(--kt-line)}
  .kt-now-tag{font-size:9.5px;letter-spacing:2px;color:var(--kt-hot);font-weight:800}
  .kt-scrub{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--kt-dim);
    font-size:10.5px;font-family:var(--font-mono,monospace)}
  .kt-scrub .bar{flex:1;height:4px;border-radius:2px;background:var(--kt-line);position:relative}
  .kt-scrub .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--kt-hot)}
  .kt-scrub .bar em{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%)}

  .kt-tx{padding:6px 18px 16px}
  .kt-cut{font-size:10px;letter-spacing:1.6px;color:var(--kt-dim);margin-top:10px;
    padding-bottom:2px;border-bottom:1px dashed var(--kt-line)}
  .kt-seg{margin:14px 0}
  .kt-ts{font-size:10px;letter-spacing:1px;color:var(--kt-dim);font-family:var(--font-mono,monospace)}
  .kt-cold{font-size:14px;color:var(--kt-ink);font-style:italic;border-left:3px solid var(--kt-hot);
    padding:8px 12px;background:rgba(232,67,147,.05);border-radius:0 8px 8px 0;margin-top:4px}
  .kt-q{color:var(--kt-hot);font-weight:700;font-size:13.5px;margin-top:4px}
  .kt-q::before{content:'KRISTAL — ';letter-spacing:1px;font-size:10.5px;color:var(--kt-dim)}
  .kt-a{margin-top:6px;color:var(--kt-ink);font-size:14px;padding-left:14px;
    border-left:2px solid var(--kt-line)}
  .kt-press{margin-top:8px;color:var(--kt-gold);font-weight:700;font-size:13px;padding-left:10px}
  .kt-press::before{content:'SHE PRESSES — ';letter-spacing:1px;font-size:9.5px;color:var(--kt-dim)}
  .kt-crack{margin-top:6px;color:#ffd9ea;font-size:14px;padding-left:14px;
    border-left:2px solid var(--kt-hot);background:rgba(232,67,147,.06);border-radius:0 8px 8px 0;
    padding-top:6px;padding-bottom:6px}
  .kt-receipt{display:inline-flex;margin-top:5px;padding:3px 7px;border-radius:999px;
    background:rgba(240,165,0,.1);border:1px solid rgba(240,165,0,.3);color:var(--kt-gold);
    font-size:9px;letter-spacing:1.2px;font-weight:800;text-transform:uppercase}
  .kt-behavior{color:var(--kt-dim);font-size:9px;letter-spacing:1px;text-transform:uppercase;
    margin-left:7px}
  .kt-rf{margin-top:6px;display:grid;grid-template-columns:1fr;gap:6px}
  .kt-rf div{display:flex;gap:10px;font-size:13px;align-items:baseline}
  .kt-rf b{color:var(--kt-dim);font-weight:600;flex:none;max-width:52%}
  .kt-rf span{color:var(--kt-ink)}
  .kt-clip{margin-top:14px;border:1px dashed var(--kt-hot);border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:var(--kt-dim)}
  .kt-clip b{color:var(--kt-ink)}
  .kt-aftermath{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;
    font-size:12px;color:var(--kt-dim);border-top:1px solid var(--kt-line);padding-top:10px}
  .kt-aftermath b{font-size:9.5px;letter-spacing:2px;color:var(--kt-dim)}
  .kt-aftermath em{font-style:normal;font-weight:800}
  .kt-aftermath .up{color:#3ddc84}
  .kt-aftermath .down{color:#ff6b6b}
  .kt-consequence{flex-basis:100%;display:flex;gap:7px;flex-wrap:wrap}
  .kt-consequence i{font-style:normal;border:1px solid var(--kt-line);border-radius:999px;
    padding:3px 8px;color:var(--kt-ink);background:rgba(255,255,255,.03)}
  .kt-consequence-note{flex-basis:100%;color:var(--kt-ink)}
  .kt-comments{margin-top:14px;border-top:1px solid var(--kt-line);padding-top:10px}
  .kt-c{display:flex;gap:9px;align-items:flex-start;margin:8px 0;font-size:13px}
  .kt-c img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
  .kt-c b{color:var(--kt-ink)}
  .kt-c i{font-style:normal;color:var(--kt-dim)}
  .kt-c[data-rel="subject"] b{color:var(--kt-hot)}
  .kt-c[data-rel="subject"]{background:rgba(232,67,147,.05);border-radius:8px;padding:6px 8px}
  .kt-replies{margin:6px 0 2px 34px;padding-left:10px;border-left:2px solid var(--kt-line)}
  .kt-reply{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:12px;color:var(--kt-dim)}
  .kt-reply img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none}
  .kt-reply b{color:var(--kt-hot)}

  .kt-empty{color:var(--kt-dim);text-align:center;padding:50px 0}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="modern-header" id="modernHeader">
  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="brand-section" aria-label="Go to home">
        <div class="brand-icon"><span class="brand-logo-text">⚡</span></div>
        <div class="brand-content">
          <h1>DC <span class="brand-gradient">Franchise</span> Database</h1>
          <p class="brand-subtitle">Kristal-talKs</p>
        </div>
      </a>
    </div>
    <nav class="header-nav" aria-label="Primary navigation"><ul class="nav-list"></ul></nav>
  </div>
</header>

<div id="kt">
  <div class="kt-wrap">
    <div class="kt-head">
      <img class="kt-cover" src="assets/avatars/kristal.png" alt="Kristal">
      <div>
        <div class="kt-logo">Kristal-tal<b>Ks</b></div>
        <div class="kt-tag">The exit interview they should have been scared of. Hosted by Kristal.</div>
        <div class="kt-stats" id="kt-stats"></div>
      </div>
    </div>

    <nav class="kt-apps" aria-label="Choose an app">
      <a href="social.html?app=birdie">Birdie</a>
      <a href="social.html?app=chatalumni">ChatAlumni</a>
      <a href="dramagram.html">Dramagram</a>
      <span aria-current="page">Kristal-talKs</span>
    </nav>

    <!-- The podcast's seasons: one tab per off-season, newest first. -->
    <div class="kt-periods" id="kt-periods" role="tablist"></div>
    <div class="kt-slate" id="kt-slate"></div>

    <div id="kt-list"></div>
  </div>
</div>

<script type="module" src="js/site-header.js"></script>
<script type="module">
import { podcastFor, PODCAST_FOLLOWERS, MENTIONED_HIT } from './js/kristal.js';
import { episodeComments } from './js/kristal-voice.js';
import { careersIn } from './js/records.js';
import { socialGraph } from './js/life-resolver.js';
import { tiesFor } from './js/dramagram.js';

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
  : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);

let episodes = [];
let period = null;
// The remix counts, per period. A DISPLAY PREFERENCE like dark mode — it
// changes words, never facts or numbers — so this browser is the right home
// for it, and another device hearing the original cut is not a bug.
const SALT_KEY = 'kt_remix';
let salts = {};
try { salts = JSON.parse(localStorage.getItem(SALT_KEY)) || {}; } catch { /* fresh */ }
let buildInputs = null;
let graph = null;
let namesBySlug = {};

const avatar = (slug, cls = '') => `<img class="${cls}" src="assets/avatars/${encodeURIComponent(slug)}.png"
  alt="" onerror="this.style.visibility='hidden'">`;

/** Seeded bars — an episode keeps its waveform forever. */
function wave(ep) {
  let h = 0;
  for (let i = 0; i < ep.id.length; i++) h = (h * 31 + ep.id.charCodeAt(i)) >>> 0;
  const boost = ep.tier === 'viral' ? 1 : ep.tier === 'solid' ? 0.72 : 0.45;
  return `<span class="kt-wave">${Array.from({ length: 9 }, (_, i) =>
    `<i style="height:${Math.round(6 + ((h >> (i * 3)) % 8) * 2.4 * boost)}px"></i>`).join('')}</span>`;
}

const mmss = min => `${Math.floor(min)}:${String(Math.round((min % 1) * 60)).padStart(2, '0')}`;

/**
 * Timestamps across the runtime, so the transcript reads like a real one.
 * Cold open at 0:00; the exchanges spread over the first two thirds; rapid
 * fire near the end. Decorative, deterministic, never a number a model uses.
 */
function stamps(ep) {
  const n = ep.exchanges.length;
  const span = ep.minutes * 0.68;
  return {
    cold: '0:00',
    at: i => mmss(2 + (span - 2) * ((i + 1) / (n + 1))),
    rapid: mmss(ep.minutes - 9),
  };
}

function transcript(ep) {
  const ts = stamps(ep);
  const comments = episodeComments(ep, {
    ties: graph ? tiesFor(ep.guest, graph) : [], names: namesBySlug });
  // The scrub thumb sits somewhere seeded — a paused listen, not a progress claim.
  let h = 0;
  for (let i = 0; i < ep.id.length; i++) h = (h * 33 + ep.id.charCodeAt(i)) >>> 0;
  const pos = 22 + (h % 56);
  return `<div class="kt-now">
    <div class="kt-now-tag">NOW PLAYING · EP ${ep.num}${ep.visit > 1 ? ` · ${esc(ep.guestName)}’s appearance #${ep.visit}` : ''}</div>
    <div class="kt-scrub"><span>0:00</span>
      <span class="bar"><i style="width:${pos}%"></i><em style="left:${pos}%"></em></span>
      <span>${mmss(ep.minutes)}</span></div>
  </div>
  <div class="kt-tx">
    <!-- The frame that makes a short transcript read as EDITED rather than
         thin: nobody prints an hour of audio, and saying so is the difference
         between "highlights" and "missing content". -->
    <div class="kt-cut">THE GOOD PARTS — what Kristal clipped from the ${mmss(ep.minutes)} hour.
      The rest stays on the feed.</div>
    <div class="kt-seg"><span class="kt-ts">${ts.cold} · COLD OPEN</span>
      <div class="kt-cold">${esc(ep.coldOpen)}</div></div>
    ${ep.exchanges.map((x, i) => `<div class="kt-seg">
      <span class="kt-ts">${ts.at(i)}${x.topic === 'the-response' ? ' · THE CLIP' : ''}</span>
      ${x.receipt ? `<div><span class="kt-receipt">record · ${esc(x.receipt.type)}</span><span class="kt-behavior">${esc(x.behavior)}</span></div>` : ''}
      <div class="kt-q">${esc(x.q)}</div>
      <div class="kt-a">${esc(ep.guestName)}: &ldquo;${esc(x.a)}&rdquo;</div>
      ${x.press ? `<div class="kt-press">${esc(x.press)}</div>
        <div class="kt-crack">${esc(ep.guestName)}: &ldquo;${esc(x.crack)}&rdquo;</div>` : ''}
    </div>`).join('')}
    <div class="kt-seg"><span class="kt-ts">${ts.rapid} · RAPID FIRE</span>
      <div class="kt-rf">${ep.rapid.map(r =>
        `<div><b>${esc(r.q)}</b><span>${esc(r.a)}</span></div>`).join('')}</div></div>
    ${ep.mentionedName && ep.tier === 'viral'
      ? `<div class="kt-clip">THE CLIP EVERYONE SHARED was about <b>${esc(ep.mentionedName)}</b>,
         who was not in the room to answer it — see the comments.</div>` : ''}
    <!-- What the hour was worth. The same numbers the follower model applies —
         PODCAST_FOLLOWERS by tier for the guest, MENTIONED_HIT for the subject
         of a viral one — shown here so the economics are never a secret. -->
    <div class="kt-aftermath">
      <b>THE AFTERMATH</b>
      <span>${esc(ep.guestName)} <em class="up">+${short(PODCAST_FOLLOWERS[ep.tier] || 0)} followers</em></span>
      ${ep.mentionedName && ep.tier === 'viral'
        ? `<span>${esc(ep.mentionedName)} <em class="down">−${Math.round(Math.abs(MENTIONED_HIT) * 1000) / 10}% of theirs</em></span>` : ''}
      ${ep.aftermath ? `<span>credibility <em>${esc(ep.aftermath.credibility)}</em></span>
        <span>controversy <em>${esc(ep.aftermath.controversy)}/10</em></span>
        <div class="kt-consequence">${ep.aftermath.tags.map(t => `<i>${esc(t)}</i>`).join('')}</div>
        ${ep.aftermath.relationship ? `<div class="kt-consequence-note">${esc(ep.aftermath.relationship.label)}</div>` : ''}
        ${ep.aftermath.responseRequested ? `<div class="kt-consequence-note"><b>${esc(ep.mentionedName || 'The subject')}</b> has grounds for a response episode.</div>` : ''}` : ''}
    </div>
    ${comments.length ? `<div class="kt-comments">${comments.map(c =>
      `<div class="kt-c" data-rel="${c.relation}">${avatar(c.slug)}
        <span><b>${esc(c.name)}</b>${c.relation === 'subject' ? ' <i>· the subject</i>' : ''}
        <br>${esc(c.text)}</span></div>
        ${(c.replies || []).length ? `<div class="kt-replies">${c.replies.map(r =>
          `<div class="kt-reply">${avatar(r.slug)}<span><b>${esc(r.name)}</b><br>${esc(r.text)}</span></div>`).join('')}</div>` : ''}`).join('')}</div>` : ''}
  </div>`;
}

function card(ep) {
  return `<article class="kt-ep" data-t="${ep.tier}">
    <button class="kt-ep-row" data-open="${esc(ep.id)}">
      <span class="kt-play"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg></span>
      <span class="kt-art">${avatar('kristal', 'host')}${avatar(ep.guest, 'guest')}</span>
      <span class="kt-ep-meta">
        <span class="kt-ep-num">EP ${ep.num} · ${esc(ep.kind === 'debrief' ? 'THE DEBRIEF' : 'THE CATCH-UP')}</span><br>
        <span class="kt-ep-title">${esc(ep.title)}</span>
        <span class="kt-ep-sub">
          <span>${mmss(ep.minutes)}</span>
          <span>${short(ep.listeners)} listeners</span>
          <span class="kt-tier" data-t="${ep.tier}">${esc(ep.tierLabel)}</span>
        </span>
      </span>
      ${wave(ep)}
    </button>
    <div class="kt-body" data-body="${esc(ep.id)}"></div>
  </article>`;
}

function render() {
  const list = episodes.filter(e => e.afterSeason === period).slice().reverse();
  const debriefs = list.filter(e => e.kind === 'debrief').length;
  const s = list[0]?.season;
  $('#kt-slate').innerHTML = list.length
    ? `This period: <b>${list.length} episode${list.length === 1 ? '' : 's'}</b> —
       ${debriefs} debrief${debriefs === 1 ? '' : 's'} on <b>${esc(s?.title || period)}</b>
       and ${list.length - debriefs} catch-up${list.length - debriefs === 1 ? '' : 's'}.
       <button class="kt-remix" id="kt-remix" title="Same guests, same numbers — every word re-rolled.">↻ remix the cut</button>`
    : '';
  const remix = $('#kt-remix');
  if (remix) remix.onclick = () => {
    salts[period] = (salts[period] || 0) + 1;
    try { localStorage.setItem(SALT_KEY, JSON.stringify(salts)); } catch { /* session-only */ }
    // Same bookings, same listeners — podcastFor re-runs only to recompose
    // the words, and the parity test guarantees the numbers cannot move.
    episodes = podcastFor({ ...buildInputs, proseSalts: salts });
    render();
  };
  $('#kt-list').innerHTML = list.length ? list.map(card).join('')
    : '<p class="kt-empty">Kristal took this one off.</p>';
  $('#kt-list').querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => {
      const art = b.closest('.kt-ep');
      const body = art.querySelector('.kt-body');
      const opening = !art.classList.contains('open');
      art.classList.toggle('open');
      // The transcript is composed on open, not on list render — 60 full
      // transcripts on page load would be building a book nobody asked for.
      if (opening && !body.innerHTML) {
        const ep = episodes.find(e => e.id === b.dataset.open);
        if (ep) body.innerHTML = transcript(ep);
      }
    };
  });
}

(async () => {
  const [pdb, sdb, life, roster] = await Promise.all([
    fetch('players_database.json').then(r => r.json()).catch(() => ({ players: [] })),
    fetch('seasons_database.json').then(r => r.json()).catch(() => ({ seasons: [] })),
    fetch('life_events.json').then(r => r.json()).catch(() => ({ events: [] })),
    fetch('franchise_roster.json').then(r => r.json()).catch(() => ({ players: [] })),
  ]);
  const rows = roster.players || roster || [];
  const careers = careersIn(pdb, 'all');
  namesBySlug = Object.fromEntries((pdb.players || []).map(p => [p.id, p.name]));
  graph = socialGraph(careers);
  buildInputs = {
    careers, seasons: sdb.seasons || [], lifeEvents: life.events || [],
    // archetype AND stats, so the voice styles have both to choose from.
    profiles: Object.fromEntries(rows.filter(r => r.slug)
      .map(r => [r.slug, { archetype: r.archetype, stats: r.stats }])),
    names: namesBySlug,
  };
  episodes = podcastFor({ ...buildInputs, proseSalts: salts });
  const total = episodes.reduce((n, e) => n + e.listeners, 0);
  $('#kt-stats').innerHTML = `<b>${episodes.length}</b> episodes ·
    <b>${short(total)}</b> lifetime listens ·
    <b>${episodes.filter(e => e.tier === 'viral').length}</b> everyone heard`;

  const gaps = [...new Set(episodes.map(e => e.afterSeason))].reverse();
  period = gaps[0] || null;
  $('#kt-periods').innerHTML = gaps.map(g => {
    const eps = episodes.filter(e => e.afterSeason === g);
    return `<button role="tab" data-period="${esc(g)}" aria-pressed="${g === period}">
      ${esc(eps[0].when)}<small>${esc(eps[0].season?.title || g)} · ${eps.length} ep</small>
    </button>`;
  }).join('');
  $('#kt-periods').querySelectorAll('[data-period]').forEach(b => {
    b.onclick = () => {
      period = b.dataset.period;
      $('#kt-periods').querySelectorAll('[data-period]').forEach(x =>
        x.setAttribute('aria-pressed', x === b));
      render();
    };
  });
  render();
})();
</script>
</body>
</html>
