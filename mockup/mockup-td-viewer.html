<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total Drama Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   MOCKUP — Total Drama stepped viewer (spec 2026-10-06 §6, §7).
   Two screens: a camp segment (scenes, a cutaway, confessionals, an
   alliance title card) and the campfire ceremony (Q&A, the vote in the
   confession cam, marshmallows, the last marshmallow, the Dock of Shame).
   The idiom is the cartoon's: squash and stretch, speed lines, a wooden
   camp sign for the clock, the outhouse door as the confessional wipe,
   Chris's production clipboard for what the camp cannot see.
   ══════════════════════════════════════════════════════════════════ */
:root {
  --ink: #1b1420;
  --orange: #f28c28;
  --yellow: #ffc93c;
  --wood: #8a5530;
  --wood-dark: #5e3519;
  --wood-light: #b77a45;
  --red: #d8433f;
  --green: #3f9a4a;
  --bg: #f3ead6;
  --bg2: #e8dcc0;
  --panel: #fffaf0;
  --text: #241a12;
  --muted: #7a6a58;
  --line: #d6c6a6;
  --paper: #fffdf6;
  --paper-line: #c9dcef;
  --cap-bg: #ffffff;
  --cap-text: #1b1420;
  --chip-bg: rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121c; --bg2: #1d1a28; --panel: #221e2e; --text: #f1e9da; --muted: #a99c8a;
    --line: #3a3348; --paper: #f6efdc; --paper-line: #b9cde0; --cap-bg: #fffaf0; --cap-text: #1b1420;
    --chip-bg: rgba(20,18,28,.82);
  }
}
:root[data-theme="dark"] {
  --bg: #14121c; --bg2: #1d1a28; --panel: #221e2e; --text: #f1e9da; --muted: #a99c8a;
  --line: #3a3348; --paper: #f6efdc; --paper-line: #b9cde0; --cap-bg: #fffaf0; --cap-text: #1b1420;
  --chip-bg: rgba(20,18,28,.82);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--orange) 10%, transparent), transparent 50%);
  color: var(--text);
  font: 700 15px/1.45 Nunito, system-ui, sans-serif;
  min-height: 100vh;
}
.app { max-width: 1240px; margin: 0 auto; padding: 14px 16px 28px; display: grid; gap: 12px;
  grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "side"; }
@media (min-width: 1000px) { .app { grid-template-columns: minmax(0, 1fr) 300px; grid-template-areas: "top top" "main side"; } }
.top { grid-area: top; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font: 400 26px/1 'Luckiest Guy', cursive; letter-spacing: 1px; color: var(--yellow);
  -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--orange), 4px 4px 0 var(--ink); transform: rotate(-3deg); }
.screens { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 6px; }
.scr-btn { border: 2px solid var(--ink); background: var(--panel); color: var(--text); font: 800 13px Nunito; padding: 6px 12px; border-radius: 999px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
.scr-btn.on { background: var(--yellow); color: var(--ink); }
.spacer { flex: 1; }
.tbtn { border: 2px solid var(--ink); background: var(--panel); color: var(--text); font: 800 12px Nunito; padding: 5px 10px; border-radius: 8px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
.tbtn svg { width: 14px; height: 14px; vertical-align: -2px; }
main { grid-area: main; min-width: 0; display: grid; gap: 10px; align-content: start; }

/* ── THE STAGE ─────────────────────────────────────────────────── */
.stage { position: relative; aspect-ratio: 16 / 9; border: 4px solid var(--ink); border-radius: 16px; overflow: hidden;
  background: #223; box-shadow: 6px 6px 0 var(--ink); isolation: isolate; }
.bd { position: absolute; inset: -4%; background-size: cover; background-position: center; transition: transform 1.1s cubic-bezier(.3,.7,.2,1), opacity .5s; will-change: transform; }
.bd.next { opacity: 0; }
.stage.whip .bd { filter: blur(14px); transform: translateX(-8%) scale(1.1) !important; transition: transform .22s ease-in, filter .22s; }
.shade { position: absolute; inset: 0; pointer-events: none; z-index: 3; transition: background .6s; }
.stage.night .shade { background: radial-gradient(ellipse at 50% 70%, rgba(255,160,80,.10), rgba(10,12,40,.28) 70%); }
.cast { position: absolute; inset: 0; z-index: 5; }
.card { position: absolute; transform-origin: 50% 100%; transition: left .7s cubic-bezier(.3,.8,.25,1.1), bottom .7s cubic-bezier(.3,.8,.25,1.1), width .7s cubic-bezier(.3,.8,.25,1.1), filter .5s, opacity .5s; }
.card .face { position: relative; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; background: #fff; aspect-ratio: 1; box-shadow: 0 0 0 3px #fff inset; transform: rotate(var(--tilt, 0deg)); transition: transform .4s; }
.card .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .name { position: absolute; left: 50%; bottom: -12%; transform: translateX(-50%) rotate(calc(var(--tilt, 0deg) * -1.4)); white-space: nowrap;
  font: 400 clamp(9px, 1.3vw, 15px)/1 'Luckiest Guy'; letter-spacing: .5px; color: #fff3d6; padding: 5px 9px 3px;
  background: linear-gradient(var(--wood-light), var(--wood)); border: 2.5px solid var(--ink); border-radius: 6px; box-shadow: 2px 2px 0 var(--ink); }
.card.bg { filter: brightness(.68) saturate(.75); }
.card.bg .name { font-size: clamp(7px, .9vw, 11px); }
.stage.night .card { filter: brightness(.86) saturate(.92); }
.stage.night .card.bg { filter: brightness(.55) saturate(.7); }
.card.speak { z-index: 4; }
.card.speak .face { box-shadow: 0 0 0 3px #fff inset, 0 0 0 4px var(--yellow), 0 10px 26px rgba(0,0,0,.35); transform: rotate(var(--tilt, 0deg)) translateY(-6%) scale(1.06); }
.card .mallow { position: absolute; top: -10%; right: -10%; width: 34%; aspect-ratio: 1.15; display: none; }
.card.safe .mallow { display: block; }
/* fresh-only animations */
.card.pop .face { animation: squash .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes squash { 0% { transform: rotate(var(--tilt)) scale(.6, 1.25) translateY(20%); } 45% { transform: rotate(var(--tilt)) scale(1.18, .86); } 70% { transform: rotate(var(--tilt)) scale(.95, 1.06) translateY(-8%); } 100% { transform: rotate(var(--tilt)) translateY(-6%) scale(1.06); } }
.card.laugh .face { animation: laugh .7s ease-in-out 2; }
@keyframes laugh { 0%,100% { transform: rotate(var(--tilt)) translateY(0); } 25% { transform: rotate(calc(var(--tilt) - 5deg)) translateY(-10%) scale(1.04,.96); } 50% { transform: rotate(var(--tilt)) translateY(0) scale(.97,1.04); } 75% { transform: rotate(calc(var(--tilt) + 5deg)) translateY(-8%); } }
.card.shake .face { animation: shake .5s linear; }
@keyframes shake { 0%,100% { transform: rotate(var(--tilt)) translateX(0); } 15% { transform: rotate(calc(var(--tilt) - 6deg)) translateX(-8%); } 35% { transform: rotate(calc(var(--tilt) + 6deg)) translateX(8%); } 55% { transform: rotate(calc(var(--tilt) - 4deg)) translateX(-5%); } 75% { transform: rotate(calc(var(--tilt) + 3deg)) translateX(3%); } }
.card.storm { animation: stormoff .9s cubic-bezier(.6,-0.3,.8,.4) forwards; }
@keyframes stormoff { 0% { transform: none; } 25% { transform: scale(.92,1.08) translateX(-4%); } 100% { transform: translateX(260%) rotate(12deg); opacity: 0; } }
.card.leanR .face { transform: rotate(9deg) translateX(10%) translateY(-6%) scale(1.06); }
.card.leanL .face { transform: rotate(-9deg) translateX(-10%) translateY(-6%) scale(1.06); }
.card.walk { animation: walkaway 2.6s ease-in forwards; }
@keyframes walkaway { 0% { transform: none; } 15% { transform: translateY(-3%); } 30% { transform: translateY(0); } 45% { transform: translateY(-3%) ; } 100% { transform: translate(-6%, -150%) scale(.22); opacity: .0; } }
.fx { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
.ring { position: absolute; border: 4px solid var(--yellow); border-radius: 50%; transform: translate(-50%, -50%); animation: ring .9s ease-out forwards; }
@keyframes ring { from { width: 10%; aspect-ratio: 1; opacity: 1; border-width: 6px; } to { width: 46%; aspect-ratio: 1; opacity: 0; border-width: 1px; } }
.popword { position: absolute; transform: translate(-50%, -50%) rotate(-8deg); font: 400 clamp(18px, 3.4vw, 40px)/1 'Luckiest Guy'; color: var(--yellow);
  -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); animation: popword 1.1s cubic-bezier(.3,1.7,.5,1) forwards; }
@keyframes popword { 0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg); } 30% { transform: translate(-50%,-50%) scale(1.25) rotate(-8deg); } 80% { opacity: 1; } 100% { transform: translate(-50%,-80%) scale(1) rotate(-8deg); opacity: 0; } }
.badge { position: absolute; transform: translate(-50%, -50%); width: clamp(22px, 3.4vw, 40px); aspect-ratio: 1; border-radius: 50%; background: var(--red); border: 3px solid var(--ink);
  color: #fff; font: 400 clamp(14px, 2.2vw, 26px)/1 'Luckiest Guy'; display: grid; place-items: center; animation: badge .9s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes badge { 0% { transform: translate(-50%,-30%) scale(0); } 40% { transform: translate(-50%,-60%) scale(1.2); } 85% { opacity: 1; } 100% { transform: translate(-50%,-70%) scale(1); opacity: 0; } }
.speed { position: absolute; inset: 0; animation: speedfade .7s ease-out forwards; }
@keyframes speedfade { from { opacity: .9; } to { opacity: 0; } }
.puff { position: absolute; width: 8%; aspect-ratio: 1; border-radius: 50%; background: #f4ecdc; border: 3px solid var(--ink); animation: puff .8s ease-out forwards; }
@keyframes puff { from { transform: translate(-50%,-50%) scale(.3); opacity: 1; } to { transform: translate(-50%,-50%) scale(1.6); opacity: 0; } }
.heart { position: absolute; transform: translate(-50%,-50%); width: 7%; animation: heart 1.2s ease-out forwards; }
@keyframes heart { 0% { transform: translate(-50%,-20%) scale(0); } 30% { transform: translate(-50%,-60%) scale(1.2); } 100% { transform: translate(-50%,-160%) scale(.9); opacity: 0; } }
.toss { position: absolute; width: 4.2%; aspect-ratio: 1.15; z-index: 9; }

/* the camp clock: a wooden sign on two ropes */
.sign { position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 12; text-align: center; pointer-events: none; }
.sign .ropes { display: flex; justify-content: space-between; width: 60%; margin: 0 auto; height: clamp(14px, 3vw, 34px); }
.sign .ropes i { width: 3px; background: #c9a56a; border-left: 1px solid var(--ink); border-right: 1px solid var(--ink); }
.plank { background: repeating-linear-gradient(180deg, var(--wood-light) 0 22%, var(--wood) 22% 24%, var(--wood-light) 24% 48%, #a86e3c 48% 50%, var(--wood-light) 50% 100%);
  border: 4px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 var(--ink); padding: .5em 1.1em .35em; color: #fff3d6; }
.sign .plank { font: 400 clamp(14px, 2.6vw, 30px)/1.05 'Luckiest Guy'; letter-spacing: 1px; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.sign .plank small { display: block; font-size: .62em; color: var(--yellow); letter-spacing: 2px; margin-bottom: .15em; }
.sign.drop { animation: signdrop .9s cubic-bezier(.3,1.5,.5,1); }
@keyframes signdrop { 0% { transform: translateX(-50%) translateY(-120%) rotate(-6deg); } 60% { transform: translateX(-50%) translateY(6%) rotate(3deg); } 80% { transform: translateX(-50%) translateY(-2%) rotate(-1.5deg); } 100% { transform: translateX(-50%) translateY(0) rotate(0); } }
.chip { position: absolute; left: 2%; top: 3%; z-index: 11; font: 900 clamp(8px, 1.15vw, 13px)/1 Nunito; letter-spacing: .5px; text-transform: uppercase; color: var(--text);
  background: var(--chip-bg); border: 2.5px solid var(--ink); border-radius: 999px; padding: .45em .9em; box-shadow: 2px 2px 0 var(--ink); }
.chip b { color: var(--orange); }
.cuttag { position: absolute; right: 2%; top: 3%; z-index: 11; font: 400 clamp(10px, 1.5vw, 17px)/1 'Luckiest Guy'; letter-spacing: 1px; color: var(--ink); background: var(--yellow);
  border: 3px solid var(--ink); padding: .4em .7em .3em; transform: rotate(3deg); box-shadow: 3px 3px 0 var(--ink); }

/* confession cam */
.conf .vig { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: radial-gradient(ellipse 62% 70% at 50% 52%, transparent 55%, rgba(0,0,0,.55) 100%); }
.grain { position: absolute; inset: -50%; z-index: 7; pointer-events: none; opacity: .14; mix-blend-mode: overlay; animation: grain .5s steps(4) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
@keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-6%,4%); } 50% { transform: translate(5%,-3%); } 75% { transform: translate(-3%,-6%); } 100% { transform: translate(0,0); } }
.camtag { position: absolute; right: 2.5%; bottom: 4%; z-index: 11; font: 400 clamp(10px, 1.6vw, 18px)/1 'Luckiest Guy'; letter-spacing: 1.5px; color: #fff3d6;
  -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.camtag i { display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: var(--orange); border: 2px solid var(--ink); margin-right: .35em; vertical-align: -1px; }
.fly { position: absolute; width: .7%; aspect-ratio: 1; background: #111; border-radius: 50%; z-index: 7; animation: fly 3s linear infinite; }
@keyframes fly { 0% { transform: translate(0,0); } 25% { transform: translate(380%, -220%); } 50% { transform: translate(120%, 160%); } 75% { transform: translate(-260%, -60%); } 100% { transform: translate(0,0); } }
.door { position: absolute; inset: 0; z-index: 20; pointer-events: none; transform: translateX(105%);
  background: repeating-linear-gradient(90deg, #8a5a30 0 11%, #6b4220 11% 11.6%, #94633a 11.6% 23%, #6b4220 23% 23.6%);
  border-left: 6px solid var(--ink); }
.door::after { content: ''; position: absolute; left: 50%; top: 14%; width: 7%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%;
  background: transparent; box-shadow: inset -.9vw .3vw 0 0 #1b1420; }
.door.shut { animation: doorshut .7s cubic-bezier(.6,0,.4,1) forwards; }
@keyframes doorshut { 0% { transform: translateX(105%); } 45% { transform: translateX(0); } 55% { transform: translateX(0); } 100% { transform: translateX(-105%); } }

/* title card */
.title { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(27,20,32,.35); }
.title .rays { position: absolute; left: 50%; top: 50%; width: 170%; aspect-ratio: 1; transform: translate(-50%,-50%);
  background: repeating-conic-gradient(var(--yellow) 0 9deg, var(--orange) 9deg 18deg); opacity: .92; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
.title .burst { position: relative; text-align: center; }
.title .kicker { font: 400 clamp(14px, 2.6vw, 30px)/1 'Luckiest Guy'; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); letter-spacing: 2px; }
.title .big { font: 400 clamp(30px, 7.4vw, 86px)/1 'Luckiest Guy'; color: var(--yellow); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink);
  margin: .1em 0 .2em; }
.title .faces { display: flex; justify-content: center; gap: 2.4%; }
.title .faces img { width: clamp(52px, 13vw, 150px); aspect-ratio: 1; object-fit: cover; border: 4px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); background: #fff; }
.title.fresh .big { animation: slam .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes slam { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 60% { transform: scale(.92) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(-2deg); } }
.title.fresh .faces img { animation: squash2 .5s cubic-bezier(.3,1.6,.5,1) backwards; }
.title.fresh .faces img:nth-child(2) { animation-delay: .12s; } .title.fresh .faces img:nth-child(3) { animation-delay: .24s; }
@keyframes squash2 { 0% { transform: scale(.3, 1.4) translateY(40%); opacity: 0; } 60% { transform: scale(1.15,.9); opacity: 1; } 100% { transform: none; } }

/* the plate of marshmallows */
.plate { position: absolute; right: 2%; top: 3%; z-index: 11; display: flex; align-items: center; gap: .35em; background: var(--chip-bg); border: 2.5px solid var(--ink); border-radius: 999px;
  padding: .35em .7em; box-shadow: 2px 2px 0 var(--ink); font: 900 clamp(8px, 1.1vw, 12px)/1 Nunito; color: var(--text); text-transform: uppercase; letter-spacing: .5px; }
.plate svg { width: clamp(10px, 1.5vw, 17px); height: auto; }
.plate svg.gone { opacity: .2; }
.chop { position: absolute; left: 50%; bottom: 47%; transform: translateX(-50%); z-index: 11; font: 400 clamp(12px, 2vw, 22px)/1 'Luckiest Guy'; color: #fff3d6; letter-spacing: 1px;
  -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink); }
.stage.tense .bd { animation: tense 1.6s ease-in-out infinite; }
@keyframes tense { 0%,100% { transform: scale(1.12); } 50% { transform: scale(1.15); } }

/* ── THE CAPTION ───────────────────────────────────────────────── */
.caption { position: relative; background: var(--cap-bg); color: var(--cap-text); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink);
  padding: 22px 18px 14px; min-height: 104px; }
.who { position: absolute; left: 14px; top: -18px; font: 400 18px/1 'Luckiest Guy'; letter-spacing: 1px; color: #fff3d6; padding: 7px 12px 5px;
  background: linear-gradient(var(--wood-light), var(--wood)); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
.who.conf { background: linear-gradient(#6f4a8a, #4f2f6a); }
.who.host { background: linear-gradient(var(--yellow), var(--orange)); color: var(--ink); -webkit-text-stroke: 0; }
.who.dir { display: none; }
.say { font: 800 clamp(16px, 2vw, 21px)/1.4 Nunito; }
.say.direction { font: 700 italic clamp(14px, 1.7vw, 18px)/1.45 Nunito; color: #6b5a48; }
.say.quote { font: 800 italic clamp(17px, 2.1vw, 23px)/1.4 Nunito; }
.say.quote::before { content: '\201C'; font: 400 1.6em/0 'Luckiest Guy'; color: #8a5aa8; vertical-align: -.35em; margin-right: .1em; }
.say.punch { animation: punch .35s cubic-bezier(.3,1.7,.5,1); transform-origin: 0 50%; }
@keyframes punch { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.caption.loud { animation: capshake .4s linear; }
@keyframes capshake { 0%,100% { transform: none; } 20% { transform: translate(-4px, 1px) rotate(-.6deg); } 40% { transform: translate(4px,-1px) rotate(.6deg); } 60% { transform: translate(-3px,0); } 80% { transform: translate(2px,0); } }
.hl-name { color: #c25d0e; }
.hl-game { background: linear-gradient(transparent 58%, color-mix(in srgb, var(--yellow) 75%, transparent) 58%); }
.say .caret { display: inline-block; width: .5em; height: 1em; background: var(--orange); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stepn { position: absolute; right: 12px; top: 8px; font: 800 11px Nunito; color: #9a8a76; }

/* ── CONTROLS ──────────────────────────────────────────────────── */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cbtn { border: 3px solid var(--ink); background: var(--panel); color: var(--text); font: 900 14px Nunito; padding: 8px 14px; border-radius: 12px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.cbtn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.cbtn.go { background: var(--yellow); color: var(--ink); font-size: 16px; padding: 8px 22px; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn.on { background: var(--orange); color: var(--ink); }
.progress { flex: 1; min-width: 120px; height: 12px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--panel); overflow: hidden; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(45deg, var(--orange) 0 8px, var(--yellow) 8px 16px); transition: width .3s; }

/* ── SCRIPT ────────────────────────────────────────────────────── */
details.script { background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }
details.script summary { cursor: pointer; padding: 10px 14px; font: 400 16px 'Luckiest Guy'; letter-spacing: 1px; }
.lines { max-height: 260px; overflow: auto; padding: 0 14px 12px; }
.ln { padding: 4px 8px; border-radius: 8px; cursor: pointer; font-weight: 700; }
.ln:hover { background: color-mix(in srgb, var(--yellow) 25%, transparent); }
.ln.cur { background: color-mix(in srgb, var(--yellow) 45%, transparent); }
.ln.sc { font: 400 13px 'Luckiest Guy'; letter-spacing: 1px; color: var(--orange); margin-top: 6px; }
.ln .n { font-weight: 900; }
.ln.d { font-style: italic; color: var(--muted); }
.ln.c .n { color: #8a5aa8; }

/* ── CHRIS'S CLIPBOARD ─────────────────────────────────────────── */
aside { grid-area: side; min-width: 0; }
.clip { position: relative; margin-top: 18px; background: linear-gradient(#a8743f, #8a5a30); border: 4px solid var(--ink); border-radius: 18px; padding: 26px 12px 12px; box-shadow: 6px 6px 0 var(--ink); }
.clip::before { content: ''; position: absolute; left: 50%; top: -16px; width: 110px; height: 34px; transform: translateX(-50%); border-radius: 10px;
  background: linear-gradient(#d8dce2, #9aa0a8); border: 4px solid var(--ink); }
.clip .sheet { background: var(--paper); color: #2a2018; border: 3px solid var(--ink); border-radius: 6px; min-height: 380px;
  background-image: repeating-linear-gradient(transparent 0 25px, var(--paper-line) 25px 26px); background-position: 0 40px; padding: 10px 12px 14px; }
.clip h3 { margin: 0 0 4px; font: 400 18px 'Permanent Marker'; color: #c8463c; transform: rotate(-1.5deg); }
.clip .sub { font: 700 11px Nunito; color: #7a6a58; margin-bottom: 8px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.tab { font: 900 11px Nunito; border: 2px solid var(--ink); background: #f4ead2; color: #2a2018; border-radius: 6px 6px 0 0; padding: 3px 7px; cursor: pointer; }
.tab.on { background: var(--yellow); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 3px; vertical-align: 1px; }
.note { font: 400 15px/1.35 'Permanent Marker'; color: #2a2a5a; margin: 8px 0; }
.note .k { color: #c8463c; }
.note small { display: block; font: 700 12px/1.35 Nunito; color: #5a4a3a; margin-top: 1px; }
.note.fresh { animation: inkin .6s ease-out; }
@keyframes inkin { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.ally { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; font: 400 15px 'Permanent Marker'; color: #2a2a5a; }
.minis { display: flex; gap: 3px; }
.minis img { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--ink); object-fit: cover; }
.bond { display: grid; grid-template-columns: 1fr 70px 26px; gap: 6px; align-items: center; font: 800 12px Nunito; margin: 5px 0; }
.bar { height: 9px; border: 2px solid var(--ink); border-radius: 5px; background: #eee3cc; position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 50%; }
.bar i.pos { background: var(--green); } .bar i.neg { background: var(--red); right: 50%; left: auto; }
.empty { font: 400 14px 'Permanent Marker'; color: #9a8a76; margin-top: 10px; }
.tally { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: center; margin: 6px 0; font: 800 13px Nunito; }
.tally img { width: 30px; height: 30px; border-radius: 6px; border: 2px solid var(--ink); object-fit: cover; }
.tally .marks { font: 400 18px 'Permanent Marker'; color: #c8463c; letter-spacing: 1px; }
.foot { margin-top: 10px; font: 700 12px Nunito; color: var(--muted); text-align: center; }
/* dark: the ink outline stays, the hard shadow turns to a warm glow so it still reads */
:root[data-theme="dark"] .cbtn, :root[data-theme="dark"] .tbtn, :root[data-theme="dark"] .scr-btn, :root[data-theme="dark"] details.script,
:root[data-theme="dark"] .stage, :root[data-theme="dark"] .caption, :root[data-theme="dark"] .clip, :root[data-theme="dark"] .progress { border-color: #000; box-shadow: 4px 4px 0 color-mix(in srgb, var(--orange) 55%, #000); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cbtn, :root:not([data-theme="light"]) .tbtn, :root:not([data-theme="light"]) .scr-btn, :root:not([data-theme="light"]) details.script,
  :root:not([data-theme="light"]) .stage, :root:not([data-theme="light"]) .caption, :root:not([data-theme="light"]) .clip, :root:not([data-theme="light"]) .progress { border-color: #000; box-shadow: 4px 4px 0 color-mix(in srgb, var(--orange) 55%, #000); }
}
@media (max-width: 560px) {
  .app { padding: 10px 16px 24px; }
  .logo { font-size: 20px; }
  .caption { min-height: 120px; padding: 20px 12px 12px; }
  .who { font-size: 15px; }
  .cbtn { padding: 7px 10px; font-size: 13px; }
  .cbtn .lbl { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">Total Drama</div>
    <div class="screens" id="screens"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="classic" title="Classic viewer, same screen">Classic</button>
    <button class="tbtn" id="sound" title="Music only under plans, fights and the ceremony"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndw" d="M17 9a4 4 0 0 1 0 6"/></svg> <span id="sndl">Off</span></button>
    <button class="tbtn" id="theme" title="Light / dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
  </div>
  <main>
    <div class="stage" id="stage">
      <div class="bd" id="bd0"></div><div class="bd next" id="bd1"></div>
      <div class="shade"></div>
      <div class="cast" id="cast"></div>
      <div class="fx" id="fx"></div>
      <div id="hud"></div>
      <div class="door" id="door"></div>
    </div>
    <div class="caption" id="caption"><div class="who" id="who"></div><div class="say" id="say"></div><div class="stepn" id="stepn"></div></div>
    <div class="controls">
      <button class="cbtn" id="restart" title="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lbl">Restart</span></button>
      <button class="cbtn" id="back" title="Back (Left arrow)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Back</span></button>
      <button class="cbtn go" id="next" title="Next (Space / Right arrow)">Next <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="cbtn" id="auto" title="Play on its own"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg><span class="lbl">Auto</span></button>
      <button class="cbtn" id="all" title="Reveal everything on this screen"><span class="lbl">All</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 5l7 7-7 7M12 5l7 7-7 7"/></svg></button>
      <div class="progress"><i id="prog"></i></div>
    </div>
    <details class="script" id="script"><summary>The script</summary><div class="lines" id="lines"></div></details>
  </main>
  <aside>
    <div class="clip">
      <div class="sheet" id="sheet"></div>
    </div>
    <div class="foot">Only what has aired so far. Click any line in the script to jump.</div>
  </aside>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// DATA — what the engine would write. Seed-4242-shaped Gophers, day 4.
// ══════════════════════════════════════════════════════════════════
const AV = n => `../assets/avatars/${n.toLowerCase()}.png`;
const SET = (v, s, tod) => `../assets/sets/td/${v}/${s}-${tod}.webp`;
const GOPHERS = ['Alejandro', 'Geoff', 'Sierra', 'Harold', 'Courtney', 'Gwen', 'Noah', 'Izzy'];
const GAME_WORDS = ['vote', 'votes', 'voting', 'alliance', 'idol', 'marshmallow', 'marshmallows', 'Dock of Shame', 'Boat of Losers', 'relay', 'Outcasts', 'Trifecta', 'tonight', 'final two'];
const MALLOW = '<svg viewBox="0 0 46 40"><ellipse cx="23" cy="30" rx="20" ry="8" fill="#e8e0d0" stroke="#1b1420" stroke-width="3"/><rect x="3" y="10" width="40" height="20" fill="#fffaf2" stroke="none"/><path d="M3 10v20M43 10v20" stroke="#1b1420" stroke-width="3"/><ellipse cx="23" cy="10" rx="20" ry="8" fill="#ffffff" stroke="#1b1420" stroke-width="3"/><ellipse cx="17" cy="8" rx="6" ry="2" fill="#f1ece2"/></svg>';

// One step = one line, one stage direction, or one reveal. `side` items enter
// Chris's clipboard at the step they belong to and stay.
const CAMP = [
  { t: 'scene', spot: 'dock', tod: 'day', day: 'DAY 4', clock: '7:12 AM', place: 'The Dock', focus: ['Geoff', 'Alejandro'], bg: ['Harold'], bgAt: [[50, 30]], bed: 'none',
    side: [{ tab: 'bonds', pairs: [['Alejandro', 'Geoff', 4], ['Alejandro', 'Courtney', -2], ['Geoff', 'Courtney', 1]] }] },
  { t: 'dir', text: 'Geoff baits a hook. Alejandro holds the worm bucket at arm’s length.' },
  { t: 'line', who: 'Geoff', text: 'Dude, hold it closer. The worms aren’t gonna bite you.' },
  { t: 'line', who: 'Alejandro', text: 'Listen. Courtney sat out the whole relay yesterday. That’s why we lost.', bed: 'camp-day' },
  { t: 'line', who: 'Geoff', text: 'She said she hurt her ankle.' },
  { t: 'line', who: 'Alejandro', text: 'Her ankle was fine at dinner. She stood on a bench to yell at Chef.' },
  { t: 'line', who: 'Geoff', text: 'Okay, but why not Noah? He called my hat a cry for help.' },
  { t: 'line', who: 'Alejandro', text: 'Noah is annoying. Courtney wants to run this team. Annoying, I can live with.' },
  { t: 'dir', text: 'Geoff yanks a fish out of the lake. It slaps Alejandro across the face.', act: [{ kind: 'shake', who: 'Alejandro' }, { kind: 'laugh', who: 'Geoff' }], pop: 'SLAP!' },
  { t: 'line', who: 'Geoff', text: 'Ha! Breakfast! Fine. Courtney. But you’re carrying the fish.',
    side: [{ tab: 'plans', who: 'Alejandro', target: 'Courtney', why: 'sat out the relay; wants to run the team' },
           { tab: 'plans', who: 'Geoff', target: 'Courtney', why: 'wanted Noah; Alejandro talked him round' }] },
  { t: 'conf', who: 'Alejandro', text: 'Geoff is a great guy. By lunch, he will think getting rid of Courtney was his idea.' },

  { t: 'cut', spot: 'mess-hall', tod: 'day', clock: '7:40 AM', place: 'The Mess Hall', focus: ['Izzy', 'Harold'], bed: 'none' },
  { t: 'dir', text: 'Izzy balances a spoon on her nose. Harold times her on his digital watch.' },
  { t: 'line', who: 'Harold', text: 'Forty seconds. That’s a camp record. I checked.' },
  { t: 'line', who: 'Izzy', text: 'Izzy doesn’t do records. Izzy does legends!', act: [{ kind: 'laugh', who: 'Izzy' }, { kind: 'laugh', who: 'Harold' }],
    side: [{ tab: 'log', text: 'Harold and Izzy: +1 (spoon record)' }] },

  { t: 'scene', spot: 'cabins', tod: 'day', day: 'DAY 4', clock: '10:30 AM', place: 'The Cabins', focus: ['Courtney', 'Sierra'], bg: ['Gwen'], bed: 'none' },
  { t: 'dir', text: 'Courtney marches out of the girls’ cabin holding her planner open.' },
  { t: 'line', who: 'Courtney', text: 'Who read my planner? There’s a sticky note in here that says “cute handwriting!”' },
  { t: 'line', who: 'Sierra', text: 'It’s a compliment! I read everybody’s stuff. It’s research.' },
  { t: 'line', who: 'Courtney', text: 'That is an invasion of privacy! I could sue you for that!', loud: true, react: ['Gwen'], bed: 'camp-day' },
  { t: 'line', who: 'Sierra', text: 'Can you sue somebody for sitting out a relay? Asking for the team.' },
  { t: 'dir', text: 'Courtney storms back inside and slams the door. The whole cabin shakes.', act: [{ kind: 'storm', who: 'Courtney' }], pop: 'SLAM!',
    side: [{ tab: 'bonds', pairs: [['Courtney', 'Sierra', -3]] }, { tab: 'plans', who: 'Courtney', target: 'Sierra', why: 'read her planner' },
           { tab: 'log', text: 'Courtney and Sierra: −2 (the planner)' }] },
  { t: 'line', who: 'Gwen', text: 'And that’s my morning.', focusAdd: 'Gwen' },
  { t: 'conf', who: 'Sierra', text: 'I’ve seen every season of every reality show. The one who yells on day four never makes the merge.' },

  { t: 'scene', spot: 'campfire', tod: 'day', day: 'DAY 4', clock: '4:15 PM', place: 'The Campfire Pit', focus: ['Gwen', 'Noah'], bed: 'none',
    side: [{ tab: 'bonds', pairs: [['Gwen', 'Noah', 5], ['Gwen', 'Alejandro', -2], ['Noah', 'Alejandro', -1]] }, { tab: 'love', who: 'Noah', to: 'Gwen', what: 'crush (since day 1)' }] },
  { t: 'dir', text: 'Noah reads on a stump. Gwen sits down next to him with her sketchbook on her knees.' },
  { t: 'line', who: 'Gwen', text: 'You know Alejandro’s telling everyone they’re the only person he trusts?' },
  { t: 'line', who: 'Noah', text: 'He told me that on day one. I didn’t buy it then either.', bed: 'camp-day' },
  { t: 'line', who: 'Gwen', text: 'He’s got Geoff and Sierra. That’s three. With Courtney gone tonight, it’s three against everybody.' },
  { t: 'line', who: 'Noah', text: 'So we vote him. Courtney’s going home anyway, and maybe somebody gets brave.' },
  { t: 'line', who: 'Gwen', text: 'Two votes isn’t a plan, Noah.' },
  { t: 'line', who: 'Noah', text: 'It’s a start. Call us the Outcasts. Nobody here wants us anyway.', act: [{ kind: 'lean', who: ['Noah', 'Gwen'] }] },
  { t: 'line', who: 'Gwen', text: 'Fine. But I’m not making T-shirts.', act: [{ kind: 'laugh', who: 'Noah' }],
    side: [{ tab: 'plans', who: 'Gwen', target: 'Alejandro', why: 'tells everyone they’re his only friend' },
           { tab: 'plans', who: 'Noah', target: 'Alejandro', why: 'votes with Gwen' }] },
  { t: 'title', kind: 'ALLIANCE FORMED', name: 'The Outcasts', faces: ['Gwen', 'Noah'], side: [{ tab: 'allies', name: 'The Outcasts', who: ['Gwen', 'Noah'] }] },
  { t: 'conf', who: 'Noah', text: 'I don’t do alliances. But Gwen laughs at my jokes, so I’m making an exception.' },
];
CAMP[0].side.unshift({ tab: 'allies', name: 'The Trifecta', who: ['Alejandro', 'Geoff', 'Sierra'], since: 'day 1' },
                     { tab: 'secrets', text: 'Sierra holds a Hidden Immunity Idol. Nobody knows.' });

const TRIBAL = [
  { t: 'scene', spot: 'ceremony', venue: 'hosted-camp', tod: 'night', day: 'DAY 4', clock: '9:05 PM', place: 'The Campfire Ceremony', focus: [], bg: [], seated: GOPHERS, bed: 'tribal', ceremony: true },
  { t: 'line', who: 'Chris', text: 'Gophers! Back so soon. And you lost the relay by, what, a whole lake?' },
  { t: 'line', who: 'Chris', text: 'Courtney. Rumour has it your ankle made a full recovery by dinner.', focus: ['Courtney'] },
  { t: 'line', who: 'Courtney', text: 'It’s called pacing myself. Some of us are playing a long game.', focus: ['Courtney'] },
  { t: 'line', who: 'Sierra', text: 'The long game of sitting on a log.', focus: ['Courtney', 'Sierra'], react: ['Geoff'], act: [{ kind: 'laugh', who: 'Geoff' }] },
  { t: 'line', who: 'Chris', text: 'Gwen! Anybody here playing too hard?', focus: ['Gwen'] },
  { t: 'line', who: 'Gwen', text: 'Somebody’s been telling everyone they’re his best friend. Does that count?', focus: ['Gwen', 'Alejandro'], react: ['Alejandro', 'Geoff'] },
  { t: 'line', who: 'Alejandro', text: 'Making friends is not a crime, Gwen.', focus: ['Gwen', 'Alejandro'] },
  { t: 'line', who: 'Chris', text: 'Ooh! Okay. You’ve all cast your votes in the confession cam. Let’s see what you said.' },
  { t: 'vote', who: 'Alejandro', text: 'Nobody stands on a bench with a hurt ankle. Sorry, princess.',
    side: [{ tab: 'tally', voter: 'Alejandro', target: 'Courtney' }] },
  { t: 'vote', who: 'Gwen', text: 'Two votes isn’t a plan. But it’s my vote, and I’m using it.',
    side: [{ tab: 'tally', voter: 'Gwen', target: 'Alejandro' }] },
  { t: 'vote', who: 'Courtney', text: 'Read my planner? Enjoy reading the inside of a boat.',
    side: [{ tab: 'tally', voter: 'Courtney', target: 'Sierra' }] },
  { t: 'votes', who: ['Geoff', 'Sierra', 'Harold', 'Izzy', 'Noah'], text: 'Geoff, Sierra, Harold, Izzy and Noah cast their votes.',
    side: [{ tab: 'tally', voter: 'Geoff', target: 'Courtney' }, { tab: 'tally', voter: 'Sierra', target: 'Courtney' }, { tab: 'tally', voter: 'Harold', target: 'Courtney' },
           { tab: 'tally', voter: 'Izzy', target: 'Courtney' }, { tab: 'tally', voter: 'Noah', target: 'Alejandro' }] },
  { t: 'line', who: 'Chris', text: 'There are eight of you, and only seven marshmallows on this plate. When I call your name, come and get one.' },
  { t: 'mallow', who: 'Geoff' },
  { t: 'mallow', who: 'Harold' },
  { t: 'mallow', who: 'Izzy' },
  { t: 'mallow', who: 'Gwen' },
  { t: 'mallow', who: 'Noah' },
  { t: 'mallow', who: 'Sierra' },
  { t: 'line', who: 'Chris', text: 'Courtney. Alejandro.', focus: ['Courtney', 'Alejandro'], tense: true },
  { t: 'line', who: 'Chris', text: 'This is the final marshmallow of the evening.', focus: ['Courtney', 'Alejandro'], tense: true },
  { t: 'dir', text: 'Courtney grips the stump. Alejandro doesn’t blink.', focus: ['Courtney', 'Alejandro'], tense: true, act: [{ kind: 'shake', who: 'Courtney' }] },
  { t: 'mallow', who: 'Alejandro', last: true },
  { t: 'line', who: 'Courtney', text: 'What? No. No! I was the only one here with a plan!', focus: ['Courtney'], loud: true, react: ['Sierra', 'Gwen'] },
  { t: 'line', who: 'Chris', text: 'Courtney, the Dock of Shame is that way. The Boat of Losers waits for no one.', focus: ['Courtney'] },
  { t: 'exit', who: 'Courtney', spot: 'exit', clock: '9:31 PM', place: 'The Dock of Shame', text: 'This is a mistake! My lawyers are going to hear about this!', bed: 'none' },
];

const SCREENS = [
  { id: 'td-camp-pre', label: 'Camp · Gophers', venue: 'hosted-camp', steps: CAMP },
  { id: 'td-tribal', label: 'Campfire Ceremony', venue: 'hosted-camp', steps: TRIBAL },
];

// ══════════════════════════════════════════════════════════════════
// LEDGER — what is true at step N, folded from the steps. Never kept.
// ══════════════════════════════════════════════════════════════════
function ledgerAt(scr, idx) {
  const L = { scene: null, cut: false, conf: null, focus: [], bg: [], gone: new Set(), safe: [], seated: [], ceremony: false, tense: false, exit: null,
              side: [], tallies: {}, voted: new Set(), plate: 7, sceneStart: 0 };
  scr.steps.forEach((s, i) => {
    if (i > idx) return;
    if (s.t === 'scene' || s.t === 'cut') {
      L.scene = s; L.cut = s.t === 'cut'; L.focus = [...(s.focus || [])]; L.bg = [...(s.bg || [])]; L.gone = new Set(); L.sceneStart = i;
      if (s.seated) { L.seated = [...s.seated]; L.ceremony = true; }
    }
    L.conf = (s.t === 'conf' || s.t === 'vote') ? s : null;
    if (s.focusAdd && !L.focus.includes(s.focusAdd)) { L.focus.push(s.focusAdd); L.bg = L.bg.filter(n => n !== s.focusAdd); }
    if (s.act) s.act.forEach(a => { if (a.kind === 'storm') L.gone.add(a.who); });
    if (s.t === 'mallow') { L.safe.push(s.who); L.plate--; }
    L.tense = !!s.tense;
    if (s.t === 'exit') L.exit = s;
    if (s.t === 'vote') L.voted.add(s.who);
    if (s.t === 'votes') s.who.forEach(n => L.voted.add(n));
    (s.side || []).forEach(x => L.side.push({ ...x, at: i }));
  });
  return L;
}

// ══════════════════════════════════════════════════════════════════
// STAGE — paint step N. Only the newest step animates (fresh).
// ══════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
let SI = 0, IDX = 0, AUTO = null, TYPING = null, SOUND = false, front = 0;
const cards = {};

function card(name) {
  if (cards[name]) return cards[name];
  const el = document.createElement('div');
  el.className = 'card';
  const tilt = ((name.charCodeAt(0) * 7 + name.length * 3) % 9) - 4;
  el.style.setProperty('--tilt', tilt + 'deg');
  el.innerHTML = `<div class="face"><img src="${AV(name)}" alt=""></div><div class="name">${name}</div><div class="mallow">${MALLOW}</div>`;
  $('cast').appendChild(el);
  cards[name] = el;
  return el;
}

function place(el, x, bottom, w) { el.style.left = (x - w / 2) + '%'; el.style.bottom = bottom + '%'; el.style.width = w + '%'; }

function setBackdrop(url, how, fresh) {
  const cur = $('bd' + front), nxt = $('bd' + (1 - front));
  if (cur.dataset.url === url) return;
  if (!fresh || how === 'cut') {
    cur.style.backgroundImage = `url(${url})`; cur.dataset.url = url; cur.classList.remove('next'); nxt.classList.add('next'); return;
  }
  nxt.style.backgroundImage = `url(${url})`; nxt.dataset.url = url;
  nxt.classList.remove('next'); cur.classList.add('next'); front = 1 - front;
}

function anchor(name) {
  const el = cards[name]; if (!el) return { x: 50, y: 50 };
  const st = $('stage').getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: ((r.left + r.width / 2) - st.left) / st.width * 100, y: (r.top - st.top) / st.height * 100 };
}

function fx(html, x, y, cls) {
  const d = document.createElement('div'); d.className = cls; d.style.left = x + '%'; d.style.top = y + '%'; d.innerHTML = html || '';
  $('fx').appendChild(d); setTimeout(() => d.remove(), 2600);
}

function speedLines() {
  const d = document.createElement('div'); d.className = 'speed';
  let p = ''; for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, r1 = 38, r2 = 80; p += `<line x1="${50 + Math.cos(a) * r1}" y1="${50 + Math.sin(a) * r1 * .6}" x2="${50 + Math.cos(a) * r2}" y2="${50 + Math.sin(a) * r2 * .6}" stroke="#1b1420" stroke-width="${.4 + (i % 3) * .3}"/>`; }
  d.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%">${p}</svg>`;
  $('fx').appendChild(d); setTimeout(() => d.remove(), 800);
}

function paint(fresh) {
  const scr = SCREENS[SI], s = scr.steps[IDX], L = ledgerAt(scr, IDX), stage = $('stage');
  const venue = scr.venue, sc = L.scene;
  stage.classList.toggle('night', (L.exit ? 'night' : sc.tod) === 'night');
  stage.classList.toggle('conf', !!L.conf);
  stage.classList.toggle('tense', L.tense);
  if (!fresh) { stage.querySelectorAll('.card').forEach(c => c.style.transition = 'none'); }

  // the backdrop and the camera
  const spot = L.exit ? 'exit' : (L.conf ? 'confessional' : sc.spot);
  const tod = L.exit ? 'night' : (L.conf ? 'day' : sc.tod);
  const enteringConf = fresh && L.conf && !(IDX > 0 && ledgerAt(scr, IDX - 1).conf);
  const leavingConf = fresh && !L.conf && IDX > 0 && ledgerAt(scr, IDX - 1).conf;
  const isCut = fresh && s.t === 'cut';
  const swap = () => setBackdrop(SET(venue, spot, tod), (enteringConf || leavingConf || isCut) ? 'cut' : 'fade', fresh);
  if (enteringConf || leavingConf) { const d = $('door'); d.classList.remove('shut'); void d.offsetWidth; d.classList.add('shut'); setTimeout(swap, 300); }
  else if (isCut) { stage.classList.add('whip'); setTimeout(() => { swap(); stage.classList.remove('whip'); }, 220); }
  else swap();

  // who is on stage, and where
  const speaker = (s.t === 'line' || s.t === 'conf' || s.t === 'vote' || s.t === 'mallow') ? s.who : null;
  Object.values(cards).forEach(c => { c.style.opacity = 0; c.classList.remove('speak', 'pop', 'laugh', 'shake', 'storm', 'leanL', 'leanR', 'bg', 'safe', 'walk'); });
  const show = (n, x, b, w, cls) => { const c = card(n); place(c, x, b, w); c.style.opacity = 1; if (cls) c.classList.add(...cls.split(' ')); return c; };

  if (L.conf) {
    show(L.conf.who, 50, -6, 40, 'speak');
  } else if (L.exit) {
    const c = show(L.exit.who, 50, 4, 20, 'speak');
    if (fresh) setTimeout(() => c.classList.add('walk'), 900);
  } else if (L.ceremony) {
    // the camp on the stumps; the safe ones step back with their marshmallow
    const stumps = L.seated.filter(n => !L.safe.includes(n));
    const focus = (s.focus || []).filter(n => stumps.includes(n) || L.safe.includes(n));
    const back = L.safe;
    back.forEach((n, i) => show(n, back.length === 1 ? 50 : 10 + i * (80 / (back.length - 1)), 34, 8.5, 'safe' + (n === speaker ? ' speak' : ' bg')));
    const wFront = stumps.length > 4 ? 13 : 17;
    stumps.forEach((n, i) => {
      const x = stumps.length === 1 ? 50 : 12 + i * (76 / (stumps.length - 1));
      const isF = focus.includes(n) || n === speaker;
      show(n, x, 8, isF ? wFront + 4 : wFront, (focus.length && !isF ? 'bg' : '') + (n === speaker ? ' speak' : ''));
    });
  } else {
    const focus = L.focus.filter(n => !L.gone.has(n)).slice(0, 3);
    const bg = L.bg.filter(n => !L.gone.has(n));
    // a background camper stands where the set has floor for them (on the dock, not on the lake)
    bg.forEach((n, i) => { const at = (sc.bgAt || [])[i]; show(n, at ? at[0] : (i % 2 ? 88 - i * 6 : 10 + i * 6), at ? at[1] : 17, at ? 7 : 9, 'bg'); });
    const xs = focus.length === 1 ? [50] : focus.length === 2 ? [32, 68] : [22, 50, 78];
    focus.forEach((n, i) => show(n, xs[i], 8, focus.length === 3 ? 20 : 23, n === speaker ? 'speak' : ''));
    // the storm-off plays on the step that has it
    if (fresh && s.act) s.act.filter(a => a.kind === 'storm').forEach(a => { const c = card(a.who); c.style.opacity = 1; c.classList.add('storm');
      const xy = anchor(a.who); fx('', xy.x, 90, 'puff'); });
  }
  // camera pushes toward whoever speaks
  const bd = $('bd' + front);
  if (speaker && cards[speaker] && !L.conf) { const xy = anchor(speaker); bd.style.transform = `scale(1.1) translate(${(50 - xy.x) * .06}%, 1%)`; }
  else bd.style.transform = L.conf ? 'scale(1.04)' : 'scale(1.03)';

  if (!fresh) requestAnimationFrame(() => requestAnimationFrame(() => stage.querySelectorAll('.card').forEach(c => c.style.transition = '')));

  // HUD
  let hud = '';
  if (L.conf) hud += `<div class="vig"></div><div class="grain"></div>${[0, 1, 2].map(i => `<div class="fly" style="left:${38 + i * 9}%;top:${30 + (i % 2) * 14}%;animation-delay:-${i}s"></div>`).join('')}<div class="camtag"><i></i>${s.t === 'vote' ? 'The Vote' : 'Confession Cam'}</div>`;
  else if (L.exit) hud += `<div class="chip"><b>${sc.day}</b> · ${L.exit.clock} · ${L.exit.place}</div><div class="cuttag">Boat of Losers</div>`;
  else {
    const isSceneStep = (s.t === 'scene' || s.t === 'cut');
    if (isSceneStep && s.t === 'scene') hud += `<div class="sign ${fresh ? 'drop' : ''}"><div class="ropes"><i></i><i></i></div><div class="plank"><small>${sc.day} · ${sc.clock}</small>${sc.place}</div></div>`;
    else hud += `<div class="chip"><b>${sc.day || 'DAY 4'}</b> · ${sc.clock} · ${sc.place}</div>`;
    if (L.cut) hud += `<div class="cuttag">Meanwhile</div>`;
    if (L.ceremony) hud += `<div class="plate">${Array.from({ length: 7 }, (_, i) => MALLOW.replace('<svg', `<svg class="${i < L.plate ? '' : 'gone'}"`)).join('')}</div>`;
    if (L.tense) hud += `<div class="chop">On the chopping block</div>`;
  }
  if (s.t === 'title') hud += `<div class="title ${fresh ? 'fresh' : ''}"><div class="rays"></div><div class="burst"><div class="kicker">${s.kind}</div><div class="big">${s.name}</div><div class="faces">${s.faces.map(n => `<img src="${AV(n)}" alt="${n}">`).join('')}</div></div></div>`;
  if (s.t === 'votes') hud += `<div class="title ${fresh ? 'fresh' : ''}" style="background:rgba(27,20,32,.55)"><div class="burst"><div class="kicker">The rest of the vote</div><div class="faces" style="margin-top:4%">${s.who.map(n => `<img src="${AV(n)}" alt="${n}" style="width:clamp(40px,10vw,110px)">`).join('')}</div></div></div>`;
  $('hud').innerHTML = hud;

  // the actions on this step
  if (fresh) {
    if (speaker && cards[speaker] && !L.conf && !L.exit) cards[speaker].classList.add('pop');
    (s.act || []).forEach(a => {
      const who = [].concat(a.who);
      if (a.kind === 'laugh') who.forEach(n => cards[n] && cards[n].classList.add('laugh'));
      if (a.kind === 'shake') who.forEach(n => cards[n] && cards[n].classList.add('shake'));
      if (a.kind === 'lean' && who.length === 2) {
        const [l, r] = who.map(anchor)[0].x < who.map(anchor)[1].x ? who : [...who].reverse();
        cards[l] && cards[l].classList.add('leanR'); cards[r] && cards[r].classList.add('leanL');
        const A = anchor(l), B = anchor(r); fx('psst', (A.x + B.x) / 2, A.y - 4, 'popword');
      }
    });
    if (s.pop) { const n = [].concat((s.act || [])[0]?.who || [])[0]; const xy = n ? anchor(n) : { x: 50, y: 40 }; fx(s.pop, xy.x, Math.max(xy.y - 6, 14), 'popword'); }
    if (s.loud && speaker) { const xy = anchor(speaker); for (let k = 0; k < 3; k++) setTimeout(() => fx('', xy.x, xy.y + 10, 'ring'), k * 140); speedLines();
      const cap = $('caption'); cap.classList.remove('loud'); void cap.offsetWidth; cap.classList.add('loud'); }
    (s.react || []).forEach((n, k) => setTimeout(() => { if (cards[n] && cards[n].style.opacity !== '0') { const xy = anchor(n); fx('!', xy.x, xy.y, 'badge'); cards[n].classList.add('shake'); } }, 260 + k * 120));
    if (s.t === 'mallow') toss(s.who, s.last);
  }

  caption(s, fresh, L);
  script(L);
  clipboard(L, fresh);
  $('prog').style.width = ((IDX + 1) / scr.steps.length * 100) + '%';
  $('stepn').textContent = `${IDX + 1} / ${scr.steps.length}`;
  music(scr, IDX);
}

function toss(name, last) {
  const st = $('stage').getBoundingClientRect(), to = anchor(name);
  const t = document.createElement('div'); t.className = 'toss'; t.innerHTML = MALLOW; $('fx').appendChild(t);
  const from = { x: 64, y: 46 };
  const k = t.animate([
    { left: from.x + '%', top: from.y + '%', transform: 'rotate(0deg) scale(.8)' },
    { left: (from.x + to.x) / 2 + '%', top: Math.min(from.y, to.y) - 26 + '%', transform: 'rotate(240deg) scale(1.2)', offset: .5 },
    { left: to.x + '%', top: to.y + 2 + '%', transform: 'rotate(480deg) scale(1)' },
  ], { duration: last ? 1100 : 700, easing: 'cubic-bezier(.3,.6,.4,1)' });
  k.onfinish = () => { t.remove(); fx('', to.x, to.y + 6, 'puff'); };
  if (last) fx('SAFE!', to.x, to.y - 4, 'popword');
}

// ── caption: names and game words light up once the line is complete
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function highlight(text) {
  let h = esc(text);
  const names = [...GOPHERS, 'Chris', 'Chef'];
  h = h.replace(new RegExp(`\\b(${names.join('|')})\\b`, 'g'), '<span class="hl-name">$1</span>');
  h = h.replace(new RegExp(`\\b(${GAME_WORDS.map(w => w.replace(/ /g, '\\s')).join('|')})\\b`, 'gi'), '<span class="hl-game">$1</span>');
  return h;
}
function caption(s, fresh, L) {
  const who = $('who'), say = $('say');
  clearTimeout(TYPING);
  let name = '', cls = 'who', text = '', scls = 'say';
  if (s.t === 'line') { name = s.who; text = s.text; if (s.who === 'Chris') cls += ' host'; }
  else if (s.t === 'conf') { name = s.who + ' · confessional'; cls += ' conf'; text = s.text; scls += ' quote'; }
  else if (s.t === 'vote') { name = s.who + ' · votes'; cls += ' conf'; text = s.text; scls += ' quote'; }
  else if (s.t === 'exit') { name = s.who; text = s.text; scls += ' quote'; }
  else if (s.t === 'mallow') { name = 'Chris'; cls += ' host'; text = s.last ? `${s.who}.` : `${s.who}.`; }
  else if (s.t === 'scene' || s.t === 'cut') { cls += ' dir'; text = s.ceremony ? 'The campers file in and sit on the stumps around the fire. Chris waits behind the oil drum with a plate of marshmallows.' : `${L.focus.join(' and ')}${L.bg.length ? ', with ' + L.bg.join(', ') + ' nearby' : ''}.`; scls += ' direction'; }
  else if (s.t === 'title') { cls += ' dir'; text = `${s.faces.join(' and ')} are an alliance: ${s.name}.`; scls += ' direction'; }
  else { cls += ' dir'; text = s.text; scls += ' direction'; }
  who.className = cls; who.textContent = name;
  say.className = scls;
  const full = highlight(text);
  if (!fresh || text.length < 46) { say.innerHTML = full; if (fresh) { say.classList.add('punch'); } return; }
  // type at speaking pace; breathe at commas and full stops
  let i = 0; say.textContent = '';
  const tick = () => {
    i++; say.innerHTML = esc(text.slice(0, i)) + '<span class="caret"></span>';
    if (i >= text.length) { say.innerHTML = full; return; }
    const c = text[i - 1]; TYPING = setTimeout(tick, c === '.' || c === '?' || c === '!' ? 260 : c === ',' ? 140 : 24);
  };
  tick();
}

function script(L) {
  const scr = SCREENS[SI];
  let h = '';
  scr.steps.forEach((s, i) => {
    if (i > IDX) return;
    const cur = i === IDX ? ' cur' : '';
    if (s.t === 'scene' || s.t === 'cut') h += `<div class="ln sc${cur}" data-i="${i}">${s.t === 'cut' ? 'Meanwhile · ' : ''}${s.day || ''} ${s.clock} — ${s.place}</div>`;
    else if (s.t === 'line') h += `<div class="ln${cur}" data-i="${i}"><span class="n">${s.who}:</span> ${esc(s.text)}</div>`;
    else if (s.t === 'conf' || s.t === 'vote') h += `<div class="ln c${cur}" data-i="${i}"><span class="n">${s.who} [${s.t === 'vote' ? 'vote' : 'conf'}]:</span> ${esc(s.text)}</div>`;
    else if (s.t === 'mallow') h += `<div class="ln${cur}" data-i="${i}"><span class="n">Chris:</span> ${s.who}. <i>(${s.who} gets a marshmallow${s.last ? ', the last one' : ''}.)</i></div>`;
    else if (s.t === 'title') h += `<div class="ln sc${cur}" data-i="${i}">Alliance formed: ${s.name}</div>`;
    else if (s.t === 'exit') h += `<div class="ln sc${cur}" data-i="${i}">${s.place}</div><div class="ln c${cur}" data-i="${i}"><span class="n">${s.who}:</span> ${esc(s.text)}</div>`;
    else h += `<div class="ln d${cur}" data-i="${i}">(${esc(s.text)})</div>`;
  });
  const box = $('lines'); box.innerHTML = h;
  const c = box.querySelector('.cur:last-child') || box.lastElementChild; if (c) box.scrollTop = c.offsetTop - box.clientHeight + 40;
}

// ── Chris's clipboard: what the camp cannot see, gated by the step
let TAB = null;
function clipboard(L, fresh) {
  const scr = SCREENS[SI], items = L.side;
  const tabs = scr.id === 'td-tribal' ? [['tally', 'Tally'], ['plans', 'Why']] : [['allies', 'Alliances'], ['plans', 'Votes'], ['bonds', 'Bonds'], ['love', 'Crushes'], ['secrets', 'Secrets'], ['log', 'Log']];
  if (!TAB || !tabs.some(t => t[0] === TAB)) TAB = tabs[0][0];
  const newAt = t => items.some(x => x.tab === t && x.at === IDX);
  let h = `<h3>Chris’s clipboard</h3><div class="sub">${scr.id === 'td-tribal' ? 'The votes, as cast. The campers only get marshmallows.' : 'What the camp doesn’t know yet.'}</div><div class="tabs">`;
  tabs.forEach(([k, l]) => h += `<button class="tab ${k === TAB ? 'on' : ''}" data-tab="${k}">${l}${newAt(k) && k !== TAB ? '<span class="dot"></span>' : ''}</button>`);
  h += '</div>';
  const mine = items.filter(x => x.tab === TAB), fr = x => (fresh && x.at === IDX ? ' fresh' : '');
  if (TAB === 'allies') mine.forEach(x => h += `<div class="ally${fr(x)}"><div class="minis">${x.who.map(n => `<img src="${AV(n)}" alt="">`).join('')}</div>${x.name}</div><div class="note${fr(x)}" style="margin-top:0"><small>${x.who.join(', ')}${x.since ? ' · since ' + x.since : ' · formed today'}</small></div>`);
  if (TAB === 'plans') {
    const last = {}; mine.forEach(x => last[x.who] = x);
    Object.values(last).forEach(x => h += `<div class="note${fr(x)}">${x.who} <span class="k">→ ${x.target}</span><small>${x.why}</small></div>`);
    if (scr.id === 'td-tribal') h += `<div class="note"><small>Gwen and Noah went after Alejandro. Courtney went after Sierra over the planner. The Trifecta held, and Harold and Izzy went with the majority.</small></div>`;
  }
  if (TAB === 'bonds') {
    const last = {}; mine.forEach(x => x.pairs.forEach(p => last[p[0] + p[1]] = { p, at: x.at }));
    Object.values(last).forEach(({ p, at }) => { const v = p[2], w = Math.abs(v) * 5; h += `<div class="bond${fresh && at === IDX ? ' note fresh' : ''}" style="font:800 12px Nunito;color:#2a2018"><span>${p[0]} & ${p[1]}</span><span class="bar"><i class="${v >= 0 ? 'pos' : 'neg'}" style="width:${w}%"></i></span><span>${v > 0 ? '+' : ''}${v}</span></div>`; });
  }
  if (TAB === 'love') mine.forEach(x => h += `<div class="note${fr(x)}">${x.who} <span class="k">♥</span> ${x.to}<small>${x.what}</small></div>`);
  if (TAB === 'secrets' || TAB === 'log') mine.forEach(x => h += `<div class="note${fr(x)}">${x.text}</div>`);
  if (TAB === 'tally') {
    const by = {}; mine.forEach(x => (by[x.target] = by[x.target] || []).push(x));
    Object.entries(by).sort((a, b) => b[1].length - a[1].length).forEach(([t, vs]) => {
      h += `<div class="tally${vs.some(v => v.at === IDX) && fresh ? ' note fresh' : ''}"><img src="${AV(t)}" alt=""><div><b>${t}</b><div style="font:700 11px Nunito;color:#5a4a3a">${vs.map(v => v.voter).join(', ')}</div></div><span class="marks">${'|'.repeat(vs.length)}</span></div>`;
    });
  }
  if (!mine.length) h += `<div class="empty">Nothing yet. Keep watching.</div>`;
  $('sheet').innerHTML = h;
}

// ── music: silence unless the moment earns it
const BEDS = { 'camp-day': '../assets/audio/bed-camp-day.mp3', tribal: '../assets/audio/bed-tribal.mp3' };
let audio = null, bedNow = 'none';
function music(scr, idx) {
  let bed = 'none'; scr.steps.forEach((s, i) => { if (i <= idx && s.bed) bed = s.bed; });
  if (!SOUND) bed = 'none';
  if (bed === bedNow) return; bedNow = bed;
  if (audio) { const a = audio; let v = a.volume; const f = setInterval(() => { v -= .05; if (v <= 0) { a.pause(); clearInterval(f); } else a.volume = v; }, 60); audio = null; }
  if (bed !== 'none') { audio = new Audio(BEDS[bed]); audio.loop = true; audio.volume = .35; audio.play().catch(() => {}); }
}

// ══════════════════════════════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════════════════════════════
function go(i, fresh) { const n = SCREENS[SI].steps.length; IDX = Math.max(0, Math.min(n - 1, i)); paint(fresh); }
function next() { if (IDX < SCREENS[SI].steps.length - 1) go(IDX + 1, true); else if (SI < SCREENS.length - 1) { SI++; IDX = 0; tabsUi(); go(0, true); } }
function setAuto(on) {
  clearTimeout(AUTO); AUTO = null; $('auto').classList.toggle('on', on);
  if (!on) return;
  const loop = () => { const s = SCREENS[SI].steps[IDX]; const len = (s.text || '').length; next(); AUTO = setTimeout(loop, 1500 + len * 38); };
  AUTO = setTimeout(loop, 600);
}
function tabsUi() { $('screens').innerHTML = SCREENS.map((s, i) => `<button class="scr-btn ${i === SI ? 'on' : ''}" data-si="${i}">${s.label}</button>`).join(''); }
$('screens').onclick = e => { const b = e.target.closest('[data-si]'); if (!b) return; SI = +b.dataset.si; TAB = null; tabsUi(); go(0, true); };
$('next').onclick = () => { setAuto(false); next(); };
$('back').onclick = () => { setAuto(false); go(IDX - 1, false); };
$('restart').onclick = () => { setAuto(false); go(0, true); };
$('all').onclick = () => { setAuto(false); go(SCREENS[SI].steps.length - 1, false); };
$('auto').onclick = () => setAuto(!AUTO);
$('stage').onclick = () => { setAuto(false); next(); };
$('lines').onclick = e => { const l = e.target.closest('[data-i]'); if (l) { setAuto(false); go(+l.dataset.i, false); } };
$('sheet').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) { TAB = t.dataset.tab; clipboard(ledgerAt(SCREENS[SI], IDX), false); } };
$('classic').onclick = () => alert('Classic viewer: lands on the same screen (by id, then by part of the episode). Not wired in the mockup.');
$('sound').onclick = () => { SOUND = !SOUND; $('sndl').textContent = SOUND ? 'On' : 'Off'; bedNow = '?'; music(SCREENS[SI], IDX); };
$('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); setAuto(false); next(); }
  if (e.key === 'ArrowLeft') { setAuto(false); go(IDX - 1, false); }
});
const q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
SI = +(q.get('s') || 0); tabsUi();
go(+(q.get('i') || 0), !q.get('i'));
</script>
