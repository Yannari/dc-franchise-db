<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dramagram</title>
<!--
  DRAMAGRAM — the directory.

  Design: docs/superpowers/specs/2026-08-18-dramagram-design.md
  Model:  js/dramagram.js

  Step 1 of the build order: the grid, and nothing else. No posts yet. It is
  useful on its own and it proves the derived follower model against real data
  before anything depends on it.

  ── ITS OWN PAGE, NOT A THIRD PANE IN social.html ──

  Birdie and ChatAlumni are EPISODE-SCOPED: that page is driven by season and
  episode pickers and social-page.js is eleven hundred lines of feed engine.
  Dramagram is a directory of people across all time, which is a different shape
  entirely. It gets a third button in that app switcher and lives here, so the
  feed engine is not entangled with something that has no episode at all.

  ── ITS OWN LOOK ──

  Birdie is paper white and slate; ChatAlumni is cream and bottle green. Neither
  shares a colour, a typeface or a corner radius with the other, deliberately.
  This is the third: near-black, photo-first, one warm accent, square corners.
  No borrowed brand.
-->
<link rel="stylesheet" href="styles.css">
<style>
  #dg{
    --dg-bg:#0c0c0e; --dg-card:#141416; --dg-line:#26262b;
    --dg-ink:#f2f0ee; --dg-dim:#8b8781; --dg-hot:#ff7a4d;
    --dg-live:#3ddc84; --dg-seq:#5b6070;
    background:var(--dg-bg); color:var(--dg-ink);
    font:15px/1.5 ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    padding:22px 20px 70px;
  }
  #dg *{box-sizing:border-box}
  .dg-wrap{max-width:1140px;margin:0 auto}
  .dg-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
  .dg-logo{font-size:27px;font-weight:800;letter-spacing:-.03em;
    background:linear-gradient(92deg,var(--dg-hot),#ffc14d);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .dg-sub{color:var(--dg-dim);font-size:13.5px}
  .dg-back{color:var(--dg-hot);text-decoration:none;font-weight:600;font-size:13px}

  .dg-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 16px}
  .dg-in,.dg-sel{background:var(--dg-card);border:1px solid var(--dg-line);color:var(--dg-ink);
    border-radius:2px;padding:9px 12px;font:inherit;font-size:14px}
  .dg-in{min-width:250px;flex:1}
  .dg-in::placeholder{color:var(--dg-dim)}
  .dg-chip{background:none;border:1px solid var(--dg-line);color:var(--dg-dim);
    border-radius:2px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .dg-chip[aria-pressed=true]{color:var(--dg-bg);background:var(--dg-ink);border-color:var(--dg-ink)}
  .dg-count{color:var(--dg-dim);font-size:13px;margin-left:auto}

  .dg-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .dg-cell{background:var(--dg-card);border:1px solid var(--dg-line);border-radius:2px;
    overflow:hidden;text-decoration:none;color:inherit;display:block;
    transition:border-color .12s,transform .12s}
  .dg-cell:hover{border-color:var(--dg-hot);transform:translateY(-2px)}
  .dg-pic{position:relative;aspect-ratio:1;background:#1b1b1f;display:block;width:100%}
  .dg-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .dg-pic .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:#3a3a42;letter-spacing:-.04em}
  /* The dot. Sequestered is not "offline" — it is a houseguest with no phone,
     so it reads as a distinct state rather than as absence. */
  .dg-dot{position:absolute;left:9px;bottom:9px;width:11px;height:11px;border-radius:50%;
    border:2px solid var(--dg-card);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .dg-dot[data-s=active]{background:var(--dg-live)}
  .dg-dot[data-s=quiet]{background:#4a4a52}
  .dg-dot[data-s=sequestered]{background:var(--dg-seq);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 0 4px rgba(91,96,112,.25)}
  .dg-meta{padding:9px 11px 11px}
  .dg-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dg-tick{color:#4db2ff;flex:0 0 auto}
  .dg-foll{color:var(--dg-dim);font-size:12.5px;margin-top:2px}
  .dg-foll b{color:var(--dg-ink);font-weight:700}
  .dg-delta{font-size:11px;font-weight:700;margin-left:6px}
  .dg-delta.up{color:var(--dg-live)} .dg-delta.down{color:#ff6b6b}
  .dg-seqline{color:var(--dg-seq);font-size:11.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;margin-top:3px}
  .dg-empty{color:var(--dg-dim);text-align:center;padding:60px 20px}

  /* ── the profile ── */
  .dg-prof{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;margin:6px 0 26px}
  .dg-prof-pic{width:132px;height:132px;border-radius:50%;object-fit:cover;flex:0 0 auto;
    border:2px solid var(--dg-line);background:#1b1b1f}
  .dg-prof-pic.fb{display:flex;align-items:center;justify-content:center;font-size:44px;
    font-weight:800;color:#3a3a42}
  .dg-prof-body{flex:1;min-width:260px}
  .dg-prof-name{font-size:23px;font-weight:800;display:flex;align-items:center;gap:8px}
  .dg-stats{display:flex;gap:24px;margin:12px 0 10px;flex-wrap:wrap}
  .dg-stat b{font-size:17px;font-weight:800}
  .dg-stat span{color:var(--dg-dim);font-size:13px;margin-left:5px}
  .dg-bio{color:var(--dg-dim);font-size:13.5px;line-height:1.6;max-width:60ch}
  .dg-bio b{color:var(--dg-ink);font-weight:600}

  .dg-posts{display:grid;gap:4px;grid-template-columns:repeat(3,1fr);margin-top:8px}
  @media(max-width:640px){.dg-posts{gap:2px}}
  .dg-post{position:relative;aspect-ratio:1;overflow:hidden;background:#141416;
    border:0;padding:0;cursor:pointer;display:block;width:100%;font:inherit;color:inherit;text-align:left}
  .dg-post img{width:100%;height:100%;object-fit:cover;display:block}
  /* The card a post becomes when no photograph fits. Designed rather than
     blank: the grid has to stay a grid. */
  .dg-card{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:14px;gap:6px}
  .dg-card .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(0,0,0,.45)}
  .dg-card .t{font-size:13.5px;font-weight:700;line-height:1.3;color:rgba(0,0,0,.82)}
  .dg-card[data-sig=major]{background:linear-gradient(150deg,#ffb36b,#ff7a4d)}
  .dg-card[data-sig=notable]{background:linear-gradient(150deg,#9fd9c7,#6fb9a5)}
  .dg-card[data-sig=minor]{background:linear-gradient(150deg,#3a3a42,#2a2a31)}
  .dg-card[data-sig=minor] .k{color:rgba(255,255,255,.40)}
  .dg-card[data-sig=minor] .t{color:rgba(255,255,255,.80)}
  .dg-post .when{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;font-size:10.5px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
    background:linear-gradient(transparent,rgba(0,0,0,.65))}

  .dg-open{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:60}
  .dg-open-in{background:var(--dg-card);border:1px solid var(--dg-line);max-width:520px;width:100%;
    max-height:86vh;overflow:auto}
  .dg-open-media{aspect-ratio:1;background:#111}
  .dg-open-media img{width:100%;height:100%;object-fit:cover;display:block}
  .dg-open-body{padding:15px 17px 18px}
  .dg-open-cap{font-size:15px;line-height:1.55}
  .dg-open-meta{color:var(--dg-dim);font-size:12px;margin-top:10px;letter-spacing:.05em;
    text-transform:uppercase;font-weight:700}
  /* What they said, then what happened, then the room. */
  .dg-open-fact{color:var(--dg-dim);font-size:12.5px;margin-top:9px;padding-top:9px;
    border-top:1px solid var(--dg-line);line-height:1.5}
  .dg-comments{margin-top:12px;display:grid;gap:7px}
  .dg-c{font-size:13.5px;line-height:1.45}
  .dg-c b{font-weight:700;margin-right:5px}
  .dg-c[data-rel=rival]{color:var(--dg-dim)}
  .dg-close{margin-top:14px;background:none;border:1px solid var(--dg-line);color:var(--dg-dim);
    padding:8px 14px;border-radius:2px;font:inherit;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header class="modern-header" id="modernHeader">
  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="brand-section" aria-label="Go to home">
        <div class="brand-icon"><span class="brand-logo-text">⚡</span></div>
        <div class="brand-content">
          <h1>DC <span class="brand-gradient">Franchise</span> Database</h1>
          <p class="brand-subtitle">Dramagram</p>
        </div>
      </a>
    </div>
    <nav class="header-nav" aria-label="Primary navigation"><ul class="nav-list"></ul></nav>
  </div>
</header>

<div id="dg">
  <div class="dg-wrap">
    <div class="dg-head">
      <span class="dg-logo">Dramagram</span>
      <span class="dg-sub" id="dg-now"></span>
      <a class="dg-back" href="social.html">← Birdie &amp; ChatAlumni</a>
    </div>

    <div class="dg-bar">
      <input class="dg-in" id="dg-q" type="search" placeholder="Search by name…" aria-label="Search by name">
      <select class="dg-sel" id="dg-sort" aria-label="Sort">
        <option value="followers">Most followers</option>
        <option value="followers-asc">Fewest followers</option>
        <option value="name">Name A–Z</option>
        <option value="recent">Recently active</option>
      </select>
      <!-- No show filter here on purpose: the site header already carries a
           global one, and two filters for the same idea on one page is the
           worst version of both. This page listens to that one. -->
      <span class="dg-count" id="dg-count"></span>
    </div>

    <div class="dg-grid" id="dg-grid"></div>
    <div id="dg-profile" hidden></div>
  </div>
</div>

<script type="module" src="js/site-header.js"></script>
<script type="module">
import { directory, short, postsFor, photosOf, followerHistory, tiesFor } from './js/dramagram.js';
import { lineFor } from './js/life-events.js';
import { captionFor, commentsFor } from './js/dramagram-voice.js';
import { socialGraph } from './js/life-resolver.js';
import { careersIn } from './js/records.js';
import { airLabel, latestAired } from './js/franchise-calendar.js';
import { currentShow } from './js/show-switcher.js';

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

let rows = [];
let show = 'all';

const initials = n => String(n).split(/[\s-]+/).map(w => w[0] || '').join('').slice(0,2).toUpperCase();

function cell(d) {
  const delta = d.lastDelta
    ? `<span class="dg-delta ${d.lastDelta > 0 ? 'up' : 'down'}">${
        d.lastDelta > 0 ? '+' : '−'}${short(Math.abs(d.lastDelta))}</span>` : '';
  return `<a class="dg-cell" href="dramagram.html?player=${encodeURIComponent(d.slug)}">
    <span class="dg-pic">
      <img src="assets/avatars/${encodeURIComponent(d.slug)}.png" alt="" loading="lazy"
        onerror="this.outerHTML='<span class=\\'fb\\'>${esc(initials(d.name))}</span>'">
      <span class="dg-dot" data-s="${d.status}" title="${esc(d.statusLabel)}"></span>
    </span>
    <span class="dg-meta">
      <span class="dg-name">${esc(d.name)}${d.verified
        ? '<svg class="dg-tick" width="13" height="13" viewBox="0 0 24 24" aria-label="verified">'
          + '<path fill="currentColor" d="M12 2l2.4 2.1 3.2-.4 1 3 2.8 1.6-1.2 3 1.2 3-2.8 1.6-1 3-3.2-.4L12 22l-2.4-2.1-3.2.4-1-3L2.6 15.7l1.2-3-1.2-3 2.8-1.6 1-3 3.2.4z"/>'
          + '<path fill="#141416" d="M10.8 15.4l-3-3 1.3-1.3 1.7 1.7 4-4 1.3 1.3z"/></svg>'
        : ''}</span>
      <span class="dg-foll"><b>${short(d.followers)}</b> followers${delta}</span>
      ${d.status === 'sequestered' ? '<span class="dg-seqline">in the house</span>' : ''}
    </span>
  </a>`;
}

function render() {
  const q = $('#dg-q').value.trim().toLowerCase();
  const sort = $('#dg-sort').value;
  let list = rows.filter(d => (show === 'all' || d.shows.includes(show))
    && (!q || d.name.toLowerCase().includes(q)));
  if (sort === 'name') list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'followers-asc') list = list.slice().sort((a, b) => a.followers - b.followers);
  if (sort === 'recent') {
    const rank = { active: 0, sequestered: 1, quiet: 2 };
    list = list.slice().sort((a, b) => rank[a.status] - rank[b.status] || b.followers - a.followers);
  }
  $('#dg-count').textContent = `${list.length} profile${list.length === 1 ? '' : 's'}`;
  $('#dg-grid').innerHTML = list.length
    ? list.map(cell).join('')
    : '<p class="dg-empty">Nobody by that name.</p>';
}

/**
 * One profile: the header, and their approved life events as a grid.
 *
 * A post takes a photograph when the folder has an unused one and otherwise
 * renders as a designed card — the galleries are character art and there is no
 * wedding photo of anybody, so nothing here claims a picture is of the thing it
 * sits beside.
 */
async function renderProfile(slug) {
  viewing = slug;
  const d = rows.find(x => x.slug === slug);
  $('#dg-grid').hidden = true;
  const host = $('#dg-profile');
  host.hidden = false;
  if (!d) { host.innerHTML = '<p class="dg-empty">No such profile.</p>'; return; }

  const photos = await photosOf(slug);
  const posts = postsFor(slug, { events: allEvents, seasons: allSeasons, photos });
  const h = followerHistory(slug, { careers: allCareers, seasons: allSeasons, events: allEvents });
  const bio = d.bio || {};
  const bioLine = [bio.occupation, bio.hometown].filter(Boolean).join(' · ');

  host.innerHTML = `
    <div class="dg-prof">
      <img class="dg-prof-pic" src="assets/avatars/${encodeURIComponent(slug)}.png" alt=""
        onerror="this.outerHTML='<div class='dg-prof-pic fb'>${esc(initials(d.name))}</div>'">
      <div class="dg-prof-body">
        <div class="dg-prof-name">${esc(d.name)}${d.verified ? tick() : ''}</div>
        <div class="dg-stats">
          <span class="dg-stat"><b>${posts.length}</b><span>posts</span></span>
          <span class="dg-stat"><b>${short(d.followers)}</b><span>followers</span></span>
          <span class="dg-stat"><b>${d.seasonsPlayed}</b><span>season${d.seasonsPlayed === 1 ? '' : 's'}</span></span>
          ${d.wins ? `<span class="dg-stat"><b>${d.wins}</b><span>win${d.wins === 1 ? '' : 's'}</span></span>` : ''}
        </div>
        <div class="dg-bio">
          ${bioLine ? `<b>${esc(bioLine)}</b><br>` : ''}
          ${d.status === 'sequestered' ? 'Currently in the house.'
            : d.status === 'quiet' ? 'Has been quiet for a while.' : 'Around.'}
          ${h.steps.length ? `<br>${esc(followerStory(h))}` : ''}
        </div>
      </div>
    </div>
    ${posts.length ? `<div class="dg-posts">${posts.map(postTile).join('')}</div>`
      : `<p class="dg-empty">No posts yet.<br>Life events become posts once you approve them in
         <a class="dg-back" href="life.html">Life</a>.</p>`}`;

  host.querySelectorAll('[data-post]').forEach(el => {
    el.onclick = () => openPost(posts[Number(el.dataset.post)], d);
  });
}

/** "Up 120k after winning Carnival of Chaos" — the number, explained. */
function followerStory(h) {
  const big = h.steps.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))[0];
  if (!big) return '';
  const when = big.season ? (big.season.title || big.season.seasonId) : '';
  const verb = big.delta > 0 ? 'Up' : 'Down';
  return `${verb} ${short(Math.abs(big.delta))} ${big.why === 'won' ? 'for winning' : `after ${big.why}`}${when ? ` ${when}` : ''}.`;
}

const tick = () => '<svg class="dg-tick" width="15" height="15" viewBox="0 0 24 24" aria-label="verified">'
  + '<path fill="currentColor" d="M12 2l2.4 2.1 3.2-.4 1 3 2.8 1.6-1.2 3 1.2 3-2.8 1.6-1 3-3.2-.4L12 22l-2.4-2.1-3.2.4-1-3L2.6 15.7l1.2-3-1.2-3 2.8-1.6 1-3 3.2.4z"/>'
  + '<path fill="#141416" d="M10.8 15.4l-3-3 1.3-1.3 1.7 1.7 4-4 1.3 1.3z"/></svg>';

function postTile(p, i) {
  const when = p.season ? airLabel(p.season) : '';
  // TOLD FROM THIS PROFILE'S SIDE. A two-person event is stored once and
  // carries whichever half it was written from, so passing event.player put
  // "Bowie and Hicks fell out publicly" on HICKS'S OWN page. The reader is
  // whoever's profile this is.
  // THE CAPTION, NOT THE WIKI LINE. lineFor writes the encyclopedia sentence —
  // third person, past tense — which is right for an article and wrong on a
  // photo. This is the same fact in the character's own voice.
  const caption = captionFor(p.event, {
    archetype: archetypeBySlug[viewing], names: namesBySlug,
    season: p.season ? (p.season.title || '') : '',
  }) || lineFor(p.event, namesBySlug, viewing);
  if (p.photo) {
    return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
      <img src="${esc(p.photo)}" alt="" loading="lazy">
      ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
  }
  return `<button class="dg-post" data-post="${i}" title="${esc(caption)}">
    <span class="dg-card" data-sig="${p.significance}">
      <span class="k">${esc(p.track)}</span>
      <span class="t">${esc(caption)}</span>
    </span>
    ${when ? `<span class="when">${esc(when)}</span>` : ''}</button>`;
}

function openPost(p, d) {
  const caption = captionFor(p.event, {
    archetype: archetypeBySlug[viewing], names: namesBySlug,
    season: p.season ? (p.season.title || '') : '',
  }) || lineFor(p.event, namesBySlug, viewing);
  // What actually happened, under what they said about it. The two registers
  // sit together rather than one replacing the other.
  const fact = lineFor(p.event, namesBySlug, viewing);
  const comments = commentsFor(p.event, { ties: tiesFor(viewing, graph), names: namesBySlug });
  const wrap = document.createElement('div');
  wrap.className = 'dg-open';
  wrap.innerHTML = `<div class="dg-open-in">
    ${p.photo ? `<div class="dg-open-media"><img src="${esc(p.photo)}" alt=""></div>` : ''}
    <div class="dg-open-body">
      <!-- No name prefix: lineFor already opens with it, and the first build
           read "Alejandro Alejandro and Lindsay broke up." -->
      <div class="dg-open-cap"><b>${esc(d.name)}</b> ${esc(caption)}</div>
      <div class="dg-open-fact">${esc(fact)}${p.event.detail ? ` ${esc(p.event.detail)}` : ''}</div>
      ${comments.length ? `<div class="dg-comments">${comments.map(c =>
        `<div class="dg-c" data-rel="${c.relation}"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`
      ).join('')}</div>` : ''}
      <div class="dg-open-meta">${esc(p.season ? airLabel(p.season) : '')} · ${esc(p.track)}</div>
      <button class="dg-close">Close</button>
    </div>
  </div>`;
  wrap.onclick = e => { if (e.target === wrap || e.target.classList.contains('dg-close')) wrap.remove(); };
  document.body.appendChild(wrap);
}

let allEvents = []; let allSeasons = []; let allCareers = []; let namesBySlug = {};
let graph = null; let archetypeBySlug = {};
/** Whose profile is open — the side every caption is told from. */
let viewing = null;

(async () => {
  const [pdb, sdb, life, live, roster] = await Promise.all([
    fetch('players_database.json').then(r => r.json()).catch(() => ({ players: [] })),
    fetch('seasons_database.json').then(r => r.json()).catch(() => ({ seasons: [] })),
    fetch('life_events.json').then(r => r.json()).catch(() => ({ events: [] })),
    // The live season comes from the Worker, the same endpoint player.html and
    // devotees.html read — not a file. Optional: no season airing means every
    // dot is simply not sequestered.
    fetch('https://dc-studio.yannari19.workers.dev/api/live-season')
      .then(r => r.json()).then(j => (j && j.ok && j.airing) ? j : null).catch(() => null),
    fetch('franchise_roster.json').then(r => r.json()).catch(() => ({ players: [] })),
  ]);
  const seasons = sdb.seasons || [];
  allSeasons = seasons;
  allEvents = life.events || [];
  allCareers = careersIn(pdb, 'all');
  namesBySlug = Object.fromEntries((pdb.players || []).map(p => [p.id, p.name]));
  // Who knows whom, so a comment section is made of people who actually do.
  graph = socialGraph(allCareers);
  // Tone comes from the archetype: a villain does not caption a wedding the way
  // a hero does. Read from the published roster, which is where it is authored.
  const rosterList = Array.isArray(roster) ? roster : (roster.players || []);
  archetypeBySlug = Object.fromEntries(rosterList.map(r => [r.slug, r.archetype]));
  rows = directory({ careers: allCareers, seasons, events: allEvents, live });

  const now = latestAired(seasons);
  $('#dg-now').textContent = now ? airLabel(now) : '';

  // ONE ACCOUNT, SEEN FROM EVERY SHOW.
  //
  // Filtering is a lens on one directory — somebody who played both appears
  // under both, never as two profiles. The lens is the site's own switcher,
  // which every other page already obeys; a second one here would be two
  // controls for one idea, and the first build had exactly that.
  show = currentShow() || 'all';
  window.addEventListener('showchange', e => {
    show = e.detail?.show || 'all';
    render();
  });

  $('#dg-q').oninput = render;
  $('#dg-sort').onchange = render;

  // ?player=<slug> is a profile; anything else is the directory. One page, two
  // views, so a link from the grid is a normal href and the back button works.
  const who = new URLSearchParams(location.search).get('player');
  if (who) { await renderProfile(who); } else { render(); }
})();
</script>
</body>
</html>
