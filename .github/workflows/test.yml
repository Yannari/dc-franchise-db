name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ONE STUDIO SAVE IS THREE PUSHES.
#
# Saving a character commits the roster, then the voice, then the avatar — so
# every save queued three identical test runs, and a burst of characters queued
# thirty. Only the last one tells you anything: the two before it are testing a
# tree that no longer exists. Superseding them keeps the queue short, which is
# what starves Pages of runners in the first place.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A SLOW SUITE MUST NOT BLOCK DEPLOYMENTS.
    #
    # On 2026-08-18 nothing reached the site for an hour and a half. Nothing was
    # wrong with the site, the build, or the repository — the last successful
    # Pages build took 51 seconds. The suite was NOT hung either, which is what
    # it looked like and what the first version of this comment claimed: reading
    # the log of run 32106627205 showed it still finishing files after 101
    # minutes, because `npm test` genuinely needed about two hours.
    #
    # With no timeout, those runs held a runner for GitHub's six-hour default.
    # Sixteen were stuck at once, the oldest since 06:22, and every Pages build
    # queued behind them. Cancelling them started a build within seconds.
    #
    # The two-hour part is fixed at the source: the 42 season-playing files that
    # cost 103 of those 119 minutes moved to nightly.yml. What runs here is the
    # other 276, measured at 16 minutes.
    #
    # Thirty is the backstop, not the budget. If a season-playing test lands
    # here by mistake, CI goes red and names it, rather than quietly costing
    # twenty minutes on every push — and a push is three per Studio save.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
