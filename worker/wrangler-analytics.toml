# The episode / analytics worker — dc-analytics.
#
# Its own config rather than the one beside it, because wrangler.toml belongs to
# dc-studio and carries that worker's D1 binding and GitHub vars. Deploying this
# script with `--name` alone would still read those and attach a database this
# worker has no use for.
#
# Deploy:
#   cd worker && wrangler deploy --config wrangler-analytics.toml
#
# Secrets (listed so the next person knows what this worker needs). It needs
# BOTH, and they do different jobs — one missing key does not degrade the
# worker, it turns off whichever half of it that key serves:
#
#   OPENAI_API_KEY     the whole analytics run, which is three modes and not
#                      one. current-season.html does step 1 (`summarize` for
#                      raw BrantSteele, or `enhance` for a simulator summary)
#                      and then step 2, the panels — the DEFAULT route, taken
#                      by any request arriving without a `mode`. The panels are
#                      OpenAI ONLY and return a 500 naming this secret when it
#                      is missing. The two step-1 passes prefer OpenAI and
#                      still fall back to Claude, so they keep working either
#                      way.
#   ANTHROPIC_API_KEY  the creative modes — episode, story-digest, social —
#                      plus the step-1 fallback above. Episode prose is
#                      unchanged and still Claude-first.
#
#   wrangler secret put OPENAI_API_KEY --config wrangler-analytics.toml
#   wrangler secret put ANTHROPIC_API_KEY --config wrangler-analytics.toml
name = "dc-analytics"
main = "worker-episode-live.js"
compatibility_date = "2024-11-01"
