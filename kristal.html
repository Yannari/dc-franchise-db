<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kristal-talKs</title>
<!--
  KRISTAL-TALKS — the exit-interview podcast.

  Model: js/kristal.js. Episodes are DERIVED — computed from the published
  record and the approved life log, pinned to off-seasons — so this page is a
  reader like Dramagram, not an editor: nothing here writes anything.

  ── ITS OWN PAGE, ITS OWN LOOK ──

  Same reasoning as Dramagram: the podcast is scoped to the whole franchise's
  timeline, not to an episode, so it does not live inside social.html's feed
  engine. Fourth app in the switcher. Birdie is paper, ChatAlumni is cream,
  Dramagram is near-black photo-first; this is a LISTENING app — deep plum,
  one hot magenta, rounded cards, waveform bars. No borrowed brand.
-->
<link rel="stylesheet" href="styles.css">
<style>
  #kt{
    --kt-bg:#120a14; --kt-card:#1c1120; --kt-line:#33203a;
    --kt-ink:#f5eef7; --kt-dim:#9c86a4; --kt-hot:#e84393;
    --kt-gold:#f0a500;
    background:var(--kt-bg); color:var(--kt-ink);
    font:15px/1.55 ui-sans-serif,system-ui,'Segoe UI',sans-serif;
    padding:22px 20px 70px; min-height:60vh;
  }
  .kt-wrap{max-width:860px;margin:0 auto}
  .kt-head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
  .kt-cover{width:84px;height:84px;border-radius:18px;object-fit:cover;
    border:2px solid var(--kt-hot);box-shadow:0 6px 24px rgba(232,67,147,.25)}
  .kt-logo{font-size:30px;font-weight:900;letter-spacing:-.5px}
  .kt-logo b{color:var(--kt-hot)}
  .kt-tag{color:var(--kt-dim);font-size:13px;margin-top:2px}
  .kt-stats{color:var(--kt-dim);font-size:12.5px;margin-top:6px}
  .kt-stats b{color:var(--kt-ink)}

  .kt-apps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
  .kt-apps a,.kt-apps span{display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;
    text-decoration:none;border:1px solid var(--kt-line);color:var(--kt-dim)}
  .kt-apps a:hover{color:var(--kt-ink);border-color:var(--kt-dim)}
  .kt-apps span{color:#fff;background:var(--kt-hot);border-color:var(--kt-hot)}

  .kt-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 18px}
  .kt-bar select{background:var(--kt-card);color:var(--kt-ink);border:1px solid var(--kt-line);
    border-radius:10px;padding:9px 12px;font:inherit;font-size:13.5px}
  .kt-count{color:var(--kt-dim);font-size:13px}

  .kt-ep{background:var(--kt-card);border:1px solid var(--kt-line);border-radius:16px;
    margin-bottom:12px;overflow:hidden}
  .kt-ep-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;
    background:none;border:0;width:100%;text-align:left;color:inherit;font:inherit}
  .kt-ep-row:hover{background:rgba(232,67,147,.06)}
  .kt-art{position:relative;flex:none;width:58px;height:58px}
  .kt-art img{width:44px;height:44px;border-radius:10px;object-fit:cover;position:absolute}
  .kt-art .host{left:0;top:0;z-index:1;border:2px solid var(--kt-hot)}
  .kt-art .guest{right:0;bottom:0;z-index:2;border:2px solid var(--kt-card)}
  .kt-ep-meta{flex:1;min-width:0}
  .kt-ep-title{font-weight:800;font-size:15px}
  .kt-ep-sub{color:var(--kt-dim);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .kt-tier{font-size:9.5px;letter-spacing:1.2px;font-weight:800;padding:3px 8px;border-radius:999px}
  .kt-tier[data-t="viral"]{background:rgba(232,67,147,.18);color:var(--kt-hot)}
  .kt-tier[data-t="solid"]{background:rgba(240,165,0,.14);color:var(--kt-gold)}
  .kt-tier[data-t="quiet"]{background:rgba(255,255,255,.06);color:var(--kt-dim)}
  /* The waveform: simple geometric bars, taller on a louder episode. */
  .kt-wave{display:flex;gap:2px;align-items:flex-end;height:26px;flex:none}
  .kt-wave i{width:3px;border-radius:2px;background:var(--kt-hot);opacity:.75}
  .kt-ep[data-t="quiet"] .kt-wave i{background:var(--kt-dim)}
  .kt-ep[data-t="solid"] .kt-wave i{background:var(--kt-gold)}

  .kt-body{display:none;padding:4px 18px 16px;border-top:1px dashed var(--kt-line)}
  .kt-ep.open .kt-body{display:block}
  .kt-x{margin:12px 0}
  .kt-q{color:var(--kt-hot);font-weight:700;font-size:13.5px}
  .kt-q::before{content:'KRISTAL — ';letter-spacing:1px;font-size:10.5px;color:var(--kt-dim)}
  .kt-a{margin-top:5px;color:var(--kt-ink);font-size:14px;padding-left:14px;
    border-left:2px solid var(--kt-line)}
  .kt-about{margin-top:10px;font-size:12px;color:var(--kt-dim)}
  .kt-about b{color:var(--kt-ink)}
  .kt-empty{color:var(--kt-dim);text-align:center;padding:50px 0}
  .kt-pager{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0;color:var(--kt-dim);font-size:13px}
  .kt-pager button{background:none;border:1px solid var(--kt-line);color:var(--kt-ink);
    padding:8px 16px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
  .kt-pager button:disabled{opacity:.35;cursor:default}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="modern-header" id="modernHeader">
  <div class="header-container">
    <div class="header-top">
      <a href="index.html" class="brand-section" aria-label="Go to home">
        <div class="brand-icon"><span class="brand-logo-text">⚡</span></div>
        <div class="brand-content">
          <h1>DC <span class="brand-gradient">Franchise</span> Database</h1>
          <p class="brand-subtitle">Kristal-talKs</p>
        </div>
      </a>
    </div>
    <nav class="header-nav" aria-label="Primary navigation"><ul class="nav-list"></ul></nav>
  </div>
</header>

<div id="kt">
  <div class="kt-wrap">
    <div class="kt-head">
      <img class="kt-cover" src="assets/avatars/kristal.png" alt="Kristal">
      <div>
        <div class="kt-logo">Kristal-tal<b>Ks</b></div>
        <div class="kt-tag">The exit interview they should have been scared of. Hosted by Kristal.</div>
        <div class="kt-stats" id="kt-stats"></div>
      </div>
    </div>

    <nav class="kt-apps" aria-label="Choose an app">
      <a href="social.html?app=birdie">Birdie</a>
      <a href="social.html?app=chatalumni">ChatAlumni</a>
      <a href="dramagram.html">Dramagram</a>
      <span aria-current="page">Kristal-talKs</span>
    </nav>

    <div class="kt-bar">
      <select id="kt-season" aria-label="Off-season"></select>
      <select id="kt-kind" aria-label="Kind">
        <option value="all">All episodes</option>
        <option value="debrief">Season debriefs</option>
        <option value="life">Catch-ups</option>
      </select>
      <span class="kt-count" id="kt-count"></span>
    </div>

    <div id="kt-list"></div>
  </div>
</div>

<script type="module" src="js/site-header.js"></script>
<script type="module">
import { podcastFor } from './js/kristal.js';
import { careersIn } from './js/records.js';

const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
  : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);

let episodes = [];
let page = 0;
const PAGE = 12;

const avatar = slug => `<img src="assets/avatars/${encodeURIComponent(slug)}.png" alt=""
  onerror="this.style.visibility='hidden'">`;

/** The bars are seeded off the id so an episode keeps its waveform forever. */
function wave(ep) {
  let h = 0;
  const s = ep.id;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const boost = ep.tier === 'viral' ? 1 : ep.tier === 'solid' ? 0.72 : 0.45;
  return `<span class="kt-wave">${Array.from({ length: 9 }, (_, i) => {
    const v = 6 + ((h >> (i * 3)) % 8) * 2.4 * boost;
    return `<i style="height:${Math.round(v)}px"></i>`;
  }).join('')}</span>`;
}

function card(ep, i) {
  return `<article class="kt-ep ${''}" data-t="${ep.tier}" id="ep-${esc(ep.id)}">
    <button class="kt-ep-row" data-open="${i}">
      <span class="kt-art">
        <img class="host" src="assets/avatars/kristal.png" alt="">
        ${avatar(ep.guest).replace('<img ', '<img class="guest" ')}
      </span>
      <span class="kt-ep-meta">
        <span class="kt-ep-title">${esc(ep.title)}</span>
        <span class="kt-ep-sub">
          <span>${esc(ep.when)}</span>
          <span>${short(ep.listeners)} listeners</span>
          <span class="kt-tier" data-t="${ep.tier}">${esc(ep.tierLabel)}</span>
        </span>
      </span>
      ${wave(ep)}
    </button>
    <div class="kt-body">
      ${ep.exchanges.map(x => `<div class="kt-x">
        <div class="kt-q">${esc(x.q)}</div>
        <div class="kt-a">${esc(ep.guestName)}: &ldquo;${esc(x.a)}&rdquo;</div>
      </div>`).join('')}
      ${ep.mentionedName && ep.tier === 'viral'
        ? `<div class="kt-about">The clip everyone shared was about <b>${esc(ep.mentionedName)}</b>,
           who was not in the room to answer it.</div>` : ''}
    </div>
  </article>`;
}

function render() {
  const sid = $('#kt-season').value;
  const kind = $('#kt-kind').value;
  const list = episodes
    .filter(e => (sid === 'all' || e.afterSeason === sid) && (kind === 'all' || e.kind === kind))
    .slice()
    .reverse();   // newest first — it is a podcast feed
  $('#kt-count').textContent = `${list.length} episode${list.length === 1 ? '' : 's'}`;
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (page >= pages) page = pages - 1;
  const shown = list.slice(page * PAGE, (page + 1) * PAGE);
  $('#kt-list').innerHTML = (shown.length
    ? shown.map((e, i) => card(e, i)).join('')
    : '<p class="kt-empty">No episodes yet. Kristal records when a season finishes.</p>')
    + (pages > 1 ? `<div class="kt-pager">
        <button data-pg="-1" ${page === 0 ? 'disabled' : ''}>← Newer</button>
        <span>Page ${page + 1} of ${pages}</span>
        <button data-pg="1" ${page === pages - 1 ? 'disabled' : ''}>Older →</button>
      </div>` : '');
  $('#kt-list').querySelectorAll('[data-open]').forEach(b => {
    b.onclick = () => b.closest('.kt-ep').classList.toggle('open');
  });
  $('#kt-list').querySelectorAll('[data-pg]').forEach(b => {
    b.onclick = () => { page += Number(b.dataset.pg); render(); window.scrollTo(0, 0); };
  });
}

(async () => {
  const [pdb, sdb, life, roster] = await Promise.all([
    fetch('players_database.json').then(r => r.json()).catch(() => ({ players: [] })),
    fetch('seasons_database.json').then(r => r.json()).catch(() => ({ seasons: [] })),
    fetch('life_events.json').then(r => r.json()).catch(() => ({ events: [] })),
    fetch('franchise_roster.json').then(r => r.json()).catch(() => ({ players: [] })),
  ]);
  const rows = roster.players || roster || [];
  episodes = podcastFor({
    careers: careersIn(pdb, 'all'),
    seasons: sdb.seasons || [],
    lifeEvents: life.events || [],
    archetypes: Object.fromEntries(rows.filter(r => r.slug).map(r => [r.slug, r.archetype])),
    names: Object.fromEntries((pdb.players || []).map(p => [p.id, p.name])),
  });
  const total = episodes.reduce((n, e) => n + e.listeners, 0);
  $('#kt-stats').innerHTML = `<b>${episodes.length}</b> episodes ·
    <b>${short(total)}</b> lifetime listens ·
    <b>${episodes.filter(e => e.tier === 'viral').length}</b> everyone heard`;
  const gaps = [...new Set(episodes.map(e => e.afterSeason))];
  $('#kt-season').innerHTML = '<option value="all">Every off-season</option>'
    + gaps.reverse().map(g => {
      const ep = episodes.find(e => e.afterSeason === g);
      return `<option value="${esc(g)}">${esc(ep.season?.title || g)} — ${esc(ep.when)}</option>`;
    }).join('');
  $('#kt-season').onchange = () => { page = 0; render(); };
  $('#kt-kind').onchange = () => { page = 0; render(); };
  render();
})();
</script>
</body>
</html>
