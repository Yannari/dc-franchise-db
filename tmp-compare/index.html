<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set Style Compare</title>
<style>
:root{--bg:#0d0b0a;--ink:#efe6d6;--dim:#a99c88;--line:#3a3027}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--dim);margin:0 0 20px}
h2{font-size:17px;margin:28px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
figure{margin:0}img{width:100%;display:block;border:1px solid var(--line)}
figcaption{margin-top:6px}figcaption b{color:#f2c879}figcaption span{display:block;color:var(--dim);font-size:13px}
</style></head><body>
<h1>Which look for the sets?</h1>
<p>Same room, three ways. The portraits on the stage are cartoon; the set should sit with them without looking like a toy.</p>
<h2>The conclave</h2>
<div class="row">
<figure><img src="conclave-1-real.jpg" alt=""><figcaption><b>A. Real</b><span>The first render: photographic (what you called "too real").</span></figcaption></figure>
<figure><img src="conclave-2-cel.jpg" alt=""><figcaption><b>B. Cel-shaded</b><span>Flat bands of shade and ink outlines, like an animated series background. Currently live.</span></figcaption></figure>
<figure><img src="conclave-3-painted.jpg" alt=""><figcaption><b>C. Painted</b><span>Real light, smoothed into brush strokes: a digital matte painting.</span></figcaption></figure>
</div>
<h2>The mission field (early test, the geometry is still placeholder)</h2>
<div class="row">
<figure><img src="field-2-cel.jpg" alt=""><figcaption><b>B. Cel-shaded</b><span>Reads as a low-poly game outdoors.</span></figcaption></figure>
<figure><img src="field-3-painted.jpg" alt=""><figcaption><b>C. Painted</b><span>Softer, but the simple trees still show; outdoors needs proper trees and terrain in either style.</span></figcaption></figure>
</div>
</body></html>
