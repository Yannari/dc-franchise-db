<!--
  ON AIR: what Blindside Network is airing right now, for a visitor.
  Built by js/on-air.js from what "Publish to site" sends. The creator's
  control room that used to sit here is current-season.html, under Studio.
-->
<link rel="stylesheet" href="styles.css">
<style>
  .oa-wrap{max-width:1180px;margin:0 auto;padding:28px clamp(16px,3vw,32px) 64px;display:grid;gap:34px}
  .oa-hero{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.10);border-radius:20px;
    padding:30px clamp(20px,4vw,40px) 26px;display:grid;gap:12px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--show,#FF3EA5) 22%,#160d22) 0%,#140c20 55%,#100918 100%)}
  .oa-hero::after{content:"";position:absolute;inset:auto -10% -60% auto;width:55%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--show,#FF3EA5) 30%,transparent),transparent 65%);pointer-events:none}
  .oa-hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .oa-live{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--font-body);letter-spacing:.2em;
    text-transform:uppercase;color:#fff;background:rgba(255,62,165,.16);border:1px solid rgba(255,62,165,.55);
    border-radius:999px;padding:7px 12px}
  .oa-live i{width:8px;height:8px;border-radius:50%;background:#FF3EA5;box-shadow:0 0 0 0 rgba(255,62,165,.6)}
  .oa-live.off{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:var(--muted)}
  .oa-live.off i{background:var(--muted)}
  @media (prefers-reduced-motion:no-preference){.oa-live:not(.off) i{animation:oa-pulse 1.8s ease-out infinite}}
  @keyframes oa-pulse{70%{box-shadow:0 0 0 8px rgba(255,62,165,0)}100%{box-shadow:0 0 0 0 rgba(255,62,165,0)}}
  .oa-show{font:600 13px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--show,#FF3EA5)}
  .oa-title{font-family:var(--font-display);font-weight:900;font-size:clamp(40px,7vw,78px);line-height:.92;
    letter-spacing:.01em;margin:4px 0 0;text-wrap:balance}
  .oa-meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;color:var(--muted);font-size:15px}
  .oa-meta span{white-space:nowrap}
  .oa-progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;max-width:520px}
  .oa-progress i{display:block;height:100%;background:linear-gradient(90deg,#FF3EA5,#7B5CFF);border-radius:inherit}

  .oa-block{display:grid;gap:14px}
  .oa-block h2{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;
    display:flex;align-items:baseline;gap:10px}
  .oa-block h2 small{font:600 14px var(--font-body);color:var(--muted)}
  .oa-exit{border-left:3px solid #FF3EA5;padding:4px 0 4px 18px}
  .oa-exit p{margin:0;font-size:18px;max-width:60ch}
  .oa-exit a,.oa-more{color:#FFC23D;font-weight:600;text-decoration:none;justify-self:start}
  .oa-exit a:hover,.oa-more:hover{text-decoration:underline}

  .oa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .oa-card{display:grid;justify-items:center;gap:6px;text-align:center;text-decoration:none;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 10px 14px;
    transition:transform .2s,border-color .2s,background .2s}
  .oa-card:hover,.oa-card:focus-visible{transform:translateY(-2px);border-color:rgba(255,62,165,.5);background:rgba(255,255,255,.07)}
  .oa-face{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#241535;display:grid;place-items:center}
  .oa-face img{width:100%;height:100%;object-fit:cover}
  .oa-initials{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--muted)}
  .oa-name{font-weight:600;font-size:15px}
  .oa-stats{font-size:12.5px;color:var(--muted)}
  .oa-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#FFC23D}
  .oa-card.is-out .oa-face{filter:grayscale(1);opacity:.6}
  .oa-card.is-out .oa-name{color:var(--muted)}

  .oa-posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .oa-post{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
  .oa-post header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .oa-post header span,.oa-post footer{color:var(--muted);font-size:12.5px}
  .oa-post p{margin:0;overflow-wrap:anywhere}

  .oa-finale,.oa-recent a{display:grid;gap:4px;text-decoration:none;color:var(--text);background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px}
  .oa-finale b,.oa-recent b{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em}
  .oa-finale span,.oa-recent span{color:var(--muted)}
  .oa-recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .oa-loading{color:var(--muted)}
</style>
</head>
