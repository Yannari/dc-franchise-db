<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total Drama Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   MOCKUP v2 — Total Drama stepped viewer, game-HUD direction (user pick,
   2026-10-07). The painted set fills the frame and is alive: fire, clouds,
   smoke, water, lights, birds and fireflies are sprites animated from the
   marks Blender writes beside every plate (<spot>-<tod>.json). People stand
   and sit where the set has room for them; whoever is not in the
   conversation is busy with something of their own.
   ══════════════════════════════════════════════════════════════════ */
:root {
  --ink: #12141c;
  --orange: #ff8a1f;
  --amber: #ffc23a;
  --teal: #2ec4c4;
  --gophers: #4fb84a;
  --bass: #d8433f;
  --conf: #8a5ad8;
  --glass: rgba(14, 16, 26, .86);
  --glass2: rgba(22, 25, 38, .92);
  --hud-text: #f4f1ea;
  --hud-dim: #a9adbd;
  --bg: #e9ebf1;
  --bg2: #dfe2ea;
  --panel: #ffffff;
  --text: #1b1d27;
  --muted: #6a6f80;
  --line: #cfd3de;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d0f15; --bg2: #151821; --panel: #1a1d28; --text: #eceef4; --muted: #8d93a6; --line: #2a2f3e; }
}
:root[data-theme="dark"] { --bg: #0d0f15; --bg2: #151821; --panel: #1a1d28; --text: #eceef4; --muted: #8d93a6; --line: #2a2f3e; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 700 15px/1.45 Nunito, system-ui, sans-serif; min-height: 100vh; }
.app { max-width: 1240px; margin: 0 auto; padding: 14px 16px 28px; display: grid; gap: 10px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font: 400 24px/1 'Lilita One', cursive; letter-spacing: .5px; color: var(--amber); -webkit-text-stroke: 1px #3a1e08; paint-order: stroke fill;
  text-shadow: 0 2px 0 var(--orange), 0 3px 0 #3a1e08; transform: skewX(-6deg); }
.eps { font: 800 12px Nunito; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; margin-left: 4px; }
.tab { border: 0; background: var(--bg2); color: var(--muted); font: 800 12px Nunito; letter-spacing: .4px; text-transform: uppercase; padding: 7px 14px;
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); cursor: pointer; }
.tab.on { background: var(--orange); color: #1a0e02; }
.spacer { flex: 1; }
.ibtn { border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 800 12px Nunito; padding: 6px 10px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.ibtn svg { width: 15px; height: 15px; }

/* ── THE FRAME ─────────────────────────────────────────────────── */
.frame { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #0a0b10; isolation: isolate;
  box-shadow: 0 18px 50px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04); }
.world { position: absolute; inset: 0; transform-origin: 50% 60%; animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.035) translate(-.6%, .2%); } to { transform: scale(1.06) translate(.6%, -.4%); } }
.frame.push .world { animation: none; transition: transform 1s cubic-bezier(.3,.7,.2,1); }
.plate { position: absolute; inset: 0; background-size: 100% 100%; transition: opacity .45s; }
.plate.out { opacity: 0; }
.live, .cast { position: absolute; inset: 0; pointer-events: none; }
.night-wash { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 75%, transparent 40%, rgba(8,10,30,.35)); }

/* live layer */
.cloud { position: absolute; transform: translate(-50%, -50%); animation: cloud var(--d, 70s) ease-in-out infinite alternate; opacity: .97; }
@keyframes cloud { from { margin-left: calc(var(--dx, 4%) * -1); } to { margin-left: var(--dx, 4%); } }
.flame { position: absolute; transform: translate(-50%, -100%); transform-origin: 50% 100%; }
.flame img { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
.flame img:nth-child(1) { animation: flick1 .9s ease-in-out infinite; }
.flame img:nth-child(2) { animation: flick2 1.3s ease-in-out infinite; opacity: .75; transform: scaleX(-1); }
@keyframes flick1 { 0%,100% { transform: scale(1, 1) skewX(0); } 25% { transform: scale(.94, 1.08) skewX(-4deg); } 50% { transform: scale(1.05, .93) skewX(2deg); } 75% { transform: scale(.97, 1.04) skewX(4deg); } }
@keyframes flick2 { 0%,100% { transform: scaleX(-1) scale(.9, .95); } 40% { transform: scaleX(-1) scale(1, 1.12) skewX(5deg); } 70% { transform: scaleX(-1) scale(.92, .9) skewX(-3deg); } }
.glow { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; mix-blend-mode: screen; animation: glow 1.6s ease-in-out infinite alternate;
  background: radial-gradient(circle, rgba(255,170,80,.55), rgba(255,120,40,.18) 45%, transparent 70%); }
@keyframes glow { from { opacity: .7; transform: translate(-50%, -50%) scale(.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } }
.ember { position: absolute; width: .35%; aspect-ratio: 1; border-radius: 50%; background: #ffc86a; box-shadow: 0 0 6px #ff9a3a; animation: ember var(--d, 2.4s) linear infinite; animation-delay: var(--dl, 0s); opacity: 0; }
@keyframes ember { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--ex, 10px), -120px); opacity: 0; } }
.puff { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(230,230,240,.55), rgba(230,230,240,0) 70%); animation: puff var(--d, 5s) ease-out infinite; animation-delay: var(--dl, 0s); opacity: 0; }
@keyframes puff { 0% { transform: translate(-50%, 0) scale(.4); opacity: 0; } 15% { opacity: .8; } 100% { transform: translate(calc(-50% + var(--ex, 30px)), -160px) scale(2.4); opacity: 0; } }
.bulb { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; animation: twinkle var(--d, 2s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
@keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
.shimmer { position: absolute; height: .25%; border-radius: 4px; background: rgba(230, 250, 255, .55); animation: shimmer var(--d, 5s) ease-in-out infinite; animation-delay: var(--dl, 0s); opacity: 0; }
@keyframes shimmer { 0% { transform: translateX(0) scaleX(.3); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateX(var(--ex, 40px)) scaleX(1); opacity: 0; } }
.bird { position: absolute; width: 1.6%; animation: bird var(--d, 18s) linear infinite; animation-delay: var(--dl, 0s); }
.bird svg { width: 100%; animation: flap .5s ease-in-out infinite alternate; }
@keyframes bird { from { transform: translate(-10vw, 0); } to { transform: translate(120vw, -4vh); } }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
.leaf { position: absolute; width: .9%; aspect-ratio: 1.6; border-radius: 50% 0; background: #c8902e; animation: leaf var(--d, 9s) linear infinite; animation-delay: var(--dl, 0s); opacity: 0; }
@keyframes leaf { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: .95; } 100% { transform: translate(var(--ex, -60px), 55vh) rotate(540deg); opacity: 0; } }
.fly { position: absolute; width: .45%; aspect-ratio: 1; border-radius: 50%; background: #e8ff8a; box-shadow: 0 0 8px 2px rgba(220,255,120,.8); animation: firefly var(--d, 7s) ease-in-out infinite alternate, blinkf 2.2s ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes firefly { 0% { transform: translate(0, 0); } 33% { transform: translate(30px, -20px); } 66% { transform: translate(-20px, -40px); } 100% { transform: translate(15px, 10px); } }
@keyframes blinkf { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
.mote { position: absolute; width: .3%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,240,200,.7); animation: firefly var(--d, 12s) ease-in-out infinite alternate; }
.gnat { position: absolute; width: 1.4%; aspect-ratio: 1.3; border-radius: 50%; background: #141414; animation: gnat 2.6s linear infinite; animation-delay: var(--dl, 0s); z-index: 5; }
.gnat::before, .gnat::after { content: ''; position: absolute; top: -55%; width: 75%; height: 90%; border-radius: 50%; background: rgba(220,235,255,.75); animation: wing .06s linear infinite alternate; }
.gnat::before { left: -35%; transform-origin: 100% 100%; } .gnat::after { right: -35%; transform-origin: 0 100%; }
@keyframes wing { from { transform: rotate(-25deg) scaleY(.6); } to { transform: rotate(20deg) scaleY(1); } }
.flystrip { position: absolute; transform-origin: 50% 0; animation: strip 3.5s ease-in-out infinite; }
@keyframes strip { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes gnat { 0% { transform: translate(0,0); } 25% { transform: translate(40px,-25px); } 50% { transform: translate(10px,30px); } 75% { transform: translate(-35px,-5px); } 100% { transform: translate(0,0); } }

/* people */
.tok { position: absolute; transform: translate(-50%, -100%); transition: left .8s cubic-bezier(.3,.8,.25,1.05), top .8s cubic-bezier(.3,.8,.25,1.05), height .8s, width .8s, opacity .4s, filter .4s; }
.tok .body { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 3.4s ease-in-out infinite; animation-delay: var(--bd, 0s); }
@keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.018); } }
.tok .face { position: absolute; inset: 0; border-radius: 14% 14% 10% 10%; overflow: hidden; border: 2px solid rgba(20,16,24,.85); background: #fff;
  box-shadow: 0 0 0 2px rgba(255,255,255,.85) inset, 0 6px 14px rgba(0,0,0,.35); transform: rotate(var(--tilt, 0deg)); transition: transform .5s; }
.tok .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tok .shadow { position: absolute; left: 10%; right: 10%; bottom: -6%; height: 12%; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); z-index: -1; }
.tok .tag { position: absolute; left: 50%; bottom: -16%; transform: translateX(-50%); white-space: nowrap; font: 400 clamp(8px, 1.05vw, 13px)/1 'Lilita One'; letter-spacing: .4px;
  color: #fff; background: rgba(14,16,26,.82); padding: 3px 7px 2px; clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%); }
.tok.bg { filter: saturate(.8) brightness(.85); }
.tok.bg .tag { opacity: .75; }
.tok.speak .face { box-shadow: 0 0 0 2px rgba(255,255,255,.9) inset, 0 0 0 3px var(--amber), 0 10px 22px rgba(0,0,0,.45); }
.tok.speak .tag { background: var(--orange); color: #1a0e02; }
.tok.pop .body { animation: talkpop .5s cubic-bezier(.3,1.6,.5,1), breathe 3.4s ease-in-out .5s infinite; }
@keyframes talkpop { 0% { transform: scale(.88, 1.1); } 50% { transform: scale(1.06, .95); } 100% { transform: scale(1); } }
.tok.laugh .body { animation: laugh .55s ease-in-out 3; }
@keyframes laugh { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-7%) rotate(-4deg); } 75% { transform: translateY(-5%) rotate(4deg); } }
.tok.shake .body { animation: shake .45s linear; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7%) rotate(-5deg); } 45% { transform: translateX(7%) rotate(5deg); } 70% { transform: translateX(-4%); } }
.tok.storm { animation: storm 1s cubic-bezier(.6,-0.3,.8,.4) forwards; }
@keyframes storm { 0% { margin-left: 0; } 25% { margin-left: -2%; } 100% { margin-left: 70%; opacity: 0; } }
.tok.walk { animation: walk 3s ease-in forwards; }
@keyframes walk { 0% { opacity: 1; } 100% { top: 40%; height: 3%; width: 3%; opacity: 0; } }
.tok.walk .body { animation: step .4s ease-in-out infinite alternate; }
@keyframes step { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(-4%); } }
/* the busy ones */
.tok.act-fish .body { animation: sway 4s ease-in-out infinite; }
.tok.act-read .body { animation: nod 5s ease-in-out infinite; }
.tok.act-eat .body { animation: chew 1.1s ease-in-out infinite; }
.tok.act-stretch .body { animation: stretch 3s ease-in-out infinite; }
.tok.act-nap .body { animation: nap 6s ease-in-out infinite; }
@keyframes sway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes nod { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(3deg) translateY(2%); } }
@keyframes chew { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.96) translateY(2%); } }
@keyframes stretch { 0%,100% { transform: rotate(-8deg) scaleY(1.02); } 50% { transform: rotate(8deg) scaleY(1.04); } }
@keyframes nap { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(-12deg) translateY(2%); } }
.busy { position: absolute; left: 82%; top: -18%; width: 42%; aspect-ratio: 1; border-radius: 50%; background: rgba(14,16,26,.85); border: 2px solid rgba(255,255,255,.9);
  display: grid; place-items: center; animation: bob 2.2s ease-in-out infinite; }
.busy svg { width: 62%; height: 62%; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12%); } }
.rod { position: absolute; left: 70%; top: 30%; width: 120%; height: 4px; background: #6a4a2a; transform-origin: 0 50%; transform: rotate(-28deg); }
.rod::after { content: ''; position: absolute; right: 0; top: 0; width: 2px; height: 190%; background: rgba(255,255,255,.7); transform-origin: top; }
.bobber { position: absolute; left: 175%; top: 104%; width: 12%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(#e8433f 50%, #fff 50%); animation: bobber 2.4s ease-in-out infinite; }
@keyframes bobber { 0%,100% { transform: translateY(0); } 50% { transform: translateY(30%); } }
.zzz { position: absolute; left: 70%; top: -20%; font: 400 clamp(10px, 1.4vw, 18px) 'Lilita One'; color: #fff; text-shadow: 0 1px 2px #000; animation: zzz 2.6s ease-out infinite; }
@keyframes zzz { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(40%, -120%) scale(1.2); opacity: 0; } }

/* reactions */
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.ring { position: absolute; border: 3px solid var(--amber); border-radius: 50%; transform: translate(-50%, -50%); animation: ring .9s ease-out forwards; }
@keyframes ring { from { width: 6%; aspect-ratio: 1; opacity: 1; } to { width: 34%; aspect-ratio: 1; opacity: 0; } }
.pop { position: absolute; transform: translate(-50%, -50%); font: 400 clamp(16px, 3vw, 38px)/1 'Lilita One'; color: var(--amber); -webkit-text-stroke: 1.5px #1a0e02; paint-order: stroke fill;
  text-shadow: 0 3px 0 #1a0e02; animation: popw 1.1s cubic-bezier(.3,1.7,.5,1) forwards; }
@keyframes popw { 0% { transform: translate(-50%,-50%) scale(0) rotate(-20deg); } 30% { transform: translate(-50%,-50%) scale(1.2) rotate(-6deg); } 80% { opacity: 1; } 100% { transform: translate(-50%,-90%) scale(1) rotate(-6deg); opacity: 0; } }
.excl { position: absolute; transform: translate(-50%, -50%); width: clamp(18px, 2.6vw, 30px); aspect-ratio: 1; border-radius: 50%; background: var(--bass); color: #fff; display: grid; place-items: center;
  font: 400 clamp(12px, 1.8vw, 20px)/1 'Lilita One'; box-shadow: 0 0 0 2px #fff; animation: excl .9s cubic-bezier(.3,1.8,.5,1) forwards; }
@keyframes excl { 0% { transform: translate(-50%,-20%) scale(0); } 40% { transform: translate(-50%,-60%) scale(1.15); } 85% { opacity: 1; } 100% { transform: translate(-50%,-70%); opacity: 0; } }
.toss { position: absolute; width: 2.4%; aspect-ratio: 1.1; border-radius: 30%; background: #fffaf0; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 12px rgba(255,240,200,.8); }

/* ── HUD ───────────────────────────────────────────────────────── */
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; font-family: Nunito; }
.loc { position: absolute; left: 2.2%; top: 4%; display: flex; align-items: stretch; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
.loc .ic { width: clamp(30px, 4.2vw, 52px); background: var(--orange); clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%); display: grid; place-items: center; padding-right: 12%; }
.loc .ic svg { width: 58%; height: auto; }
.loc .txt { background: var(--glass); color: var(--hud-text); padding: .45em 1.6em .45em 1.1em; margin-left: -6px; clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); }
.loc .place { font: 400 clamp(13px, 1.9vw, 24px)/1 'Lilita One'; letter-spacing: .6px; text-transform: uppercase; }
.loc .when { font: 800 clamp(8px, 1vw, 12px)/1.2 Nunito; color: var(--hud-dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
.loc .when b { color: var(--amber); }
.loc.fresh { animation: locin .6s cubic-bezier(.2,.9,.3,1.1); }
@keyframes locin { from { transform: translateX(-120%); } to { transform: none; } }
.team { position: absolute; left: 2.2%; top: calc(4% + clamp(34px, 5.2vw, 62px)); font: 900 clamp(7px, .85vw, 10px)/1 Nunito; letter-spacing: 1.2px; text-transform: uppercase;
  color: #0c1a0a; background: var(--gophers); padding: 4px 9px; clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.map { position: absolute; right: 2%; top: 4%; width: clamp(92px, 13vw, 150px); background: var(--glass); border-radius: 8px; padding: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.map svg { display: block; width: 100%; height: auto; }
.map .lbl { font: 900 clamp(7px, .8vw, 10px)/1 Nunito; letter-spacing: 1px; color: var(--hud-dim); text-transform: uppercase; margin: 2px 2px 4px; display: flex; justify-content: space-between; }
.map .lbl b { color: var(--amber); }
.pin { animation: pin 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pin { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }
.plate-hud { position: absolute; right: 2%; top: 4%; display: flex; gap: 5px; align-items: center; background: var(--glass); padding: 7px 10px; border-radius: 8px; color: var(--hud-text);
  font: 900 clamp(8px, .9vw, 11px)/1 Nunito; letter-spacing: 1px; text-transform: uppercase; }
.plate-hud i { width: clamp(9px, 1.2vw, 15px); aspect-ratio: 1.1; border-radius: 30%; background: #fffaf0; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.plate-hud i.gone { opacity: .18; }
.chop { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); font: 400 clamp(11px, 1.6vw, 20px)/1 'Lilita One'; letter-spacing: 2px; color: #fff; text-transform: uppercase;
  background: var(--bass); padding: .45em 1.2em .35em; clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%); animation: chop 1.4s ease-in-out infinite; }
@keyframes chop { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.04); } }
.frame.tense .world { animation: tense 1.6s ease-in-out infinite; }
@keyframes tense { 0%,100% { transform: scale(1.08); } 50% { transform: scale(1.1); } }

/* dialogue */
.dlg { position: absolute; left: 2.2%; right: 2.2%; bottom: 3.2%; min-height: 22%; pointer-events: auto; }
.dlg .panel { position: absolute; inset: 0 0 0 0; background: var(--glass); clip-path: polygon(1.4% 0, 100% 0, 98.6% 100%, 0 100%);
  border-top: 3px solid var(--orange); box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.dlg .panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--orange), var(--amber) 40%, transparent); }
.dlg .name { position: absolute; left: calc(var(--cut, 0%) + 3%); top: -1.3em; font: 400 clamp(13px, 1.8vw, 22px)/1 'Lilita One'; letter-spacing: .8px; color: #0c1a0a;
  padding: .32em 1.2em .26em .9em; background: var(--gophers); clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); text-transform: uppercase; }
.dlg .name.host { background: var(--amber); color: #1a0e02; }
.dlg .name.conf { background: var(--conf); color: #fff; }
.dlg .name.dir { display: none; }
.dlg .say { position: relative; padding: 1.15em 3.4em 1em calc(var(--cut, 0%) + 3%); color: var(--hud-text); font: 800 clamp(13px, 1.75vw, 21px)/1.42 Nunito; }
.dlg .say.direction { font: 700 italic clamp(12px, 1.55vw, 18px)/1.45 Nunito; color: #c9cdd9; }
.dlg .say.quote { font: 800 italic clamp(13px, 1.8vw, 22px)/1.4 Nunito; }
.dlg .say .hn { color: var(--amber); }
.dlg .say .hg { color: var(--teal); }
.dlg .say.punch { animation: punch .3s cubic-bezier(.3,1.7,.5,1); transform-origin: 0 50%; }
@keyframes punch { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg .next { position: absolute; right: 2.4%; bottom: 14%; width: clamp(12px, 1.4vw, 18px); aspect-ratio: 1; background: var(--amber); clip-path: polygon(0 0, 100% 50%, 0 100%); animation: nx .8s ease-in-out infinite alternate; }
@keyframes nx { from { transform: translateX(0); } to { transform: translateX(5px); } }
.dlg .caret { display: inline-block; width: .45em; height: 1em; background: var(--amber); vertical-align: -2px; margin-left: 2px; animation: blink .7s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.dlg.loud .panel { animation: dshake .35s linear; }
@keyframes dshake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.cutin { position: absolute; left: 0; bottom: 0; width: 15%; aspect-ratio: .82; clip-path: polygon(10% 0, 100% 0, 88% 100%, 0 100%); overflow: hidden; background: #222; }
.cutin img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
.cutin.fresh { animation: cutin .45s cubic-bezier(.2,.9,.3,1.1); }
@keyframes cutin { from { transform: translateX(-60%); opacity: 0; } to { transform: none; opacity: 1; } }
.dlg.conf .panel { border-top-color: var(--conf); }
.dlg.conf .panel::before { background: linear-gradient(90deg, var(--conf), #c8a0ff 40%, transparent); }

/* confession cam */
.static { position: absolute; inset: -20%; z-index: 20; pointer-events: none; opacity: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.static.burst { animation: burst .45s steps(5) forwards; }
@keyframes burst { 0% { opacity: 1; transform: translate(0,0); } 25% { transform: translate(-5%,3%); } 50% { opacity: 1; transform: translate(4%,-2%); } 75% { transform: translate(-2%,-4%); } 100% { opacity: 0; } }
.conf-vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 65% 72% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
.grain { position: absolute; inset: -40%; pointer-events: none; opacity: .1; mix-blend-mode: overlay; animation: grain .5s steps(4) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
@keyframes grain { 0% { transform: translate(0,0); } 25% { transform: translate(-5%,3%); } 50% { transform: translate(4%,-2%); } 75% { transform: translate(-2%,-5%); } 100% { transform: translate(0,0); } }
.rec { position: absolute; right: 2.5%; top: 4%; font: 400 clamp(10px, 1.4vw, 17px) 'Lilita One'; letter-spacing: 1.5px; color: #fff; background: var(--conf); padding: .4em 1em .3em;
  clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); text-transform: uppercase; }

/* title card */
.title { position: absolute; inset: 0; z-index: 15; display: grid; place-items: center; overflow: hidden; background: rgba(8,10,18,.4); }
.title .band { position: absolute; left: -10%; right: -10%; top: 30%; height: 40%; background: var(--orange); transform: rotate(-6deg); box-shadow: 0 0 0 6px var(--ink), 0 0 0 9px var(--amber); }
.title .band::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(255,255,255,.08) 40px 80px); }
.title .inner { position: relative; text-align: center; transform: rotate(-6deg); }
.title .kicker { font: 900 clamp(10px, 1.3vw, 15px) Nunito; letter-spacing: 4px; text-transform: uppercase; color: #1a0e02; }
.title .big { font: 400 clamp(28px, 6.5vw, 80px)/1 'Lilita One'; color: #fff; -webkit-text-stroke: 2px #1a0e02; paint-order: stroke fill; text-shadow: 0 5px 0 #1a0e02; text-transform: uppercase; }
.title .faces { position: absolute; display: flex; gap: 1.5vw; bottom: 7%; left: 50%; transform: translateX(-50%); }
.title .faces img { width: clamp(52px, 11vw, 130px); aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 3px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
.title.fresh .band { animation: band .5s cubic-bezier(.2,.9,.3,1); }
@keyframes band { from { transform: rotate(-6deg) translateX(-110%); } to { transform: rotate(-6deg); } }
.title.fresh .big { animation: slam .55s .15s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes slam { from { transform: scale(2.4); opacity: 0; } to { transform: none; opacity: 1; } }
.title.fresh .faces img { animation: rise .45s cubic-bezier(.3,1.6,.5,1) backwards; }
.title.fresh .faces img:nth-child(1) { animation-delay: .3s; } .title.fresh .faces img:nth-child(2) { animation-delay: .4s; } .title.fresh .faces img:nth-child(3) { animation-delay: .5s; }
@keyframes rise { from { transform: translateY(60%); opacity: 0; } to { transform: none; opacity: 1; } }

/* intel drawer */
.intel-btn { position: absolute; right: 2%; top: calc(4% + clamp(92px, 13vw, 150px) * .78 + 12px); pointer-events: auto; border: 0; background: var(--glass); color: var(--hud-text);
  font: 900 clamp(8px, .9vw, 11px) Nunito; letter-spacing: 1.2px; text-transform: uppercase; padding: 8px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.intel-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bass); display: none; }
.intel-btn.new .dot { display: inline-block; animation: pin 1s infinite; }
.intel { position: absolute; top: 0; right: 0; bottom: 0; width: min(34%, 340px); background: var(--glass2); z-index: 12; pointer-events: auto; transform: translateX(100%); transition: transform .35s cubic-bezier(.3,.8,.3,1);
  color: var(--hud-text); padding: 14px 14px 0; display: flex; flex-direction: column; border-left: 2px solid var(--orange); }
.frame.intel-open .intel { transform: none; }
.intel h4 { margin: 0 0 2px; font: 400 18px 'Lilita One'; letter-spacing: .6px; text-transform: uppercase; }
.intel .sub { font: 700 11px Nunito; color: var(--hud-dim); margin-bottom: 10px; }
.itabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.itab { border: 0; background: rgba(255,255,255,.07); color: var(--hud-dim); border-radius: 6px; padding: 6px 7px; cursor: pointer; display: flex; position: relative; }
.itab svg { width: 16px; height: 16px; }
.itab.on { background: var(--orange); color: #1a0e02; }
.itab .dot { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--bass); }
.ilist { overflow: auto; flex: 1; padding-bottom: 12px; }
.icard { background: rgba(255,255,255,.05); border-radius: 8px; padding: 8px 10px; margin-bottom: 7px; font: 700 12px/1.35 Nunito; color: #d8dbe6; border-left: 3px solid var(--teal); }
.icard b { color: #fff; }
.icard .k { color: var(--amber); }
.icard.fresh { animation: inr .5s ease-out; }
@keyframes inr { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.minis { display: flex; gap: 3px; margin-top: 5px; }
.minis img { width: 24px; height: 24px; border-radius: 5px; object-fit: cover; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); position: relative; overflow: hidden; margin-top: 5px; }
.bar i { position: absolute; top: 0; bottom: 0; left: 50%; }
.bar i.pos { background: var(--gophers); } .bar i.neg { background: var(--bass); right: 50%; left: auto; }
.tally { display: flex; align-items: center; gap: 8px; }
.tally img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; }
.tally .marks { margin-left: auto; font: 400 16px 'Lilita One'; color: var(--bass); letter-spacing: 2px; }
.empty { font: 700 12px Nunito; color: var(--hud-dim); }

/* ── CONTROLS ──────────────────────────────────────────────────── */
.bar-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cbtn { border: 0; background: var(--panel); color: var(--text); border-radius: 9px; padding: 9px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; font: 800 13px Nunito;
  box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line) inset; }
.cbtn svg { width: 16px; height: 16px; }
.cbtn.go { background: var(--orange); color: #1a0e02; box-shadow: none; padding: 9px 22px; }
.cbtn.on { background: var(--teal); color: #04201f; }
.key { font: 900 10px Nunito; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.12); }
.chapters { flex: 1; min-width: 160px; display: flex; gap: 3px; }
.chapters i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.chapters i b { position: absolute; inset: 0; width: 0; background: var(--orange); transition: width .3s; }
details.script { background: var(--panel); border-radius: 10px; box-shadow: 0 0 0 1px var(--line) inset; }
details.script summary { cursor: pointer; padding: 10px 14px; font: 800 12px Nunito; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.lines { max-height: 240px; overflow: auto; padding: 0 14px 12px; }
.ln { padding: 4px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; }
.ln:hover { background: var(--bg2); }
.ln.cur { background: color-mix(in srgb, var(--orange) 22%, transparent); }
.ln.sc { font: 900 11px Nunito; letter-spacing: 1px; text-transform: uppercase; color: var(--orange); margin-top: 6px; }
.ln .n { font-weight: 900; }
.ln.d { font-style: italic; color: var(--muted); }
@media (max-width: 640px) {
  .frame { aspect-ratio: auto; height: 0; padding-bottom: 56.25%; }
  .dlg { position: static; }
  .stagewrap .dlg { display: none; }
  .dlg-mobile { display: block !important; }
  .map, .intel-btn { display: none; }
  .intel { position: static; transform: none; width: auto; border-left: 0; border-radius: 10px; margin-top: 8px; }
  .cbtn .lbl, .key { display: none; }
}
.dlg-mobile { display: none; position: relative; min-height: 120px; margin-top: -4px; }
.dlg-mobile .dlg { position: relative; left: 0; right: 0; bottom: 0; min-height: 120px; }
</style>
</head>

<script>
const GOPHERS = ['Alejandro', 'Geoff', 'Sierra', 'Harold', 'Courtney', 'Gwen', 'Noah', 'Izzy'];
const CAMP = [
  { t: 'scene', spot: 'dock', tod: 'day', day: 'DAY 4', clock: '7:12 AM', place: 'The Dock', focus: ['Geoff', 'Alejandro'], bg: ['Harold'], bgAt: [[50, 30]], bed: 'none',
    side: [{ tab: 'bonds', pairs: [['Alejandro', 'Geoff', 4], ['Alejandro', 'Courtney', -2], ['Geoff', 'Courtney', 1]] }] },
  { t: 'dir', text: 'Geoff baits a hook. Alejandro holds the worm bucket at arm’s length.' },
  { t: 'line', who: 'Geoff', text: 'Dude, hold it closer. The worms aren’t gonna bite you.' },
  { t: 'line', who: 'Alejandro', text: 'Listen. Courtney sat out the whole relay yesterday. That’s why we lost.', bed: 'camp-day' },
  { t: 'line', who: 'Geoff', text: 'She said she hurt her ankle.' },
  { t: 'line', who: 'Alejandro', text: 'Her ankle was fine at dinner. She stood on a bench to yell at Chef.' },
  { t: 'line', who: 'Geoff', text: 'Okay, but why not Noah? He called my hat a cry for help.' },
  { t: 'line', who: 'Alejandro', text: 'Noah is annoying. Courtney wants to run this team. Annoying, I can live with.' },
  { t: 'dir', text: 'Geoff yanks a fish out of the lake. It slaps Alejandro across the face.', act: [{ kind: 'shake', who: 'Alejandro' }, { kind: 'laugh', who: 'Geoff' }], pop: 'SLAP!' },
  { t: 'line', who: 'Geoff', text: 'Ha! Breakfast! Fine. Courtney. But you’re carrying the fish.',
    side: [{ tab: 'plans', who: 'Alejandro', target: 'Courtney', why: 'sat out the relay; wants to run the team' },
           { tab: 'plans', who: 'Geoff', target: 'Courtney', why: 'wanted Noah; Alejandro talked him round' }] },
  { t: 'conf', who: 'Alejandro', text: 'Geoff is a great guy. By lunch, he will think getting rid of Courtney was his idea.' },

  { t: 'cut', spot: 'mess-hall', tod: 'day', clock: '7:40 AM', place: 'The Mess Hall', focus: ['Izzy', 'Harold'], bed: 'none' },
  { t: 'dir', text: 'Izzy balances a spoon on her nose. Harold times her on his digital watch.' },
  { t: 'line', who: 'Harold', text: 'Forty seconds. That’s a camp record. I checked.' },
  { t: 'line', who: 'Izzy', text: 'Izzy doesn’t do records. Izzy does legends!', act: [{ kind: 'laugh', who: 'Izzy' }, { kind: 'laugh', who: 'Harold' }],
    side: [{ tab: 'log', text: 'Harold and Izzy: +1 (spoon record)' }] },

  { t: 'scene', spot: 'cabins', tod: 'day', day: 'DAY 4', clock: '10:30 AM', place: 'The Cabins', focus: ['Courtney', 'Sierra'], bg: ['Gwen'], bed: 'none' },
  { t: 'dir', text: 'Courtney marches out of the girls’ cabin holding her planner open.' },
  { t: 'line', who: 'Courtney', text: 'Who read my planner? There’s a sticky note in here that says “cute handwriting!”' },
  { t: 'line', who: 'Sierra', text: 'It’s a compliment! I read everybody’s stuff. It’s research.' },
  { t: 'line', who: 'Courtney', text: 'That is an invasion of privacy! I could sue you for that!', loud: true, react: ['Gwen'], bed: 'camp-day' },
  { t: 'line', who: 'Sierra', text: 'Can you sue somebody for sitting out a relay? Asking for the team.' },
  { t: 'dir', text: 'Courtney storms back inside and slams the door. The whole cabin shakes.', act: [{ kind: 'storm', who: 'Courtney' }], pop: 'SLAM!',
    side: [{ tab: 'bonds', pairs: [['Courtney', 'Sierra', -3]] }, { tab: 'plans', who: 'Courtney', target: 'Sierra', why: 'read her planner' },
           { tab: 'log', text: 'Courtney and Sierra: −2 (the planner)' }] },
  { t: 'line', who: 'Gwen', text: 'And that’s my morning.', focusAdd: 'Gwen' },
  { t: 'conf', who: 'Sierra', text: 'I’ve seen every season of every reality show. The one who yells on day four never makes the merge.' },

  { t: 'scene', spot: 'campfire', tod: 'day', day: 'DAY 4', clock: '4:15 PM', place: 'The Campfire Pit', focus: ['Gwen', 'Noah'], bed: 'none',
    side: [{ tab: 'bonds', pairs: [['Gwen', 'Noah', 5], ['Gwen', 'Alejandro', -2], ['Noah', 'Alejandro', -1]] }, { tab: 'love', who: 'Noah', to: 'Gwen', what: 'crush (since day 1)' }] },
  { t: 'dir', text: 'Noah reads on a stump. Gwen sits down next to him with her sketchbook on her knees.' },
  { t: 'line', who: 'Gwen', text: 'You know Alejandro’s telling everyone they’re the only person he trusts?' },
  { t: 'line', who: 'Noah', text: 'He told me that on day one. I didn’t buy it then either.', bed: 'camp-day' },
  { t: 'line', who: 'Gwen', text: 'He’s got Geoff and Sierra. That’s three. With Courtney gone tonight, it’s three against everybody.' },
  { t: 'line', who: 'Noah', text: 'So we vote him. Courtney’s going home anyway, and maybe somebody gets brave.' },
  { t: 'line', who: 'Gwen', text: 'Two votes isn’t a plan, Noah.' },
  { t: 'line', who: 'Noah', text: 'It’s a start. Call us the Outcasts. Nobody here wants us anyway.', act: [{ kind: 'lean', who: ['Noah', 'Gwen'] }] },
  { t: 'line', who: 'Gwen', text: 'Fine. But I’m not making T-shirts.', act: [{ kind: 'laugh', who: 'Noah' }],
    side: [{ tab: 'plans', who: 'Gwen', target: 'Alejandro', why: 'tells everyone they’re his only friend' },
           { tab: 'plans', who: 'Noah', target: 'Alejandro', why: 'votes with Gwen' }] },
  { t: 'title', kind: 'ALLIANCE FORMED', name: 'The Outcasts', faces: ['Gwen', 'Noah'], side: [{ tab: 'allies', name: 'The Outcasts', who: ['Gwen', 'Noah'] }] },
  { t: 'conf', who: 'Noah', text: 'I don’t do alliances. But Gwen laughs at my jokes, so I’m making an exception.' },
];
CAMP[0].side.unshift({ tab: 'allies', name: 'The Trifecta', who: ['Alejandro', 'Geoff', 'Sierra'], since: 'day 1' },
                     { tab: 'secrets', text: 'Sierra holds a Hidden Immunity Idol. Nobody knows.' });

const TRIBAL = [
  { t: 'scene', spot: 'ceremony', venue: 'hosted-camp', tod: 'night', day: 'DAY 4', clock: '9:05 PM', place: 'The Campfire Ceremony', focus: [], bg: [], seated: GOPHERS, bed: 'tribal', ceremony: true },
  { t: 'line', who: 'Chris', text: 'Gophers! Back so soon. And you lost the relay by, what, a whole lake?' },
  { t: 'line', who: 'Chris', text: 'Courtney. Rumour has it your ankle made a full recovery by dinner.', focus: ['Courtney'] },
  { t: 'line', who: 'Courtney', text: 'It’s called pacing myself. Some of us are playing a long game.', focus: ['Courtney'] },
  { t: 'line', who: 'Sierra', text: 'The long game of sitting on a log.', focus: ['Courtney', 'Sierra'], react: ['Geoff'], act: [{ kind: 'laugh', who: 'Geoff' }] },
  { t: 'line', who: 'Chris', text: 'Gwen! Anybody here playing too hard?', focus: ['Gwen'] },
  { t: 'line', who: 'Gwen', text: 'Somebody’s been telling everyone they’re his best friend. Does that count?', focus: ['Gwen', 'Alejandro'], react: ['Alejandro', 'Geoff'] },
  { t: 'line', who: 'Alejandro', text: 'Making friends is not a crime, Gwen.', focus: ['Gwen', 'Alejandro'] },
  { t: 'line', who: 'Chris', text: 'Ooh! Okay. You’ve all cast your votes in the confession cam. Let’s see what you said.' },
  { t: 'vote', who: 'Alejandro', text: 'Nobody stands on a bench with a hurt ankle. Sorry, princess.',
    side: [{ tab: 'tally', voter: 'Alejandro', target: 'Courtney' }] },
  { t: 'vote', who: 'Gwen', text: 'Two votes isn’t a plan. But it’s my vote, and I’m using it.',
    side: [{ tab: 'tally', voter: 'Gwen', target: 'Alejandro' }] },
  { t: 'vote', who: 'Courtney', text: 'Read my planner? Enjoy reading the inside of a boat.',
    side: [{ tab: 'tally', voter: 'Courtney', target: 'Sierra' }] },
  { t: 'votes', who: ['Geoff', 'Sierra', 'Harold', 'Izzy', 'Noah'], text: 'Geoff, Sierra, Harold, Izzy and Noah cast their votes.',
    side: [{ tab: 'tally', voter: 'Geoff', target: 'Courtney' }, { tab: 'tally', voter: 'Sierra', target: 'Courtney' }, { tab: 'tally', voter: 'Harold', target: 'Courtney' },
           { tab: 'tally', voter: 'Izzy', target: 'Courtney' }, { tab: 'tally', voter: 'Noah', target: 'Alejandro' }] },
  { t: 'line', who: 'Chris', text: 'There are eight of you, and only seven marshmallows on this plate. When I call your name, come and get one.' },
  { t: 'mallow', who: 'Geoff' },
  { t: 'mallow', who: 'Harold' },
  { t: 'mallow', who: 'Izzy' },
  { t: 'mallow', who: 'Gwen' },
  { t: 'mallow', who: 'Noah' },
  { t: 'mallow', who: 'Sierra' },
  { t: 'line', who: 'Chris', text: 'Courtney. Alejandro.', focus: ['Courtney', 'Alejandro'], tense: true },
  { t: 'line', who: 'Chris', text: 'This is the final marshmallow of the evening.', focus: ['Courtney', 'Alejandro'], tense: true },
  { t: 'dir', text: 'Courtney grips the stump. Alejandro doesn’t blink.', focus: ['Courtney', 'Alejandro'], tense: true, act: [{ kind: 'shake', who: 'Courtney' }] },
  { t: 'mallow', who: 'Alejandro', last: true },
  { t: 'line', who: 'Courtney', text: 'What? No. No! I was the only one here with a plan!', focus: ['Courtney'], loud: true, react: ['Sierra', 'Gwen'] },
  { t: 'line', who: 'Chris', text: 'Courtney, the Dock of Shame is that way. The Boat of Losers waits for no one.', focus: ['Courtney'] },
  { t: 'exit', who: 'Courtney', spot: 'exit', clock: '9:31 PM', place: 'The Dock of Shame', text: 'This is a mistake! My lawyers are going to hear about this!', bed: 'none' },
];

const SCREENS = [
  { id: 'td-camp-pre', label: 'Camp · Day 4', venue: 'hosted-camp', steps: CAMP },
  { id: 'td-tribal', label: 'Campfire Ceremony', venue: 'hosted-camp', steps: TRIBAL },
];


// ── staging the mockup adds to the engine's steps: who is busy with what, who sits ──
const STAGING = {
  'dock': { bgAct: { Harold: 'fish' } },
  'mess-hall': { pose: 'sit', bg: ['Owen'], bgAct: { Owen: 'eat' } },
  'cabins': { bgAct: { Gwen: 'read' } },
  'campfire': { pose: 'sit', bg: ['Izzy'], bgAct: { Izzy: 'stretch' } },
};
const SPOT_ICON = {
  dock: '<path d="M2 15h20M5 15v5M10 15v5M14 15v5M19 15v5M4 11l8-6 8 6" stroke="#1a0e02" stroke-width="2.4" fill="none" stroke-linecap="round"/>',

// ══════════════════════════════════════════════════════════════════
// LEDGER — what is true at step N, folded from the steps.
// ══════════════════════════════════════════════════════════════════
function ledgerAt(scr, idx) {

      L.scene = { ...s, ...st, bg: [...(s.bg || []), ...(st.bg || [])] }; L.cut = s.t === 'cut'; L.focus = [...(s.focus || [])]; L.bg = [...L.scene.bg]; L.gone = new Set();

}

const MARKS = {};
async function loadMarks(venue, spot, tod) {
  const k = `${venue}/${spot}-${tod}`;
  if (MARKS[k]) return MARKS[k];
  try { MARKS[k] = await (await fetch(`../assets/sets/td/${k}.json`)).json(); } catch (e) { MARKS[k] = { horizon: .5, marks: [] }; }
  return MARKS[k];
}
const marksOf = (M, kind) => M.marks.filter(m => m.kind === kind);

// choose places for people: speakers up front and apart, the busy ones further back
function placePeople(M, focus, bg, pose) {
  const out = {};
  // the dialogue panel covers the bottom fifth: people stand and sit in the band above it
  const pool = (pose === 'sit' ? marksOf(M, 'seat') : marksOf(M, 'stand')).filter(m => m.u > .12 && m.u < .88 && m.v > .4 && m.v < .75);
  const used = [];
  const far = (a, b) => Math.abs(a.u - b.u) > .15;
  const score = m => m.s - Math.abs(m.u - .5) * .3;
  const front = [...pool].sort((a, b) => score(b) - score(a));
  focus.forEach(n => { const m = front.find(c => !used.includes(c) && used.every(u => far(c, u))); if (m) { used.push(m); out[n] = m; } });
  const backPool = [...marksOf(M, 'stand'), ...marksOf(M, 'seat')].filter(m => m.u > .08 && m.u < .92 && m.v > .2 && m.v < .74).sort((a, b) => a.s - b.s);

  const behind = (c, u) => far(c, u) || u.v - c.v > .07;
  bg.forEach(n => { const m = backPool.find(c => !used.includes(c) && used.every(u => behind(c, u))); if (m) { used.push(m); out[n] = m; } });
  return out;
}

  const tod = L.exit ? 'night' : (L.conf ? 'day' : sc.tod);
  const indoor = ['mess-hall', 'confessional'].includes(spot);
  const M = await loadMarks(venue, spot, tod);

// ══════════════════════════════════════════════════════════════════
// SOUND — the place's ambience, synthesized live (nothing to download),
// built from the same marks the picture moves with; and short effects
// for the moments. Off until the viewer turns it on (browsers block
// audio before a click). Quiet by design: the ambience sits under the
// words, the music beds only play where the moment earns them.
// ══════════════════════════════════════════════════════════════════
const SFX = (() => {
  let ctx = null, master = null, amb = null, key = '', timers = [];

    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
  };
  const noiseBuf = (() => { let b = null; return () => { if (b) return b; b = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate); const d = b.getChannelData(0); let last = 0; for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = i % 2 ? w : last * 3.5; } return b; }; })();
  const noise = () => { const s = ctx.createBufferSource(); s.buffer = noiseBuf(); s.loop = true; s.loopStart = Math.random(); return s; };
  const filt = (type, f, q = .7) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const gain = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const every = (fn, lo, hi) => { let t; const tick = () => { fn(); t = setTimeout(tick, lo + Math.random() * (hi - lo)); timers.push(t); }; t = setTimeout(tick, Math.random() * hi); timers.push(t); };

  const layers = {
    fire(out, n) {     // a roar of filtered noise and the crackle of pops
      const src = noise(), bp = filt('bandpass', 900, .5), g = gain(.05 + .02 * n); src.connect(bp); bp.connect(g); g.connect(out); src.start();
      every(() => { const t = ctx.currentTime; const s = noise(), hp = filt('highpass', 2200), e = gain(0); s.connect(hp); hp.connect(e); e.connect(out); e.gain.setValueAtTime(.18 + Math.random() * .2, t); e.gain.exponentialRampToValueAtTime(.001, t + .03 + Math.random() * .05); s.start(t); s.stop(t + .1); }, 40, 260);
    },
    water(out) {       // waves lapping: low noise swelling and falling

      lfo(g.gain, .16, .05, .07);

    },
    wind(out) {

    },
    birds(out) {       // little chirped phrases from the trees

        for (let i = 0; i < n; i++) { const t = t0 + i * (.09 + Math.random() * .05); const o = ctx.createOscillator(), e = gain(0); o.type = 'sine'; o.connect(e); e.connect(out);
          o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * (1.3 + Math.random() * .4), t + .06); e.gain.linearRampToValueAtTime(.045, t + .01); e.gain.exponentialRampToValueAtTime(.001, t + .08); o.start(t); o.stop(t + .1); } }, 1500, 5000);

    crickets(out) {    // two crickets a little out of step

    },

    },
    crowd(out) {       // the carnival's distant hubbub, kept for other venues
      const src = noise(), bp = filt('bandpass', 700, .8), g = gain(.02); src.connect(bp); bp.connect(g); g.connect(out); src.start(); lfo(g.gain, .4, .008, .02);

  };

    if (kind === 'pop') blast(500, 1100, .09, 'sine', .25);
    if (kind === 'slam') { blast(140, 40, .35, 'sine', .45); hiss(800, .25, .25); }
    if (kind === 'slap') { hiss(1800, .08, .45, 'highpass'); blast(300, 120, .08, 'triangle', .2); }
    if (kind === 'boing') blast(180, 520, .25, 'triangle', .2);
    if (kind === 'title') { blast(90, 45, .6, 'sine', .4); setTimeout(() => hit('whoosh'), 60); }
    if (kind === 'safe') { [660, 880, 1320].forEach((f, i) => setTimeout(() => { const tt = ctx.currentTime; const o = ctx.createOscillator(), e = gain(0); o.frequency.value = f; o.connect(e); e.connect(master); e.gain.linearRampToValueAtTime(.16, tt + .01); e.gain.exponentialRampToValueAtTime(.001, tt + .25); o.start(tt); o.stop(tt + .3); }, i * 90)); }
    if (kind === 'blip') { const o = ctx.createOscillator(), e = gain(0); o.type = 'square'; o.frequency.value = 520 + Math.random() * 60; o.connect(e); e.connect(master); e.gain.linearRampToValueAtTime(.025, t + .004); e.gain.exponentialRampToValueAtTime(.001, t + .035); o.start(t); o.stop(t + .05); }
  }
  return { init, scene, hit, on: () => !!ctx && ctx.state === 'running', resume: () => ctx && ctx.resume(), suspend: () => ctx && ctx.suspend() };
})();

$('classic').onclick = () => alert('Classic view: lands on the same screen. Not wired in the mockup.');
$('sound').onclick = () => { SOUND = !SOUND; $('sndl').textContent = SOUND ? 'Sound on' : 'Sound off'; if (SOUND) { SFX.init(); SFX.resume(); paint(false); } else SFX.suspend(); bedNow = '?'; music(); };
$('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); setAuto(false); next(); } if (e.key === 'ArrowLeft') { setAuto(false); go(IDX - 1, false); } if (e.key === 'i') $('intelBtn').click(); });
const q = new URLSearchParams(location.search);
if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
if (q.get('intel')) $('frame').classList.add('intel-open');
SI = +(q.get('s') || 0); tabsUi();
go(+(q.get('i') || 0), !q.get('i'));
</script>
</body>
</html>
