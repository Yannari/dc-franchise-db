name = "dc-studio"
main = "worker-studio.js"
compatibility_date = "2024-11-01"

# Non-secret config. Edit these for your repo/site.
[vars]
GITHUB_REPO = "Yannari/dc-franchise-db"   # owner/repo that GitHub Pages serves
GITHUB_BRANCH = "main"                      # branch Pages builds from
# Comma-separated. The dev origins are here because gallery uploads happen from
# the player page, and that page is usually open on serve.py while you are
# working. Origin is not the security boundary — every write route checks
# STUDIO_TOKEN, and a browser cannot forge an Origin header anyway.
ALLOWED_ORIGIN = "https://yannari.github.io,http://localhost:8080,http://127.0.0.1:8080"

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put GITHUB_TOKEN     (fine-grained PAT: Contents = Read+Write on this repo)
#   wrangler secret put STUDIO_TOKEN     (a long random string; the frontend must send it)

# D1 database (Step 1 of the D1 learning project). Reach it in the Worker as env.DB.
# Created with: npx wrangler d1 create dc-franchise
[[d1_databases]]
binding = "DB"
database_name = "dc-franchise"
database_id = "e00978c3-52eb-48e2-8e0f-d90fc51b2437"

# The gallery. 592 MB of it, which is what broke GitHub Pages: the published
# site was 778 MB against a 1 GB limit, and 28 of 30 builds were timing out.
# Pages serves the app; R2 serves the pictures.
[[r2_buckets]]
binding = "GALLERY"
bucket_name = "dc-gallery"
