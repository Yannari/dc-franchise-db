<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- THE VILLA, top-down floor plan. North (top) = jungle and the drive in; south (bottom) = the cliff and the sea. -->
  <rect width="1920" height="1080" fill="#5aa957"/>
  <!-- the sea below the cliff -->
  <path d="M0 900 C 300 870, 700 905, 1000 885 C 1300 865, 1650 900, 1920 880 L 1920 1080 L 0 1080 Z" fill="#2aa7cf"/>
  <path d="M0 900 C 300 870, 700 905, 1000 885 C 1300 865, 1650 900, 1920 880" fill="none" stroke="#7d6a5a" stroke-width="22"/>
  <!-- the drive and the jungle path -->
  <path d="M960 0 L 960 120" stroke="#e9c785" stroke-width="60"/>
  <!-- the building -->
  <rect x="360" y="120" width="1200" height="520" fill="#efe7da" stroke="#2a2a2a" stroke-width="10"/>
  <g stroke="#2a2a2a" stroke-width="6" fill="none">
    <line x1="700" y1="120" x2="700" y2="640"/><line x1="1220" y1="120" x2="1220" y2="640"/>
    <line x1="360" y1="380" x2="700" y2="380"/><line x1="1220" y1="330" x2="1560" y2="330"/>
    <line x1="700" y1="260" x2="1220" y2="260"/><line x1="880" y1="120" x2="880" y2="260"/><line x1="1040" y1="120" x2="1040" y2="260"/>
  </g>
  <!-- doors (gaps marked) -->
  <g fill="#efe7da"><rect x="930" y="114" width="60" height="14"/><rect x="694" y="470" width="14" height="60"/><rect x="1214" y="430" width="14" height="60"/>
    <rect x="694" y="200" width="14" height="50"/><rect x="1214" y="200" width="14" height="50"/><rect x="760" y="254" width="60" height="14"/><rect x="1100" y="254" width="60" height="14"/>
    <rect x="820" y="634" width="280" height="14"/></g>
  <!-- furniture hints -->
  <!-- common room: sunken U sofa around the fire pit, TJ's spot on the open side -->
  <path d="M800 330 L 1120 330 L 1120 560 L 1060 560 L 1060 390 L 860 390 L 860 560 L 800 560 Z" fill="#d9542a"/>
  <circle cx="960" cy="480" r="46" fill="#3a3a3a"/><circle cx="960" cy="480" r="28" fill="#ff8a1a"/>
  <circle cx="960" cy="600" r="16" fill="#111"/><text x="985" y="606" font-size="16" fill="#111">TJ</text>
  <!-- kitchen: island and counter -->
  <rect x="1250" y="350" width="280" height="40" fill="#9c9c9c"/><rect x="1310" y="450" width="170" height="70" fill="#cfcfcf" stroke="#555"/>
  <g fill="#ff6a1a"><circle cx="1330" cy="545" r="12"/><circle cx="1370" cy="545" r="12"/><circle cx="1410" cy="545" r="12"/><circle cx="1450" cy="545" r="12"/></g>
  <!-- gym -->
  <rect x="1260" y="150" width="90" height="40" fill="#333"/><rect x="1400" y="150" width="120" height="30" fill="#333"/><rect x="1270" y="240" width="250" height="40" fill="#555"/>
  <!-- bedrooms: bunks -->
  <g fill="#7a5ad8"><rect x="390" y="150" width="70" height="120"/><rect x="480" y="150" width="70" height="120"/><rect x="570" y="150" width="70" height="120"/>
    <rect x="390" y="410" width="70" height="120"/><rect x="480" y="410" width="70" height="120"/><rect x="570" y="410" width="70" height="120"/></g>
  <!-- confessional and bathroom -->
  <rect x="780" y="160" width="40" height="40" fill="#111"/><circle cx="800" cy="215" r="10" fill="#ff6a1a"/>
  <rect x="1080" y="150" width="120" height="60" fill="#bfe3ef"/>
  <!-- pool deck terrace -->
  <rect x="360" y="660" width="1200" height="210" fill="#e6d2a8" stroke="#2a2a2a" stroke-width="6"/>
  <rect x="470" y="770" width="760" height="80" rx="6" fill="#5fd3ea" stroke="#fff" stroke-width="6"/>
  <circle cx="1380" cy="790" r="55" fill="#7fe4f0" stroke="#fff" stroke-width="6"/>
  <g fill="#ffffff"><rect x="480" y="690" width="40" height="60"/><rect x="540" y="690" width="40" height="60"/><rect x="600" y="690" width="40" height="60"/><rect x="660" y="690" width="40" height="60"/></g>
  <rect x="1260" y="680" width="90" height="40" fill="#7a5230"/>
  <!-- labels -->
  <g font-size="24" font-weight="800" fill="#1b1b1b" text-anchor="middle">
    <text x="530" y="335">BUNK ROOM 1</text><text x="530" y="580">BUNK ROOM 2</text>
    <text x="960" y="305">COMMON ROOM</text><text x="960" y="330" font-size="16" font-weight="400">deliberation: the U sofa, the fire pit</text>
    <text x="800" y="245" font-size="18">CONFESSIONAL</text><text x="960" y="200" font-size="18">HALL</text><text x="1140" y="240" font-size="18">BATHROOM</text>
    <text x="1390" y="315">GYM</text><text x="1390" y="420">KITCHEN</text>
    <text x="960" y="98" font-size="20" fill="#fff">FRONT DOOR (from the jungle path)</text>
    <text x="850" y="720">POOL DECK</text><text x="850" y="745" font-size="16" font-weight="400">infinity pool on the cliff edge</text>
    <text x="1380" y="870" font-size="20">HOT TUB</text><text x="1305" y="745" font-size="16">OUTDOOR BAR</text>
    <text x="960" y="980" fill="#fff">THE SEA (Blue Lagoon below)</text>
  </g>
  <text x="40" y="1050" font-size="22" font-weight="700" fill="#fff">THE VILLA — floor plan layout (paint as a blueprint-style illustrated map; no words)</text>
</svg>
