<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Match VP v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Outfit:wght@300;400;600;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   PERFECT MATCH — viewing party, v2 (visual-novel stage)
   The stage plays like the dating game it is: busts that slide in, a
   dialogue box that types, a camera that pushes in on whoever is talking
   with everyone else out of focus, heart-iris wipes between rooms, pops
   for every feeling that moved, toasts for the big moments.
   Scenery is LIGHT, not drawings: sky, bloom, haze, bokeh, leaf shadow,
   embers, beams. Neon script is the only "object".
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --pink:#ff2e88; --hot:#ff4fa0; --coral:#ff7a59; --sun:#ffc15e; --lav:#a78bfa; --teal:#14c8bb;
  --bg:#fff4f8; --bg2:#ffe7f1; --card:#ffffff; --card2:#fff9fb; --ink:#2b1026; --muted:#8a6b80; --line:#f4d6e4;
  --glass:rgba(255,255,255,.78); --glassInk:#2b1026; --glassLine:rgba(255,255,255,.9); --shadow:0 18px 40px rgba(160,40,100,.18);
}
:root[data-theme="dark"]{
  --bg:#12081a; --bg2:#1b0d25; --card:#1f1029; --card2:#261433; --ink:#fbe8f3; --muted:#b596ab; --line:#3a2244;
  --glass:rgba(24,10,34,.72); --glassInk:#fbe8f3; --glassLine:rgba(255,120,190,.35); --shadow:0 18px 40px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12081a; --bg2:#1b0d25; --card:#1f1029; --card2:#261433; --ink:#fbe8f3; --muted:#b596ab; --line:#3a2244;
    --glass:rgba(24,10,34,.72); --glassInk:#fbe8f3; --glassLine:rgba(255,120,190,.35); --shadow:0 18px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg));color:var(--ink);font:15px/1.45 Outfit,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1220px;margin:0 auto;padding:14px 16px 96px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.logo{font:46px/1 Yellowtail,cursive;color:var(--pink);text-shadow:0 0 18px #ff2e8855}
.logo small{display:block;font:600 11px Outfit;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.tabs button,.themeBtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;font:600 13px Outfit;cursor:pointer;transition:all .2s}
.tabs button.on{background:linear-gradient(135deg,var(--coral),var(--pink));border-color:transparent;color:#fff;box-shadow:0 6px 16px #ff2e8855}
.themeBtn{display:flex;align-items:center;gap:6px}
.themeBtn svg{width:16px;height:16px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}

/* ── STAGE ─────────────────────────────────────────────────────────── */
.stage{position:sticky;top:8px;z-index:5;contain:inline-size;min-width:0;max-width:100%;aspect-ratio:16/8.4;
  border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow),0 0 0 1px #ffffff22 inset;background:#000;user-select:none}
.cam{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1);transform-origin:var(--ox,50%) 70%}
.cam.close{transform:scale(1.14)}
.scene{position:absolute;inset:-4%;transition:opacity .6s}

/* scenes are light, not drawings */
.sc-day{background:
  radial-gradient(40% 55% at 72% 34%,#fff8dccc,#ffd89a66 40%,#0000 70%),
  linear-gradient(180deg,#ff9fb0 0%,#ffb99a 32%,#ffd6a8 52%,#9fe6ee 53%,#56c4df 70%,#2c8fc4 100%)}
.sc-terrace{background:
  radial-gradient(60% 50% at 30% 20%,#ffb3d966,#0000 70%),
  linear-gradient(180deg,#4d1d66 0%,#b1407e 45%,#ff8a7a 75%,#ffc39a 100%)}
.sc-night{background:
  radial-gradient(55% 45% at 50% 100%,#ff7a3a99,#ff2e8833 45%,#0000 70%),
  linear-gradient(180deg,#0c0620 0%,#26103f 50%,#4a1747 100%)}
.sc-hut{background:
  radial-gradient(45% 60% at 50% 40%,#ffe6b8,#e0a45c 45%,#6a3a15 100%)}
.sc-casa{background:
  radial-gradient(50% 60% at 75% 30%,#14c8bb55,#0000 70%),radial-gradient(40% 50% at 20% 70%,#a78bfa55,#0000 70%),
  linear-gradient(180deg,#07142c,#132a52 60%,#1b0f3a)}
.sc-final{background:
  radial-gradient(60% 60% at 50% 110%,#ff2e8899,#0000 70%),linear-gradient(180deg,#1a0624,#4b0f45 60%,#8a1e5c)}
.stage .sun{position:absolute;left:66%;top:18%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffbe9,#ffe2a1 45%,#ffc86b00 70%);filter:blur(2px);animation:bloom 6s ease-in-out infinite}
@keyframes bloom{50%{transform:scale(1.08);opacity:.85}}
.stage .shimmer{position:absolute;left:0;right:0;top:53%;bottom:0;background:repeating-linear-gradient(180deg,#ffffff00 0 9px,#ffffff33 9px 10px);
  mask:linear-gradient(180deg,#000,#0000);animation:shim 5s linear infinite;opacity:.6}
@keyframes shim{to{background-position:0 40px}}
.stage .gobo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.32;filter:blur(6px);
  background:
   radial-gradient(18% 5% at 12% 18%,#2b1026 60%,#0000 61%),radial-gradient(22% 5% at 20% 10%,#2b1026 60%,#0000 61%),
   radial-gradient(16% 4% at 6% 30%,#2b1026 60%,#0000 61%),radial-gradient(20% 5% at 90% 12%,#2b1026 60%,#0000 61%),
   radial-gradient(15% 4% at 96% 26%,#2b1026 60%,#0000 61%);
  transform-origin:10% 0;animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.2deg) translateX(1%)}}
.stage .bokeh{position:absolute;inset:0;pointer-events:none}
.stage .bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,#fff0 70%);opacity:.0;filter:blur(1px);animation:bok var(--t) ease-in-out infinite;animation-delay:var(--d)}
@keyframes bok{0%,100%{opacity:0;transform:translateY(8px)}50%{opacity:var(--o);transform:translateY(-8px)}}
.stage .string i{background:radial-gradient(circle,#fff1c9,#ffcf7a55 45%,#fff0 70%)}
.stage .embers i{border-radius:50%;background:#ffb35c;box-shadow:0 0 8px #ff7a3a;opacity:0;animation:ember var(--t) linear infinite;animation-delay:var(--d)}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-260px)}}
.stage .glow{position:absolute;left:50%;bottom:-18%;width:60%;aspect-ratio:2;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,#ffb35ccc,#ff5c3a66 45%,#0000);animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.85;transform:translateX(-50%) scale(1)}40%{opacity:1;transform:translateX(-50%) scale(1.05)}70%{opacity:.75}}
.stage .beams{position:absolute;inset:0;background:
  conic-gradient(from 200deg at 20% -10%,#0000 0 8deg,#ffffff22 10deg 14deg,#0000 16deg 360deg),
  conic-gradient(from 150deg at 80% -10%,#0000 0 8deg,#ffffff22 10deg 14deg,#0000 16deg 360deg);animation:beam 6s ease-in-out infinite alternate}
@keyframes beam{to{filter:hue-rotate(40deg);transform:translateX(2%)}}
.stage .weave{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;background:
  repeating-linear-gradient(45deg,#8a4b1a 0 3px,#0000 3px 9px),repeating-linear-gradient(-45deg,#8a4b1a 0 3px,#0000 3px 9px)}
.stage .vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,#0000 55%,#0008)}
:root[data-theme="light"] .stage .vign{background:radial-gradient(120% 90% at 50% 45%,#0000 60%,#6a1d4a55)}

/* raw, unaired */
.stage.raw .cam{filter:grayscale(.9) contrast(1.15) brightness(.85)}
.stage .grain{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:overlay;background:repeating-radial-gradient(circle at 20% 30%,#fff4 0 1px,#0000 1px 3px)}
.stage.raw .grain{opacity:.8;animation:grain .25s steps(3) infinite}
@keyframes grain{to{transform:translate(3px,-2px)}}

/* busts */
.bust{position:absolute;bottom:27%;width:19%;aspect-ratio:4/5;transform:translate(-50%,6%);transition:left .9s cubic-bezier(.2,1.2,.3,1),transform .7s cubic-bezier(.2,1.3,.3,1),filter .5s,opacity .5s;z-index:3}
.bust .frame{position:absolute;inset:0;border-radius:26px;overflow:hidden;
  box-shadow:0 0 0 3px #ffffffcc,0 20px 40px #0007;background:linear-gradient(160deg,var(--c1,#ffd1e6),var(--c2,#c4a6ff))}
.bust img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.bust .ini{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(24px,5vw,60px) Outfit;color:#fff9}
.bust .frame::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,#0006)}
.bust .rim{position:absolute;inset:-3px;border-radius:28px;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:0 0 0 3px var(--rim,#ffc15e),0 0 38px 10px var(--rim,#ffc15e)}
.bust.speak{z-index:4;filter:none;transform:translate(-50%,0) scale(1.04);animation:breathe 3.2s ease-in-out infinite}
.bust.speak .rim{opacity:.9}
.bust.back{filter:blur(2.5px) brightness(.62) saturate(.8);transform:translate(-50%,10%) scale(.94)}
.bust.hurt{--rim:#ef4444}.bust.hurt .rim{opacity:.9}
.bust.hurt.speak{animation:none}
.bust.off{opacity:0}
.bust.offL{left:-20%!important}.bust.offR{left:120%!important}
@keyframes breathe{50%{transform:translate(-50%,-1%) scale(1.045)}}

/* dialogue box */
.dlg{position:absolute;left:4%;right:4%;bottom:4%;z-index:8;min-height:25%;border-radius:20px;padding:2.6% 3% 2.2%;
  background:var(--glass);color:var(--glassInk);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1.5px solid var(--glassLine);box-shadow:0 14px 34px #0005;transition:transform .45s cubic-bezier(.2,1.3,.3,1),opacity .3s}
.dlg.hide{transform:translateY(130%);opacity:0}
.dlg .plate{position:absolute;left:3%;top:0;transform:translateY(-58%);padding:5px 16px;border-radius:12px;
  font:700 clamp(12px,1.5vw,17px) Outfit;color:#fff;background:linear-gradient(135deg,var(--pc1,#ff7a59),var(--pc2,#ff2e88));box-shadow:0 6px 14px #0004;letter-spacing:.02em}
.dlg .plate em{font-style:normal;font:clamp(10px,1.1vw,12px) 'Bebas Neue';letter-spacing:.18em;opacity:.85;margin-left:8px}
.dlg .txt{font:500 clamp(13px,1.75vw,20px)/1.4 Outfit;min-height:2.8em}
.dlg .txt.narr{font-style:italic;color:inherit}
.dlg .nxt{position:absolute;right:2.4%;bottom:12%;width:14px;height:14px;animation:nudge 1s ease-in-out infinite;opacity:.8}
@keyframes nudge{50%{transform:translateX(4px)}}
.dlg.hut{background:linear-gradient(135deg,#fff7ea,#ffe9cc);color:#3a200c;border-color:#e8b77a}
.dlg.dior .plate{--pc1:#ff8cc6;--pc2:#ff2e88;box-shadow:0 0 0 2px #fff,0 0 22px #ff4fa0aa}
.dlg.narrator .plate{--pc1:#2b2b2b;--pc2:#111;color:var(--sun)}

/* HUD */
.hud{position:absolute;left:3%;top:4%;z-index:9;display:flex;gap:8px;align-items:center}
.hud .pill{background:#0009;color:#fff;border-radius:999px;padding:5px 12px;font:clamp(11px,1.3vw,15px) 'Bebas Neue';letter-spacing:.14em;backdrop-filter:blur(6px)}
.hud .air{display:flex;align-items:center;gap:6px}
.hud .air::before{content:'';width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #f33;animation:blink 1.2s infinite}
.stage.raw .hud .air::before{background:#aaa;box-shadow:none;animation:none}
@keyframes blink{50%{opacity:.25}}
.hud .scissors{display:none}
.stage.raw .hud .scissors{display:inline-flex}
.headline{position:absolute;right:3%;top:4%;z-index:9;max-width:46%;background:var(--glass);color:var(--glassInk);backdrop-filter:blur(8px);
  border-radius:999px;padding:6px 14px;font:700 clamp(11px,1.25vw,14px) Outfit;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;opacity:0;transition:opacity .3s}
.headline.on{opacity:1}

/* neon */
.neon{position:absolute;left:50%;top:22%;z-index:7;transform:translate(-50%,-50%);font:clamp(28px,6.4vw,78px)/1 Yellowtail,cursive;white-space:nowrap;pointer-events:none;color:#fff2;-webkit-text-stroke:1px #fff4}
.neon i{font-style:normal}
.neon.on i{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 4px #fff,0 0 14px var(--glow),0 0 30px var(--glow),0 0 60px var(--glow);animation:buzz 3s infinite}
.neon.on.fresh i{animation:strike .55s both,buzz 3s .7s infinite;animation-delay:calc(var(--k)*65ms),calc(.7s + var(--k)*65ms)}
.neon.dying i{animation:die .4s forwards;animation-delay:calc(var(--k)*150ms)}
.neon.off{opacity:0}
@keyframes strike{0%,30%,50%{opacity:.15}40%,60%,100%{opacity:1}}
@keyframes buzz{0%,92%,100%{opacity:1}94%{opacity:.6}97%{opacity:.8}}
@keyframes die{0%{opacity:1}30%{opacity:.15}45%{opacity:1}100%{opacity:.06;text-shadow:none;color:#fff3}}

/* pops */
.pops{position:absolute;inset:0;z-index:9;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;padding:5px 11px 5px 7px;border-radius:999px;
  font:700 clamp(10px,1.2vw,14px) Outfit;color:#fff;background:linear-gradient(135deg,#ff7a59,#ff2e88);box-shadow:0 8px 18px #0005;white-space:nowrap;
  animation:rise 2.4s cubic-bezier(.2,1,.3,1) forwards;animation-delay:var(--d,0s);opacity:0}
.pop svg{width:1.3em;height:1.3em}
.pop.down{background:linear-gradient(135deg,#6b7280,#374151)}
.pop.red{background:linear-gradient(135deg,#f87171,#b91c1c)}
.pop.gold{background:linear-gradient(135deg,#ffc15e,#ff7a59);color:#3a1600}
.pop.teal{background:linear-gradient(135deg,#2dd4bf,#0e7490)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}25%{transform:translate(-50%,-4px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50px)}}
.stage:not(.fresh) .pop{display:none}

/* toast */
.toast{position:absolute;left:50%;top:40%;z-index:10;transform:translate(-50%,-50%) skewX(-8deg);padding:10px 34px;opacity:0;pointer-events:none;
  font:clamp(20px,3.6vw,44px)/1 'Bebas Neue';letter-spacing:.12em;color:#fff;background:linear-gradient(90deg,#ff2e88,#ff7a59);box-shadow:0 14px 34px #0007;overflow:hidden}
.toast::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,#fff0,#fff9,#fff0);transform:skewX(-20deg)}
.toast.go{animation:toast 2.3s cubic-bezier(.2,1,.3,1) forwards}
.toast.go::after{animation:sheen 1s .35s}
.toast small{display:block;font:600 clamp(9px,1vw,12px) Outfit;letter-spacing:.3em;opacity:.9;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-160%,-50%) skewX(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) skewX(-8deg)}80%{opacity:1;transform:translate(-50%,-50%) skewX(-8deg)}100%{opacity:0;transform:translate(60%,-50%) skewX(-8deg)}}
@keyframes sheen{to{left:130%}}

/* heart iris wipe */
.wipe{position:absolute;inset:0;z-index:11;pointer-events:none;display:grid;place-items:center;opacity:0}
.wipe svg{width:12%;fill:#ff2e88;filter:drop-shadow(0 0 30px #ff2e88)}
.wipe.go{animation:wipeFade 1s ease forwards}
.wipe.go svg{animation:wipeGrow 1s cubic-bezier(.6,0,.4,1) forwards}
@keyframes wipeFade{0%,55%{opacity:1}100%{opacity:0}}
@keyframes wipeGrow{0%{transform:scale(.1)}55%{transform:scale(22)}100%{transform:scale(22)}}

/* phone */
.phone{position:absolute;right:6%;bottom:9%;width:21%;aspect-ratio:9/17;z-index:9;border-radius:26px;background:linear-gradient(145deg,#2a2a2e,#0c0c0e);padding:2.2% 1.6%;
  box-shadow:0 30px 50px #0009,inset 0 0 0 2px #444;transform:translateY(260%) rotate(8deg);visibility:hidden;transition:transform .7s cubic-bezier(.2,1.3,.3,1),visibility 0s .7s}
.phone.up{transform:translateY(0) rotate(-4deg);visibility:visible;transition:transform .7s cubic-bezier(.2,1.3,.3,1)}
.phone.buzz{animation:vib .08s 10}
@keyframes vib{50%{margin-left:4px}}
.phone .scr{height:100%;border-radius:18px;background:linear-gradient(180deg,#ff4fa0,#ff7a59);padding:12% 8%;color:#fff;display:flex;flex-direction:column;gap:7%}
.phone h4{margin:0;font:clamp(14px,2.2vw,26px)/1 'Bebas Neue';letter-spacing:.06em}
.phone p{margin:0;background:#fff;color:#2b1026;border-radius:12px 12px 12px 3px;padding:8%;font:600 clamp(8px,1.05vw,13px)/1.35 Outfit;box-shadow:0 6px 12px #0003}
.phone .tag{font:600 clamp(7px,.9vw,11px) Outfit;opacity:.92}

/* heart rate */
.ecg{position:absolute;left:0;right:0;top:34%;height:22%;z-index:6;opacity:0;pointer-events:none}
.ecg.on{opacity:1}
.ecg polyline{fill:none;stroke:#7dffb0;stroke-width:3;filter:drop-shadow(0 0 6px #7dffb0);stroke-dasharray:1600;stroke-dashoffset:1600}
.stage.fresh .ecg.on polyline{animation:draw 1.8s linear forwards}
.stage:not(.fresh) .ecg.on polyline{stroke-dashoffset:0}
.bpm{position:absolute;right:4%;top:30%;z-index:7;font:clamp(16px,2.6vw,32px) 'Bebas Neue';color:#7dffb0;text-shadow:0 0 10px #7dffb0;opacity:0}
.bpm.on{opacity:1}
@keyframes draw{to{stroke-dashoffset:0}}

/* game cards: ballots, stick/twist */
.deal{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;display:flex;gap:2%;width:72%;justify-content:center;pointer-events:none}
.gc{width:24%;aspect-ratio:5/7;perspective:700px}
.gc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.4,1)}
.gc.flip>div{transform:rotateY(180deg)}
.gc .f,.gc .b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;box-shadow:0 16px 30px #0007;display:grid;place-items:center;overflow:hidden}
.gc .f{background:linear-gradient(135deg,#ff4fa0,#a855f7);border:3px solid #fff}
.gc .f::before{content:'';position:absolute;inset:8%;border:2px solid #fff8;border-radius:10px}
.gc .f svg{width:42%;fill:#fff;filter:drop-shadow(0 4px 8px #0004)}
.gc .b{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,#ffeef6);border:3px solid #fff;color:#2b1026;text-align:center;padding:8%}
.gc .b .who{font:700 clamp(9px,1.2vw,14px) Outfit;color:#8a6b80}
.gc .b .what{font:clamp(18px,3vw,38px)/1 'Bebas Neue';letter-spacing:.04em;color:var(--pink);margin-top:6%}
.gc .b .what.stick{color:#10a36b}.gc .b .what.twist{color:#ff2e88}
.gc .b .face{width:52%;aspect-ratio:1;border-radius:50%;overflow:hidden;margin:0 auto 6%;border:3px solid #ffd1e6;background:#ffd1e6}
.gc .b .face img{width:100%;height:100%;object-fit:cover}
.gc.in{animation:dealIn .6s cubic-bezier(.2,1.3,.3,1) both;animation-delay:var(--dl)}
@keyframes dealIn{from{opacity:0;transform:translateY(-60%) rotate(-12deg)}}

/* vote board */
.board{position:absolute;right:5%;top:15%;width:38%;z-index:8;background:var(--glass);color:var(--glassInk);backdrop-filter:blur(14px);border:1.5px solid var(--glassLine);border-radius:18px;padding:2% 2.6%;box-shadow:0 20px 40px #0006}
.board h5{margin:0 0 2.4%;font:clamp(13px,1.8vw,22px)/1 'Bebas Neue';letter-spacing:.1em;color:var(--pink)}
.board .row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:2.2%;font:700 clamp(9px,1.1vw,13px) Outfit}
.board .bar{grid-column:1/-1;height:clamp(8px,1.2vw,14px);border-radius:99px;background:#ff2e8822;overflow:hidden}
.board .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff7a59,#ff2e88);transition:width 1.3s cubic-bezier(.2,1.2,.3,1)}
.board .row .pc{opacity:0;transition:opacity .4s .7s}
.board .row.shown .pc{opacity:1}
.board .row.win .bar i{background:linear-gradient(90deg,#ffc15e,#ff2e88);box-shadow:0 0 14px #ffc15e}
.board.hide{display:none}
.petals{position:absolute;inset:0;z-index:10;pointer-events:none}
.petals i{position:absolute;left:50%;top:40%;width:2.4%;aspect-ratio:1;opacity:0}
.petals i svg{width:100%;fill:var(--pk,#ff4fa0)}
.stage.fresh .petals.go i{animation:petal 2.8s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--dl)}
@keyframes petal{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.5)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.1)}}

/* the envelope */
.env{position:absolute;left:50%;top:44%;width:26%;z-index:9;transform:translate(-50%,-50%) scale(.5);opacity:0;transition:all .7s cubic-bezier(.2,1.3,.3,1)}
.env.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.env .flap{transform-origin:50% 0;transform-box:fill-box;transition:transform .7s .4s}
.env.open .flap{transform:scaleY(-1)}
.env .card{transform-box:fill-box;transition:transform .9s .9s}
.env.open .card{transform:translateY(-52px)}

/* shake */
.stage.shake .cam{animation:shake .5s}
@keyframes shake{15%,85%{transform:translateX(-4px)}35%,65%{transform:translateX(6px)}50%{transform:translateX(-6px)}}

.rail{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

.card{scroll-margin-top:52vw;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;position:relative;
  animation:pop .45s cubic-bezier(.2,1.4,.3,1);box-shadow:0 4px 14px #a0286410}

.tape{position:absolute;right:10px;top:-9px;transform:rotate(3deg);background:#efe3bf;color:#5a4a1e;font:12px 'Bebas Neue';letter-spacing:.14em;padding:3px 12px;box-shadow:0 2px 4px #0003}

aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;scrollbar-width:thin;padding-bottom:70px}

.map .edge{fill:none;transition:all .6s}

.heat{border-collapse:collapse;font:10.5px Outfit;width:100%}

/* controls */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;
  background:linear-gradient(0deg,var(--bg) 40%,#0000)}

  .ecg{top:30%} .env{width:52%;top:40%}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }

</head>

  S.steps.forEach((st, i) => { if (i <= upto) (st.rel || []).forEach(o => ops.push([o, i === upto])); });
  for (const [[op, a, b, v], isNew] of ops) {
    const key = b ? k(a, b) : a;
    if (isNew) R.fresh.add(op === 'crush' || op === 'crushSet' ? `${a}>${b}` : key);
    if (op === 'couple') { R.couples = R.couples.filter(x => !x.includes(a) && !x.includes(b)); R.couples.push(key); R.flirt = R.flirt.filter(x => x !== key); }
    if (op === 'uncouple') { R.couples = R.couples.filter(x => x !== key); R.strain = R.strain.filter(x => x !== key); R.warm = R.warm.filter(x => x !== key); }
    if (op === 'crush') R.crush[`${a}>${b}`] = Math.max(R.crush[`${a}>${b}`] || 0, v);
    if (op === 'crushSet') R.crush[`${a}>${b}`] = v;
    if (op === 'flirt' && !R.flirt.includes(key)) R.flirt.push(key);
    if (op === 'reveal') R.flirt = R.flirt.filter(x => x !== key);
    if (op === 'rival' && !R.rival.includes(key)) R.rival.push(key);
    if (op === 'strain' && !R.strain.includes(key)) R.strain.push(key);
    if (op === 'warm') { R.strain = R.strain.filter(x => x !== key); if (!R.warm.includes(key)) R.warm.push(key); }
    if (op === 'leave') { R.gone.add(a); R.couples = R.couples.filter(x => !x.split('|').includes(a)); }
    if (op === 'arrive') R.away.delete(a);
  }
  return R;
}

// ── The relationship store: one record per DIRECTION (A>B is not B>A).
// r romance 0-10 · f friendship -10..10 · s what A SHOWS · t what B THINKS A feels.
// Crush ops from the heart-map data write here too, so there is one store.
function dimsAt(S, upto) {
  const D = {};
  const put = (key, patch) => { const cur = D[key] || { r: 0, f: 0 }; D[key] = { ...cur, ...patch }; };
  for (const [k, v] of Object.entries(S.D || {})) put(k, v);
  const ops = [...S.rel];
  S.steps.forEach((st, i) => {
    if (i > upto) return;
    (st.rel || []).forEach(o => ops.push(o));
    for (const [k, v] of Object.entries(st.d || {})) put(k, v);
  });
  for (const [op, a, b, v] of ops) {
    if (op === 'crush') put(`${a}>${b}`, { r: Math.max(D[`${a}>${b}`]?.r || 0, v * 3) });
    if (op === 'crushSet') put(`${a}>${b}`, { r: v * 3 });
  }
  for (const rec of Object.values(D)) { if (rec.s == null) rec.s = rec.r; if (rec.t == null) rec.t = rec.s; }
  return D;
}
const dim = (D, a, b) => D[`${a}>${b}`] || { r: 0, f: 0, s: 0, t: 0 };

/* The label is NARRATION, so thresholds are fine here (CLAUDE.md). It reads
   the truth both ways, what is shown, and whether the pair is coupled. */
function relLabel(D, R, a, b) {
  const me = dim(D, a, b), them = dim(D, b, a);
  const coupled = R.couples.includes([a, b].sort().join('|'));
  if (me.s - me.r >= 4 && me.r <= 3) return ['fake', 'Faking it'];
  if (coupled) {
    if (me.r >= 7 && them.r >= 7) return ['love', 'Head over heels'];
    if (me.r >= 6 && them.r <= 3) return ['alone', 'All in — alone'];
    if (me.r <= 3 && them.r >= 6) return ['surv', 'Not feeling it'];
    if (me.r <= 3 && them.r <= 3) return ['surv', 'Couple for survival'];
    return ['love', 'Coupled'];
  }
  if (me.r >= 6 && me.s <= 2) return ['hidden', 'Hidden crush'];
  if (me.r >= 6 && me.f <= -2) return ['mixed', "Fancies, can't stand"];
  if (me.r >= 6 && them.r >= 6) return ['crush', 'Mutual spark'];
  if (me.r >= 5) return ['crush', 'One-way crush'];
  if (me.r <= 1 && me.f >= 5 && them.r >= 6) return ['zone', 'Friend-zoning'];
  if (me.f <= -5) return ['rival', 'Can\'t stand'];
  if (me.f >= 6 && me.r <= 1) return ['friend', 'Just friends'];
  return null;
}

function drawMap(S, R) {
  const D = dimsAt(S, idx);
  const names = S.cast, n = names.length, cx = 140, cy = 132, rad = 104;
  const P = Object.fromEntries(names.map((nm, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [nm, [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]];
  }));
  const live = nm => !R.gone.has(nm) && !R.away.has(nm);
  const edge = (a, b, cls, extra = '', bend = 0, marker = '') => {
    const [x1, y1] = P[a], [x2, y2] = P[b];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
    const qx = mx + (-dy / len) * bend + (cx - mx) * .18, qy = my + (dx / len) * bend + (cy - my) * .18;
    // stop short of the node so arrowheads show
    const sx = x1 + dx / len * 16, sy = y1 + dy / len * 16, ex = x2 - dx / len * 18, ey = y2 - dy / len * 18;
    return `<path class="edge ${cls}" data-a="${a}" data-b="${b}" ${extra} d="M${sx} ${sy} Q${qx} ${qy} ${ex} ${ey}" ${marker}/>`;
  };
  let e = '';
  for (const key of R.rival) { const [a, b] = key.split('|'); if (live(a) && live(b)) e += edge(a, b, 'rival' + (R.fresh.has(key) ? ' new' : ''), '', 0); }
  for (const [ab, rec] of Object.entries(D)) {
    const [a, b] = ab.split('>'); if (!live(a) || !live(b) || rec.r < 5) continue;
    if (!S.cast.includes(a) || !S.cast.includes(b)) continue;
    if (R.couples.includes([a, b].sort().join('|'))) continue;
    const hidden = rec.s <= 2 ? ' style-hidden' : '';
    e += edge(a, b, 'crush' + hidden + (R.fresh.has(ab) ? ' new' : ''), `style="--w:${.6 + rec.r * .32};${rec.s <= 2 ? 'stroke:#a855f7;stroke-dasharray:2 3' : ''}"`, 14, 'marker-end="url(#arr)"');
  }
  for (const key of R.flirt) { const [a, b] = key.split('|'); if (live(a) && live(b)) e += edge(a, b, 'flirt' + (R.fresh.has(key) ? ' new' : ''), '', -10); }
  for (const key of R.couples) {
    const [a, b] = key.split('|'); if (!live(a) || !live(b)) continue;
    const cls = R.strain.includes(key) ? 'strained' : 'couple';
    e += edge(a, b, cls + (R.fresh.has(key) ? ' new' : ''), '', 0);
    const [x1, y1] = P[a], [x2, y2] = P[b], mx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * .09, my = (y1 + y2) / 2 + (cy - (y1 + y2) / 2) * .09;
    e += `<path d="${HEART}" transform="translate(${mx} ${my}) scale(.5)" fill="${cls === 'strained' ? '#f59e0b' : '#ff2e88'}" stroke="#fff" stroke-width="2">${R.warm.includes(key) ? '<animateTransform attributeName="transform" type="scale" additive="sum" values="1;1.35;1;1.2;1" dur="1.2s" repeatCount="indefinite"/>' : ''}</path>`;
  }
  const nodes = names.map((nm, i) => {
    const [x, y] = P[nm], id = 'c' + i;
    const cls = (R.gone.has(nm) ? 'gone' : R.away.has(nm) ? 'gone' : '') + (nm === sel ? ' sel' : '');
    return `<g class="node ${cls}" data-n="${nm}"><clipPath id="${id}"><circle cx="${x}" cy="${y}" r="14"/></clipPath>
      <circle cx="${x}" cy="${y}" r="14" fill="${(COLOR[nm] || ['#ffd1e6'])[0]}"/>
      ${src(nm) ? `<image href="${src(nm)}" x="${x - 14}" y="${y - 14}" width="28" height="28" clip-path="url(#${id})" preserveAspectRatio="xMidYMid slice"/>` : `<text x="${x}" y="${y + 3.5}" style="font-weight:800;fill:#fff">${ini(nm)}</text>`}
      <circle class="ring" cx="${x}" cy="${y}" r="14"/><text x="${x}" y="${y + (y > cy ? 27 : -19)}">${nm}</text></g>`;
  }).join('');
  document.getElementById('map').innerHTML = `<svg class="map" viewBox="0 0 280 270"><defs>
    <linearGradient id="gCouple" x1="0" x2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4fa0"/></marker></defs>${e}${nodes}</svg>`;

  // Focus: with somebody picked, everything that is not theirs fades.
  const svg = document.querySelector('#map svg');
  if (sel && S.cast.includes(sel)) svg.querySelectorAll('path.edge').forEach(p => {
    if (p.dataset.a !== sel && p.dataset.b !== sel) p.classList.add('faded');
  });
  svg.querySelectorAll('.node').forEach(g => g.onclick = () => { sel = g.dataset.n; renderAside(); });
  renderRel(S, R, D);
}

// ── The relationship viewer: one islander, everybody they have a story with.
const EYE = '<svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>';
const MASK = '<svg viewBox="0 0 24 24"><path d="M2 7c4-2 16-2 20 0-1 7-4 10-6 10-2 0-3-3-4-3s-2 3-4 3c-2 0-5-3-6-10z" fill="currentColor"/><circle cx="8" cy="10" r="1.6" fill="#fff"/><circle cx="16" cy="10" r="1.6" fill="#fff"/></svg>';
function renderRel(S, R, D) {
  const names = S.cast.filter(n => n !== 'Dior');
  if (!sel || !names.includes(sel)) sel = names[0];
  document.getElementById('picker').innerHTML = names.map(n =>
    `<button class="${n === sel ? 'on' : ''} ${R.gone.has(n) || R.away.has(n) ? 'gone' : ''}" data-n="${n}" title="${n}">${mini(n)}</button>`).join('');
  document.querySelectorAll('#picker button').forEach(b => b.onclick = () => { sel = b.dataset.n; renderAside(); });
  const X = sel;
  const bars = (rec) => `<div class="bar2 rom"><i style="width:${rec.r * 10}%"></i>${rec.s !== rec.r ? `<span class="ghost" style="left:calc(${rec.s * 10}% - 1px)" title="shows"></span>` : ''}</div>
    <div class="bar2 fr"><i style="${rec.f >= 0 ? `left:50%;width:${rec.f * 5}%;background:#14b8a6` : `left:${50 + rec.f * 5}%;width:${-rec.f * 5}%;background:#ef4444`}"></i></div>`;
  const others = names.filter(n => n !== X).map(Y => {
    const out = dim(D, X, Y), inc = dim(D, Y, X);
    const known = D[`${X}>${Y}`] || D[`${Y}>${X}`];
    const coupled = R.couples.includes([X, Y].sort().join('|'));
    const weight = (coupled ? 100 : 0) + out.r * 3 + inc.r * 2 + Math.abs(out.f) + Math.abs(inc.f);
    return { Y, out, inc, known, coupled, weight };
  }).filter(o => o.known).sort((a, b) => b.weight - a.weight);
  const coupledWith = names.find(n => R.couples.includes([X, n].sort().join('|')));
  const rows = others.map(({ Y, out, inc }) => {
    const lab = relLabel(D, R, X, Y), back = relLabel(D, R, Y, X);
    const notes = [];
    if (out.s !== out.r && Math.abs(out.s - out.r) >= 3) notes.push(`<div class="belief shows">${MASK}<span>${X} <b>shows</b> ${out.s}/10 romance to ${Y} — really feels ${out.r}.</span></div>`);
    if (Math.abs(inc.t - inc.r) >= 3) notes.push(`<div class="belief thinks">${EYE}<span>${X} <b>believes</b> ${Y} is at ${inc.t}/10 — really ${inc.r}.</span></div>`);
    if (Math.abs(out.t - out.r) >= 3 && out.t !== out.s) notes.push(`<div class="belief thinks">${EYE}<span>${Y} <b>believes</b> ${X} is at ${out.t}/10 — really ${out.r}.</span></div>`);
    else if (Math.abs(out.t - out.r) >= 3) notes.push(`<div class="belief thinks">${EYE}<span>${Y} <b>believes</b> ${X} is at ${out.t}/10.</span></div>`);
    return `<div class="rrow"><div class="top">${mini(Y)}<b>${Y}</b>
      ${lab ? `<span class="tagx ${lab[0]}" title="${X} → ${Y}">${lab[1]}</span>` : ''}
      ${back && (!lab || back[1] !== lab[1]) ? `<span class="tagx ${back[0]}" style="opacity:.75" title="${Y} → ${X}">${Y}: ${back[1]}</span>` : ''}</div>
      <div class="dirh"><span></span><span>Romance</span><span>Friendship</span></div>
      <div class="dir"><span class="lbl">${X} →</span>${bars(out)}</div>
      <div class="dir"><span class="lbl">← ${Y}</span>${bars(inc)}</div>${notes.join('')}</div>`;
  }).join('');
  document.getElementById('rel').innerHTML = `<div class="relhead">${mini(X)}<div><b>${X}</b>
    <span>${R.gone.has(X) ? 'Dumped' : coupledWith ? `Coupled with ${coupledWith}` : 'Single'} · ${others.length} people with a story</span></div></div>
    ${rows || '<p class="rest">Nobody yet.</p>'}<p class="rest">Everyone else: acquaintances.</p>`;
}

// ══════════════════════════════════════════════════════════════════════
// The stage

let cur = 'villa', idx = -1, typing = null, sel = null;
// The Debug tab reports on the last screen you were watching, at your last click.
let watched = { screen: 'villa', idx: -1 };
const $ = s => document.querySelector(s);
const stage = $('#stage');

function sceneHtml(bg) {
  const rnd = (i, m) => ((i * 9301 + 49297) % 233280) / 233280 * m;
  const bokeh = (n, cls, y0, y1, size) => `<div class="bokeh ${cls}">${Array.from({ length: n }, (_, i) =>
    `<i style="left:${rnd(i + 1, 100).toFixed(1)}%;top:${(y0 + rnd(i + 7, y1 - y0)).toFixed(1)}%;width:${(size * (0.5 + rnd(i + 3, 1))).toFixed(1)}%;aspect-ratio:1;--o:${(.3 + rnd(i + 5, .6)).toFixed(2)};--t:${(4 + rnd(i + 2, 5)).toFixed(1)}s;--d:${(-rnd(i + 4, 6)).toFixed(1)}s"></i>`).join('')}</div>`;
  const string = y => `<div class="bokeh string">${Array.from({ length: 16 }, (_, i) => {
    const t = i / 15, sag = Math.sin(t * Math.PI) * 9;
    return `<i style="left:${(t * 100).toFixed(1)}%;top:${(y + sag).toFixed(1)}%;width:2.2%;aspect-ratio:1;--o:.9;--t:${(2 + (i % 3)).toFixed(1)}s;--d:-${(i % 4) * .5}s"></i>`; }).join('')}</div>`;
  const embers = `<div class="bokeh embers">${Array.from({ length: 22 }, (_, i) =>
    `<i style="left:${(38 + rnd(i + 1, 24)).toFixed(1)}%;bottom:4%;width:${(.4 + rnd(i + 2, .5)).toFixed(2)}%;aspect-ratio:1;--x:${(rnd(i + 3, 80) - 40).toFixed(0)}px;--t:${(2.4 + rnd(i + 4, 2.4)).toFixed(1)}s;--d:-${rnd(i + 5, 4).toFixed(1)}s"></i>`).join('')}</div>`;
  const inner = {
    day: `<div class="sun"></div><div class="shimmer"></div>${bokeh(14, '', 5, 50, 5)}${string(6)}`,
    terrace: `${bokeh(26, 'string', 4, 60, 4)}`,
    night: `${bokeh(18, '', 2, 40, 1.6)}<div class="glow"></div>${embers}${string(5)}`,
    hut: `<div class="weave"></div>${bokeh(8, 'string', 10, 50, 6)}`,
    casa: `${bokeh(24, '', 5, 80, 3)}`,
    final: `<div class="beams"></div>${bokeh(20, 'string', 5, 70, 3)}`,
  }[bg] || '';
  return `<div class="scene sc-${bg}">${inner}</div>`;
}

function buildStage(S, st) {

  stage.innerHTML = `<div class="cam">${sceneHtml(st?.bg || 'day')}<div class="busts"></div></div>
    <div class="vign"></div><div class="grain"></div>

    <svg class="env" viewBox="0 0 200 150"><g class="card"><rect x="30" y="24" width="140" height="92" rx="8" fill="#fffdf7" stroke="#ff2e88" stroke-width="3"/>

function paintStage(S, i, fresh, prevBg) {
  const st = S.steps[i];
  buildStage(S, st);
  if (!st) return;
  stage.classList.toggle('fresh', !!fresh);
  stage.classList.toggle('raw', !!st.raw);
  stage.querySelector('.airtxt').textContent = st.raw ? 'Unaired footage' : 'On air';
  if (fresh && prevBg && prevBg !== st.bg) { const w = stage.querySelector('.wipe'); w.classList.add('go'); }

  // busts
  const speaker = (st.cast.find(c => c[2] === 'speak') || st.cast[0] || [])[0];
  const b = stage.querySelector('.busts');
  b.innerHTML = st.cast.map(([n, x, mode]) => {
    const [c1, c2] = COLOR[n] || ['#ffd1e6', '#c4a6ff'];
    const cls = ['bust', mode === 'speak' ? 'speak' : '', mode === 'back' ? 'back' : '', mode === 'hurt' ? 'hurt back' : '',
      /off/.test(mode) && !fresh ? 'off ' + mode : ''].join(' ');
    return `<div class="${cls}" data-n="${n}" style="left:${fresh && mode !== 'offR' && mode !== 'offL' ? (x < 50 ? -15 : x > 50 ? 115 : x) : x}%;--c1:${c1};--c2:${c2}">
      <div class="frame">${img(n) || `<div class="ini">${ini(n)}</div>`}</div><div class="rim"></div></div>`;
  }).join('');
  // slide in (fresh), or slide out for exits
  if (fresh) requestAnimationFrame(() => requestAnimationFrame(() => {
    st.cast.forEach(([n, x, mode]) => { const el = b.querySelector(`[data-n="${n}"]`); el.style.left = x + '%';
      if (/off/.test(mode)) setTimeout(() => el.classList.add('off', mode), 1300); });
  }));
  // camera
  const cam = stage.querySelector('.cam');
  const sp = st.cast.find(c => c[0] === speaker);
  cam.style.setProperty('--ox', (sp ? sp[1] : 50) + '%');
  if (st.close) { if (fresh) setTimeout(() => cam.classList.add('close'), 250); else cam.classList.add('close'); }
  if (st.fx?.shake && fresh) setTimeout(() => stage.classList.add('shake'), 350);

  // dialogue
  const [who, text, kind] = st.say || [];
  const dlg = stage.querySelector('.dlg');
  if (who) {
    dlg.classList.remove('hide');
    dlg.classList.toggle('dior', kind === 'dior'); dlg.classList.toggle('narrator', kind === 'narrator'); dlg.classList.toggle('hut', kind === 'hut');
    const [c1, c2] = COLOR[who] || ['#ff7a59', '#ff2e88'];
    const plate = dlg.querySelector('.plate');
    plate.style.setProperty('--pc1', c1); plate.style.setProperty('--pc2', c2);
    plate.innerHTML = `${who}${kind === 'hut' ? '<em>Beach hut</em>' : kind === 'narrator' ? '<em>Voiceover</em>' : kind === 'dior' ? '<em>Host</em>' : kind === 'text' ? '<em>Text</em>' : ''}`;
    const t = dlg.querySelector('.txt'); t.classList.toggle('narr', kind === 'narrator');
    clearInterval(typing);
    if (fresh) { let k = 0; t.textContent = ''; typing = setInterval(() => { t.textContent = text.slice(0, ++k); if (k >= text.length) clearInterval(typing); }, 18); }
    else t.textContent = text;
  }

  // neon
  const nn = stage.querySelector('#neon');
  const ne = st.fx?.neon || st.fx?.neonDie;
  if (ne) {
    nn.style.setProperty('--glow', ne[1]);
    nn.innerHTML = [...ne[0]].map((ch, k) => `<i style="--k:${k}">${ch === ' ' ? '&nbsp;' : ch}</i>`).join('');
    nn.className = 'neon on' + (fresh ? ' fresh' : '') + (st.fx.neonDie && fresh ? ' dying' : '') + (st.fx.neonDie && !fresh ? ' off' : '');
    if (st.fx.neonDie && fresh) { nn.className = 'neon on'; setTimeout(() => nn.classList.add('dying'), 900); }
  }
  // text phone
  if (st.fx?.phone) {
    const [to, msg, tag] = st.fx.phone, p = stage.querySelector('.phone');
    p.querySelector('.tag').textContent = `To: ${to}`; p.querySelector('p').textContent = msg; p.querySelector('.tag.h').textContent = tag;
    if (fresh) setTimeout(() => { p.classList.add('up'); p.classList.add('buzz'); }, 300); else p.classList.add('up');
  }
  // heart rate
  if (st.fx?.ecg) {
    const [n, bpm] = st.fx.ecg, pts = [];
    for (let x = 0; x <= 1000; x += 8) { const t = x % 160; const spike = x > 520;
      pts.push(`${x},${t === 80 ? (spike ? 2 : 22) : t === 88 ? (spike ? 98 : 80) : t === 72 ? 64 : 55 + Math.sin(x / 11) * 2}`); }
    stage.querySelector('.ecg polyline').setAttribute('points', pts.join(' '));
    stage.querySelector('.ecg').classList.add('on');
    const el = stage.querySelector('.bpm'); el.textContent = `${n} · ${bpm} bpm`; el.classList.add('on');
  }
  // cards dealt: ballots, or one stick/twist
  const deal = stage.querySelector('.deal');
  const cards = st.fx?.deal ? st.fx.deal.map(([v, t]) => ({ who: `${v} voted`, face: t, what: t, cls: '' }))
    : st.fx?.deal1 ? [{ who: st.fx.deal1[0], face: st.fx.deal1[0], what: st.fx.deal1[1].toUpperCase(), cls: st.fx.deal1[1] }] : [];
  if (cards.length) {
    deal.innerHTML = cards.map((c, k) => `<div class="gc ${fresh ? 'in' : 'flip'}" style="--dl:${k * 180}ms"><div><div class="f">${IC.heart}</div>
      <div class="b"><div><div class="face">${img(c.face) || ''}</div><div class="who">${c.who}</div><div class="what ${c.cls}">${c.what}</div></div></div></div></div>`).join('');
    if (fresh) deal.querySelectorAll('.gc').forEach((el, k) => setTimeout(() => el.classList.add('flip'), 900 + k * 520));
  }
  // vote board
  if (st.fx?.board != null) {
    const bd = stage.querySelector('.board'); bd.classList.remove('hide');
    const rows = [...bd.querySelectorAll('.row')], n = st.fx.board;
    const show = () => rows.forEach((r, k) => { const on = k < n; r.classList.toggle('shown', on); r.classList.toggle('win', on && k === rows.length - 1);
      r.querySelector('i').style.width = on ? S.board[k][1] * 1.9 + '%' : '0'; });
    const prev = () => rows.forEach((r, k) => { const on = k < n - 1; r.classList.toggle('shown', on); r.querySelector('i').style.width = on ? S.board[k][1] * 1.9 + '%' : '0'; });
    if (fresh) { prev(); setTimeout(show, 400); } else show();
  }
  if (st.fx?.env) { const e = stage.querySelector('.env'); e.classList.add('on'); if (fresh) setTimeout(() => e.classList.add('open'), 300); else e.classList.add('open'); }
  if (st.fx?.petals && fresh) setTimeout(() => stage.querySelector('.petals').classList.add('go'), 500);
  if (st.fx?.toast && fresh) {
    const t = stage.querySelector('.toast'); t.innerHTML = `${st.fx.toast[1]}<small>${st.fx.toast[0]}</small>`; setTimeout(() => t.classList.add('go'), 600);
  }
  // pops rise from the busts they belong to
  if (fresh && st.pops) {
    stage.querySelector('.pops').innerHTML = st.pops.map(([n, t, style = '', icon = 'heartW'], k) => {
      const c = st.cast.find(x => x[0] === n); const x = c ? c[1] : 50;
      return `<div class="pop ${style === 'heart' ? '' : style}" style="left:${x}%;top:${22 + (k % 2) * 8}%;--d:${.7 + k * .35}s">${IC[icon] || IC.heartW}${t}</div>`;
    }).join('');
  }
  const hl = stage.querySelector('.headline'); hl.textContent = st.card.k; hl.classList.add('on');
}

// ══════════════════════════════════════════════════════════════════════
// Transcript, rail, heart map, debug, controls
// ══════════════════════════════════════════════════════════════════════
function labelOf(a) {
  if (a >= 60) return ['ff', 'Fan favourite']; if (a >= 25) return ['loved', 'Loved']; if (a >= 5) return ['liked', 'Liked'];
  if (a >= -5) return ['invisible', 'Invisible']; if (a >= -25) return ['divisive', 'Divisive']; if (a >= -60) return ['disliked', 'Disliked'];
  return ['villain', 'Villain'];
}
function moodAt(screen = cur, at = idx) {
  const order = Object.keys(SCREENS), m = { ...MOOD0 }, air = {};
  for (const key of order) {
    const steps = SCREENS[key].steps;
    const upto = key === screen ? at : order.indexOf(key) < order.indexOf(screen) ? steps.length - 1 : -1;
    for (let k = 0; k <= upto; k++) {
      for (const [n, d] of Object.entries(steps[k].mood || {})) m[n] = (m[n] ?? 0) + d * 1.6;
      if (!steps[k].raw) for (const [n] of steps[k].cast) air[n] = (air[n] || 0) + 1;
    }
  }
  return { m, air };
}
// ── THE DEBUG SCREEN: its own tab, like the other shows' debug screens.
// It reports on the screen you were last watching, at your last click.
function renderDebugScreen() {
  const S = SCREENS[watched.screen], at = watched.idx, R = relAt(S, at), D = dimsAt(S, at), { m, air } = moodAt(watched.screen, at);
  const names = [...S.cast].filter(n => n !== 'Dior').sort();
  const mood = names.map(n => {
    const a = Math.max(-100, Math.min(100, m[n] ?? 0)), [c, l] = labelOf(a);
    return `<div class="mrow ${R.gone.has(n) ? 'gone' : ''}">${mini(n)}<div><div class="nm"><span>${n}</span><span class="lab ${c}">${l} · ${Math.round(a)}</span></div>
      <div class="gauge"><i style="left:${a >= 0 ? 50 : 50 + a / 2}%;width:${Math.abs(a) / 2}%;background:${a >= 0 ? 'linear-gradient(90deg,#ff7a59,#ff2e88)' : 'linear-gradient(90deg,#7f1d1d,#f87171)'}"></i></div></div></div>`; }).join('');
  const max = Math.max(1, ...Object.values(air));
  const airRows = names.map(n => `<div class="mrow">${mini(n)}<div><div class="nm"><span>${n}</span><span>${air[n] || 0} scenes</span></div>
      <div class="gauge"><i style="left:0;width:${100 * (air[n] || 0) / max}%;background:linear-gradient(90deg,#ffc15e,#ff7a59)"></i></div></div></div>`).join('');
  const heat = (key, colour) => `<table class="heat"><tr><th></th>${names.map(n => `<th class="rot"><span>${n}</span></th>`).join('')}</tr>
    ${names.map(a => `<tr><th style="text-align:right">${a}</th>${names.map(b => {
      if (a === b) return '<td class="self"></td>';
      const v = dim(D, a, b)[key];
      return `<td style="background:${colour(v)}" title="${a} → ${b}: ${v}">${v || ''}</td>`; }).join('')}</tr>`).join('')}</table>`;
  const rom = v => v ? `rgba(255,46,136,${.15 + v / 11})` : 'transparent';
  const fr = v => v > 0 ? `rgba(20,184,166,${.15 + v / 11})` : v < 0 ? `rgba(239,68,68,${.15 - v / 11})` : 'transparent';
  $('#debugScreen').innerHTML = `
    <div class="panel wide"><h3>Debug · ${S.tab} · ${at >= 0 ? `after click ${at + 1}` : 'at rest'}</h3><p class="note">Engine numbers. The islanders never see any of this, and the public sees only the first two.</p></div>
    <div class="panel"><h3>Public mood</h3><p class="note">Approval from aired footage only.</p>${mood}</div>
    <div class="panel"><h3>Airtime</h3><p class="note">Aired scenes so far.</p>${airRows}</div>
    <div class="panel wide"><h3>Romance · row feels for column</h3><p class="note">One-way: read across a row for what that islander feels.</p>${heat('r', rom)}</div>
    <div class="panel wide"><h3>Friendship · row feels for column</h3>${heat('f', fr)}</div>`;
}
function cardHtml(st, i) {
  const S = SCREENS[cur], c = st.card;
  const revealed = S.steps.some((x, j) => j <= idx && x.reveals === i);
  const who = st.say ? st.say[0] : '';
  return `<div class="card ${c.cls || ''} ${c.big ? 'big' : ''} ${c.unaired && !revealed ? 'unaired' : ''}" id="card-${i}">
    <div class="fx">${st.cast.map(x => mini(x[0])).join('')}</div>
    <div><div class="k">${c.k}</div><p>${who && !['Narrator'].includes(who) && st.say[2] !== 'text' ? `<span class="who">${who}:</span> ` : ''}${st.say ? st.say[1].replace(/^I GOT A TEXT!$/, c.t) : c.t}</p></div>
    ${c.unaired ? `<div class="tape ${revealed ? 'revealed' : ''}">${revealed ? 'Aired later' : "Didn't air · " + c.secret}</div>` : ''}</div>`;
}
function renderRail() {
  const S = SCREENS[cur];
  if (!S.phases) { $('#rail').innerHTML = ''; return; }
  const at = idx >= 0 ? S.steps[idx].phase : -1;
  $('#rail').innerHTML = S.phases.map((p, i) => `<span class="${i === at ? 'on' : i < at ? 'done' : ''}">${i + 1}. ${p}</span>`).join('');
}
let lastBg = null;
function renderAside() { const S = SCREENS[cur === 'debug' ? watched.screen : cur]; drawMap(S, relAt(S, cur === 'debug' ? watched.idx : idx)); }
function paint(fresh) {
  const isDebug = cur === 'debug';
  $('#debugScreen').hidden = !isDebug;
  ['#stage', '#rail', '#cards'].forEach(s => { $(s).hidden = isDebug; });
  document.querySelector('.controls').style.visibility = isDebug ? 'hidden' : '';
  if (isDebug) { renderDebugScreen(); renderAside(); return; }
  watched = { screen: cur, idx };
  const S = SCREENS[cur], y = window.scrollY;
  if (idx < 0) { buildStage(S, { bg: S.steps[0].bg }); const hl = stage.querySelector('.headline'); hl.textContent = S.sub; hl.classList.add('on'); }
  else paintStage(S, idx, fresh, lastBg);
  lastBg = idx >= 0 ? S.steps[idx].bg : null;
  $('#cards').innerHTML = `<div class="card"><div class="fx">${mini('Dior')}</div><div><div class="k">${S.tab} · ${S.hud}</div><p>${S.sub}</p></div></div>`
    + S.steps.slice(0, idx + 1).map(cardHtml).join('');
  if (fresh) { const sp = S.steps[idx]?.cast.find(c => c[2] === 'speak'); if (sp && sp[0] !== 'Dior' && S.cast.includes(sp[0])) sel = sp[0]; }
  renderRail(); renderAside();
  $('#count').textContent = `${Math.max(0, idx + 1)} / ${S.steps.length}`;
  window.scrollTo(0, y);
  if (fresh) document.getElementById(`card-${idx}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function tabs() {
  $('#tabs').innerHTML = Object.entries(SCREENS).map(([k, s]) => `<button data-k="${k}" class="${k === cur ? 'on' : ''}">${s.tab}</button>`).join('')
    + `<button data-k="debug" class="${cur === 'debug' ? 'on' : ''}" style="border-style:dashed">Debug</button>`;
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; cur = k; if (k !== 'debug') { idx = -1; lastBg = null; } tabs(); paint(false); });
}
function theme(set) {
  const root = document.documentElement;
  const dark = set ?? !(root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'dark' : 'light';
  try { localStorage.setItem('pm-theme', root.dataset.theme); } catch {}
  $('#theme').innerHTML = dark ? `${IC.sun} Light` : `${IC.moon} Dark`;
}
$('#theme').onclick = () => theme();
try { const t = localStorage.getItem('pm-theme'); if (t) theme(t === 'dark'); else theme(matchMedia('(prefers-color-scheme: dark)').matches); } catch { theme(false); }
$('#next').onclick = () => { if (cur !== 'debug' && idx < SCREENS[cur].steps.length - 1) { idx++; paint(true); } };
$('#all').onclick = () => { if (cur === 'debug') return; idx = SCREENS[cur].steps.length - 1; paint(false); };
$('#reset').onclick = () => { idx = -1; lastBg = null; paint(false); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); $('#next').click(); } });
window.step = k => { lastBg = k > 0 ? SCREENS[cur].steps[k - 1].bg : null; idx = k; paint(true); };
window.show = k => { cur = k; idx = -1; lastBg = null; tabs(); paint(false); };
window.theme = theme;
tabs(); paint(false);
</script>
</body>
</html>
