<!doctype html>
<html lang="en" data-root=".">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Social — Birdie &amp; ChatAlumni</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
  /* ══════════════════════════════════════════════════════════════════
     TWO PRODUCTS, ONE ROUTE.

     Birdie and ChatAlumni deliberately share no surface colour, no type
     scale, no row rhythm and no engagement vocabulary. A green-buttoned
     copy of the same feed would read as one app with a filter, which is
     the whole thing this page is trying not to be.

       Birdie      paper white / slate ink / one sky action / tomato red
                   dense, individually addressable, contested
       ChatAlumni  cream / bottle green authority / warm gold live
                   roomy, clustered, conversational, no ratios

     The wordmarks are original: an abstract wing-and-speech-mark for
     Birdie, a struck stage-mic bar for ChatAlumni. No borrowed brand.
     ══════════════════════════════════════════════════════════════════ */

  .soc-wrap{ max-width:1260px; margin:0 auto; padding:0 16px 80px; }

  /* ── app switcher + context ─────────────────────────────────────── */
  .soc-top{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:16px 0 12px;
  }
  .soc-switch{
    display:inline-flex; padding:4px; gap:4px; border-radius:999px;
    background:var(--panel2,rgba(255,255,255,.06));
    border:1px solid var(--stroke,rgba(255,255,255,.14));
  }
  .soc-switch button{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    padding:9px 18px; border-radius:999px; border:1px solid transparent;
    background:none; color:var(--muted,#bdb4c7); font:inherit; font-weight:700;
    font-size:14.5px; min-height:44px;
  }
  .soc-switch button[aria-pressed="true"]{ color:#fff; }
  .soc-switch button.b[aria-pressed="true"]{ background:#1c7ed6; }
  .soc-switch button.c[aria-pressed="true"]{ background:#12261c; color:#f6efdc; }
  .soc-switch button:focus-visible{ outline:3px solid #ffb020; outline-offset:2px; }

  .soc-ctx{
    display:inline-flex; align-items:center; gap:9px; padding:7px 14px;
    border-radius:999px; font-size:12.5px; font-weight:800; letter-spacing:.06em;
    text-transform:uppercase; border:1px solid var(--stroke); background:var(--panel2);
    color:var(--muted);
  }
  .soc-pickers{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; min-width:0; }
  .soc-pickers select{
    min-height:44px; padding:8px 12px; border-radius:10px; font:inherit; font-size:14px;
    /* A season title can be long. Without a min-width of 0 a flex select refuses
       to shrink below its content and pushes the page sideways on a phone. */
    min-width:0; max-width:100%; text-overflow:ellipsis;
    background:var(--panel2,#1a1620); color:var(--text,#f4f1f7);
    border:1px solid var(--stroke,rgba(255,255,255,.16));
  }
  .conn{
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid currentColor;
  }
  .conn .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; }
  .conn[data-state="LIVE"]{ color:#e5484d; }
  .conn[data-state="REPLAY"]{ color:#ffb020; }
  .conn[data-state="CAUGHT UP"]{ color:#5fbf7f; }
  .conn[data-state="PRESEASON"]{ color:#8b9dc3; }
  .conn[data-state="ARCHIVE"]{ color:#9b8bb4; }

  /* ── the three-column shell ─────────────────────────────────────── */
  .soc-shell{ display:grid; grid-template-columns:200px minmax(0,1fr) 300px; gap:22px; align-items:start; }
  @media(max-width:1100px){ .soc-shell{ grid-template-columns:180px minmax(0,1fr); } .soc-rail-right{ display:none; } }
  @media(max-width:860px){ .soc-shell{ grid-template-columns:minmax(0,1fr); } .soc-rail-left{ display:none; } }

  .soc-rail-left nav{ position:sticky; top:16px; display:flex; flex-direction:column; gap:4px; }
  .soc-rail-left a, .soc-rail-left button{
    display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:12px;
    text-decoration:none; font-weight:700; font-size:15px; min-height:44px; cursor:pointer;
    border:1px solid transparent; background:none; color:var(--muted); font-family:inherit; text-align:left;
  }
  .soc-rail-left button[aria-current="page"]{ color:var(--text); background:var(--panel); border-color:var(--stroke); }
  .soc-rail-right{ position:sticky; top:16px; display:flex; flex-direction:column; gap:16px; }

  /* the reading column never changes width when a rail appears */
  .soc-main{ min-width:0; max-width:680px; }

  .panel-card{
    border:1px solid var(--stroke); border-radius:16px; background:var(--panel);
    padding:16px 18px;
  }
  .panel-card h2{ font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; margin:0 0 12px; color:var(--muted); }

  /* ══ BIRDIE ═══════════════════════════════════════════════════════ */
  .birdie{
    --paper:#ffffff; --ink:#15181c; --quiet:#5b6570; --line:#e3e7ec;
    --sky:#1c7ed6; --tomato:#e5484d; --chip:#f2f5f8;
    background:var(--paper); color:var(--ink);
    border:1px solid var(--line); border-radius:18px; overflow:hidden;
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media(prefers-color-scheme:dark){
    .birdie{ --paper:#16181c; --ink:#eef1f5; --quiet:#9aa4b0; --line:#2a2f36; --chip:#1e2228; }
  }
  .birdie-head{
    position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line); padding:12px 18px 0;
  }
  .birdie-mark{ display:flex; align-items:center; gap:10px; font-weight:900; font-size:19px; letter-spacing:-.02em; }
  .birdie-mark svg{ width:26px; height:26px; }
  .b-tabs{ display:flex; gap:2px; margin-top:12px; }
  .b-tabs button{
    flex:1; min-height:46px; padding:12px 6px; border:0; background:none; cursor:pointer;
    font:inherit; font-weight:700; font-size:14.5px; color:var(--quiet);
    border-bottom:3px solid transparent;
  }
  .b-tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--sky); }
  .b-tabs button:focus-visible{ outline:3px solid var(--sky); outline-offset:-3px; }

  .post{
    display:grid; grid-template-columns:48px minmax(0,1fr); gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .post.is-reply{ padding-left:34px; }
  .post.is-new{ animation:slideIn .28s ease-out; }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:none;} }
  .post:target, .post.is-focus{ background:rgba(28,126,214,.07); }
  .avatar{
    width:48px; height:48px; border-radius:50%; object-fit:cover; background:var(--chip);
    display:grid; place-items:center; font-weight:800; font-size:16px; color:var(--quiet);
    border:1px solid var(--line);
  }
  .post-head{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; font-size:14.5px; }
  .post-name{ font-weight:800; color:var(--ink); text-decoration:none; }
  .post-handle, .post-time{ color:var(--quiet); font-size:13.5px; }
  .post-body{ margin:3px 0 8px; font-size:15.5px; line-height:1.45; overflow-wrap:anywhere; }
  .mention{ color:var(--sky); text-decoration:none; font-weight:600; }
  .mention:hover{ text-decoration:underline; }
  .replying{ font-size:13px; color:var(--quiet); margin-bottom:3px; }
  .post-ctx{ font-size:12px; color:var(--quiet); letter-spacing:.04em; text-transform:uppercase; margin-bottom:7px; }
  .acts{ display:flex; gap:20px; align-items:center; }
  .act{
    display:inline-flex; align-items:center; gap:7px; background:none; border:0; cursor:pointer;
    color:var(--quiet); font:inherit; font-size:13.5px; padding:6px 4px; border-radius:8px;
    min-height:38px; font-variant-numeric:tabular-nums;
  }
  .act:hover{ color:var(--sky); }
  .act.tom:hover, .act.tom[aria-pressed="true"]{ color:var(--tomato); }
  .act.like[aria-pressed="true"]{ color:var(--sky); }
  .act svg{ width:17px; height:17px; }
  /* A recurring account wears its reach. Strangers show nothing — an account
     with 40 followers announcing them is not what a small account looks like. */
  .reach{
    font-size:11.5px; font-weight:800; letter-spacing:.02em; padding:1px 7px;
    border-radius:999px; background:var(--chip); color:var(--quiet);
    border:1px solid var(--line); font-variant-numeric:tabular-nums;
  }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); }
  .chip{
    min-height:38px; padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit;
    font-size:13.5px; font-weight:700; border:1px solid var(--line); background:var(--chip);
    color:var(--ink);
  }
  .chip[aria-pressed="true"]{ background:var(--sky); border-color:var(--sky); color:#fff; }
  .thread-head{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    border-bottom:1px solid var(--line); font-size:13.5px; color:var(--quiet);
  }
  .thread-head button{
    min-height:40px; padding:8px 14px; border-radius:10px; cursor:pointer; font:inherit;
    font-weight:700; border:1px solid var(--line); background:none; color:var(--ink);
  }
  .persona-card{ padding:14px 18px; border-bottom:1px solid var(--line); background:var(--chip); }
  .persona-top{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .follow{
    min-height:40px; padding:9px 18px; border-radius:999px; cursor:pointer; font:inherit;
    font-weight:700; border:1px solid var(--sky); background:none; color:var(--sky);
  }
  .follow[aria-pressed="true"]{ background:var(--sky); color:#fff; }
  .featured{
    font-size:10.5px; font-weight:900; letter-spacing:.09em; padding:3px 8px; border-radius:6px;
    border:1px solid var(--sky); color:var(--sky); text-transform:uppercase;
  }

  /* ══ CHATALUMNI ═══════════════════════════════════════════════════ */
  .chat{
    --cream:#f7f2e6; --inkc:#1d2320; --bottle:#12452f; --gold:#b8862b; --linec:#e0d7c2;
    background:var(--cream); color:var(--inkc);
    border:1px solid var(--linec); border-radius:18px; overflow:hidden;
    font-family:"Georgia","Iowan Old Style",serif;
  }
  @media(prefers-color-scheme:dark){
    .chat{ --cream:#171c19; --inkc:#eee7d6; --linec:#2b332d; --bottle:#3f9c72; }
  }
  .chat-head{
    position:sticky; top:0; z-index:5; background:var(--bottle); color:#f6efdc;
    padding:14px 20px;
  }
  .chat-mark{ display:flex; align-items:center; gap:11px; font-weight:700; font-size:19px; letter-spacing:.02em; }
  .chat-mark svg{ width:24px; height:24px; }
  .chat-sub{ font-size:13px; opacity:.85; margin-top:3px; font-family:system-ui,sans-serif; }
  .c-tabs{ display:flex; gap:8px; padding:10px 20px; background:rgba(0,0,0,.06); border-bottom:1px solid var(--linec); flex-wrap:wrap; }
  .c-tabs button{
    min-height:44px; padding:9px 16px; border-radius:999px; border:1px solid transparent; cursor:pointer;
    background:none; font:inherit; font-size:14px; font-weight:600; color:var(--inkc); opacity:.7;
    font-family:system-ui,sans-serif;
  }
  .c-tabs button[aria-selected="true"]{ opacity:1; background:var(--bottle); color:#f6efdc; }
  .pinned{
    display:flex; gap:9px; align-items:center; padding:10px 20px; font-size:13.5px;
    background:rgba(184,134,43,.14); border-bottom:1px solid var(--linec);
    font-family:system-ui,sans-serif;
  }
  .pinned b{ color:var(--gold); letter-spacing:.06em; font-size:11.5px; text-transform:uppercase; }

  .msg{ display:grid; grid-template-columns:56px minmax(0,1fr); gap:14px; padding:16px 20px 12px; }
  .msg.clustered{ padding-top:2px; }
  .msg.clustered .msg-avatar, .msg.clustered .msg-head{ visibility:hidden; height:0; overflow:hidden; }
  .msg-avatar{ width:56px; height:56px; border-radius:12px; object-fit:cover; border:2px solid var(--bottle); background:var(--cream); display:grid; place-items:center; font-weight:700; }
  .msg-head{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .msg-name{ font-weight:700; font-size:17px; color:var(--inkc); text-decoration:none; }
  .msg-stars{ color:var(--gold); font-size:12px; letter-spacing:.08em; }
  .msg-time{ font-size:12.5px; opacity:.55; font-family:system-ui,sans-serif; }
  .visiting{
    font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    border:1px solid var(--gold); color:var(--gold); border-radius:5px; padding:2px 7px;
    font-family:system-ui,sans-serif;
  }
  .msg-body{ font-size:16.5px; line-height:1.55; margin:5px 0 9px; }
  .msg-foot{ display:flex; gap:18px; align-items:center; font-size:13px; font-family:system-ui,sans-serif; opacity:.8; flex-wrap:wrap; }
  .msg-foot button{ background:none; border:0; cursor:pointer; font:inherit; color:inherit; min-height:38px; display:inline-flex; align-items:center; gap:6px; }
  .host-replied{ color:var(--bottle); font-weight:700; letter-spacing:.05em; font-size:11.5px; text-transform:uppercase; }
  .comments{ border-left:2px solid var(--linec); margin:8px 0 0; padding:2px 0 2px 14px; display:flex; flex-direction:column; gap:6px; }
  .comment{ font-size:14px; font-family:system-ui,sans-serif; }
  .comment b{ opacity:.65; font-weight:600; }
  .divider{
    display:flex; align-items:center; gap:12px; padding:10px 20px; font-size:11.5px;
    letter-spacing:.1em; text-transform:uppercase; opacity:.6; font-family:system-ui,sans-serif;
  }
  .divider::before,.divider::after{ content:""; height:1px; background:var(--linec); flex:1; }

  /* ── host directory ─────────────────────────────────────────────── */
  .hostrow{
    display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center;
    padding:11px 20px; border-bottom:1px solid var(--linec);
  }
  .hostrow .avatar{ width:44px; height:44px; border-radius:10px; }
  .hostrow .h-name{ font-weight:700; font-size:15.5px; }
  .hostrow .h-meta{ font-size:12.5px; opacity:.7; font-family:system-ui,sans-serif; }

  /* ── new items pill, watch clock, states ────────────────────────── */
  /* A `hidden` element must actually hide. `.newpill{display:block}` outranks the
     browser's own [hidden]{display:none}, so without this rule the pill sat there
     empty and permanently visible — announcing arrivals that had not happened. */
  .newpill[hidden]{ display:none; }
  .newpill{
    position:sticky; top:64px; z-index:6; display:block; margin:0 auto; transform:translateY(-8px);
    padding:10px 20px; border-radius:999px; border:0; cursor:pointer; min-height:44px;
    background:#1c7ed6; color:#fff; font:inherit; font-weight:700; font-size:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.3); animation:pillIn .3s ease-out;
  }
  .newpill.c{ background:#12452f; color:#f6efdc; }
  @keyframes pillIn{ from{ opacity:0; transform:translateY(-16px);} to{ opacity:1; transform:translateY(-8px);} }

  .clock{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 16px;
    border-bottom:1px solid currentColor; background:rgba(127,127,127,.07);
  }
  .clock .time{ margin-right:auto; }
  .clock progress{ order:99; flex:1 1 100%; }
  .clock button{
    min-height:44px; padding:8px 13px; border-radius:10px; cursor:pointer; font:inherit;
    font-weight:700; font-size:13.5px; border:1px solid currentColor; background:none;
    color:inherit; opacity:.75;
  }
  .clock button[aria-pressed="true"]{ opacity:1; background:currentColor; }
  .clock button[aria-pressed="true"] { color:inherit; }
  .birdie .clock button[aria-pressed="true"]{ background:var(--sky); border-color:var(--sky); color:#fff; }
  .chat .clock button[aria-pressed="true"]{ background:var(--bottle); border-color:var(--bottle); color:#f6efdc; }
  .clock .time{ font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; }
  .clock progress{ flex:1; min-width:120px; height:8px; }

  /* ── the scrubber ──
     A <progress> looks like this and cannot be touched, so the bar showed
     where the episode was and gave no way to go anywhere else. A range input
     is the same picture with a handle on it. Full width on its own row, and a
     target big enough for a thumb. */
  .clock .clock-scrub{
    order:99; flex:1 1 100%; width:100%; margin:2px 0 0; height:26px;
    -webkit-appearance:none; appearance:none; background:none; cursor:pointer;
  }
  .clock .clock-scrub::-webkit-slider-runnable-track{
    height:8px; border-radius:99px; background:rgba(127,127,127,.35);
  }
  .clock .clock-scrub::-moz-range-track{
    height:8px; border-radius:99px; background:rgba(127,127,127,.35);
  }
  .clock .clock-scrub::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:20px; height:20px; margin-top:-6px;
    border-radius:50%; background:currentColor; border:2px solid rgba(255,255,255,.85);
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .clock .clock-scrub::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:currentColor;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .birdie .clock .clock-scrub{ color:var(--sky); }
  .chat .clock .clock-scrub{ color:var(--bottle); }
  .clock .clock-scrub:focus-visible{ outline:2px solid currentColor; outline-offset:4px; }

  /* ── what a reply is answering ──
     "Replying to @somebody" was dead text, so a reply named a post the reader
     had no way to reach. The handle is a link now, and the post being answered
     is drawn above the reply, short enough that the reply stays the card you
     are reading. */
  .replying a{ color:inherit; font-weight:700; text-decoration:none; border-bottom:1px solid currentColor; }
  .replying a:hover{ opacity:.75; }
  /* THE PARENT SITS ABOVE THE REPLY, which is how a timeline shows a
     conversation: the post being answered, a line joining the two, then the
     answer. It had been a card BELOW the handle, which is where a QUOTE goes —
     two different relationships drawn the same way, so neither read as itself.
     Spans both grid columns and comes first in the source, so the reading order
     and the visual order are the same one. */
  .parent{
    grid-column:1 / -1; display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px;
    align-items:start; margin:-2px 0 10px; padding:8px 10px; cursor:pointer;
    border:1px solid rgba(127,127,127,.3); border-radius:12px;
    background:rgba(127,127,127,.05); font-size:13px; line-height:1.45; position:relative;
  }
  /* The thread line. Short, and it stops at the reply's avatar. */
  .parent::after{
    content:''; position:absolute; left:26px; top:100%; width:2px; height:10px;
    background:rgba(127,127,127,.35);
  }
  .parent:hover{ background:rgba(127,127,127,.11); }
  .parent:focus-visible{ outline:2px solid currentColor; outline-offset:2px; }
  .avatar.sm{ width:32px; height:32px; font-size:13px; }
  .parent-who{ display:block; font-weight:700; margin-bottom:2px; }
  .parent-who i{ font-style:normal; font-weight:400; opacity:.7; }
  .parent-text{ display:block; opacity:.85; }

  /* Where the batch the pill released stops. */
  .newmark{
    margin:0; padding:8px 18px; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--quiet); background:rgba(127,127,127,.06);
    border-bottom:1px solid var(--line); border-top:1px solid var(--line);
  }
  .post.is-new{ border-left:3px solid var(--sky); }

  .persona-btns{ display:flex; gap:8px; align-items:center; }
  .pclose{
    min-height:40px; min-width:40px; border-radius:999px; cursor:pointer; font:inherit;
    font-size:22px; line-height:1; border:1px solid var(--line); background:none; color:var(--quiet);
  }
  .pclose:hover{ color:var(--ink); background:rgba(127,127,127,.12); }

  .state-card{ padding:36px 26px; text-align:center; }
  .state-card h2{ font-size:24px; margin:0 0 10px; letter-spacing:-.01em; text-transform:none; color:inherit; }
  .state-card p{ margin:0 auto 14px; max-width:46ch; line-height:1.55; opacity:.85; }
  .state-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .state-actions a, .state-actions button{
    min-height:44px; display:inline-flex; align-items:center; padding:11px 20px; border-radius:12px;
    border:1px solid var(--stroke); background:var(--panel2); color:var(--text); cursor:pointer;
    text-decoration:none; font:inherit; font-weight:700;
  }

  .loadmore{
    display:block; width:100%; min-height:52px; margin:0; padding:16px; cursor:pointer;
    border:0; border-top:1px solid currentColor; background:none; color:inherit;
    font:inherit; font-weight:700; opacity:.75;
  }

  /* trends + pulse */
  .trend{ display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--stroke); align-items:baseline; }
  .trend:last-child{ border-bottom:0; }
  .trend .n{ font-weight:800; opacity:.4; font-variant-numeric:tabular-nums; }
  .trend .t{ flex:1; font-weight:700; font-size:14px; }
  .trend .c{ font-size:12px; opacity:.6; font-variant-numeric:tabular-nums; }
  .pulse-row{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; font-size:13.5px; }
  .pulse-row .lab{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.55; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media(prefers-reduced-motion:reduce){
    .post.is-new, .newpill{ animation:none; }
    *{ scroll-behavior:auto !important; }
  }
  @media(max-width:860px){
    .soc-main{ max-width:none; }
    .soc-pickers{ margin-left:0; width:100%; }
    .soc-pickers select{ flex:1 1 140px; }
    .birdie, .chat{ border-radius:0; border-left:0; border-right:0; margin:0 -16px; }
    .post{ padding:13px 16px; }
    .msg{ padding:14px 16px 10px; }
  }
  
  /* Dramagram in the app switcher. It is a link, not a toggle, so it never
     shows a pressed state — and it carries its own warm accent rather than
     borrowing Birdie's sky or ChatAlumni's bottle green. */
  .soc-switch .d{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    padding:9px 15px; border-radius:2px; font-weight:700; font-size:14px;
    color:#ff7a4d; border:1px solid rgba(255,122,77,.35); background:transparent;
  }
  .soc-switch .d:hover{ background:rgba(255,122,77,.10); border-color:#ff7a4d; }
</style>
</head>

           feed engine. -->
      <a class="d" id="pick-gram" href="dramagram.html">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
        Dramagram
      </a>
      <!-- Fourth app, same rule as Dramagram: all-time scope means a LINK to

      <a class="d" id="pick-kristal" href="kristal.html">
