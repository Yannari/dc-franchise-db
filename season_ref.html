<!-- The page script below is a classic script, so it cannot import. This pair
     hands it js/shows.js — the sole registry — rather than letting it grow a
     second idea of what a season reference means. -->
<script>
window._showsReady = new Promise(resolve => { window._showsResolve = resolve; });
</script>
<script type="module">
  import { parseSeasonRef, seasonId, DEFAULT_FORMAT } from './js/shows.js';
  window.shows = { parseSeasonRef, seasonId, DEFAULT_FORMAT };
  /* The wiki tab is an ARTICLE, and the site already has an article
     stylesheet — the one the character pages use. Borrowing it rather than
     writing a second one is the whole reason the two read as the same
     encyclopaedia rather than as a dashboard with a wiki-shaped tab in it. */
  import { WIKI_CSS } from './js/wiki-view.js';
  const wkStyle = document.createElement('style');
  wkStyle.textContent = WIKI_CSS;
  document.head.appendChild(wkStyle);
  window._showsResolve(window.shows);
</script>

<script>
/* The registry is handed to this classic script as a narrow surface; these are
   the display names it needs and nothing more. */
const SHOW_NAMES={'total-drama':'Total Drama','big-brother':'Big Brother'};
const SEASON_COLORS=['#60a5fa','#a78bfa','#34d399','#f59e0b','#fb923c','#f472b6','#38bdf8','#fbbf24','#e879f9'];

function slugify(n){return(n||'').toLowerCase().replace(/[^a-z0-9]/g,'-');}
function plink(name,ps){const s=ps||slugify(name);return `<a href="player.html?player=${s}" style="color:var(--sc);font-weight:700">${name}</a>`;}
function phaseClass(p){if(!p)return'pre-merge';const lp=p.toLowerCase();if(lp==='winner')return'winner';if(lp==='finalist')return'finalist';if(lp.includes('juror'))return'juror';return'pre-merge';}


function buildAwardHighlights(awards){
  if(!awards)return'';
  const PICKS=[
    {key:'fanFavorite',    label:'⭐ Fan Favorite'},
    {key:'bestStrategic',  label:'🧠 Best Strategic'},
    {key:'seasonMVP',      label:'👑 Season MVP'},
    {key:'bestPhysical',   label:'💪 Best Physical'},
    {key:'biggestVillain', label:'😈 Biggest Villain'},
    {key:'bestUnderdog',   label:'🔥 Best Underdog'},
    {key:'mostChaotic',    label:'🌀 Most Chaotic'},
    {key:'ironPerson',     label:'🛡️ Iron Person'},
  ];
  return PICKS.map(({key,label})=>{
    const a=awards[key];if(!a)return'';
    const name=a.name||'';if(!name)return'';
    const ps=a.playerSlug||slugify(name);
    const desc=a.description||a.desc||'';
    return`<div class="sr-hl-card">
      <div class="sr-hl-label">${label}</div>
      <div class="sr-hl-row">
        <div class="sr-hl-av">
          <img src="assets/avatars/${ps}.png" onload="this.style.display='block';this.parentElement.querySelector('span').style.display='none'" onerror="this.style.display='none'"/>
          <span>${name.substring(0,2).toUpperCase()}</span>
        </div>
        <div>
          <div class="sr-hl-name">${plink(name,ps)}</div>
          ${desc?`<div class="sr-hl-desc">${desc}</div>`:''}
        </div>
      </div>
    </div>`;
  }).filter(Boolean).join('');
}

function buildRecords(season){
  const st=season.statistics;if(!st)return'';
  const records=[];
  if(st.challengeWins?.mostTotal){const r=st.challengeWins.mostTotal;records.push({label:'Most Ch. Wins',val:r.wins,sub:r.name});}
  if(st.challengeWins?.mostImmunity){const r=st.challengeWins.mostImmunity;records.push({label:'Most Immunity',val:r.wins,sub:r.name});}
  if(st.challengeWins?.longestStreak){const r=st.challengeWins.longestStreak;records.push({label:'Longest Streak',val:r.wins,sub:r.note||r.name});}
  if(st.socialGame?.fewestVotes){const r=Array.isArray(st.socialGame.fewestVotes)?st.socialGame.fewestVotes[0]:st.socialGame.fewestVotes;records.push({label:'Fewest Votes',val:r.votes+' votes',sub:r.name+(r.note?' ('+r.note+')':'')});}
  if(st.socialGame?.mostVotes){const r=st.socialGame.mostVotes;records.push({label:'Most Votes Against',val:r.votes+' votes',sub:r.name});}
  if(st.socialGame?.mostJuryVotes){const r=st.socialGame.mostJuryVotes;records.push({label:'Most Jury Votes',val:r.votes,sub:r.name});}
  if(st.extreme?.closestFinale)records.push({label:'Finale Vote',val:st.extreme.closestFinale,sub:'Final Tribal'});
  if(st.strategic?.longestIdolHold){const r=st.strategic.longestIdolHold;records.push({label:'Longest Idol Hold',val:r.tribals+' tribals',sub:r.name});}
  if(st.extreme?.tieVotes)records.push({label:'Tie Votes',val:st.extreme.tieVotes,sub:'This season'});
  if(st.extreme?.rockDraws)records.push({label:'Rock Draws',val:st.extreme.rockDraws,sub:'Tiebreaker'});
  if(!records.length)return'';
  return`<div class="sr-sh sr-reveal"><h2>Season Records</h2></div>
  <div class="sr-records sr-reveal">${records.map(r=>`<div class="sr-record"><div class="sr-record-lbl">${r.label}</div><div class="sr-record-val">${r.val}</div><div class="sr-record-sub">${r.sub}</div></div>`).join('')}</div>`;
}

(async function(){
  try{
    /* The registry is an enhancement, not a dependency: on file://, or if the
       module 404s, browsers never run it and waiting forever would turn a
       missing nicety into a page that never loads. Without it only bare
       numbers resolve — which is Total Drama, which is what every bookmarked
       link on this site already means. */
    await Promise.race([
      window._showsReady,
      new Promise(resolve=>setTimeout(()=>resolve(null),3000)),
    ]);

    const raw=new URLSearchParams(window.location.search).get('season');
    const shows=window.shows||null;
    const ref=shows
      ? shows.parseSeasonRef(raw)
      : (/^\d+$/.test(String(raw||'').trim()) && Number(raw)>0 ? {format:null,number:Number(raw)} : null);
    if(!ref){document.getElementById('season-content').innerHTML='<div class="hero"><h1>⚠️ No Season Specified</h1><p><a href="seasons.html">← Back to Seasons</a></p></div>';return;}

    const sn=ref.number;
    /* Total Drama keeps the bare filename its fourteen files already use;
       every other show is namespaced by seasonId, exactly as the publish path
       writes them. */
    const isDefault=!shows||ref.format===shows.DEFAULT_FORMAT;
    const file=isDefault?'season'+sn+'-data.json':shows.seasonId(ref.format,sn)+'-data.json';
    /* Links onward carry the same reference they arrived on. */
    const seasonRef=isDefault?String(sn):shows.seasonId(ref.format,sn);

    const resp=await fetch('data/seasons/'+file);
    if(!resp.ok)throw new Error('Season '+sn+' data not found');
    const s=await resp.json();

    // The air window lives on the season's ROW, not in its document — one home
    // for the calendar, so the two cannot drift. Optional: a page that cannot
    // reach the database still renders, just without a date.
    try {
      const db = await fetch('seasons_database.json').then(r => r.ok ? r.json() : null);
      // Matched on the ID and on the number+format, because the reference this
      // page travels on is the BARE number for Total Drama ("12") while the
      // database keys everything as "td-12". Comparing only the id found
      // nothing and the date silently never appeared.
      const rows = db?.seasons || [];
      window.__seasonRow = rows.find(x => x.seasonId === seasonRef)
        || rows.find(x => Number(x.seasonNumber) === Number(sn)
          && (x.format || shows.DEFAULT_FORMAT) === (ref.format || shows.DEFAULT_FORMAT))
        || null;
    } catch { window.__seasonRow = null; }

    /* What this season is CALLED. A bare "S1" titles Big Brother 1 as though it
       were Total Drama's premiere — the same number naming two different
       seasons, on the page whose whole job is to be about one of them. Total
       Drama keeps the bare form every bookmark and heading already uses. */
    const isDefaultShow = !ref.format || ref.format === shows.DEFAULT_FORMAT;
    const showPrefix = isDefaultShow ? 'S' : shows.seasonId(ref.format, sn).split('-')[0].toUpperCase();
    const seasonLabel = isDefaultShow ? `Season ${sn}` : `${SHOW_NAMES[ref.format] || ref.format} ${sn}`;
    document.title = showPrefix + sn + ' — ' + s.title;
    document.getElementById('footer-sub').textContent=s.title+' • '+s.castSize+' players';

    // [AI_FILL] IS A PLACEHOLDER, NOT A VALUE.
    //
    // The export writes it into fields the writer has not filled yet, and every
    // other reader in the project strips it — this page did not, so a season
    // whose emoji had never been written rendered the literal string
    // "[AI_FILL]" in its own headline.
    function _emoji(v) {
      return (!v || v === '[AI_FILL]') ? '📺' : v;
    }
    // When it aired. The season documents do not carry the calendar — it lives
    // on the row in seasons_database.json — so this reads whichever the page
    // was handed and says nothing when neither has it.
    function _aired(sn) {
      const y = sn.airYear || (window.__seasonRow && window.__seasonRow.airYear);
      const slot = sn.airSlot || (window.__seasonRow && window.__seasonRow.airSlot);
      if (!y || !slot) return '';
      const L = { winter: 'Winter', spring: 'Spring', summer: 'Summer', fall: 'Fall' };
      return L[String(slot).toLowerCase()] ? `${L[String(slot).toLowerCase()]} ${y}` : '';
    }

    const sc=SEASON_COLORS[(sn-1)%SEASON_COLORS.length];
    document.documentElement.style.setProperty('--sc',sc);
    document.documentElement.style.setProperty('--sc-glow',sc+'44');

    // Hero
    const heroHTML=`<div class="sr-hero">
      <div class="sr-hero-photo" id="sr-hero-photo"></div>
      <div class="sr-hero-overlay"></div>
      <div class="sr-hero-body">
        <div class="sr-hero-snum">${_emoji(s.emoji)} &nbsp; ${seasonLabel} <span style="opacity:.4">•</span> <span style="opacity:.6">${s.status||'Complete'}</span>${
          _aired(s) ? ` <span style="opacity:.4">•</span> <span style="opacity:.6">${_aired(s)}</span>` : ''}</div>
        <h1 class="sr-hero-title">${s.title}</h1>
        <p class="sr-hero-sub">${s.subtitle||''}</p>
        <div class="sr-hero-pills">
          <span class="sr-pill accent">🏆 ${s.winner.name}</span>
          <span class="sr-pill">👥 ${s.castSize} players</span>
          <span class="sr-pill">📺 ${s.episodeCount} episodes</span>
          ${s.winner.vote?`<span class="sr-pill">🗳️ ${s.winner.vote}</span>`:''}
        </div>
      </div>
    </div>`;

    // Winner
    const w=s.winner;
    const finalists=s.finalists||[];
    const maxVotes=Math.max(...finalists.map(f=>f.votes||f.juryVotes||0),1);
    const barColors=[sc,'#94a3b8','#64748b'];
    const finalistsHTML=finalists.length?`<div class="sr-finalists">
      <div class="sr-finalists-lbl">Final Jury Vote</div>
      ${[...finalists].sort((a,b)=>(a.placement||9)-(b.placement||9)).map((f,i)=>{
        const v=f.votes||f.juryVotes||0;
        return`<div class="sr-finalist-row">
          <div class="sr-finalist-name">${plink(f.name,f.playerSlug)}</div>
          <div class="sr-finalist-bar-wrap"><div class="sr-finalist-bar" data-pct="${Math.round(v/maxVotes*100)}" style="width:0%;background:${barColors[i]||'#64748b'}"></div></div>
          <div class="sr-finalist-votes" style="color:${barColors[i]||'#ccc'}">${v}</div>
        </div>`;
      }).join('')}
    </div>`:'';

    const winnerHTML=`<div class="sr-winner">
      <div class="sr-winner-lbl">👑 Season Winner</div>
      <div class="sr-winner-row">
        <div class="sr-winner-av">
          <img src="assets/avatars/${w.playerSlug}.png"
            style="display:none"
            onload="this.style.display='block';this.nextElementSibling.style.display='none'"
            onerror="this.style.display='none'"/>
          <span>👑</span>
        </div>
        <div class="sr-winner-info">
          <div class="sr-winner-name">${w.name}</div>
          <div class="sr-winner-vote">${w.vote||''}${w.runnerUp?' over '+w.runnerUp:''}</div>
          ${w.keyStats?`<div style="font-size:13px;color:rgba(255,255,255,.75)">${w.keyStats}</div>`:''}
        </div>
      </div>
      ${w.strategy?`<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;font-weight:700">Strategy</div><div style="font-size:13px;color:rgba(255,255,255,.8);line-height:1.6">${w.strategy}</div></div>`:''}
      ${w.legacy?`<div style="margin-top:10px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;font-weight:700">Legacy</div><div style="font-size:13px;color:rgba(255,255,255,.7);line-height:1.6">${w.legacy}</div></div>`:''}
      ${finalistsHTML}
    </div>`;

    // Placements
    const placementsHTML=(s.placements||[]).map((p,idx)=>{
      const isRich=p.story||p.keyMoments?.length||p.alliances?.length;
      const pnum=p.placement===1?'🥇':p.placement===2?'🥈':p.placement===3?'🥉':'#'+p.placement;
      let chips=[];
      if(p.challengeWins>0)chips.push(`<span class="sr-p-chip imm">⚡ ${p.challengeWins} Ch</span>`);
      if(p.immunityWins>0)chips.push(`<span class="sr-p-chip imm">🛡️ ${p.immunityWins} Imm</span>`);
      if(p.idolsFound>0)chips.push(`<span class="sr-p-chip idol">💎 ${p.idolsFound} Idol${p.idolsFound>1?'s':''}</span>`);
      if(p.votesReceived>0)chips.push(`<span class="sr-p-chip votes">🎯 ${p.votesReceived} VA</span>`);
      (p.alliances||[]).slice(0,3).forEach(a=>chips.push(`<span class="sr-p-chip ally">🤝 ${a}</span>`));
      (p.rivalries||[]).slice(0,2).forEach(r=>chips.push(`<span class="sr-p-chip rival">⚔️ ${r}</span>`));
      const moments=p.keyMoments||[];
      const hasBody=isRich||p.notes;
      const body=hasBody?`<div class="sr-placement-body">
        ${p.story?`<div class="sr-p-story">${p.story}</div>`:''}
        ${p.gameplayStyle?`<div style="font-size:11px;color:var(--sc);font-weight:700;margin-bottom:8px;font-style:italic">"${p.gameplayStyle}"</div>`:''}
        ${chips.length?`<div class="sr-p-chips">${chips.join('')}</div>`:''}
        ${moments.length?`<div class="sr-p-moments"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px">Key Moments</div>${moments.slice(0,5).map(m=>`<div class="sr-p-moment-item">→ ${m}</div>`).join('')}</div>`:''}
        ${!p.story&&p.notes?`<div style="font-size:13px;color:rgba(255,255,255,.75)">${p.notes}</div>`:''}
      </div>`:'';
      return`<div class="sr-placement-row" style="animation-delay:${idx*20}ms">
        <div class="sr-placement-header" ${hasBody?'onclick="srToggle(this)"':`onclick="window.location.href='player.html?player=${p.playerSlug}'"`}>
          <div class="sr-p-num">${pnum}</div>
          <div class="sr-p-av">
            <img src="assets/avatars/${p.playerSlug}.png" onload="this.style.display='block';this.parentElement.querySelector('.sr-av-fb').style.display='none'" onerror="this.style.display='none'"/>
            <span class="sr-av-fb">${(p.name||'').substring(0,2).toUpperCase()}</span>
          </div>
          <div class="sr-p-info">
            <a class="sr-p-name" href="player.html?player=${p.playerSlug}" onclick="event.stopPropagation()">${p.name}</a>
            ${p.tribe?`<div class="sr-p-meta">🏕️ ${p.tribe}</div>`:''}
          </div>
          <span class="sr-p-phase ${phaseClass(p.phase)}">${p.phase||'—'}</span>
          ${hasBody?'<span class="sr-p-expand">›</span>':''}
        </div>
        ${body}
      </div>`;
    }).join('');

    // Voting history
    // Voting history — use structured data if available, else build from placements
    let historyHTML = '';
    if (s.votingHistory && s.votingHistory.length) {
      historyHTML = s.votingHistory.map(ep => {
        const el = ep.eliminated; const es = slugify(el||'');
        const vc = {}; (ep.votes||[]).forEach(v => { vc[v.target] = (vc[v.target]||0)+1; });
        const vd = Object.entries(vc).sort((a,b)=>b[1]-a[1])
          .map(([n,c]) => `<span class="sr-ep-vote">${n} ×${c}</span>`).join('');
        return `<div class="sr-ep">
          <div class="sr-ep-num">Ep ${ep.episode}</div>
          ${el ? `<div class="sr-ep-boot">
            <div class="sr-ep-boot-av">
              <img src="assets/avatars/${es}.png" onload="this.style.display='block';this.nextElementSibling.style.display='none'" onerror="this.style.display='none'"/>
              <span>${el.substring(0,2).toUpperCase()}</span>
            </div>
            <div class="sr-ep-boot-name">☠️ ${el}</div>
          </div>` : `<div class="sr-ep-boot"><span class="sr-ep-novote">No elimination</span></div>`}
          <div class="sr-ep-votes">${vd || '<span class="sr-ep-novote">No vote detail</span>'}</div>
        </div>`;
      }).join('');
    } else if (s.placements && s.placements.length) {
      // Build elimination order from placements (reverse order = elimination order)
      const ordered = [...s.placements].sort((a,b) => b.placement - a.placement);
      historyHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:16px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.07)">
        ℹ️ Full episode vote breakdown not available for this season — showing elimination order from placements.
      </div>`;
      historyHTML += ordered.map((p, idx) => {
        const epNum = s.episodeCount - idx;
        const voteMatch = (p.notes || '').match(/^([\d–\-★*]+(?:\s*[→→]\s*[\d–\-]+)?)\s*vote/i);
        const voteStr = voteMatch ? voteMatch[1].trim() : '';
        return `<div class="sr-ep">
          <div class="sr-ep-num">${p.placement === 1 ? 'WIN' : p.placement <= 3 ? 'FTC' : `Ep ~${Math.max(1,epNum)}`}</div>
          <div class="sr-ep-boot">
            <div class="sr-ep-boot-av" style="${p.placement <= 3 ? 'border-color:rgba(245,158,11,.5)' : ''}">
              <img src="assets/avatars/${p.playerSlug}.png" onload="this.style.display='block';this.nextElementSibling.style.display='none'" onerror="this.style.display='none'"/>
              <span>${(p.name||'').substring(0,2).toUpperCase()}</span>
            </div>
            <div class="sr-ep-boot-name" style="${p.placement <= 3 ? 'color:#f59e0b' : ''}">${p.placement===1?'🏆':p.placement<=3?'🥈':'☠️'} ${p.name}</div>
          </div>
          <div class="sr-ep-votes">
            ${voteStr ? `<span class="sr-ep-vote">${voteStr}</span>` : ''}
            <span class="sr-ep-vote" style="color:var(--muted)">${p.phase}</span>
          </div>
        </div>`;
      }).join('');
    }

    const moments=s.legacy?.memorableMoments||s.highlights||[];
    const narrative=s.legacy?.summary||s.seasonNarrative||'';


    /* ══════════════════════════════════════════════════════════════════
       THE WIKI TAB — the season as a reference article
       ══════════════════════════════════════════════════════════════════

       The other three tabs are editorial: a narrative, a podium, a timeline.
       A fandom season page is the opposite half — Twists, the cast wall,
       the grid, and the week-by-week — and it is the half this site never
       had. Both reference pages this was modelled on carry the same spine:

         Big Brother 5 (US):  Background · Twists · HouseGuests ·
                              Voting History · Competition History ·
                              Game History (week by week) · Trivia
         Mad House 7:         Overview · Twists · Contestants ·
                              Voting History · Game History · Trivia

       So the dashboard stays exactly as it is and this is a second reading
       of the same season, in reference form. Everything below is derived
       from the season document — nothing here is written by hand, which is
       why it fills itself in for a season nobody has annotated. */
    const wikiHTML = (() => {
      /* ── ONE SHAPE FROM TWO SHOWS ──────────────────────────────────
         Big Brother exports `weeks` — a Head of Household, a block, a veto,
         a vote. Total Drama exports `votingHistory` — an episode, a boot,
         and every ballot cast, which it has carried since long before Big
         Brother existed here.
         Built on `weeks` alone, this whole tab drew a memory wall and four
         empty sections for every Total Drama season on the site.
         So both are normalised to ROUNDS, and each section then asks for
         what it needs: the voting grid works from either, the competition
         grid needs a block and a veto and says so when there is not one. */
      const bbWeeks = Array.isArray(s.weeks) ? s.weeks : [];
      const tdRounds = (Array.isArray(s.votingHistory) ? s.votingHistory : []).map(ep => ({
        week: ep.episode,
        evicted: ep.eliminated,
        ballots: (ep.votes || []).map(v => ({ voter: v.voter, evict: v.target })),
        votes: (ep.votes || []).reduce((acc, v) => {
          if (v.target) acc[v.target] = (acc[v.target] || 0) + 1;
          return acc;
        }, {}),
        winner: ep.winner || ep.challengeWinner || '',
        immunityWinner: ep.immunityWinner || '',
        initialNominees: [], finalNominees: [],
      }));
      const weeks = bbWeeks.length ? bbWeeks : tdRounds;
      // What the round is CALLED. A Total Drama season has episodes.
      const roundWord = bbWeeks.length ? 'Week' : 'Episode';
      const hasBlock = bbWeeks.length > 0;
      const cast = (s.placements || []).slice().sort((a, b) => a.placement - b.placement);
      if (!cast.length) return '<p class="sr-thin">No cast recorded for this season.</p>';

      const esc = v => String(v ?? '').replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const av = p => `<img src="assets/avatars/${esc(p.playerSlug)}.png" alt=""
        onerror="this.style.visibility='hidden'">`;
      /* "3th" and "2th" were on the wall. A placement is an ordinal and
         `${n}th` is only right two thirds of the time. */
      const ord = n => {
        const v = Number(n);
        if (!Number.isFinite(v)) return '—';
        const t = v % 100;
        if (t >= 11 && t <= 13) return `${v}th`;
        return `${v}${['th', 'st', 'nd', 'rd'][v % 10] || 'th'}`;
      };

      /* ── who left when ──
         The wall greys somebody out from the week they leave, so the grid
         reads as a house emptying rather than a table with gaps in it. */
      /* `winner` is an object on a season document — {name, playerSlug, vote,
         runnerUp, keyStats} — and printing it gave "[object Object]" in the
         facts table. The name is what this section wants; the rest of it is
         the Overview tab's job. */
      const winnerName = typeof s.winner === 'string' ? s.winner : (s.winner?.name || '');

      /* A FINALIST IS NEVER EVICTED, whatever the last round says.
         Total Drama's final vote is recorded like any other — a round with an
         "eliminated" on it — so the winner came out of this loop marked as
         gone, and the wall greyed the champion out and blanked his last
         columns in the grid. Anybody who reached the end is held out of it. */
      const finalists = new Set([
        ...(s.finalists || []).map(f => f.name || f).filter(Boolean),
        ...(winnerName ? [winnerName] : []),
        ...cast.filter(p => p.placement === 1).map(p => p.name),
      ]);
      /* A RETURNEE LEAVES TWICE, and the wall only ever showed the second
         one. Jane was evicted in week 7 of Big Brother 1, won her way back in
         through the Battle Back, and went out again in week 15 — a fact the
         record holds in full and the page reduced to "Week 15", which reads as
         somebody who was never touched until the end.

         `outWeek` stays the LAST exit, because that is the one that greys the
         wall and blanks the grid. `exits` keeps all of them, and `awayWeeks`
         is the stretch in between: a week where somebody has already been
         evicted and appears nowhere in the record — no ballot, no chair, no
         vote against them — is a week they were not in the house for, and the
         grid should say so rather than drawing them as quietly safe. */
      const outWeek = {};
      const exits = {};
      weeks.forEach(w => {
        if (w.evicted && !finalists.has(w.evicted)) {
          outWeek[w.evicted] = w.week;
          (exits[w.evicted] = exits[w.evicted] || []).push(w.week);
        }
      });
      const inWeek = (name, w) => w.hoh === name || w.vetoWinner === name
        || w.safetyWinner === name || w.evicted === name
        || (w.ballots || []).some(b => b.voter === name)
        || (w.votes || {})[name] != null
        || (w.initialNominees || []).includes(name)
        || (w.blockBeforeSafety || []).includes(name)
        || (w.finalNominees || []).includes(name);
      const awayWeeks = {};
      for (const [name, list] of Object.entries(exits)) {
        if (list.length < 2) continue;
        const back = new Set();
        for (const w of weeks) {
          if (w.week > list[0] && w.week <= list[list.length - 1] && !inWeek(name, w)) back.add(w.week);
        }
        awayWeeks[name] = back;
      }
      const isAway = (name, w) => awayWeeks[name]?.has(w.week);
      /* THE WEEK WHERE NOBODY GOES HOME. It has a Head of Household and no
         ceremony, so every table below has to be told not to read it as a week
         whose record is simply missing. */
      const cancelled = w => !!w.cancelledEviction;

      /* ── 1. the facts ── */
      const facts = [
        ['Cast', `${s.castSize || cast.length} ${hasBlock ? 'houseguests' : 'contestants'}`],
        ['Episodes', s.episodeCount || weeks.length || '—'],
        [bbWeeks.length ? 'Weeks' : 'Rounds', weeks.length || '—'],
        s.jurySize ? ['Jury', `${s.jurySize} members`] : null,
        winnerName ? ['Winner', esc(winnerName)] : null,
        cast[1] ? ['Runner-up', esc(cast[1].name)] : null,
      ].filter(Boolean);

      /* ── 2. twists ──
         DECLARED if the export carried them, derived from the weeks if not.

         The export used to carry no twist list at all, which is why this
         section told a Total Drama season that ran a dozen of them that
         "nothing in this season's record identifies a twist". It carries
         them now — the plan joined to what actually fired — so a season
         exported from today says what it ran, with the episodes it ran on,
         and older seasons keep the derived version below. */
      const declared = (Array.isArray(s.twists) ? s.twists : [])
        .filter(t => t && (t.name || t.id));
      const twists = declared.map(t => {
        const eps = (t.episodes || []).filter(Boolean);
        const when = eps.length
          ? ` ${roundWord}${eps.length === 1 ? '' : 's'} ${eps.join(', ')}.`
          : '';
        return [`${t.emoji ? `${esc(t.emoji)} ` : ''}${esc(t.name)}`,
          `${esc(t.desc || 'No description is recorded for this twist.')}${when}`];
      });
      // Derived only when the export declared nothing — otherwise the same
      // twist would be listed twice, once by name and once by its symptom.
      const derive = !declared.length;
      const arenaWeeks = weeks.filter(w => w.safetyWinner);
      if (derive && arenaWeeks.length) {
        twists.push([`BB Block Buster`, `Three nominees, and a competition on eviction night
          where one of them wins their way off the block. Played in
          ${arenaWeeks.length} week${arenaWeeks.length === 1 ? '' : 's'} —
          ${arenaWeeks.map(w => `${esc(w.safetyWinner)} (wk ${w.week})`).join(', ')}.`]);
      }
      const sanctum = weeks.filter(w => w.publicVote);
      if (derive && sanctum.length) {
        twists.push(['The Sanctum', `No secret ballot: the house voted in front of each other,
          one at a time. Week${sanctum.length === 1 ? '' : 's'} ${sanctum.map(w => w.week).join(', ')}.`]);
      }
      const threeNom = weeks.filter(w => (w.initialNominees || []).length > 2);
      if (derive && threeNom.length && !arenaWeeks.length) {
        twists.push(['Three nominees', `The Head of Household named three in
          ${threeNom.length} week${threeNom.length === 1 ? '' : 's'}.`]);
      }
      const ties = weeks.filter(w => w.tieBreak);
      if (derive && ties.length) {
        twists.push(['Tied votes', `The house split evenly ${ties.length}
          time${ties.length === 1 ? '' : 's'}, and the Head of Household broke it.`]);
      }

      /* ── 3. the memory wall ──
         The thing the house looks at every day: everybody who walked in, in
         the order they walked out. */
      const wall = cast.slice().sort((a, b) => b.placement - a.placement).map(p => {
        const gone = outWeek[p.name];
        const win = p.placement === 1;
        return `<a class="sr-wall-cell${gone ? ' is-out' : ''}${win ? ' is-win' : ''}"
            href="player.html?player=${esc(p.playerSlug)}&view=wiki">
          <div class="sr-wall-photo">${av(p)}</div>
          <div class="sr-wall-name">${esc(p.name)}</div>
          <div class="sr-wall-fate">${win ? 'Winner'
            : gone ? `${roundWord} ${gone}${(exits[p.name] || []).length > 1
              ? ` <i class="sr-wall-back" title="${esc(`Evicted ${roundWord.toLowerCase()} ${
                exits[p.name][0]}, came back, out again ${roundWord.toLowerCase()} ${gone}`)}">\u21A9</i>`
              : ''}`
            : esc(p.status || ord(p.placement))}</div>
        </a>`;
      }).join('');

      /* ── 3b. the power table ──
         Faces, not names in cells. `byName` resolves a week's plain string
         back to the cast entry that carries the avatar slug — the weeks
         record power as names and only the placement list knows the slug. */
      const byName = Object.fromEntries(cast.map(p => [p.name, p]));
      const chip = (name, kind, badge) => {
        if (!name) return '<span class="sr-pow-none">—</span>';
        const p = byName[name];
        return `<a class="sr-chip is-${kind}" href="player.html?player=${esc(p?.playerSlug || '')}&view=wiki">
          <span class="sr-chip-av">${p ? av(p) : ''}<i class="sr-chip-b">${badge}</i></span>
          <span class="sr-chip-n">${esc(name)}</span></a>`;
      };
      /* Everybody who was ever on the block that week, in the order it happened
         to them: named first, then anybody who arrived as a replacement.

         All three lists are needed and each one alone lies. `initialNominees`
         and `blockBeforeSafety` lose the replacement — week two of BB1 opens
         on Brightly and Zee and votes on Millie and Zee, and Millie is the one
         who goes home, so a table built on the openers never shows the person
         it evicted. `finalNominees` loses the people the veto took down. */
      const nomFaces = w => {
        const opened = [...new Set([...(w.blockBeforeSafety || []), ...(w.initialNominees || [])])];
        const final = w.finalNominees || [];
        const all = [...opened, ...final.filter(n => !opened.includes(n))];
        if (!all.length) return '<span class="sr-pow-none">—</span>';
        const stayed = new Set(final);
        const opener = new Set(opened);
        return `<span class="sr-noms">${all.map(n => {
          const p = byName[n];
          const saved = !stayed.has(n);
          const late = !opener.has(n);
          const why = saved ? ' — came off the block'
            : late ? ' — went up as the replacement' : '';
          return `<a class="sr-nom${saved ? ' is-saved' : ''}${late ? ' is-late' : ''}"
            title="${esc(n)}${why}"
            href="player.html?player=${esc(p?.playerSlug || '')}&view=wiki">${p ? av(p) : ''}</a>`;
        }).join('')}</span>`;
      };
      /* The margin, under the week number. "Week" was written there before,
         directly beneath a column header reading WEEK. */
      const tally = w => {
        const v = Object.values(w.votes || {}).filter(n => Number.isFinite(n));
        // Outside the house there is no margin to quote. A camp resolves a tie
        // with a revote the raw tally does not record, so "3–3" beside a name
        // in the voted-out column would be reporting a result that never
        // happened. The count against the person who left is always true.
        if (!hasBlock) {
          const n = (w.votes || {})[w.evicted];
          return `<span>${Number.isFinite(n) && n > 0 ? `${n} vote${n === 1 ? '' : 's'}` : roundWord.toUpperCase()}</span>`;
        }
        if (v.length < 2) return `<span>${roundWord.toUpperCase()}</span>`;
        const [a, b] = [...v].sort((x, y) => y - x);
        // A house that splits evenly does not evict anybody; the Head of
        // Household does, out loud, and that is the week's whole story.
        const tb = a === b ? w.tieBreak : null;
        return `<span class="${tb ? 'is-tied' : ''}" title="${tb
          ? esc(`${a}–${b} tie — ${tb.voter} broke it and evicted ${tb.evict}`)
          : 'eviction margin'}">${a}–${b}${tb ? ' ⚖' : ''}</span>`;
      };
      const anyArena = weeks.some(w => w.safetyWinner);
      /* A table of who held power needs somebody to have held some. The Total
         Drama season export records only who was eliminated and who voted —
         no immunity winner — so a camp would draw a column of dashes beside a
         column of names, which the voting grid below already says better. The
         test is the data, not the show: the day those exports carry an
         immunity winner, this section appears for them on its own. */
      const hasPower = weeks.some(w => w.hoh || w.immunityWinner || w.winner
        || w.vetoWinner || w.safetyWinner);
      const power = hasPower ? `
        <div class="sr-pow">
          <div class="sr-pow-scroll">
            <table class="sr-pow-t">
              <thead><tr>
                <th>${roundWord}</th>
                <th>${hasBlock ? 'Head of Household' : 'Immunity'}</th>
                ${anyArena ? '<th>Block Buster</th>' : ''}
                ${hasBlock ? '<th>Power of Veto</th><th>On the block</th>' : ''}
                <th>${hasBlock ? 'Evicted' : 'Voted out'}</th>
              </tr></thead>
              <tbody>${weeks.map(w => (cancelled(w)
                /* THE WEEK WHERE NOBODY GOES HOME. Drawn as one wide cell
                   rather than a row of dashes, which is what a week with no
                   record looks like — and this week has a record, it just has
                   no ceremony in it. */
                ? `<tr class="sr-pow-none-wk">
                    <td><div class="sr-pow-wk">${w.week}<span>NO EVICTION</span></div></td>
                    <td colspan="${1 + (anyArena ? 1 : 0) + (hasBlock ? 2 : 0) + 1}">
                      <span class="sr-nowk-line">No nominations, no veto and no vote${
                        w.hoh ? ` — ${esc(w.hoh)} held a Head of Household with nothing to spend it on`
                          : ''}. The house was the same size on Thursday as it was on Sunday.</span>
                    </td>
                  </tr>`
                : `<tr>
                <td><div class="sr-pow-wk">${w.week}${tally(w)}</div></td>
                <td>${chip(w.hoh || w.immunityWinner || w.winner, 'hoh', hasBlock ? 'H' : 'I')}</td>
                ${anyArena ? `<td>${chip(w.safetyWinner, 'arena', 'B')}</td>` : ''}
                ${hasBlock ? `<td>${chip(w.vetoWinner, 'veto', 'V')}</td><td>${nomFaces(w)}</td>` : ''}
                <td>${chip(w.evicted, 'out', '✕')}</td>
              </tr>`)).join('')}</tbody>
            </table>
          </div>
          <div class="sr-pow-key">
            <span><i style="background:#facc15"></i>${hasBlock ? 'Head of Household' : 'Won immunity'}</span>
            ${anyArena ? '<span><i style="background:#c084fc"></i>Won the Block Buster</span>' : ''}
            ${hasBlock ? `<span><i style="background:#38bdf8"></i>Power of Veto</span>
            <span><i style="background:rgba(248,113,113,.6)"></i>On the block at the vote</span>
            <span><i style="background:#38bdf8"></i>Came off the block</span>
            <span><i style="background:rgba(251,146,60,.75)"></i>Went up as the replacement</span>
            <span>The number under each week is the eviction margin; ⚖ marks a tie the Head of Household broke.</span>`
            : `<span>The number under each ${roundWord.toLowerCase()} is how many votes the eliminated contestant took.</span>`}
          </div>
        </div>` : '';

      /* ── 4. the grid ──
         Cast down the side, weeks across the top, and the cell says the
         strongest thing that happened to that person that week. The same
         rule the character article uses: winning the arena outranks being
         nominated, because being nominated is how you get into it. */
      const cellFor = (name, w) => {
        if (w.hoh === name) return ['HOH', 'is-hoh'];
        if (w.evicted === name) return ['OUT', 'is-out'];
        if (w.safetyWinner === name) return ['BB', 'is-arena'];
        if (w.vetoWinner === name) return ['VETO', 'is-veto'];
        const up = (w.initialNominees || []).includes(name)
          || (w.blockBeforeSafety || []).includes(name);
        const stayed = (w.finalNominees || []).includes(name);
        if (up || stayed) return ['NOM', stayed ? 'is-nom' : 'is-saved'];
        return ['', ''];
      };
      const grid = (hasBlock && weeks.length) ? `
        <div class="wk-scroll">
          <table class="wk-table wk-weeks sr-grid">
            <thead><tr><th>${hasBlock ? 'Houseguest' : 'Contestant'}</th>${weeks.map(w =>
              `<th${cancelled(w) ? ' class="is-nowk" title="No eviction this week"' : ''}>${
                w.week}</th>`).join('')}<th>Votes</th></tr></thead>
            <tbody>${cast.map(p => {
              const gone = outWeek[p.name];
              let against = 0;
              return `<tr>
                <th><a href="player.html?player=${esc(p.playerSlug)}&view=wiki">${
                  av(p)}${esc(p.name)}</a></th>
                ${weeks.map(w => {
                  const left = gone && w.week > gone;
                  against += (w.votes || {})[p.name] || 0;
                  if (left) return '<td class="is-gone"></td>';
                  // Out of the house and not yet back: not safe, not there.
                  if (isAway(p.name, w)) return '<td class="is-away" title="Out of the house">·</td>';
                  if (cancelled(w) && !cellFor(p.name, w)[0]) return '<td class="is-nowk"></td>';
                  const [label, cls] = cellFor(p.name, w);
                  return `<td class="${cls}">${label}</td>`;
                }).join('')}
                <td class="sr-grid-tot">${against || ''}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>
        </div>
        <p class="sr-thin">
          <span class="sr-key is-hoh">HOH</span> Head of Household ·
          <span class="sr-key is-veto">VETO</span> Power of Veto ·
          ${arenaWeeks.length ? '<span class="sr-key is-arena">BB</span> won the Block Buster · ' : ''}
          <span class="sr-key is-nom">NOM</span> on the block at the vote ·
          <span class="sr-key is-saved">NOM</span> nominated and came off ·
          <span class="sr-key is-out">OUT</span> evicted.
          The last column is votes received across the season.
        </p>` : (cast.some(p => (p.challengeWins || 0) + (p.immunityWins || 0) + (p.rewardWins || 0) + (p.idolsFound || 0))
          ? `<div class="sr-scroll">
              <table class="sr-grid sr-comp">
                <thead><tr><th>Contestant</th><th>Challenge wins</th><th>Immunity</th>
                  <th>Rewards</th><th>Idols</th><th>Advantages</th><th>Votes against</th></tr></thead>
                <tbody>${cast.map(p => `<tr>
                  <th><a href="player.html?player=${esc(p.playerSlug)}&view=wiki">${
                    av(p)}${esc(p.name)}</a></th>
                  <td class="is-count">${p.challengeWins || ''}</td>
                  <td>${p.immunityWins || ''}</td>
                  <td>${p.rewardWins || ''}</td>
                  <td>${p.idolsFound || ''}</td>
                  <td>${(p.advPlayed || 0) + (p.advHeld || 0) || ''}</td>
                  <td class="sr-grid-tot">${p.votesReceived || ''}</td>
                </tr>`).join('')}</tbody>
              </table>
            </div>
            <p class="sr-thin">
              A camp has no block and no veto, so its competition record is per contestant rather
              than per ${roundWord.toLowerCase()}: challenge wins across the season, of which the
              individual immunity wins are the ones that could not be taken away, plus rewards,
              idols found, advantages played or still in hand at the end, and votes cast against
              them. Ordered by finish.
            </p>`
          : (weeks.length
            ? `<p class="sr-thin">Nothing in this season's record counts a competition. A season
               exported before the per-player challenge record existed does not carry it.</p>`
            : '<p class="sr-thin">No round-by-round record was exported for this season.</p>'));

      /* ── 4b. the voting history ──
         The table every Big Brother wiki is built around, and the one thing
         a tally could never produce: WHO EACH HOUSEGUEST VOTED FOR, week by
         week. It needs `ballots`, which the engine has always had and the
         export only started carrying today, so a season exported before
         that says so rather than drawing an empty grid. */
      const hasBallots = weeks.some(w => (w.ballots || []).length);
      const voteCell = (name, w) => {
        if (w.hoh === name) {
          // The Head of Household does not vote — unless the house tied and
          // they broke it, which is the most consequential vote of the week
          // and belongs on the grid rather than in a footnote.
          const tb = w.tieBreakVote;
          return tb && tb.voter === name
            ? [esc(tb.evict), 'is-tiebreak', 'broke the tie', byName[tb.evict]]
            : ['HOH', 'is-hoh', 'did not vote', null];
        }
        const up = (w.finalNominees || []).includes(name)
          || (w.blockBeforeSafety || []).includes(name);
        const ballot = (w.ballots || []).find(b => b.voter === name);
        if (ballot) {
          // WITH THE FACE. Fifteen columns of surnames is a grid you read;
          // fifteen columns of faces is one you scan, which is the only reason
          // the reference wikis put portraits in this table at all.
          return [esc(ballot.evict), ballot.changed ? 'is-changed' : '',
            ballot.stated ? `said ${ballot.stated}` : (ballot.changed ? 'changed their mind' : ''),
            byName[ballot.evict]];
        }
        if (w.evicted === name) return ['OUT', 'is-out', 'evicted', null];
        if (up) return ['NOM', 'is-nom', 'on the block, could not vote', null];
        return ['', '', '', null];
      };
      const votingHistory = hasBallots ? `
        <div class="wk-scroll">
          <table class="wk-table wk-weeks sr-grid sr-votes">
            <thead><tr><th>Voted to evict</th>${weeks.map(w =>
              `<th${cancelled(w) ? ' class="is-nowk" title="No eviction this week"' : ''}>${
                w.week}</th>`).join('')}</tr></thead>
            <tbody>${cast.map(p => {
              const gone = outWeek[p.name];
              return `<tr>
                <th><a href="player.html?player=${esc(p.playerSlug)}&view=wiki">${
                  av(p)}${esc(p.name)}</a></th>
                ${weeks.map(w => {
                  if (gone && w.week > gone) return '<td class="is-gone"></td>';
                  if (isAway(p.name, w)) return '<td class="is-away" title="Out of the house">·</td>';
                  if (cancelled(w)) return '<td class="is-nowk" title="No eviction this week"></td>';
                  const [label, cls, title, face] = voteCell(p.name, w);
                  return `<td class="${cls}"${title ? ` title="${esc(title)}"` : ''}>${
                    face ? `<span class="sr-vf">${av(face)}<b>${label}</b></span>` : label}</td>`;
                }).join('')}
              </tr>`;
            }).join('')}</tbody>
          </table>
        </div>
        <p class="sr-thin">
          Each cell is who that ${hasBlock ? 'houseguest' : 'contestant'} voted
          ${hasBlock ? 'to evict' : 'out'}.
          ${hasBlock ? `<span class="sr-key is-hoh">HOH</span> held the power and did not vote ·
            <span class="sr-key is-nom">NOM</span> was on the block ·
            <span class="sr-key is-changed">name</span> moved their vote after the plans were laid ·
            <span class="sr-key is-tiebreak">name</span> broke a tie.
            Hover a changed vote to see what they had said they would do.`
            : `A blank cell is somebody who had immunity, was not at the ceremony, or did not
               vote that round.`}
        </p>` : '';

      /* ── 5. week by week ──
         Two versions of the same round, and the good one is optional.

         DERIVED is built here from the record: true, complete, and unable
         to say anything about how the week went, because the export does
         not know. WRITTEN comes from `gameHistory` — the episodes read
         round by round, with the record handed over as the skeleton the
         prose is not allowed to contradict.

         A season nobody has run the fill on still gets the derived line,
         and a round whose episode was never written keeps it too, so this
         degrades a round at a time rather than all at once. */
      const written = new Map((Array.isArray(s.gameHistory) ? s.gameHistory : [])
        .filter(r => r && r.prose).map(r => [Number(r.n), r]));
      const gameHistory = weeks.map(w => {
        const noms = (w.blockBeforeSafety || w.initialNominees || []);
        const bits = [];
        if (w.hoh) bits.push(`<b>${esc(w.hoh)}</b> won Head of Household.`);
        if (w.winner) bits.push(`<b>${esc(w.winner)}</b> won the challenge.`);
        if (w.immunityWinner && w.immunityWinner !== w.winner) {
          bits.push(`<b>${esc(w.immunityWinner)}</b> had immunity.`);
        }
        if (noms.length) bits.push(`${noms.map(esc).join(', ')} went on the block.`);
        if (w.vetoWinner) bits.push(`<b>${esc(w.vetoWinner)}</b> won the veto.`);
        if (w.safetyWinner) bits.push(`<b>${esc(w.safetyWinner)}</b> won the Block Buster and came off.`);
        if (w.finalNominees?.length && w.finalNominees.join() !== noms.join()) {
          bits.push(`${w.finalNominees.map(esc).join(' and ')} faced the vote.`);
        }
        if (w.tieBreak) bits.push('The vote tied.');
        if (w.evicted) {
          const tally = Object.entries(w.votes || {}).map(([n, c]) => `${c}`).sort((a, b) => b - a);
          // A house evicts; a camp votes somebody out.
          bits.push(`<b>${esc(w.evicted)}</b> was ${hasBlock ? 'evicted' : 'voted out'}${tally.length > 1
            ? `, ${tally[0]}-${tally[1]}` : ''}.`);
        }
        /* ── WRITTEN PROSE THAT NAMES NOBODY FROM THIS WEEK IS NOT ABOUT
              THIS WEEK. ──
           Big Brother 1 shipped with fifteen `gameHistory` rows describing an
           entirely different cast — Millie, Bowie, Caleb, Priya — because the
           fill was run against the wrong season's episodes and committed here.
           The page printed all of it, above the derived line, as this season's
           own account of itself.

           The test is the record, not a heuristic: every round the fill writes
           names the person who held power and the person who left, and both
           are in the week object. Prose that mentions none of them is prose
           about some other house. */
        const w2raw = written.get(Number(w.week));
        const knownNames = [w.hoh, w.winner, w.immunityWinner, w.vetoWinner, w.safetyWinner,
          w.evicted, ...(w.initialNominees || []), ...(w.blockBeforeSafety || []),
          ...(w.finalNominees || [])].filter(Boolean);
        const aboutThisWeek = w2raw && (!knownNames.length || knownNames.some(n =>
          new RegExp(`\\b${String(n).replace(/[^A-Za-z0-9 ]/g, c => String.fromCharCode(92) + c)}\\b`)
            .test(String(w2raw.prose))));
        const w2 = aboutThisWeek ? w2raw : null;
        const body = cancelled(w)
          ? `<p class="sr-week-f">No nominations, no veto and no vote this week — nobody went
             home.${w.hoh ? ` <b>${esc(w.hoh)}</b> won Head of Household.` : ''}</p>`
          : w2
          ? `${w2.title ? `<div class="sr-week-t">${esc(w2.title)}</div>` : ''}
             <p class="sr-week-p">${esc(w2.prose)}</p>
             <p class="sr-week-f">${bits.join(' ')}</p>`
          : bits.join(' ');
        return `<div class="sr-week">
          <div class="sr-week-n">${roundWord} ${w.week}</div>
          <div class="sr-week-b">${body}</div>
        </div>`;
      }).join('');

      /* ── 6. trivia, measured ──
         Every line here has to be true in the show it is about. The first
         version was written against Big Brother's record and printed
         "reached the end without ever being nominated" over a Total Drama
         season, which has no nominations — the honest equivalent there is
         never having a vote cast against you, which is a different and
         rarer thing. Same for competitions: a house counts HOH and veto, a
         camp counts challenge wins. */
      const trivia = [];
      const most = arr => arr.slice().sort((a, b) => b.n - a.n)[0];
      const comps = cast.map(p => ({ name: p.name, n: hasBlock
        ? (p.bb?.hohWins || 0) + (p.bb?.vetoWins || 0) + (p.bb?.blockBusterWins || 0)
        : (p.challengeWins || 0) }));
      const topComp = most(comps);
      if (topComp?.n) {
        trivia.push(`${esc(topComp.name)} won the most ${hasBlock ? 'competitions' : 'challenges'} this season (${topComp.n}).`);
      }
      if (hasBlock) {
        const noms = cast.map(p => ({ name: p.name, n: p.bb?.timesNominated || 0 }));
        const topNom = most(noms);
        if (topNom?.n) trivia.push(`${esc(topNom.name)} was nominated more than anybody else (${topNom.n} times).`);
        const arena = cast.map(p => ({ name: p.name, n: p.bb?.blockBusterWins || 0 }));
        const topArena = most(arena);
        if (topArena?.n > 1) {
          trivia.push(`${esc(topArena.name)} won their way off the block ${topArena.n} times.`);
        }
      } else {
        const got = cast.map(p => ({ name: p.name, n: p.votesReceived || 0 }));
        const topVotes = most(got);
        if (topVotes?.n) {
          trivia.push(`${esc(topVotes.name)} had more votes cast against them than anybody else (${topVotes.n}).`);
        }
      }
      /* Reaching the end untouched. In a house that is never being put on the
         block; in a camp it is never having a name written down against you. */
      const untouched = hasBlock
        ? cast.filter(p => p.placement <= 5 && !(p.bb?.timesNominated))
        : cast.filter(p => p.placement <= 5 && !(p.votesReceived));
      if (untouched.length) {
        trivia.push(`${untouched.map(p => esc(p.name)).join(', ')} reached the end without ever
          ${hasBlock ? 'being nominated' : 'having a vote cast against them'}.`);
      }
      if (winnerName) {
        const w = cast.find(p => p.name === winnerName);
        if (hasBlock && w?.bb) {
          trivia.push(`${esc(winnerName)} won with ${w.bb.hohWins || 0} HOH
            and ${w.bb.vetoWins || 0} veto wins.`);
        } else if (w) {
          trivia.push(`${esc(winnerName)} won with ${w.challengeWins || 0} challenge
            win${(w.challengeWins || 0) === 1 ? '' : 's'} and ${w.votesReceived || 0}
            vote${(w.votesReceived || 0) === 1 ? '' : 's'} cast against them.`);
        }
      }

      /* A wiki section: an id, a heading with a rule under it, and an entry
         in the contents box. The dashboard's `sr-sh` header — a display font
         with a coloured pill beside it — is the house style of the other
         three tabs and is exactly what made this one read as a dashboard
         wearing a wiki label. */
      const toc = [];
      const sec = (title, body, note) => {
        if (!body) return '';
        const id = 'wk-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        toc.push([id, title]);
        return `<section class="wk-section" id="${id}">
          <h2>${title}${note ? ` <span class="wk-count">${note}</span>` : ''}</h2>
          ${body}</section>`;
      };

      const showLabel = hasBlock ? 'Big Brother' : 'Total Drama';
      const infobox = `<aside class="wk-infobox">
        <div class="wk-ib-title">${esc(s.title || (roundWord + ' season'))}</div>
        <div class="wk-ib-show">${showLabel}</div>
        <table class="wk-ib-table">
          ${facts.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}
        </table>
      </aside>`;

      const body = `
        ${s.subtitle ? `<p class="wk-lead">${esc(s.subtitle)}</p>` : ''}
        ${sec('Twists', twists.length
          ? `<dl class="sr-twists">${twists.map(([t, d]) =>
              `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl>`
          : `<p class="sr-thin">Nothing in this season's record identifies a twist. Seasons
             exported before a twist was tracked do not carry it — the weeks below are still
             complete.</p>`)}
        ${sec(hasBlock ? 'Houseguests' : 'Contestants', `<div class="sr-wall">${wall}</div>`,
          `${cast.length} · in the order they left`)}
        ${sec('The power', power, hasPower ? `who ran each ${roundWord.toLowerCase()}` : '')}
        ${sec('Voting history', votingHistory, hasBallots ? 'who voted for whom' : '')}
        ${sec('Competition history', grid, hasBlock && weeks.length ? `${weeks.length} weeks` : '')}
        ${!hasBallots && weeks.length ? `<p class="sr-thin">A vote-by-vote history needs the
          ballots, which this season was exported before the record carried. Re-export it and
          the grid of who voted for whom appears here.</p>` : ''}
        ${sec('Game history', gameHistory)}
        ${sec('Trivia', trivia.length
          ? `<ul class="wk-list">${trivia.map(t => `<li>${t}</li>`).join('')}</ul>` : '')}
      `;

      /* Contents first, then the sections it lists — so it has to be built
         after them and spliced in, which is why the body is a variable. */
      const contents = toc.length > 2
        ? `<nav class="wk-contents"><b>Contents</b><ol>${toc.map(([id, t]) =>
            `<li><a href="#${id}">${esc(t)}</a></li>`).join('')}</ol></nav>`
        : '';

      return `<article class="wk-article">
        ${infobox}
        <div class="wk-main">${contents}${body}</div>
      </article>`;
    })();

    document.getElementById('season-content').innerHTML=`
      ${heroHTML}
      <div class="sr-tabs">
        <button class="sr-tab on" onclick="srTab('overview',this)">📊 Overview</button>
        <button class="sr-tab" onclick="srTab('placements',this)">🏆 Placements</button>
        <button class="sr-tab" onclick="srTab('history',this)">📜 Vote History</button>
        <button class="sr-tab" onclick="srTab('wiki',this)">📖 Wiki</button>
      </div>

      <div id="sr-panel-overview" class="sr-panel on">
        ${winnerHTML}
        ${narrative?`<div class="sr-sh sr-reveal"><h2>Season Narrative</h2></div><div class="sr-narrative sr-reveal">${narrative}</div>`:''}

        <!-- Top Finishers strip -->
        ${(s.placements||[]).length?`<div class="sr-sh sr-reveal"><h2>Top Finishers</h2><span class="sr-sh-pill">${(s.placements||[]).length} players</span></div>
        <div class="sr-top-strip sr-reveal">
          ${(s.placements||[]).slice(0,8).map((p,i)=>{
            const pnum=p.placement===1?'🥇':p.placement===2?'🥈':p.placement===3?'🥉':'#'+p.placement;
            const pc=phaseClass(p.phase);
            return`<a class="sr-top-card" href="player.html?player=${p.playerSlug}">
              <div class="sr-top-num">${pnum}</div>
              <div class="sr-top-av">
                <img src="assets/avatars/${p.playerSlug}.png" onload="this.style.display='block';this.parentElement.querySelector('span').style.display='none'" onerror="this.style.display='none'"/>
                <span>${(p.name||'').substring(0,2).toUpperCase()}</span>
              </div>
              <div class="sr-top-name">${p.name}</div>
              <div class="sr-top-phase ${pc}">${p.phase||'—'}</div>
            </a>`;
          }).join('')}
        </div>
        <div style="margin-bottom:20px">
          <button class="sr-tab" style="font-size:12px;padding:6px 14px" onclick="srTab('placements',document.querySelectorAll('.sr-tab')[1])">View all ${(s.placements||[]).length} placements →</button>
        </div>`:''}

        <!-- Award highlights -->
        ${s.awards?`<div class="sr-sh sr-reveal"><h2>Season Highlights</h2></div>
        <div class="sr-highlights-grid sr-reveal">
          ${buildAwardHighlights(s.awards)}
        </div>`:''}

        ${moments.length?`<div class="sr-sh sr-reveal"><h2>Memorable Moments</h2><span class="sr-sh-pill">${moments.length}</span></div>
        <div class="sr-moments">${moments.map((m,i)=>`<div class="sr-moment" style="animation-delay:${i*60}ms"><div class="sr-moment-num">${i+1}</div><div>${m}</div></div>`).join('')}</div>`:''}

        ${buildRecords(s)}

        <!-- Nav footer -->
        <div class="sr-nav-footer">
          <a href="seasons.html" class="sr-nav-btn">← All Seasons</a>
          <a href="season-awards_ref.html?season=${seasonRef}" class="sr-nav-btn accent">🏅 Season Awards →</a>
          <a href="devotees.html" class="sr-nav-btn">👥 All Players →</a>
        </div>
      </div>

      <div id="sr-panel-placements" class="sr-panel">
        <div class="sr-sh"><h2>Placements</h2><span class="sr-sh-pill">${(s.placements||[]).length}</span></div>
        <div class="sr-view-toggle">
          <button class="sr-view-btn on" onclick="srView('cards',this)">🃏 Cards</button>
          <button class="sr-view-btn" onclick="srView('table',this)">📊 Stats Table</button>
        </div>
        <div id="sr-cards-view">
          <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Click a row to expand details ${s.placements?.[0]?.story?'• Full player stories available':''} • Click name to open profile</div>
          ${placementsHTML||'<p style="color:var(--muted)">No placement data.</p>'}
        </div>
        <div id="sr-table-view" style="display:none;">
          ${buildStatsTable(s.placements||[])}
        </div>
      </div>

      <div id="sr-panel-wiki" class="sr-panel">${wikiHTML}</div>

      <div id="sr-panel-history" class="sr-panel">
        <div class="sr-sh"><h2>Vote History</h2>${s.votingHistory?`<span class="sr-sh-pill">${s.votingHistory.length} episodes</span>`:''}</div>
        <div class="sr-timeline">${historyHTML}</div>
      </div>
    `;

    // Post-render: cast photo
    const photoEl=document.getElementById('sr-hero-photo');
    const probe=new Image();
    /* Namespaced for every show but Total Drama, which keeps the filenames its
       fourteen images already use. Without this a Big Brother season loaded
       Total Drama's cast photograph for the same number. The probe means a show
       with no photo yet simply keeps its plain hero. */
    const castArt = isDefaultShow ? `s${sn}-cast.png` : `${shows.seasonId(ref.format, sn)}-cast.png`;
    probe.onload=()=>{if(photoEl){photoEl.style.backgroundImage=`url('assets/cast/${castArt}')`;setTimeout(()=>{photoEl.style.opacity='.2';},50);}};
    probe.src=`assets/cast/${castArt}`;

    // Finalist bars
    setTimeout(()=>{document.querySelectorAll('.sr-finalist-bar[data-pct]').forEach(el=>{el.style.width=el.dataset.pct+'%';});},120);

    // Scroll reveal
    const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
    document.querySelectorAll('.sr-reveal').forEach(el=>io.observe(el));

  }catch(err){
    console.error(err);
    document.getElementById('season-content').innerHTML=`<div class="hero"><h1>⚠️ Season Not Found</h1><p>${err.message}</p><p><a href="seasons.html">← Back to Seasons</a></p></div>`;
  }
})();

function srTab(id,btn){
  document.querySelectorAll('.sr-panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.sr-tab').forEach(t=>t.classList.remove('on'));
  const panel=document.getElementById('sr-panel-'+id);
  if(panel)panel.classList.add('on');
  if(btn)btn.classList.add('on');
  setTimeout(()=>{
    const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
    document.querySelectorAll('#sr-panel-'+id+' .sr-reveal').forEach(el=>io.observe(el));
  },50);
}

function srToggle(header){
  const row=header.closest('.sr-placement-row');
  if(row)row.classList.toggle('open');
}

// ── Stats table view ──────────────────────────────────────────
function buildStatsTable(placements){
  if(!placements.length) return '<p style="color:var(--muted)">No data.</p>';
  const COLS=[
    {key:'placement',label:'Place',asc:true},
    {key:'name',label:'Player',asc:true,left:true},
    {key:'phase',label:'Phase',asc:true},
    {key:'challengeWins',label:'CW',title:'Challenge Wins',asc:false},
    {key:'immunityWins',label:'IW',title:'Immunity Wins',asc:false},
    {key:'rewardWins',label:'RW',title:'Reward Wins',asc:false},
    {key:'votesReceived',label:'Votes',title:'Votes Against',asc:true},
    {key:'idolsFound',label:'Idols',asc:false},
    {key:'strategicRank',label:'Strat',title:'Strategic Rank',asc:false},
  ];
  const headCells=COLS.map(c=>
    `<th class="${c.left?'left ':''}sortable" data-key="${c.key}" title="${c.title||c.label}"
       onclick="srSortTable(this,'${c.key}',${c.asc})">${c.label} <span class="sr-sort-arrow">⇅</span></th>`
  ).join('');
  const rows=placements.map(p=>{
    const pc=phaseClass(p.phase);
    const sv=p.strategicRank;
    const sn=parseFloat(sv);
    const stratCell=!isNaN(sn)?
      (()=>{const pct=Math.min(sn/10,1);const hue=Math.round(pct*120);return`<span class="sr-strat-dot" style="background:hsla(${hue},60%,45%,.25);color:hsl(${hue},70%,65%)">${sn}</span>`})()
      :(sv?`<span style="font-size:11px;color:var(--muted)">${sv}</span>`:'<span style="color:rgba(255,255,255,.15)">—</span>');
    const num=v=>(v!=null&&v!==''&&v!==0)?`<strong>${v}</strong>`:`<span style="color:rgba(255,255,255,.15)">—</span>`;
    return`<tr>
      <td><strong>${p.placement}</strong></td>
      <td class="left"><div class="sr-st-player">
        <img class="sr-st-av" src="assets/avatars/${p.playerSlug}.png" alt="" onerror="this.style.display='none'">
        <a class="sr-st-name" href="player.html?player=${p.playerSlug}">${p.name}</a>
      </div></td>
      <td><span class="sr-p-phase ${pc}" style="font-size:10px;padding:2px 7px">${p.phase||'—'}</span></td>
      <td>${num(p.challengeWins)}</td>
      <td>${num(p.immunityWins)}</td>
      <td>${num(p.rewardWins)}</td>
      <td>${num(p.votesReceived)}</td>
      <td>${num(p.idolsFound)}</td>
      <td>${stratCell}</td>
    </tr>`;
  }).join('');
  return`<div class="sr-stats-wrap"><table class="sr-stats-table" id="srStatsTable">
    <thead><tr>${headCells}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

let _srSortAsc=true;
function srSortTable(th,key,defaultAsc){
  const table=document.getElementById('srStatsTable');
  if(!table)return;
  const sorted=th.classList.contains('sorted');
  _srSortAsc=sorted?!_srSortAsc:defaultAsc;
  table.querySelectorAll('th').forEach(h=>{
    h.classList.remove('sorted');
    const arr=h.querySelector('.sr-sort-arrow');
    if(arr)arr.textContent='⇅';
  });
  th.classList.add('sorted');
  const arr=th.querySelector('.sr-sort-arrow');
  if(arr)arr.textContent=_srSortAsc?'▲':'▼';
  const tbody=table.querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b)=>{
    const ai=Array.from(a.parentElement.children).indexOf(a.closest('tr'));
    // get cell index matching th
    const thIdx=Array.from(th.parentElement.children).indexOf(th);
    const av=a.cells[thIdx]?.textContent.trim()||'';
    const bv=b.cells[thIdx]?.textContent.trim()||'';
    const an=parseFloat(av),bn=parseFloat(bv);
    const numericCol=['Place','CW','IW','RW','Votes','Idols','Strat'].includes(th.textContent.replace('⇅','').replace('▲','').replace('▼','').trim());
    if(numericCol){
      const aa=isNaN(an)?Infinity:an,bb=isNaN(bn)?Infinity:bn;
      return _srSortAsc?aa-bb:bb-aa;
    }
    return _srSortAsc?av.localeCompare(bv):bv.localeCompare(av);
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function srView(mode,btn){
  document.querySelectorAll('.sr-view-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('sr-cards-view').style.display=mode==='cards'?'block':'none';
  document.getElementById('sr-table-view').style.display=mode==='table'?'block':'none';
}
</script>
