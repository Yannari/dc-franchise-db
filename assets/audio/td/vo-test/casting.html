<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Casting</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #1d1b18; --mute: #6b665d; --line: #e4dfd5; --accent: #c2410c; --pick: #15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --card: #211f19; --ink: #f1ede4; --mute: #a39d90; --line: #35322a; --accent: #fb923c; --pick: #4ade80; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .card.done { border-color: var(--pick); }
  h2 { font-size: 17px; margin: 0 0 2px; display: flex; gap: 8px; align-items: baseline; }
  h2 .chosen { font-size: 12px; font-weight: 600; color: var(--pick); }
  .voice { color: var(--mute); font-size: 13px; margin: 0 0 6px; }
  .line { font-style: italic; margin: 0 0 10px; }
  .takes { display: flex; flex-wrap: wrap; gap: 10px; }
  .take { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 22px; padding: 4px; }
  .take.on { border-color: var(--pick); background: color-mix(in srgb, var(--pick) 12%, transparent); }
  button { height: 32px; padding: 0 12px; border-radius: 16px; border: 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .play { background: var(--accent); color: #fff; }
  .pickb { background: transparent; color: var(--pick); border: 1.5px solid var(--pick); }
  .take.on .pickb { background: var(--pick); color: #fff; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px; }
  .bar div { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar textarea { flex: 1; min-width: 0; height: 52px; resize: none; font: 13px/1.4 ui-monospace, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .copy { background: var(--pick); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Voice casting</h1>
  <p class="sub">Three takes of each character saying a line that shows who they are. Pick the take that IS them: every line they ever speak will be in that voice, with that energy, in every season and show. When you're done, copy the box at the bottom and send it.</p>
  <div id="list"></div>
</main>
<div class="bar"><div><textarea id="out" readonly aria-label="Your picks"></textarea><button type="button" class="copy" id="copy">Copy picks</button></div></div>
<script>
// The casting record: voices/voices.json `_cast` (tools/td-vo-cast.py) and the voices they were made from.
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'td-voice-casting';
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { picks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch { /* private window: picks live until the page closes */ } };
let playing = null;
function play(btn, file) {
  if (playing) { playing.a.pause(); playing.b.textContent = '▶ Play'; }
  if (playing && playing.b === btn) { playing = null; return; }
  const a = new Audio(file); playing = { a, b: btn }; btn.textContent = '■ Stop';
  a.onended = () => { btn.textContent = '▶ Play'; playing = null; };
  a.onerror = () => { btn.textContent = '! Missing'; };
  a.play();
}
Promise.all([
  fetch('voices/voices.json', { cache: 'no-store' }).then(r => r.json()),
  fetch('voices/profiles.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({})),
]).then(([voices, profiles]) => {
  const cast = voices._cast || {};
  // a pick counts only for the takes it was made on (`made`): remade takes start unpicked
  const MADE = KEY + ':made';
  let made = {}; try { made = JSON.parse(localStorage.getItem(MADE) || '{}') || {}; } catch { made = {}; }
  for (const [n, c] of Object.entries(cast)) {
    if (picks[n] && made[n] !== c.made) delete picks[n];
    if (!picks[n] && c.pick) picks[n] = c.pick;
    made[n] = c.made;
  }
  try { localStorage.setItem(MADE, JSON.stringify(made)); } catch { /* private window */ }
  save();
  const names = Object.keys(cast);
  const out = document.getElementById('out');
  const render = () => {
    document.getElementById('list').innerHTML = names.map(n => {
      const c = cast[n];
      return `<div class="card${picks[n] ? ' done' : ''}"><h2>${esc(n)}${picks[n] ? `<span class="chosen">take ${picks[n]} picked</span>` : ''}</h2>
        <p class="voice">${esc(profiles[n] || '')}</p><p class="line">“${esc(c.text)}”</p>
        <div class="takes">${c.takes.map((t, k) => `<div class="take${picks[n] === k + 1 ? ' on' : ''}">
          <button type="button" class="play" data-file="voices/${esc(t.replace(/\.wav$/, '.ogg'))}">▶ Play</button>
          <button type="button" class="pickb" data-name="${esc(n)}" data-k="${k + 1}">${picks[n] === k + 1 ? '✓ Picked' : `Pick take ${k + 1}`}</button></div>`).join('')}</div></div>`;
    }).join('');
    const done = names.filter(n => picks[n]);
    out.value = done.length ? done.map(n => `${n} ${picks[n]}`).join(', ') + (done.length < names.length ? `  (still to pick: ${names.length - done.length})` : '') : 'Pick a take for each character…';
  };
  document.getElementById('list').addEventListener('click', e => {
    const p = e.target.closest('.play'); if (p) return play(p, p.dataset.file);
    const k = e.target.closest('.pickb'); if (k) { picks[k.dataset.name] = +k.dataset.k; save(); render(); }
  });
  document.getElementById('copy').addEventListener('click', () => { out.select(); navigator.clipboard?.writeText(out.value).catch(() => document.execCommand('copy')); });
  render();
}).catch(() => { document.getElementById('list').innerHTML = '<p>The casting record did not load.</p>'; });
</script>
</body>
</html>
