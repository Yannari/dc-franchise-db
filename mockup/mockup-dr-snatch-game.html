<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snatch Game — Tiered Panel mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Monoton&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0612; --bg2:#1a0b22; --ink:#f7eee2; --dim:#a894b0; --glass:rgba(20,8,28,.72);
  --amber:#ffb238; --hot:#ff3d8b; --gold:#ffd166; --teal:#3ee0d0; --dead:#6f6a80;
  --booth:#23102e; --booth-edge:#4a2a58; --card:#fff6e6; --card-ink:#2a1630;
}
:root[data-theme="light"]{
  --gold:#b86a00; --amber:#e08a00;
  --bg:#f6ecde; --bg2:#ffe3c7; --ink:#2a1630; --dim:#7a6280; --glass:rgba(255,248,238,.8);
  --booth:#fff3e2; --booth-edge:#e8b98d; --card:#fffdf8; --card-ink:#2a1630; --dead:#9c95a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.top h1{margin:0;font:400 18px/1 Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.btn{border:1px solid var(--booth-edge);background:var(--glass);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 12px system-ui;cursor:pointer}

/* ══ THE SET — built from light only ══ */
.set{position:relative;overflow:hidden;border-radius:18px;min-height:560px;isolation:isolate;
  background:
    radial-gradient(60% 45% at 50% 0%,rgba(255,178,56,.35),transparent 70%),
    radial-gradient(40% 40% at 12% 90%,rgba(255,61,139,.25),transparent 70%),
    radial-gradient(40% 40% at 88% 90%,rgba(62,224,208,.2),transparent 70%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,209,102,.25)}
/* a slow 70s sunburst of light behind everything */
.set::before{content:"";position:absolute;inset:-40%;z-index:-1;opacity:.22;
  background:repeating-conic-gradient(from 0deg at 50% 60%,var(--amber) 0 6deg,transparent 6deg 18deg);
  animation:spin 90s linear infinite;mask:radial-gradient(closest-side,#000 30%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
/* marquee bulbs around the frame */
.bulbs{position:absolute;inset:6px;border-radius:14px;pointer-events:none;z-index:3;
  background:
    radial-gradient(circle,var(--gold) 2px,transparent 3px) 0 0/22px 22px repeat-x,
    radial-gradient(circle,var(--gold) 2px,transparent 3px) 0 100%/22px 22px repeat-x;
  animation:chase 1.2s steps(2) infinite;opacity:.85}
@keyframes chase{50%{opacity:.35}}

.logo{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;text-align:center;pointer-events:none}
.logo b{font:400 clamp(22px,4vw,40px)/1 Monoton,Anton,sans-serif;letter-spacing:.06em;color:var(--hot);
  text-shadow:0 0 6px var(--hot),0 0 22px var(--hot);animation:flick 5s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}95%{opacity:1}96%{opacity:.6}}
.round-pill{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--booth-edge);
  font:600 10px/1.6 system-ui;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}

/* ══ LAYOUT ══ */
.floor{position:relative;z-index:2;display:grid;grid-template-columns:170px 1fr 190px;gap:14px;padding:96px 18px 22px;min-height:600px}

/* contestants (left) */
.desk{display:flex;flex-direction:column;gap:10px;align-self:start}
.contestant{position:relative;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--booth-edge);text-align:center;transition:transform .5s,box-shadow .5s}
.contestant img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;box-shadow:0 0 0 2px var(--teal)}
.contestant b{display:block;font:400 13px/1.1 Anton,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.contestant small{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.contestant.on{transform:scale(1.05);box-shadow:0 0 0 2px var(--teal),0 0 30px rgba(62,224,208,.45)}
.pts{display:inline-flex;gap:3px;margin-top:6px}
.pts i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--booth-edge)}
.pts i.lit{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.pts i.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}

/* the panel (centre) */
.stagecol{display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard{position:relative;margin:0 auto;max-width:560px;width:100%;padding:12px 18px;border-radius:12px;background:var(--card);color:var(--card-ink);
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,178,56,.55);transform-origin:top;transition:transform .5s}
.qcard.flip{animation:cardin .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes cardin{from{transform:rotateX(90deg);opacity:0}}
.qcard small{display:block;font:600 10px/1 system-ui;letter-spacing:.22em;text-transform:uppercase;color:#b0527a;margin-bottom:6px}
.qcard p{margin:0;font:400 clamp(16px,2.2vw,22px)/1.3 'Special Elite',Georgia,serif}
.blank{display:inline-block;min-width:120px;padding:0 4px;border-bottom:3px solid var(--hot);color:var(--hot);font-weight:700}
.blank.typing::after{content:"|";animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.tiers{display:flex;flex-direction:column;gap:10px;perspective:900px}
.tier{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.floor>*{min-width:0}
.tier.back{transform:translateZ(-40px) scale(.94);margin:0 12px}
.booth{position:relative;border-radius:12px;padding:8px 6px 6px;text-align:center;background:var(--booth);
  box-shadow:inset 0 0 0 1px var(--booth-edge),0 6px 16px rgba(0,0,0,.25);filter:saturate(.55) brightness(.72);
  transition:filter .45s,transform .45s,box-shadow .45s}
.booth img{width:100%;max-width:74px;aspect-ratio:1;border-radius:10px;object-fit:cover;object-position:top}
.plac{display:block;margin-top:5px;padding:3px 4px;border-radius:6px;background:linear-gradient(180deg,#2a1432,#150a1b);
  font:400 11px/1.1 Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#ffd166;text-shadow:0 0 6px rgba(255,209,102,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme="light"] .plac{background:linear-gradient(180deg,#3a1d44,#241029)}
.booth .qn{display:block;font-size:9.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.booth.on{filter:none;transform:translateY(-6px) scale(1.08);z-index:2;box-shadow:0 0 0 2px var(--amber),0 0 34px rgba(255,178,56,.55)}
.booth.dead{filter:grayscale(1) brightness(.55)}
.booth .said{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);min-width:130px;max-width:170px;padding:6px 8px;border-radius:8px;
  background:var(--card);color:var(--card-ink);font:400 11px/1.25 'Special Elite',serif;box-shadow:0 8px 20px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .3s}
.booth .flag{position:absolute;top:-8px;right:-6px;padding:1px 6px;border-radius:99px;font:700 9px/1.6 system-ui;letter-spacing:.12em;text-transform:uppercase;opacity:0}
.booth .flag.show{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.flag.kill{background:var(--gold);color:#2a1630}.flag.bomb{background:var(--dead);color:#fff}.flag.match{background:var(--teal);color:#062}

/* the push-in: the speaking queen, big, with her answer card and her line */
.close{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-height:128px;padding:10px 14px;border-radius:14px;
  background:var(--glass);border:1px solid var(--booth-edge);opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s}
.close.show{opacity:1;transform:none}
.close img{width:108px;height:108px;border-radius:14px;object-fit:cover;object-position:top;box-shadow:0 0 0 3px var(--amber),0 10px 30px rgba(0,0,0,.5)}
.close .who b{font:400 18px/1 Anton,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.close .who small{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em}
.close .line{margin:6px 0 0;font-size:15px;line-height:1.45}
.close .line q{quotes:"\201C" "\201D"}
.anscard{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:6px;background:var(--card);color:var(--card-ink);font:400 14px 'Special Elite',serif;
  transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.3);animation:cardup .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes cardup{from{transform:translateY(24px) rotate(8deg);opacity:0}}

/* Ru: a spotlight beam that swings from the host to whoever he is talking to */
.ru{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:14px;
  background:radial-gradient(80% 70% at 50% 30%,rgba(255,61,139,.28),transparent 70%)}
.ru .host{font:400 13px/1 Anton,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.ru img{width:78px;height:78px;border-radius:50%;object-fit:cover;object-position:top;box-shadow:0 0 0 3px var(--hot),0 0 26px rgba(255,61,139,.5);transition:transform .3s}
.ru.laugh img{animation:shake .5s 3}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.bubble{position:relative;max-width:160px;min-height:0;padding:7px 10px;border-radius:4px 14px 14px 14px;text-align:center;background:var(--hot);color:#fff;font-weight:600;font-size:13px;opacity:0;transform:scale(.6);transform-origin:bottom right;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.bubble.show{opacity:1;transform:none}
.beam{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s}
.beam.show{opacity:1}

/* ══ THE LAUGH-O-METER (right) ══ */
.meter{align-self:start;margin-top:4px;padding:10px 10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--booth-edge);text-align:center}
.meter h4{margin:0 0 4px;font:400 12px/1 Anton,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.dial{position:relative;width:170px;height:96px;margin:0 auto}
.dial svg{width:100%;height:100%;overflow:visible}
.needle{transform-origin:85px 88px;transform:rotate(-80deg);transition:transform 1.1s cubic-bezier(.3,1.6,.45,1)}
.meter .word{display:block;margin-top:4px;min-height:22px;font:400 17px/1 Anton,sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:color .3s}
.signs{display:flex;justify-content:center;gap:6px;margin-top:8px}
.sign{padding:3px 8px;border-radius:5px;font:400 11px/1 Anton,sans-serif;letter-spacing:.16em;border:1px solid var(--booth-edge);color:var(--dim);transition:all .3s}
.sign.on{color:#2a1630;background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px var(--gold);animation:flash .5s 4}
.sign.crick.on{background:var(--dead);border-color:var(--dead);color:#fff;box-shadow:none;animation:none}
@keyframes flash{50%{filter:brightness(1.6)}}
.laughs{margin-top:10px;text-align:left}
.laughs .r{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;font-size:10.5px;margin-top:3px}
.laughs .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laughs .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.laughs .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--hot));transition:width .8s}

/* toast + match explosion */
.toast{position:absolute;left:50%;top:44%;z-index:6;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none;
  font:400 clamp(40px,8vw,84px)/1 Monoton,Anton,sans-serif;color:var(--teal);text-shadow:0 0 10px var(--teal),0 0 40px var(--teal)}
.toast.go{animation:boom 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes boom{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.confetti{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(620px) rotate(540deg);opacity:.2}}
@keyframes pop{from{transform:scale(0)}}

/* the step cards under the stage (the transcript of the taping) */
.controls{display:flex;justify-content:center;gap:8px;margin:12px 0}
.cards{display:flex;flex-direction:column;gap:6px}
.cardrow{padding:8px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--booth-edge);font-size:13px;opacity:.35;transition:opacity .3s}
.cardrow.now{opacity:1;box-shadow:0 0 0 1px var(--amber)}
.cardrow small{color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:10px;margin-right:6px}

/* narrow screens: meter moves under the panel, contestants go side by side */
@media (max-width:760px){
  .floor{grid-template-columns:1fr;padding:84px 10px 18px}
  .ru{flex-direction:row;justify-content:center}.ru img{width:54px;height:54px}.bubble{max-width:220px}
  .desk{flex-direction:row;flex-wrap:wrap;align-self:auto;order:3}
  .ru{flex:1 1 100%}
  .contestant{flex:1 1 40%;min-width:0}
  .contestant b{font-size:11px}
  .meter{order:2;display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;align-items:center;text-align:left}
  .signs{flex-wrap:wrap}.sign{font-size:9.5px;padding:3px 5px}
  .tier.back{margin:0}
  .dial{width:130px;height:76px}.needle{transform-origin:85px 88px}
  .tier{gap:6px}.booth{padding:6px 3px 4px}.plac{font-size:9px}
  .close img{width:76px;height:76px}.close .line{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Snatch Game · mockup</h1>
    <div><button class="btn" id="theme">Light / dark</button></div></div>

  <div class="set" id="set">
    <div class="bulbs"></div>
    <div class="logo"><b>SNATCH GAME</b><br><span class="round-pill" id="pill">The panel</span></div>
    <svg class="beam" id="beam" viewBox="0 0 100 100" preserveAspectRatio="none"><defs>
      <linearGradient id="bg" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".45"/><stop offset="1" stop-color="#ffb238" stop-opacity="0"/></linearGradient></defs>
      <polygon id="beamPoly" points="94,92 50,40 60,40" fill="url(#bg)"/></svg>

    <div class="floor">
      <div class="desk">
        <div class="ru" id="ru"><img src="../assets/avatars/rupaul-drag.png" alt="RuPaul"><span class="host">RuPaul</span><div class="bubble" id="bubble"></div></div>
        <div class="contestant" id="c0"><img src="../assets/avatars/michellevisage.png" alt=""><b>Michelle Visage</b><small>Contestant</small><div class="pts" id="p0"><i></i><i></i><i></i></div></div>
        <div class="contestant" id="c1"><img src="../assets/avatars/rupaul.png" alt="" style="filter:hue-rotate(40deg)"><b>Guest judge</b><small>Contestant</small><div class="pts" id="p1"><i></i><i></i><i></i></div></div>
      </div>

      <div class="stagecol">
        <div class="qcard" id="qcard"><small id="qfor">Michelle, fill in the blank</small><p id="qtext">Welcome to the Snatch Game.</p></div>
        <div class="tiers" id="tiers"></div>
        <div class="close" id="close"></div>
      </div>

      <div class="meter">
        <div>
          <h4>Laugh-o-meter</h4>
          <div class="dial"><svg viewBox="0 0 170 96">
            <defs><linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#6f6a80"/><stop offset=".45" stop-color="#ffb238"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient></defs>
            <path d="M12 88 A73 73 0 0 1 158 88" fill="none" stroke="url(#arc)" stroke-width="12" stroke-linecap="round"/>
            <g class="needle" id="needle"><line x1="85" y1="88" x2="85" y2="22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="85" cy="88" r="6" fill="currentColor"/></g>
          </svg></div>
          <span class="word" id="word">—</span>
        </div>
        <div>
          <div class="signs"><span class="sign crick" id="sCrick">CRICKETS</span><span class="sign" id="sLaugh">LAUGH</span><span class="sign" id="sApp">APPLAUSE</span></div>
          <div class="laughs" id="laughs"></div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">MATCH!</div>
    <div class="confetti" id="confetti"></div>
  </div>

  <div class="controls"><button class="btn" id="prev">‹ Back</button><button class="btn" id="next">Next ›</button><button class="btn" id="all">Play all</button></div>
  <div class="cards" id="cards"></div>
</div>

<script>
const Q = [
  { q: 'Autumnatic', c: 'Cher', img: 'autumnatic' },
  { q: 'Quin', c: 'Björk', img: 'quin' },
  { q: 'Minnie Skurr', c: 'Dolly Parton', img: 'minnie-skurr' },
  { q: 'Cupcakke', c: 'Paris Hilton', img: 'cupcakke' },
  { q: 'Paige Turner', c: 'Joan Rivers', img: 'paige-turner' },
  { q: 'Taystee', c: 'Gordon Ramsay', img: 'taystee' },
  { q: 'Gigi Cherie', c: 'Judge Judy', img: 'gigi-cherie' },
  { q: 'Cheryl Hole', c: 'Morticia Addams', img: 'cheryl-hole' },
];
const LEVELS = [ // the meter's words, bottom to top
  [0, 'Crickets', 'var(--dead)'], [2.5, 'A chuckle', 'var(--dim)'], [5, 'A laugh', 'var(--amber)'],
  [7.5, 'A roar', 'var(--hot)'], [9.2, 'Ru lost it', 'var(--gold)'],
];
/* One state per reveal step. `who` is the booth on camera. */
const STEPS = [
  { tag: 'Welcome', pill: 'The panel', text: '"Welcome to the Snatch Game! Our contestants tonight are Michelle Visage and our guest judge, and our celebrity panel is the most glamorous group of people ever assembled on one set. Let\'s meet them."', q: 'Welcome to the Snatch Game.', bubble: 'Let\'s meet our celebrities!' },
  { tag: 'The panel', who: 0, say: 'Ru, baby. I\'ve been in show business since before there was a show. I was in the Bible. Page four.', laugh: 7.1, intro: true, bubble: 'Page four!' },
  { tag: 'The panel', who: 1, say: '[a long pause] …Hello. I am from Iceland. It is very… cold there. Also… elves.', laugh: 1.6, intro: true, bubble: 'Mm-hm. Moving on.' },
  { tag: 'Round 1', pill: 'Round 1 of 6', card: true, qfor: 'Michelle, fill in the blank', q: 'The worst thing about being famous is ___.', bubble: '"The worst thing about being famous is… blank."', contestant: 0 },
  { tag: 'Cher', who: 0, ans: 'outliving my critics', say: 'Honey, I\'ve outlived everyone who ever called me a phase. I keep their names in a spreadsheet. The spreadsheet is older than Michelle.', laugh: 9.4, flag: 'kill', ru: 'laugh', bubble: 'I can\'t. I cannot. Somebody help me.' },
  { tag: 'Björk', who: 1, ans: 'the swan?', say: 'The worst thing is, um… the swan. You know. The swan. From the… the thing. Ru, can we come back to me?', laugh: 0.8, flag: 'bomb', bubble: '…Okay. Dolly, save us.' },
  { tag: 'Dolly Parton', who: 2, ans: 'my wig gets recognised without me', say: 'My wig goes shopping on its own now, Ru. Last Tuesday it bought a Winnebago and it won\'t tell me where it\'s parked.', laugh: 6.4, bubble: 'A Winnebago!' },
  { tag: 'Cross-talk', who: 0, say: '[to Björk] Sweetheart, blink twice if the elves are holding you hostage.', laugh: 5.8, cross: 1, bubble: 'Cher, behave.', note: 'Cher reads Björk on the desk — Autumnatic & Quin −1 · Autumnatic +1 with the room' },
  { tag: 'Paris Hilton', who: 3, ans: 'the paparazzi', say: 'The paparazzi. That\'s hot. No, literally, Ru, I have a tan line in the shape of a camera.', laugh: 5.2, bubble: 'That\'s hot?' },
  { tag: 'The reveal', reveal: true, contestant: 0, q: 'The worst thing about being famous is ___.', ans: 'the paparazzi', match: 3, bubble: 'Michelle said… "the paparazzi"!' },
  { tag: 'Tonight', final: true, bubble: 'That\'s the Snatch Game. Good luck, and don\'t—', text: 'The taping wraps. Cher owned the desk; Björk never found the bit, and Ru stopped going to her after round two.' },
];

const $ = id => document.getElementById(id);
const tiers = $('tiers');
tiers.innerHTML = [Q.slice(0, 4), Q.slice(4)].map((row, t) => `<div class="tier ${t ? '' : 'back'}">${row.map((x, i) => {
  const k = t * 4 + i;
  return `<div class="booth" id="b${k}"><span class="flag" id="f${k}"></span><img src="../assets/avatars/${x.img}.png" alt=""><span class="plac">${x.c}</span><span class="qn">${x.q}</span></div>`;
}).join('')}</div>`).join('');
$('laughs').innerHTML = Q.map((x, i) => `<div class="r"><span>${x.c}</span><span class="bar"><i id="l${i}"></i></span></div>`).join('');
$('cards').innerHTML = STEPS.map((s, i) => `<div class="cardrow" id="k${i}"><small>${s.tag}</small>${
  s.say ? `<b>${Q[s.who].q} as ${Q[s.who].c}:</b> "${s.say}"` : s.text || s.q || ''}${s.note ? `<br><small>consequence</small>${s.note}` : ''}</div>`).join('');

let at = -1; let typer = null; const total = Array(Q.length).fill(0); const pts = [0, 0];
function levelOf(v) { let l = LEVELS[0]; for (const x of LEVELS) if (v >= x[0]) l = x; return l; }
function needle(v) { $('needle').style.transform = `rotate(${-80 + (Math.min(10, v) / 10) * 160}deg)`; }
function signs(v) { $('sCrick').classList.toggle('on', v < 2.5); $('sLaugh').classList.toggle('on', v >= 5 && v < 7.5); $('sApp').classList.toggle('on', v >= 7.5); }
function beamTo(k) {
  const b = $('b' + k), set = $('set').getBoundingClientRect(), r = b.getBoundingClientRect();
  const x = ((r.left + r.width / 2 - set.left) / set.width) * 100, y = ((r.top + r.height / 2 - set.top) / set.height) * 100;
  const h = $('ru').querySelector('img').getBoundingClientRect();
  const hx = ((h.left + h.width / 2 - set.left) / set.width) * 100, hy = ((h.top + h.height / 2 - set.top) / set.height) * 100;
  $('beamPoly').setAttribute('points', `${hx},${hy} ${x - 5},${y} ${x + 5},${y}`); $('beam').classList.add('show');
}
function confetti() {
  const c = $('confetti'); c.innerHTML = Array.from({ length: 40 }, (_, i) =>
    `<i style="left:${Math.random() * 100}%;background:${['#ffd166', '#ff3d8b', '#3ee0d0', '#fff'][i % 4]};animation-delay:${Math.random() * .4}s"></i>`).join('');
}
function show(i) {
  at = i; const s = STEPS[i]; clearInterval(typer);
  document.querySelectorAll('.cardrow').forEach((el, k) => el.classList.toggle('now', k === i));
  document.querySelectorAll('.booth').forEach(b => b.classList.remove('on'));
  $('beam').classList.remove('show'); $('ru').classList.remove('laugh'); $('close').classList.remove('show');
  $('c0').classList.toggle('on', s.contestant === 0);
  if (s.pill) $('pill').textContent = s.pill;
  if (s.q) { const blank = s.q.replace('___', `<span class="blank" id="blank">${s.reveal ? '' : '&nbsp;'}</span>`); $('qtext').innerHTML = blank; }
  if (s.qfor) $('qfor').textContent = s.qfor;
  if (s.card) { $('qcard').classList.remove('flip'); void $('qcard').offsetWidth; $('qcard').classList.add('flip'); needle(0); $('word').textContent = '—'; signs(5.5); $('sLaugh').classList.remove('on'); }
  if (s.who != null) {
    const x = Q[s.who]; const b = $('b' + s.who); b.classList.add('on'); beamTo(s.who);
    if (s.ans) { const bl = $('blank'); if (bl) { clearInterval(typer); bl.classList.add('typing'); bl.textContent = ''; let n = 0; typer = setInterval(() => { bl.textContent = s.ans.slice(0, ++n); if (n >= s.ans.length) { clearInterval(typer); bl.classList.remove('typing'); } }, 38); } }
    $('close').innerHTML = `<img src="../assets/avatars/${x.img}.png" alt=""><div class="who"><b>${x.c}</b><small>${x.q}${s.intro ? ' · introducing herself' : s.cross != null ? ` · to ${Q[s.cross].c}` : ''}</small>
      ${s.ans ? `<span class="anscard">${s.ans}</span>` : ''}<p class="line"><q>${s.say}</q></p></div>`;
    requestAnimationFrame(() => $('close').classList.add('show'));
    const l = levelOf(s.laugh); needle(s.laugh); signs(s.laugh);
    $('word').textContent = l[1]; $('word').style.color = l[2];
    total[s.who] += s.laugh; Q.forEach((_, k) => { $('l' + k).style.width = `${Math.min(100, total[k] * 5)}%`; });
    if (s.flag) { const f = $('f' + s.who); f.className = `flag ${s.flag} show`; f.textContent = s.flag === 'kill' ? 'killing it' : 'dying'; }
    if (s.flag === 'bomb') b.classList.add('dead');
    if (s.ru === 'laugh') $('ru').classList.add('laugh');
  }
  if (s.reveal) {
    const bl = $('blank'); bl.textContent = s.ans;
    const b = $('b' + s.match); b.classList.add('on'); beamTo(s.match);
    const f = $('f' + s.match); f.className = 'flag match show'; f.textContent = 'match';
    const t = $('toast'); t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); confetti();
    pts[0] = 1; const dot = $('p0').children[0]; dot.classList.add('lit', 'new');
  }
  const bub = $('bubble'); bub.classList.remove('show'); if (s.bubble) { bub.textContent = s.bubble; setTimeout(() => bub.classList.add('show'), 250); }
}
$('next').onclick = () => { if (at < STEPS.length - 1) show(at + 1); };
$('prev').onclick = () => { if (at > 0) location.hash = '', show(at - 1); };
$('all').onclick = () => { let i = at; const t = setInterval(() => { if (++i >= STEPS.length) return clearInterval(t); show(i); }, 2300); };
$('theme').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
show(0);
</script>
</body>
</html>
