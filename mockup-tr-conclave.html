<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Conclave — VP mockup (The Traitors)</title>
<!--
  ============================================================================
  MOCKUP: The Conclave — the signature VP screen for The Traitors.
  Plan: docs/superpowers/plans/2026-08-28-traitors-08-vp.md, Task 1, Step 1.

  This file is the VISUAL TARGET. rpBuildConclave(ep, observer) must reproduce
  it exactly: same grid, same fonts, same portrait treatment, same icon system,
  same sidebar, same card physics, same ambient effects. Kept in the repo.

  Class prefix: cv-   (conclave)
  Type: FRAUNCES 900 WONK 1 (display), Cormorant Garamond (narration),
  IM Fell English (vellum, spoken lines, host). The previous pass used Bodoni
  Moda on a brief that turned out to be wrong: the logotype's serifs are
  WEDGES flaring to a point, which is a Roman/Latin trait, not a Didone's
  flat slabs. mockup-tr-fonts.html is the specimen sheet that reverses it,
  and §2.5 there is the ladder the hero title's 0.80 squeeze came off.

  FOUR THINGS THIS FILE IS DELIBERATE ABOUT
  -----------------------------------------
  0. IT IS A GAME'S CHAPTER CARD, NOT A MAGAZINE SPREAD. Three lit planes with
     aerial perspective, a vignette that bites, volumetric light with dust
     hanging in it, film grain over the whole frame, and surfaces that are
     surfaces — stone with grain and pitting, vellum with fibre and a torn
     deckle edge, wax with a specular dome, brass with wear. The material work
     is SVG filters (feTurbulence, feDisplacementMap, feGaussianBlur), which
     no other screen in this repo uses; that is what stops the conclave
     reading as a recolour of get-a-clue, houston or super-hero-ld.
  1. PEOPLE ARE FACES, OBJECTS ARE ICONS. Every named person renders through
     _avatar() from assets/avatars/<slug>.png. _icon() is for things only —
     lantern, quill, wax, letter, eye. Missing portraits fall back to initials
     in the same arched niche; the roster is incomplete and the host's portrait
     does not exist yet, so that path is normal, not exceptional.
  2. THE HOST IS A VARIABLE. Not one line of copy on this screen contains a
     host's name. Every line she speaks and every face she wears resolves from
     the single HOST object below. The header carries a switcher so this can be
     proved by clicking it. In the builder HOST comes from seasonConfig.host
     resolved against HOSTS_BY_FORMAT['traitors'] in js/quick-setup.js.
     Hardcoding a host name into copy is this project's central bug class.
  3. NO EMOJI. Every icon is a hand-drawn inline SVG in _icon().

  Element IDs follow the project's _reapplyVisibility contract:
    step divs  id="cv-step-conclave-{i}"
    counter    id="cv-counter-conclave"
    controls   id="cv-controls-conclave"
    sidebar    id="cv-sidebar-inner"
  ============================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,600;9..144,700;9..144,900&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ═════════════════════════════════════════════════════════════════════════
   THE CONCLAVE — visual system.

   TYPE (revised; see mockup-tr-fonts.html for the specimen it was chosen on)
   ------------------------------------------------------------------------
   Display: FRAUNCES 900, WONK 1. The brief that produced Bodoni Moda was
   wrong — the logotype's serifs are wedges flaring to a point, not a Didone's
   flat slabs. Fraunces at 900 in caps is heavy, semi-condensed and wedge-
   serifed: the only free face that scores on all three attributes before
   anything synthetic is done to it. The hero lockup alone is squeezed to 0.80
   with a 1.3px stroke, tuned against the logotype rather than guessed;
   nothing else on the screen is distorted. Body: Cormorant Garamond.
   Hand: IM Fell English.

   MATERIAL, NOT COLOUR
   --------------------
   Every surface here is a surface. Stone is turbulence-grained and pitted,
   vellum has fibre and a torn deckle edge, wax has a specular dome, brass has
   wear. That is done with SVG filters — feTurbulence, feDisplacementMap,
   feGaussianBlur, feSpecularLighting — which nothing else in this repo uses,
   so the screen cannot read as a recolour of get-a-clue, houston or
   super-hero-ld.

   DEPTH
   -----
   Three planes, lit and focused differently:
     BACKGROUND  far wall, blurred, desaturated, low contrast (aerial perspective)
     MIDGROUND   the arch, the window, the light shafts, the table
     FOREGROUND  near-black pillar and table edge, sharp, unlit
   A vignette closes the frame, film grain sits over the whole thing, and dust
   hangs visibly inside the lantern's cone.
   ═════════════════════════════════════════════════════════════════════════ */
:root{
  --cv-void:#040508;
  --cv-stone:#0e1117;
  --cv-lantern:#e0a049;
  --cv-lantern-hot:#ffdb95;
  --cv-lantern-dim:rgba(224,160,73,.16);
  --cv-vellum:#e8ddc1;
  --cv-vellum-2:#c9ba95;
  --cv-vellum-ink:#241b11;
  --cv-wax:#75121e;
  --cv-wax-hot:#b32633;
  --cv-moon:#8fa6c2;
  --cv-moon-dim:rgba(143,166,194,.5);
  --cv-mute:#6a7484;
  --cv-rule:rgba(224,160,73,.22);
  --cv-display:'Fraunces',Georgia,'Times New Roman',serif;
  --cv-hand:'IM Fell English',Georgia,serif;
  --cv-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#000;
  color:var(--cv-vellum);
  font-family:var(--cv-body);
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:104px;                 /* room for the sticky controls */
}

/* ── SHELL ─────────────────────────────────────────────────────────────────
   Never full-screen. 1100px, centred, sitting in the dark of the turret. The
   shell is itself the near plane and casts a shadow onto the black page.    */
.cv-shell{
  position:relative;
  max-width:1100px;margin:0 auto;
  background:var(--cv-stone);
  box-shadow:0 0 0 1px rgba(224,160,73,.10),0 0 90px rgba(0,0,0,.9),0 0 200px rgba(0,0,0,.7);
  overflow:hidden;
  transition:background 1.6s ease;
}

/* ── PLANES ────────────────────────────────────────────────────────────────
   Everything below .cv-body is scenery; z-index tells you how far away it is.
   NOTE FOR THE BUILDER: in the real VP the 46px .rp-nav sits above this, so
   every absolutely-positioned scenery layer starts at top:46px, never top:0. */
.cv-veil,.cv-vig,.cv-grain{
  position:absolute;inset:0;pointer-events:none;
}
/* THE ROOM IS DRAWN ONCE, AT A FIXED HEIGHT. These three planes are the
   turret itself; they do not stretch with the length of the episode. Below
   them the shell falls away into tiled stone and dark, which is what the
   room actually does. */
.cv-far,.cv-mid,.cv-fore{
  position:absolute;left:0;right:0;top:0;height:1560px;bottom:auto;
  pointer-events:none;overflow:hidden;
}
/* the floor of the room fades into the dark rather than ending on a line */
.cv-far::after,.cv-mid::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:420px;
  background:linear-gradient(180deg,transparent,var(--cv-stone));
}
/* and the rest of the scroll is stone, quietly */
.cv-shell::before{
  content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:var(--cv-rock-src);background-size:340px 340px;
  opacity:.16;mix-blend-mode:overlay;
}
.cv-far {z-index:0}
.cv-mid {z-index:1}
.cv-fore{z-index:2}
.cv-veil{z-index:3}
.cv-vig {z-index:4}
.cv-grain{z-index:9}
.cv-body{position:relative;z-index:5}
.cv-far svg,.cv-mid svg,.cv-fore svg{position:absolute;inset:0;width:100%;height:100%}

/* aerial perspective — the far wall is blurred, desaturated and low-contrast.
   The single cheapest thing that turns flat layers into distance.           */
.cv-far{filter:blur(2.4px) saturate(.5) brightness(.72);opacity:.55}
.cv-mid{filter:blur(.4px);opacity:.62}

/* the lantern's wash over everything, warm and additive */
.cv-veil{
  transition:background 1.8s ease,opacity 1.8s ease;
  mix-blend-mode:screen;opacity:.6;
  background:radial-gradient(120% 62% at 50% 2%,var(--cv-lantern-dim) 0%,transparent 62%);
}

/* a vignette that actually bites — four stops, not two */
.cv-vig{
  background:
    radial-gradient(130% 88% at 50% 34%,transparent 0%,transparent 40%,rgba(2,3,5,.42) 72%,rgba(2,3,5,.86) 100%),
    linear-gradient(180deg,rgba(2,3,5,.7) 0%,transparent 16%,transparent 78%,rgba(2,3,5,.8) 100%);
  mix-blend-mode:multiply;
}

/* film grain over the whole frame. A static turbulence tile translated a few
   px on a step loop — animating feTurbulence itself is far too expensive.   */
.cv-grain{
  opacity:.14;mix-blend-mode:soft-light;
  background-image:var(--cv-grain-src);
  background-size:220px 220px;
  animation:cv-grainshift 1.1s steps(4) infinite;
}
@keyframes cv-grainshift{
  0%{transform:translate(0,0)} 25%{transform:translate(-6px,4px)}
  50%{transform:translate(4px,-5px)} 75%{transform:translate(-3px,-3px)}
  100%{transform:translate(0,0)}
}

/* ── AMBIENT MOTION ────────────────────────────────────────────────────────  */
.cv-ember{animation:cv-rise linear infinite;transform-origin:center}
@keyframes cv-rise{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:0}
  10%{opacity:.9}
  45%{transform:translateY(-280px) translateX(16px) scale(.8);opacity:.55}
  72%{opacity:.3}
  100%{transform:translateY(-660px) translateX(34px) scale(.4);opacity:0}
}
/* dust hanging IN the light cone — slower, dimmer, drifting sideways        */
.cv-mote{animation:cv-float linear infinite}
@keyframes cv-float{
  0%{transform:translate(0,0);opacity:0}
  14%{opacity:.55}
  50%{transform:translate(22px,-90px);opacity:.4}
  86%{opacity:.2}
  100%{transform:translate(-8px,-190px);opacity:0}
}
/* a real flicker curve: irregular stops and a double gutter, not a sine     */
.cv-cone{animation:cv-flicker 6.3s linear infinite}
@keyframes cv-flicker{
  0%{opacity:.62}  6%{opacity:.58}  9%{opacity:.72} 13%{opacity:.44}
 15%{opacity:.66} 27%{opacity:.6}  33%{opacity:.78} 36%{opacity:.5}
 38%{opacity:.71} 52%{opacity:.64} 61%{opacity:.4}  63%{opacity:.69}
 74%{opacity:.58} 83%{opacity:.75} 88%{opacity:.47} 94%{opacity:.66}
100%{opacity:.62}
}
.cv-bloom{animation:cv-breathe 6.3s linear infinite;transform-origin:center}
@keyframes cv-breathe{
  0%,100%{opacity:.85;transform:scale(1)}
  13%{opacity:.6;transform:scale(.96)}
  33%{opacity:1;transform:scale(1.06)}
  61%{opacity:.55;transform:scale(.93)}
  83%{opacity:.95;transform:scale(1.03)}
}
.cv-flame{animation:cv-lick 1.5s ease-in-out infinite;transform-origin:50% 92%}
@keyframes cv-lick{
  0%,100%{transform:scale(1,1) skewX(0deg)}
  22%{transform:scale(.9,1.14) skewX(-5deg)}
  47%{transform:scale(1.08,.93) skewX(4deg)}
  71%{transform:scale(.95,1.06) skewX(-2deg)}
}
.cv-draught{animation:cv-drift 26s ease-in-out infinite}
@keyframes cv-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(30px)}}
.cv-sway{animation:cv-swing 11s ease-in-out infinite;transform-origin:50% 0}
@keyframes cv-swing{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}

/* ── PHASE ATMOSPHERE ──────────────────────────────────────────────────────
   Five phases, and the whole room changes temperature, not just tint. The
   gathering is moonlit and blue; the argument warms; the overrule goes to
   blood; the sealing is close and hot; the meanwhile is a warm room seen
   from a cold corridor.                                                     */
.cv-shell[data-phase="gather"]{background:#0b0e15}
.cv-shell[data-phase="gather"] .cv-veil{background:radial-gradient(110% 56% at 50% 4%,rgba(143,166,194,.2) 0%,transparent 60%);opacity:.75}
.cv-shell[data-phase="gather"] .cv-far{filter:blur(3px) saturate(.4) brightness(.6) hue-rotate(-8deg)}

.cv-shell[data-phase="argue"]{background:#14181f}
.cv-shell[data-phase="argue"] .cv-veil{background:radial-gradient(120% 66% at 50% 8%,rgba(224,160,73,.3) 0%,transparent 66%);opacity:.9}

.cv-shell[data-phase="overrule"]{background:#181016}
.cv-shell[data-phase="overrule"] .cv-veil{background:radial-gradient(130% 72% at 50% 18%,rgba(179,38,51,.34) 0%,transparent 62%);opacity:1}
.cv-shell[data-phase="overrule"] .cv-far{filter:blur(2.4px) saturate(.6) brightness(.62) hue-rotate(-16deg)}

.cv-shell[data-phase="seal"]{background:#140e0d}
.cv-shell[data-phase="seal"] .cv-veil{background:radial-gradient(84% 46% at 50% 28%,rgba(255,219,149,.4) 0%,transparent 58%);opacity:1}
.cv-shell[data-phase="seal"] .cv-vig{background:
  radial-gradient(96% 62% at 50% 32%,transparent 0%,transparent 26%,rgba(2,3,5,.6) 62%,rgba(2,3,5,.94) 100%)}

.cv-shell[data-phase="meanwhile"]{background:#080c12}
.cv-shell[data-phase="meanwhile"] .cv-veil{background:radial-gradient(96% 58% at 74% 40%,rgba(255,219,149,.24) 0%,transparent 55%);opacity:.85}

/* ── PORTRAITS, LIT ────────────────────────────────────────────────────────
   They no longer sit flat in a niche. Every face is rim-lit from the lantern
   side and sunk into shadow on the other, and the hood shades the top third.
   The <img> sits over the initials; if the file is absent it removes itself
   and the initials remain in the same arched niche. The roster is incomplete
   and the default host's portrait does not exist yet, so that is the normal
   path, not the error path.                                                 */
.cv-av{
  position:relative;display:inline-block;overflow:hidden;flex:none;vertical-align:middle;
  border-radius:50% 50% 12% 12% / 44% 44% 9% 9%;
  background:linear-gradient(162deg,#252b37,#080b11);
  box-shadow:
    0 0 0 1px rgba(224,160,73,.30),
    inset 0 -10px 20px rgba(0,0,0,.75),
    inset 3px 0 12px rgba(255,214,150,.10),
    0 6px 16px rgba(0,0,0,.65);
}
.cv-av img{
  width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:2;
  filter:sepia(.32) saturate(.8) contrast(1.14) brightness(.84);
}
.cv-av-ini{
  position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--cv-display);font-weight:900;letter-spacing:.02em;
  color:rgba(224,160,73,.62);
}
/* the light: warm rim from the lantern side, shadow falling away */
.cv-av::before{
  content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(101deg,
    rgba(255,224,168,.5) 0%,
    rgba(255,214,150,.16) 20%,
    rgba(255,214,150,.02) 40%,
    rgba(4,5,9,.42) 74%,
    rgba(4,5,9,.8) 100%);
}
/* the hood: the top third of every face is in shade, because it is */
.cv-av::after{
  content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:
    radial-gradient(120% 78% at 50% -14%,rgba(2,3,6,.82) 0%,rgba(2,3,6,.3) 44%,transparent 62%),
    linear-gradient(180deg,transparent 62%,rgba(4,5,9,.55));
}
.cv-av[data-lit="dim"] img{filter:sepia(.4) saturate(.55) contrast(1.1) brightness(.58)}
.cv-av[data-lit="dim"]::before{background:linear-gradient(101deg,rgba(190,205,225,.2) 0%,rgba(4,5,9,.5) 55%,rgba(4,5,9,.86) 100%)}
.cv-av[data-lit="dim"] .cv-av-ini{color:rgba(143,166,194,.45)}
.cv-av[data-lit="hot"] img{filter:sepia(.24) saturate(.95) contrast(1.16) brightness(1.02)}
.cv-av[data-lit="hot"]{box-shadow:0 0 0 1px rgba(255,219,149,.5),0 0 26px rgba(224,160,73,.32),inset 0 -10px 20px rgba(0,0,0,.65)}

/* ═══ THE HERO PLATE ═══════════════════════════════════════════════════════
   Not a page header. A chapter card: full-bleed, 474px of turret, the title
   burned into it. The screen's one moment of pure scale.                    */
.cv-hero{
  position:relative;height:474px;overflow:hidden;
  background:#06080d;
  border-bottom:1px solid rgba(224,160,73,.18);
}
.cv-hero svg.cv-hero-scene{position:absolute;inset:0;width:100%;height:100%}
.cv-hero-lock{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  padding:0 44px 26px;text-align:center;
}
.cv-eyebrow{
  font-family:var(--cv-display);font-weight:600;font-size:10px;letter-spacing:.46em;
  text-transform:uppercase;color:var(--cv-moon);opacity:.8;
  text-shadow:0 2px 8px rgba(0,0,0,.9);
}
/* THE LOCKUP. Fraunces 900 squeezed 0.80 + 1.3px stroke — the only distorted
   text on the screen. mockup-tr-fonts.html §2.5 is the ladder it came from. */
.cv-title{
  display:inline-block;
  font-family:var(--cv-display);font-weight:900;
  font-size:clamp(42px,7.6vw,92px);line-height:1.02;padding:0 0 .06em;
  letter-spacing:-.02em;
  transform:scaleX(.80);transform-origin:center bottom;
  -webkit-text-stroke:1.3px currentColor;paint-order:stroke fill;
  color:var(--cv-lantern-hot);
  margin:10px 0 0;
  text-shadow:
    0 0 8px rgba(255,231,183,.55),
    0 0 30px rgba(224,160,73,.6),
    0 0 78px rgba(224,160,73,.42),
    0 0 150px rgba(224,160,73,.24),
    0 4px 0 rgba(0,0,0,.55),
    0 10px 30px rgba(0,0,0,.9);
  animation:cv-titleburn 7s ease-in-out infinite;
}
@keyframes cv-titleburn{
  0%,100%{text-shadow:0 0 8px rgba(255,231,183,.55),0 0 30px rgba(224,160,73,.6),0 0 78px rgba(224,160,73,.42),0 0 150px rgba(224,160,73,.24),0 4px 0 rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.9)}
  34%{text-shadow:0 0 10px rgba(255,231,183,.72),0 0 40px rgba(224,160,73,.8),0 0 100px rgba(224,160,73,.56),0 0 190px rgba(224,160,73,.3),0 4px 0 rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.9)}
  61%{text-shadow:0 0 6px rgba(255,231,183,.4),0 0 22px rgba(224,160,73,.46),0 0 60px rgba(224,160,73,.3),0 0 120px rgba(224,160,73,.18),0 4px 0 rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.9)}
}
.cv-title-rule{
  display:flex;align-items:center;justify-content:center;gap:16px;
  margin:16px auto 12px;max-width:560px;
}
.cv-title-rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(224,160,73,.55),transparent)}
.cv-sub{
  font-family:var(--cv-hand);font-style:italic;
  font-size:18.5px;line-height:1.5;color:rgba(232,221,193,.8);
  max-width:690px;margin:0 auto;
  text-shadow:0 2px 10px rgba(0,0,0,.95);
}
/* the strip under the plate — observer badge, host switcher */
.cv-head{
  padding:16px 40px;position:relative;
  border-bottom:1px solid var(--cv-rule);
  background:linear-gradient(180deg,rgba(4,5,8,.7),rgba(4,5,8,.25));
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.cv-observer{
  display:inline-flex;align-items:center;gap:9px;
  padding:7px 14px;border:1px solid var(--cv-rule);
  background:rgba(224,160,73,.05);
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--cv-lantern);
}
.cv-observer em{
  font-family:var(--cv-body);font-style:italic;text-transform:none;
  letter-spacing:0;font-size:14px;color:var(--cv-mute);
}
/* MOCKUP-ONLY affordance. Proves the host is a variable and not a string.
   The builder reads seasonConfig.host instead and renders no switcher.      */
.cv-hostpick{
  display:inline-flex;align-items:center;gap:9px;
  padding:5px 12px 5px 9px;border:1px dashed rgba(143,166,194,.35);
  font-family:var(--cv-display);font-weight:600;font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cv-mute);
}
.cv-hostpick select{
  background:transparent;border:none;color:var(--cv-lantern);
  font-family:var(--cv-display);font-size:11px;letter-spacing:.06em;
  cursor:pointer;outline:none;
}
.cv-hostpick select option{background:#12151c;color:#e8ddc1}

/* ── GRID: stream + sidebar ────────────────────────────────────────────────  */
.cv-grid{display:grid;grid-template-columns:1fr 292px;gap:0;align-items:start}
.cv-main{padding:34px 34px 70px;min-width:0}
.cv-side{
  position:sticky;top:0;align-self:start;
  border-left:1px solid var(--cv-rule);
  background:linear-gradient(180deg,rgba(4,5,8,.86),rgba(4,5,8,.42));
  backdrop-filter:blur(3px);
  padding:26px 20px 44px;min-height:100%;
  box-shadow:inset 22px 0 40px -30px rgba(0,0,0,.9);
}

/* ── THE IRONY GUTTER ──────────────────────────────────────────────────────
   The screen's signature primitive, and the best idea in it. Every beat in
   the turret carries, in the left margin, the face of whoever is downstairs
   and what they were doing at that minute. The audience reads both columns
   at once; the castle only ever gets the right one. Deliberately COLDER and
   flatter than the turret column — another room, another light, further off. */
.cv-beat{display:grid;grid-template-columns:160px 1fr;gap:0 24px}
.cv-margin{
  position:relative;padding:8px 18px 8px 0;text-align:right;
  border-right:1px dashed rgba(143,166,194,.24);
  filter:saturate(.72);
}
.cv-margin::after{
  content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,rgba(143,166,194,.28),transparent);
}
.cv-margin-time{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.2em;
  color:var(--cv-moon);opacity:.85;display:block;margin-bottom:8px;
}
.cv-margin-txt{
  font-family:var(--cv-hand);font-style:italic;
  font-size:13.5px;line-height:1.5;color:var(--cv-moon-dim);display:block;
}
.cv-margin-ic{position:absolute;right:-11px;top:1px;opacity:.7;background:var(--cv-stone);padding:2px 0;line-height:0;border-radius:50%}
.cv-margin-av{margin-bottom:9px}

/* ── THE HOST LAYER ────────────────────────────────────────────────────────
   She narrates OVER the footage, so her band breaks out of the card column
   and spans the gutter too — a different layer of the picture, letterboxed
   top and bottom. She is not a caption, and she is not the subject.         */
.cv-host{
  grid-column:1/-1;position:relative;overflow:hidden;
  display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;
  padding:17px 26px;margin-bottom:18px;
  background:linear-gradient(100deg,rgba(4,5,8,.96),rgba(44,30,15,.82) 52%,rgba(4,5,8,.96));
  border-top:1px solid rgba(224,160,73,.45);
  border-bottom:1px solid rgba(224,160,73,.45);
  box-shadow:inset 0 0 40px -8px rgba(224,160,73,.22),0 14px 34px rgba(0,0,0,.5);
}
.cv-host::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,219,149,.14) 50%,transparent 70%);
  animation:cv-sweep 9s ease-in-out infinite alternate;
}
/* broadcast letterbox: two hard black bars, so her layer reads as film */
.cv-host::after{
  content:'';position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;
  border-top:3px solid rgba(2,3,5,.85);border-bottom:3px solid rgba(2,3,5,.85);
}
@keyframes cv-sweep{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.cv-host .cv-av{box-shadow:0 0 0 1px rgba(224,160,73,.65),0 0 24px rgba(224,160,73,.22),inset 0 -8px 18px rgba(0,0,0,.6)}
.cv-host-name{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--cv-lantern);margin-bottom:7px;
  display:flex;align-items:center;gap:8px;
}
.cv-host-line{
  font-family:var(--cv-hand);font-style:italic;
  font-size:20px;line-height:1.5;color:rgba(255,228,176,.95);
  text-shadow:0 1px 12px rgba(224,160,73,.22);
}

/* ── CARDS ─────────────────────────────────────────────────────────────────
   A card is a slab of lit stone standing in the room: top edge catching the
   lantern, bottom edge in shadow, a real drop shadow beneath it.            */
.cv-card{
  position:relative;padding:24px 28px;
  border:1px solid rgba(224,160,73,.14);
  background:
    linear-gradient(178deg,rgba(255,219,149,.05),transparent 18%),
    linear-gradient(160deg,rgba(32,38,49,.95),rgba(10,13,19,.96));
  box-shadow:
    0 26px 54px rgba(0,0,0,.62),
    0 4px 10px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,224,168,.14),
    inset 0 -1px 0 rgba(0,0,0,.7);
}
/* the card's own stone grain, cut in by an SVG turbulence tile */
.cv-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:var(--cv-rock-src);background-size:300px 300px;
  opacity:.14;mix-blend-mode:overlay;
}
.cv-card>*{position:relative;z-index:1}
.cv-card-label{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--cv-lantern);opacity:.88;margin-bottom:11px;
  display:flex;align-items:center;gap:9px;
}
.cv-card-title{
  font-family:var(--cv-display);font-weight:900;font-size:25px;
  letter-spacing:-.005em;color:var(--cv-vellum);margin:0 0 12px;
  text-shadow:0 2px 14px rgba(0,0,0,.7);
}
.cv-card p{margin:0 0 13px;color:rgba(232,221,193,.86)}
.cv-card p:last-child{margin-bottom:0}
.cv-said{
  display:grid;grid-template-columns:auto 1fr;gap:17px;align-items:start;
  border-left:2px solid var(--cv-lantern);padding:6px 0 6px 19px;margin:16px 0;
  box-shadow:-14px 0 26px -18px rgba(224,160,73,.7);
}
.cv-said-txt{
  font-family:var(--cv-hand);font-size:19.5px;line-height:1.55;
  color:var(--cv-vellum);
}
.cv-said cite{
  display:block;margin-top:9px;font-style:normal;
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--cv-mute);
}

/* the arriving cloaks — a portrait inside each hood */
.cv-cloaks{display:flex;gap:20px;justify-content:center;padding:22px 0 8px;flex-wrap:wrap}
.cv-cloak{width:138px;text-align:center}
.cv-cloak-fig{position:relative;display:inline-block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.85))}
.cv-cloak-face{position:absolute;left:26px;top:11px}
.cv-cloak-name{
  font-family:var(--cv-display);font-weight:900;font-size:14px;letter-spacing:.06em;
  color:var(--cv-vellum);margin-top:10px;
}
.cv-cloak-note{
  font-family:var(--cv-hand);font-style:italic;
  font-size:13px;color:var(--cv-mute);line-height:1.4;margin-top:4px;
}
.cv-cloak[data-state="nervy"] .cv-cloak-fig{animation:cv-shiver 6s ease-in-out infinite}
@keyframes cv-shiver{
  0%,88%,100%{transform:translateX(0)}
  91%{transform:translateX(-1.5px)} 94%{transform:translateX(1.5px)} 97%{transform:translateX(-1px)}
}

/* ── VELLUM ────────────────────────────────────────────────────────────────
   Real paper: fibre from an SVG turbulence tile, a torn deckle edge from a
   displacement filter applied to the sheet's BACKING layer only, so the type
   stays sharp, and a warm sheen where the lantern falls across it.          */
.cv-slip{
  position:relative;margin:18px 0 6px;padding:22px 26px 24px;
  color:var(--cv-vellum-ink);
  filter:drop-shadow(0 16px 26px rgba(0,0,0,.7));
}
.cv-slip::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:
    linear-gradient(176deg,rgba(255,255,255,.14),transparent 32%),
    radial-gradient(120% 90% at 18% 0%,rgba(255,240,205,.6),transparent 58%),
    linear-gradient(160deg,var(--cv-vellum) 0%,var(--cv-vellum-2) 100%);
  filter:url(#cvDeckle);
}
.cv-slip::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:var(--cv-fibre-src);background-size:180px 180px;
  opacity:.55;mix-blend-mode:multiply;
}
.cv-slip>*{position:relative;z-index:2}
.cv-slip-head{
  display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;
  border-bottom:1px solid rgba(36,27,17,.3);padding-bottom:11px;margin-bottom:13px;
}
.cv-slip-target{
  font-family:var(--cv-display);font-weight:900;font-size:29px;
  letter-spacing:-.01em;color:var(--cv-vellum-ink);
}
.cv-slip-by{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(36,27,17,.6);white-space:nowrap;
  display:flex;align-items:center;gap:9px;
}
.cv-slip .cv-av{box-shadow:0 0 0 1px rgba(36,27,17,.42),inset 0 -6px 14px rgba(0,0,0,.4),0 3px 8px rgba(36,27,17,.3)}
.cv-slip .cv-av::before{background:linear-gradient(101deg,rgba(255,236,196,.4) 0%,rgba(36,27,17,.28) 68%,rgba(36,27,17,.6) 100%)}
.cv-slip-reason{
  font-family:var(--cv-hand);font-size:18.5px;line-height:1.55;
  color:rgba(36,27,17,.94);
}
/* what they did NOT say — the audience's privilege, in red ink */
.cv-unsaid{
  margin-top:15px;padding-top:12px;border-top:1px dashed rgba(117,18,30,.42);
  font-family:var(--cv-hand);font-style:italic;
  font-size:15.5px;line-height:1.5;color:var(--cv-wax);
}
.cv-unsaid b{
  display:block;font-family:var(--cv-display);font-style:normal;
  font-weight:700;font-size:9px;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(117,18,30,.68);margin-bottom:5px;
}
/* the struck slip — the losing argument stays visible, crossed out */
.cv-slip[data-struck="1"]{
  filter:saturate(.5) brightness(.82) drop-shadow(0 10px 18px rgba(0,0,0,.7));
  transform:rotate(-1.4deg) translateY(6px);
}
.cv-strike{position:absolute;inset:0;pointer-events:none;z-index:3}
.cv-strike line{stroke:var(--cv-wax-hot);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:1200;stroke-dashoffset:1200;animation:cv-draw .8s ease-out .25s forwards}
@keyframes cv-draw{to{stroke-dashoffset:0}}
.cv-overruled-stamp{
  position:absolute;right:22px;bottom:14px;z-index:4;
  font-family:var(--cv-display);font-weight:900;font-size:16px;
  letter-spacing:.28em;color:rgba(179,38,51,.88);
  border:2.5px solid rgba(179,38,51,.6);padding:3px 11px;transform:rotate(-6deg);
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}

/* the ledger of the vote */
.cv-tally{display:grid;gap:9px;margin-top:18px}
.cv-tally-row{
  display:grid;grid-template-columns:32px 1fr auto;gap:13px;align-items:center;
  padding:10px 13px;border:1px solid rgba(224,160,73,.13);
  background:linear-gradient(160deg,rgba(9,12,18,.75),rgba(4,5,8,.6));
  box-shadow:inset 0 1px 0 rgba(255,224,168,.06);
}
.cv-tally-name{font-family:var(--cv-display);font-weight:700;font-size:14px;letter-spacing:.01em}
.cv-tally-state{
  font-family:var(--cv-display);font-weight:700;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;
}
.cv-st-chosen{color:#e2515f;text-shadow:0 0 14px rgba(179,38,51,.5)}
.cv-st-struck{color:var(--cv-mute);text-decoration:line-through}
.cv-st-open{color:var(--cv-lantern);opacity:.85}

/* ── WHAT IT COST — prose, never a stat readout ────────────────────────────
   The engine moves bonds and grudges here; the screen says what that means
   in words. "Bowie & Chef -2" is a number. This is a consequence.           */
.cv-ledger{
  margin-top:20px;padding:15px 0 3px 19px;border-left:2px solid rgba(179,38,51,.6);
  box-shadow:-14px 0 26px -18px rgba(179,38,51,.8);
}
.cv-ledger-h{
  display:block;font-family:var(--cv-display);font-weight:700;font-size:9.5px;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(226,120,130,.9);margin-bottom:9px;
}
.cv-ledger p{
  font-family:var(--cv-hand);font-size:16.5px;line-height:1.55;
  color:rgba(232,221,193,.8);margin:0 0 10px;
}
.cv-ledger p:last-child{margin-bottom:0}

/* ── THE LETTER AND THE SEAL ───────────────────────────────────────────────  */
.cv-letter{position:relative;margin:10px auto 0;max-width:470px;text-align:center}
.cv-letter-sheet{
  position:relative;padding:30px 30px 66px;
  color:var(--cv-vellum-ink);
  filter:drop-shadow(0 30px 54px rgba(0,0,0,.85));
}
.cv-letter-sheet::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:
    linear-gradient(176deg,rgba(255,255,255,.16),transparent 26%),
    radial-gradient(110% 80% at 22% 4%,rgba(255,243,212,.72),transparent 60%),
    linear-gradient(158deg,var(--cv-vellum),var(--cv-vellum-2));
  filter:url(#cvDeckle);
}
.cv-letter-sheet::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:var(--cv-fibre-src);background-size:180px 180px;
  opacity:.5;mix-blend-mode:multiply;
}
.cv-letter-sheet>*{position:relative;z-index:2}
.cv-letter-sheet .cv-av{box-shadow:0 0 0 1px rgba(36,27,17,.48),inset 0 -10px 20px rgba(0,0,0,.45),0 6px 14px rgba(36,27,17,.35)}
.cv-letter-sheet .cv-av::before{background:linear-gradient(101deg,rgba(255,238,200,.42) 0%,rgba(36,27,17,.3) 66%,rgba(36,27,17,.62) 100%)}
.cv-letter-hand{font-family:var(--cv-hand);font-size:20px;line-height:1.7}
.cv-letter-name{
  font-family:var(--cv-display);font-weight:900;font-size:40px;
  letter-spacing:-.015em;margin:10px 0 4px;
}
.cv-seal-slot{
  position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.85));z-index:5;
}
.cv-seal-slot svg{animation:cv-press .78s cubic-bezier(.18,1.7,.36,1) both}
@keyframes cv-press{
  0%{transform:scale(3.1) translateY(-40px);opacity:0;filter:blur(7px)}
  55%{transform:scale(.9) translateY(3px);opacity:1;filter:blur(0)}
  74%{transform:scale(1.05) translateY(-2px)}
  100%{transform:scale(1) translateY(0);opacity:1}
}
/* the thump: a ring of displaced air leaving the wax */
.cv-shock{
  position:absolute;left:50%;bottom:-46px;width:120px;height:120px;
  transform:translate(-50%,0);border-radius:50%;pointer-events:none;z-index:4;
  border:2px solid rgba(255,219,149,.6);
  animation:cv-shock .9s cubic-bezier(.1,.7,.3,1) .45s both;
}
@keyframes cv-shock{
  0%{transform:translate(-50%,0) scale(.35);opacity:0}
  22%{opacity:.85}
  100%{transform:translate(-50%,0) scale(3.4);opacity:0}
}
.cv-shake{animation:cv-shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes cv-shake{
  0%,100%{transform:translate(0,0)}
  14%{transform:translate(-9px,2px)} 28%{transform:translate(8px,-3px)}
  43%{transform:translate(-6px,2px)} 57%{transform:translate(5px,-1px)}
  72%{transform:translate(-3px,1px)} 86%{transform:translate(2px,0)}
}

/* the irony beat — a warm room seen from a cold corridor, through a doorway */
.cv-meanwhile{position:relative;padding:0;border:none;background:none;box-shadow:none}
.cv-meanwhile-frame{
  position:relative;overflow:hidden;
  border:1px solid rgba(255,219,149,.3);
  background:
    radial-gradient(46% 40% at 16% 88%,rgba(255,148,60,.34),transparent 70%),  /* the hearth */
    radial-gradient(76% 92% at 50% 68%,rgba(255,206,132,.34),transparent 66%), /* the room  */
    radial-gradient(130% 130% at 50% 46%,rgba(46,32,18,.6),rgba(5,7,11,.99) 74%);
  padding:44px 40px 34px;text-align:center;
  box-shadow:inset 0 0 110px rgba(0,0,0,.85),0 30px 60px rgba(0,0,0,.7);
}
/* the doorway we are standing in: a hard arched frame of pure dark, and the
   whole reason the beat feels like eavesdropping rather than reporting */
.cv-meanwhile-frame::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(64% 82% at 50% 62%,transparent 54%,rgba(3,4,7,.34) 84%,rgba(3,4,7,.72) 100%);
}
.cv-meanwhile-door{position:absolute;inset:0;z-index:0;pointer-events:none}
.cv-meanwhile-door svg{width:100%;height:100%;display:block}
/* the firelight in there is not steady, because it is a fire */
.cv-meanwhile-frame{animation:cv-hearth 7.4s ease-in-out infinite}
@keyframes cv-hearth{
  0%,100%{filter:brightness(1)}
  23%{filter:brightness(1.07)}
  46%{filter:brightness(.95)}
  71%{filter:brightness(1.04)}
}
.cv-meanwhile-frame>*{position:relative;z-index:1}
.cv-pair{display:flex;gap:22px;align-items:center;justify-content:center;margin-bottom:4px}
.cv-pair-nm{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,219,149,.72);margin-top:9px;
}
.cv-meanwhile-txt{
  font-family:var(--cv-hand);font-size:20.5px;line-height:1.6;
  color:rgba(255,224,170,.92);max-width:560px;margin:18px auto 0;
  text-shadow:0 2px 18px rgba(0,0,0,.8);
}
.cv-meanwhile-cold{
  font-family:var(--cv-display);font-weight:700;font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--cv-moon);margin-top:26px;opacity:.8;
}

/* ── STATE CHIPS — only for state, never for a number ──────────────────────  */
.cv-cost{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:15px;
  border-top:1px solid rgba(224,160,73,.14);
}
.cv-chip{
  display:inline-flex;align-items:center;gap:8px;padding:6px 13px;
  border:1px solid rgba(224,160,73,.26);
  background:linear-gradient(170deg,rgba(224,160,73,.12),rgba(224,160,73,.03));
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--cv-lantern);
  box-shadow:inset 0 1px 0 rgba(255,224,168,.16);
}
.cv-chip[data-tone="bad"]{border-color:rgba(179,38,51,.45);background:linear-gradient(170deg,rgba(179,38,51,.18),rgba(179,38,51,.04));color:#e2707a}
.cv-chip[data-tone="cold"]{border-color:rgba(143,166,194,.32);background:linear-gradient(170deg,rgba(143,166,194,.12),rgba(143,166,194,.03));color:var(--cv-moon)}

/* ── SIDEBAR ───────────────────────────────────────────────────────────────  */
.cv-side-h{
  font-family:var(--cv-display);font-weight:700;font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--cv-lantern);opacity:.88;
  padding-bottom:9px;margin-bottom:15px;border-bottom:1px solid var(--cv-rule);
  display:flex;align-items:center;gap:8px;
}
.cv-side-block{margin-bottom:28px}
.cv-side-row{
  display:grid;grid-template-columns:32px 1fr auto;gap:11px;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(224,160,73,.07);
}
.cv-side-name{font-family:var(--cv-display);font-weight:700;font-size:12.5px;letter-spacing:.01em}
.cv-side-note{
  font-family:var(--cv-hand);font-style:italic;
  font-size:12px;color:var(--cv-mute);line-height:1.35;grid-column:2/4;margin-top:-3px;
}
.cv-side-tag{font-family:var(--cv-display);font-weight:700;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--cv-mute)}
.cv-side-pend{
  font-family:var(--cv-hand);font-style:italic;
  font-size:13px;color:rgba(106,116,132,.78);padding:7px 0;
}
.cv-side-host{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:5px 0}
.cv-side-host-nm{font-family:var(--cv-display);font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--cv-vellum)}
.cv-side-host-rl{font-family:var(--cv-hand);font-style:italic;font-size:12px;color:var(--cv-mute);line-height:1.35}
.cv-pot{
  font-family:var(--cv-display);font-weight:900;font-size:33px;letter-spacing:-.02em;
  color:var(--cv-lantern-hot);text-align:center;padding:6px 0 3px;
  text-shadow:0 0 26px rgba(224,160,73,.5),0 2px 0 rgba(0,0,0,.6);
}
.cv-pot-sub{
  font-family:var(--cv-hand);font-style:italic;font-size:12.5px;
  color:var(--cv-mute);text-align:center;line-height:1.45;
}
.cv-side-seal{text-align:center;padding:12px 0 4px}
.cv-side-seal-cap{
  font-family:var(--cv-display);font-weight:700;font-size:9.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--cv-mute);margin-top:9px;
}
.cv-side-target{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;margin-top:11px}
.cv-side-status{
  font-family:var(--cv-display);font-weight:700;font-size:11px;letter-spacing:.2em;
  color:var(--cv-vellum);padding:5px 0 13px;
}

/* ── REVEAL MACHINERY ──────────────────────────────────────────────────────  */
.cv-beat{opacity:0;pointer-events:none;height:0;overflow:hidden;margin:0}
.cv-beat.cv-vis{opacity:1;pointer-events:auto;height:auto;overflow:visible;margin-bottom:30px}
.cv-beat.cv-vis .cv-card,
.cv-beat.cv-vis .cv-meanwhile{animation-duration:.9s;animation-fill-mode:both;animation-timing-function:cubic-bezier(.16,.9,.28,1)}
/* CARD PHYSICS — cards MOVE differently per phase, and they have mass.      */
.cv-beat.cv-vis[data-phase="gather"]    .cv-card{animation-name:cv-emerge}
.cv-beat.cv-vis[data-phase="argue"]     .cv-card{animation-name:cv-lay}
.cv-beat.cv-vis[data-phase="overrule"]  .cv-card{animation-name:cv-jolt}
.cv-beat.cv-vis[data-phase="seal"]      .cv-card{animation-name:cv-slam}
.cv-beat.cv-vis[data-phase="meanwhile"] .cv-meanwhile{animation-name:cv-farfade;animation-duration:1.7s}
.cv-beat.cv-vis .cv-margin{animation:cv-margin-in 1.2s ease .3s both}
.cv-beat.cv-vis .cv-host{animation:cv-host-in 1s ease both}
/* out of the dark, into focus */
@keyframes cv-emerge{
  from{opacity:0;transform:translateY(22px) scale(.99);filter:blur(9px) brightness(.4)}
  to{opacity:1;transform:none;filter:blur(0) brightness(1)}
}
/* laid on the table: falls, overshoots, settles */
@keyframes cv-lay{
  0%{opacity:0;transform:translateY(-34px) rotate(2.2deg)}
  62%{opacity:1;transform:translateY(5px) rotate(-.5deg)}
  82%{transform:translateY(-2px) rotate(.2deg)}
  100%{opacity:1;transform:none}
}
/* the overrule: struck sideways */
@keyframes cv-jolt{
  0%{opacity:0;transform:translateX(-20px) skewX(2deg)}
  26%{opacity:1;transform:translateX(12px) skewX(-1.5deg)}
  48%{transform:translateX(-7px) skewX(.8deg)}
  70%{transform:translateX(3px)}
  100%{transform:none}
}
/* the sealing: dropped with weight */
@keyframes cv-slam{
  0%{opacity:0;transform:translateY(-58px) scale(1.05);filter:brightness(1.5)}
  66%{opacity:1;transform:translateY(7px) scale(.994);filter:brightness(1)}
  84%{transform:translateY(-3px)}
  100%{transform:none}
}
@keyframes cv-farfade{from{opacity:0;transform:scale(1.06);filter:blur(7px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes cv-margin-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes cv-host-in{from{opacity:0}to{opacity:1}}

/* ── STICKY CONTROLS ───────────────────────────────────────────────────────  */
.cv-controls{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,rgba(4,5,8,.1),rgba(4,5,8,.98) 44%);
  border-top:1px solid var(--cv-rule);
  padding:17px 20px;display:flex;gap:15px;justify-content:center;align-items:center;
  backdrop-filter:blur(7px);
}
.cv-btn{
  font-family:var(--cv-display);font-weight:700;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;cursor:pointer;
  background:linear-gradient(170deg,rgba(224,160,73,.16),rgba(224,160,73,.04));
  color:var(--cv-lantern);
  border:1px solid rgba(224,160,73,.42);padding:12px 26px;
  transition:background .25s,color .25s,border-color .25s,opacity .25s,box-shadow .25s;
  display:inline-flex;align-items:center;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,224,168,.18);
}
.cv-btn:hover{background:rgba(224,160,73,.26);color:var(--cv-lantern-hot);box-shadow:0 0 26px rgba(224,160,73,.3),inset 0 1px 0 rgba(255,224,168,.3)}
.cv-btn[disabled],.cv-btn.cv-dim{opacity:.3;cursor:default;pointer-events:none}
.cv-counter{
  font-family:var(--cv-display);font-weight:700;font-size:11px;letter-spacing:.26em;
  color:var(--cv-mute);min-width:86px;text-align:center;
}

/* ── ICONS ─────────────────────────────────────────────────────────────────  */
.cv-ic{display:inline-block;vertical-align:middle;flex:none}

/* ── RESPONSIVE ────────────────────────────────────────────────────────────  */
@media(max-width:900px){
  .cv-grid{grid-template-columns:1fr}
  .cv-side{position:static;border-left:none;border-top:1px solid var(--cv-rule)}
  .cv-hero{height:392px}
}
@media(max-width:700px){
  .cv-beat,.cv-beat.cv-vis{grid-template-columns:1fr}
  .cv-margin{text-align:left;border-right:none;border-left:1px dashed rgba(143,166,194,.24);padding:6px 0 6px 16px;margin-bottom:12px}
  .cv-margin::after{display:none}
  .cv-margin-ic{right:auto;left:-11px}
  .cv-main{padding:24px 18px 56px}
  .cv-head{padding:14px 20px}
  .cv-hero{height:324px}
  .cv-hero-lock{padding:0 20px 22px}
  .cv-host{grid-template-columns:1fr;gap:10px}
}

/* ── REDUCED MOTION — every animation off ──────────────────────────────────  */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cv-strike line{stroke-dashoffset:0}
  .cv-shock{display:none}
  .cv-beat.cv-vis .cv-card,.cv-beat.cv-vis .cv-meanwhile,
  .cv-beat.cv-vis .cv-margin,.cv-beat.cv-vis .cv-host{opacity:1;transform:none;filter:none}
}

<body>

<!-- ═══════════════════════════════════════════════════════════════════════
     THE FILTER BANK. Everything that makes a surface a surface lives here.
     No other screen in this repo uses SVG filters, which is deliberate: it
     is what stops the conclave reading as a recolour of anything else.
     ═══════════════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- torn deckle edge for vellum. Displacement, applied only to a sheet's
         BACKING layer, so the type printed on it stays perfectly sharp. -->
    <filter id="cvDeckle" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.05" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- the lantern's bloom: light does not stop at the glass -->
    <filter id="cvBloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cvBloomSoft" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- volumetric shafts want soft edges or they read as coloured triangles -->
    <filter id="cvShaft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <!-- pitted stone: turbulence displaced against itself -->
    <filter id="cvPit" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- wax: a lit dome, not a flat silhouette -->
    <radialGradient id="cvWaxDome" cx="34%" cy="26%" r="82%">
      <stop offset="0%"  stop-color="#e2515f"/>
      <stop offset="26%" stop-color="#b32633"/>
      <stop offset="72%" stop-color="#75121e"/>
      <stop offset="100%" stop-color="#3d0710"/>
    </radialGradient>
    <radialGradient id="cvWaxSpec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9c8" stop-opacity=".85"/>
      <stop offset="60%" stop-color="#ff9c8a" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#ff9c8a" stop-opacity="0"/>
    </radialGradient>
    <!-- brass with wear: not one gold, four -->
    <linearGradient id="cvBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f6d79a"/>
      <stop offset="26%" stop-color="#c08a3c"/>
      <stop offset="52%" stop-color="#8a5c22"/>
      <stop offset="74%" stop-color="#e0a049"/>
      <stop offset="100%" stop-color="#6a4418"/>
    </linearGradient>
  </defs>
</svg>

<div class="cv-shell" id="cv-shell" data-phase="argue">

  <!-- ── SCENERY, THREE PLANES ─────────────────────────────────────────────
       Far: the back wall of the turret, blurred and desaturated by CSS.
       Mid: the arch, the moonlit window, the light shafts, the table.
       Fore: a near pillar and the table edge, near-black and sharp.
       All SVG. No CSS div hacks anywhere in here.                          -->
  <div class="cv-far" id="cv-far" aria-hidden="true"></div>
  <div class="cv-mid" id="cv-mid" aria-hidden="true"></div>
  <div class="cv-fore" id="cv-fore" aria-hidden="true"></div>
  <div class="cv-veil" aria-hidden="true"></div>
  <div class="cv-vig" aria-hidden="true"></div>
  <div class="cv-grain" id="cv-grain" aria-hidden="true"></div>

  <div class="cv-body">

    <!-- ── THE HERO PLATE ────────────────────────────────────────────────
         A chapter card, not a page header: the turret drawn in full, the
         three of them already up there, and the title burned across it. -->
    <div class="cv-hero" id="cv-hero">
      <div id="cv-hero-scene"></div>
      <div class="cv-hero-lock">
        <div class="cv-eyebrow">The Traitors &middot; Season I &middot; Night III</div>
        <h1 class="cv-title">THE CONCLAVE</h1>
        <div class="cv-title-rule"><i></i><span id="cv-rule-seal"></span><i></i></div>
        <p class="cv-sub">Three of them climb to the turret while the castle sleeps below, and decide, calmly, which of the people they had supper with will not come down to breakfast.</p>
      </div>
    </div>

    <header class="cv-head">
      <div class="cv-observer" id="cv-observer"></div>
      <div class="cv-hostpick">Host
        <select id="cv-host-sel" onchange="cvSetHost(this.value)"></select>
      </div>
    </header>

    <div class="cv-grid">
      <main class="cv-main">
        <div id="cv-stream"></div>
      </main>
      <aside class="cv-side">
        <div id="cv-sidebar-inner"></div>
      </aside>
    </div>

  </div>
</div>

<div class="cv-controls" id="cv-controls-conclave">
  <button class="cv-btn" id="cv-btn-next" onclick="cvRevealNext()"><span id="cv-next-ic"></span>Continue</button>
  <span class="cv-counter" id="cv-counter-conclave">6 / 11</span>
  <button class="cv-btn" id="cv-btn-all" onclick="cvRevealAll()">Reveal all</button>
</div>

<script>
/* ===========================================================================

var HOSTS = [

  { id:'Claudia',  name:'Claudia Winterbourne', short:'Claudia',  slug:'claudia'  }
];
var HOST_ID = 'Valeria';   /* the registry default */
function HOST(){
  for (var i = 0; i < HOSTS.length; i++) if (HOSTS[i].id === HOST_ID) return HOSTS[i];
  return HOSTS[0];
}

/* ===========================================================================
   PORTRAITS — assets/avatars/<slug>.png, with a graceful fallback.

   filename: every slug below was confirmed against assets/avatars/.
     present  — bowie.png, chef-hatchet.png, amy.png, brick.png,
                bridgette.png, chase.png

  'Bowie':        { slug:'bowie' },
  'Chef Hatchet': { slug:'chef-hatchet' },   /* NB: not "chef.png" — no such file */
  'Amy':          { slug:'amy' },
  'Brick':        { slug:'brick' },
  'Bridgette':    { slug:'bridgette' },
  'Chase':        { slug:'chase' }
};
function _initials(name){
  return String(name || '?').split(/\s+/).map(function(w){ return w.charAt(0); }).join('').slice(0,2).toUpperCase();
}
function _avatar(slug, name, size, lit){
  var s = size || 40;
  return '<span class="cv-av" style="width:'+s+'px;height:'+s+'px"'+(lit ? ' data-lit="'+lit+'"' : '')+'>'
    + '<span class="cv-av-ini" style="font-size:'+Math.max(9, Math.round(s*0.34))+'px">'+_initials(name)+'</span>'
    + '<img src="assets/avatars/'+slug+'.png" alt="" onerror="this.remove()">'
    + '</span>';

function _av(name, size, lit){
  var e = CAST[name];

   =========================================================================== */

    cloak: '<path d="M12 2.4c-4.1 0-6.5 3.1-6.5 6.9 0 2 .7 3.5 1.4 4.5L3.4 21.8h17.2L17.1 13.8c.7-1 1.4-2.5 1.4-4.5 0-3.8-2.4-6.9-6.5-6.9z" fill="'+c+'" opacity=".92"/>'

    lantern: '<path d="M8.4 5.6c0-2.6 7.2-2.6 7.2 0" stroke="'+c+'" stroke-width="1.2"/>'

         /* the eye, pressed BELOW the surface: dark, with a lit lower lid */

/* a full-size cloak with the player's face in the hood — the one place a
   portrait and an SVG figure are composited together */
function _cloakFigure(tone, name){

  var id = 'cvClk' + tone;

    /* the cloth: lit down the left edge, falling into black on the right */

    + '<stop offset="0%" stop-color="'+body+'"/><stop offset="38%" stop-color="'+body+'" stop-opacity=".82"/>'
    + '<stop offset="100%" stop-color="#05070c"/></linearGradient>'
    + '<linearGradient id="'+id+'R" x1="0" y1="0" x2="1" y2="0">'
    + '<stop offset="0%" stop-color="rgba(255,219,149,.55)"/><stop offset="100%" stop-color="rgba(255,219,149,0)"/>'
    + '</linearGradient></defs>'
    + '<path d="M43 6c-15 0-23.5 11.2-23.5 25 0 7.2 2.6 12.6 5 16.2L6 100h74L62.5 47.2c2.4-3.6 5-9 5-16.2C67.5 17.2 58 6 43 6z" fill="url(#'+id+')"/>'
    /* the hood's inside: a hole, not a shape */
    + '<ellipse cx="43" cy="30" rx="18" ry="20.5" fill="#03050a"/>'
    /* folds, and the rim light that says where the lantern is */
    + '<path d="M43 46 31 100M43 46l12 54M36 52 22 100M50 52l14 48" stroke="#03050a" stroke-width="1.4" opacity=".5"/>'

/* ===========================================================================
   THE SCENERY — three planes, drawn in SVG and lit differently.

   The point of splitting it into three is depth. The far wall is blurred,
   desaturated and low-contrast by CSS (aerial perspective); the midground
   carries the arch, the window, the light and the table; the foreground is a
   near pillar and the table edge, almost black and perfectly sharp. A flat
   screen has one plane. This one has three, and you can see the difference
   the moment the light moves.

/* ── grain and fibre tiles ──────────────────────────────────────────────────
   feTurbulence rendered once into a data URI and tiled, rather than run as a
   live filter on a full-page element — a live turbulence over 1100x3000px
   costs frames, and this costs nothing after the first paint. */
function _noiseTile(freq, octaves, seed, alpha, size){
  var s = size || 220;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'">'
    + '<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="'+freq+'" numOctaves="'+octaves+'" seed="'+seed+'" stitchTiles="stitch"/>'
    + '<feColorMatrix type="saturate" values="0"/>'
    + '<feComponentTransfer><feFuncA type="linear" slope="'+alpha+'"/></feComponentTransfer></filter>'
    + '<rect width="100%" height="100%" filter="url(#n)"/></svg>';
  return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}

/* ── the far plane: the back wall of the turret ─────────────────────────── */

/* ── card builders ────────────────────────────────────────────────────── */
function card(title, label, ic, inner){
  return '<div class="cv-card">'
    + '<div class="cv-card-label">'+_icon(ic,14)+label+'</div>'
    + '<h3 class="cv-card-title">'+title+'</h3>'
    + inner + '</div>';
}
function said(who, line){
  return '<div class="cv-said">'+_av(who,46)
    + '<div><div class="cv-said-txt">&ldquo;'+line+'&rdquo;</div><cite>'+who+'</cite></div></div>';
}
function slipBody(s){
  return '<div class="cv-slip-head">'
    + _av(s.target,48)
    + '<span class="cv-slip-target">'+s.target.toUpperCase()+'</span>'
    + '<span class="cv-slip-by">argued by '+s.by+' '+_av(s.by,28)+'</span></div>'
    + '<div class="cv-slip-reason">&ldquo;'+s.reason+'&rdquo;</div>';
}
function slip(s){
  return '<div class="cv-slip">'+slipBody(s)
    + (s.unsaid ? '<div class="cv-unsaid"><b>What she did not say</b>'+s.unsaid+'</div>' : '')
    + '</div>';
}
function struckSlip(s){
  return '<div class="cv-slip" data-struck="1">'+slipBody(s)
    + '<svg class="cv-strike" viewBox="0 0 600 150" preserveAspectRatio="none"><line x1="14" y1="18" x2="586" y2="132"/></svg>'
    + '<div class="cv-overruled-stamp">OVERRULED</div>'
    + '</div>';
}
function tallyRow(name, by, state, txt){
  var cls = state === 'chosen' ? 'cv-st-chosen' : (state === 'struck' ? 'cv-st-struck' : 'cv-st-open');
  return '<div class="cv-tally-row">'+_av(name,28)
    + '<span class="cv-tally-name">'+name+' <span style="opacity:.4;font-size:11px">&mdash; '+by+'</span></span>'
    + '<span class="cv-tally-state '+cls+'">'+txt+'</span></div>';
}
/* the host band. The ONLY place a host name is written, and it comes from HOST(). */
function hostBand(line){
  return '<div class="cv-host">'
    + _hostAv(54)
    + '<div><div class="cv-host-name">'+_icon('aperture',12)+HOST().name+'</div>'
    + '<div class="cv-host-line">&ldquo;'+line+'&rdquo;</div></div></div>';
}

/* ===========================================================================
   SIDEBAR — rebuilt by innerHTML replacement on every reveal, gated by idx so
   it never spoils ahead. Shown here mid-reveal (6 of 11).
   Every panel is backed by something the export actually carries: the turret
   roster, the shortlist, the pot, the shield, the letter.
   =========================================================================== */
function _buildSidebarContent(idx){
  var h = '';

  h += '<div class="cv-side-block"><div class="cv-side-h">'+_icon('hourglass',12)+'Night III</div>';
  h += '<div style="font-family:\'Bodoni Moda\',Didot,serif;font-weight:600;font-size:11px;letter-spacing:.22em;color:var(--cv-vellum);padding:4px 0 12px">'
     + (idx >= 9 ? 'LETTER SEALED' : idx >= 2 ? 'IN SESSION' : 'CONVENING') + '</div>';
  h += '<div class="cv-side-host">'+_hostAv(40)
     + '<div><div class="cv-side-host-nm">'+HOST().name+'</div>'
     + '<div class="cv-side-host-rl">Your host, and the only other person awake</div></div></div></div>';

  /* who is in the turret */
  h += '<div class="cv-side-block"><div class="cv-side-h">'+_icon('cloak',12)+'In the turret</div>';
  if (idx < 1){
    h += '<div class="cv-side-pend">They are still on the stairs.</div>';
  } else {
    CONCLAVE.turret.forEach(function(t){
      var tag = '';
      if (t.name === CONCLAVE.overruled && idx >= 6) tag = 'Overruled';
      else if (t.name === 'Amy' && idx >= 4) tag = 'Private motive';
      h += '<div class="cv-side-row">'+_av(t.name,30)
        + '<span class="cv-side-name">'+t.name+'</span>'
        + '<span class="cv-side-tag">'+tag+'</span>'
        + (idx >= 6 && t.name === CONCLAVE.overruled ? '<span class="cv-side-note">Second night running. He is counting.</span>' : '')
        + '</div>';
    });
  }
  h += '</div>';

  /* the shortlist — appears name by name as each is argued */
  h += '<div class="cv-side-block"><div class="cv-side-h">'+_icon('quill',12)+'The shortlist</div>';
  var shown = [];
  if (idx >= 2) shown.push(0);
  if (idx >= 3) shown.push(1);
  if (idx >= 4) shown.push(2);
  if (!shown.length){
    h += '<div class="cv-side-pend">No name has been said aloud.</div>';
  } else {
    shown.forEach(function(i){
      var s = CONCLAVE.shortlist[i];
      var st = 'open', txt = 'Argued';
      if (idx >= 6 && s.state === 'struck'){ st = 'struck'; txt = 'Overruled'; }
      if (idx >= 8 && s.state === 'chosen'){ st = 'chosen'; txt = 'Chosen'; }
      if (idx >= 8 && s.state === 'open'){ st = 'struck'; txt = 'Withdrawn'; }
      var cls = st === 'chosen' ? 'cv-st-chosen' : (st === 'struck' ? 'cv-st-struck' : 'cv-st-open');
      h += '<div class="cv-side-row">'+_av(s.target,30)
        + '<span class="cv-side-name">'+s.target+'</span>'
        + '<span class="cv-tally-state '+cls+'">'+txt+'</span>'
        + '<span class="cv-side-note">'+s.by+'</span></div>';
    });
  }
  h += '</div>';

  /* the pot and the shield — both carried by the export */
  h += '<div class="cv-side-block"><div class="cv-side-h">'+_icon('coffer',12)+'The pot</div>';
  h += '<div class="cv-pot">&pound;'+CONCLAVE.pot+'</div>';
  h += '<div class="cv-pot-sub">'+CONCLAVE.potNote+'</div>';
  h += '<div class="cv-side-row" style="margin-top:14px;border-bottom:none">'+_icon('shield',20,'rgba(224,160,73,.6)')
     + '<span class="cv-side-name">Shield</span>'
     + '<span class="cv-side-tag">'+(CONCLAVE.shield ? 'Held' : 'None')+'</span>'
     + '<span class="cv-side-note">'+(CONCLAVE.shield
        ? CONCLAVE.shield+' cannot be touched tonight.'
        : 'Went unclaimed at the mission. Nobody at that table is safe.')+'</span></div>';
  h += '</div>';

  /* the letter */
  h += '<div class="cv-side-block"><div class="cv-side-h">'+_icon('letter',12)+'The letter</div>';
  if (idx >= 9){
    h += '<div class="cv-side-seal">'+_icon('seal',52,'#8f1a26')
       + '<div class="cv-side-seal-cap">Sealed</div></div>'
       + '<div class="cv-side-target">'+_av('Brick',46)
       + '<div><div class="cv-side-name">Brick</div>'
       + '<div class="cv-side-host-rl">Told at first light</div></div></div>';
  } else {
    h += '<div class="cv-side-pend">The wax is not lit.</div>';
  }
  h += '</div>';
  return h;
}

/* ===========================================================================
   REVEAL MACHINERY — mirrors the project's _reapplyVisibility contract.
   In the builder this reads _tvState; here it is a local index.
   =========================================================================== */
var CV_IDX = 5; /* mid-reveal, so the human can judge the partial state */

function _render(){
  var stream = document.getElementById('cv-stream');
  stream.innerHTML = BEATS.map(function(b,i){
    return '<div class="cv-beat" id="cv-step-conclave-'+i+'" data-phase="'+b.phase+'">'
      + (HOST_LINES[i] ? hostBand(HOST_LINES[i]) : '')
      + '<div class="cv-margin">'
      +   '<span class="cv-margin-ic">'+_icon(b.margin.ic,14,'rgba(143,166,194,.55)')+'</span>'
      +   '<span class="cv-margin-time">'+b.margin.t+'</span>'
      +   (b.margin.who ? '<div class="cv-margin-av">'+_av(b.margin.who,34,'dim')+'</div>' : '')
      +   '<span class="cv-margin-txt">'+b.margin.m+'</span>'
      + '</div>'
      + '<div>'+b.build()+'</div></div>';
  }).join('');
  document.getElementById('cv-observer').innerHTML =
    _icon('eye',13)+'Observer: audience <em>&mdash; you are being shown what the castle is not</em>';
  document.getElementById('cv-next-ic').innerHTML = _icon('chevron',12);
  /* the sigil sits in the rule under the title, at hero scale */
  document.getElementById('cv-rule-seal').innerHTML = _icon('seal',44,'#8f1a26');
  document.getElementById('cv-host-sel').innerHTML = HOSTS.map(function(h){
    return '<option value="'+h.id+'"'+(h.id === HOST_ID ? ' selected' : '')+'>'+h.name+'</option>';
  }).join('');
  _reapplyVisibility('conclave', CV_IDX, BEATS.length);
}

function _reapplyVisibility(suffix, upToIdx, total){
  var scroll = window.scrollY;
  for (var i = 0; i < total; i++){
    var el = document.getElementById('cv-step-'+suffix+'-'+i);
    if (!el) continue;
    if (i <= upToIdx) el.classList.add('cv-vis'); else el.classList.remove('cv-vis');
  }
  var c = document.getElementById('cv-counter-'+suffix);
  if (c) c.textContent = (upToIdx+1) + ' / ' + total;
  var done = upToIdx >= total - 1;
  document.getElementById('cv-btn-next').classList.toggle('cv-dim', done);
  document.getElementById('cv-btn-all').classList.toggle('cv-dim', done);
  /* phase atmosphere follows the last revealed beat */
  var ph = BEATS[Math.max(0, Math.min(upToIdx, total-1))].phase;
  document.getElementById('cv-shell').setAttribute('data-phase', ph);
  /* sidebar rebuilds by innerHTML replacement, from BOTH reveal paths */
  document.getElementById('cv-sidebar-inner').innerHTML = _buildSidebarContent(upToIdx);
  window.scrollTo(0, scroll);
}

function cvRevealNext(){
  if (CV_IDX >= BEATS.length - 1) return;
  CV_IDX++;
  _reapplyVisibility('conclave', CV_IDX, BEATS.length);
  var el = document.getElementById('cv-step-conclave-'+CV_IDX);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  /* the overrule is struck; the wax is PRESSED. Both land on the whole room. */
  if (BEATS[CV_IDX].phase === 'seal' || BEATS[CV_IDX].phase === 'overrule'){
    var sh = document.getElementById('cv-shell');
    sh.classList.remove('cv-shake'); void sh.offsetWidth; sh.classList.add('cv-shake');
  }
}
function cvRevealAll(){
  CV_IDX = BEATS.length - 1;
  _reapplyVisibility('conclave', CV_IDX, BEATS.length);
}
/* MOCKUP-ONLY: proves the host is a variable. Every line and every face swaps. */
function cvSetHost(v){ HOST_ID = v; _render(); }

/* ═══════════════════════════════════════════════════════════════════════════
   SCENERY BOOT — runs once. Builds the three planes, the hero, the grain and
   fibre tiles, the embers and the dust.
   ═══════════════════════════════════════════════════════════════════════════ */
(function(){
  /* the noise tiles, rendered once and handed to CSS as custom properties */
  var root = document.documentElement.style;
  root.setProperty('--cv-grain-src', _noiseTile('0.9', 4, 11, 0.42, 220));   /* film grain */
  root.setProperty('--cv-rock-src',  _noiseTile('0.035 0.09', 5, 5, 0.5, 300)); /* stone     */
  root.setProperty('--cv-fibre-src', _noiseTile('0.7 0.06', 4, 23, 0.32, 180)); /* vellum    */

  document.getElementById('cv-far').innerHTML  = _buildFar();
  document.getElementById('cv-mid').innerHTML  = _buildMid();
  document.getElementById('cv-fore').innerHTML = _buildFore();
  document.getElementById('cv-hero-scene').innerHTML = _buildHeroScene();

  /* embers rise out of the lantern and are gone before they reach the vault */
  var g = document.getElementById('cv-embers'), out = '';
  for (var i = 0; i < 30; i++){
    var x = 180 + Math.random()*760, y = 620 + Math.random()*880,
        r = 1.2 + Math.random()*2.8, d = 9 + Math.random()*14, delay = -Math.random()*18;
    out += '<circle class="cv-ember" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)
        + '" fill="url(#cvEmber)" style="animation-duration:'+d.toFixed(1)+'s;animation-delay:'+delay.toFixed(1)+'s"/>';
  }
  if (g) g.innerHTML = out;

  /* dust hanging IN the cone. Slower, dimmer, and it only exists where the
     light is — which is the whole point of drawing a volume rather than a
     gradient. */
  var m = document.getElementById('cv-motes'), mo = '';
  for (var k = 0; k < 46; k++){
    var t = Math.random(),                       /* 0 at the lantern, 1 at the floor */
        spread = 60 + t*370,
        mx = 560 + (Math.random()-0.5)*spread*2,
        my = 300 + t*1100,
        mr = 0.6 + Math.random()*1.5,
        md = 16 + Math.random()*22, mdel = -Math.random()*34;
    mo += '<circle class="cv-mote" cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="'+mr.toFixed(2)
        + '" fill="url(#cvMote)" style="animation-duration:'+md.toFixed(1)+'s;animation-delay:'+mdel.toFixed(1)+'s"/>';
  }
  if (m) m.innerHTML = mo;
})();

_render();
</script>
