<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Season Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --sc: #a78bfa; --sc-glow: rgba(167,139,250,.3); }

    .sr-hero { position:relative; border-radius:22px; overflow:hidden; margin-bottom:28px; min-height:200px; border:1px solid rgba(255,255,255,.1); }
    .sr-hero-photo { position:absolute; inset:0; background-size:cover; background-position:center top; opacity:0; transition:opacity .8s; }
    .sr-hero-overlay { position:absolute; inset:0; background:linear-gradient(135deg,rgba(10,5,25,.97) 0%,rgba(10,5,25,.65) 100%); }
    .sr-hero-body { position:relative; z-index:1; padding:36px 40px 32px; }
    .sr-hero-snum { font-size:11px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--sc); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    .sr-hero-title { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:clamp(1.6rem,4vw,2.8rem); font-weight:700; color:#fff; margin:0 0 6px; line-height:1.15; text-shadow:0 0 40px var(--sc-glow); }
    .sr-hero-sub { font-size:14px; color:var(--muted); margin:0 0 20px; }
    .sr-hero-pills { display:flex; flex-wrap:wrap; gap:8px; }
    .sr-pill { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.7); }
    .sr-pill.accent { background:rgba(255,255,255,.06); border-color:var(--sc); color:var(--sc); }

    .sr-winner { background:linear-gradient(135deg,rgba(245,158,11,.1) 0%,rgba(255,255,255,.03) 100%); border:1px solid rgba(245,158,11,.3); border-radius:20px; padding:24px 28px; margin-bottom:20px; position:relative; overflow:hidden; }
    .sr-winner::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,rgba(245,158,11,.15),transparent 70%); pointer-events:none; }
    .sr-winner-lbl { font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:#f59e0b; margin-bottom:16px; }
    .sr-winner-row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    .sr-winner-av { width:72px; height:72px; border-radius:50%; flex-shrink:0; border:3px solid rgba(245,158,11,.6); box-shadow:0 0 20px rgba(245,158,11,.3); overflow:hidden; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:28px; }
    .sr-winner-av img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-winner-info { flex:1; min-width:180px; }
    .sr-winner-name { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:1.7rem; font-weight:700; color:#f59e0b; margin:0 0 3px; }
    .sr-winner-vote { font-size:13px; color:var(--muted); margin-bottom:8px; }
    .sr-finalists { margin-top:20px; }
    .sr-finalists-lbl { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .sr-finalist-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .sr-finalist-name { font-size:13px; font-weight:700; width:90px; flex-shrink:0; }
    .sr-finalist-bar-wrap { flex:1; height:8px; background:rgba(255,255,255,.06); border-radius:20px; overflow:hidden; }
    .sr-finalist-bar { height:100%; border-radius:20px; transition:width 1s cubic-bezier(.22,.61,.36,1); }
    .sr-finalist-votes { font-size:12px; font-weight:700; width:28px; text-align:right; }

    .sr-tabs { display:flex; gap:4px; margin-bottom:24px; background:rgba(255,255,255,.04); padding:4px; border-radius:14px; border:1px solid rgba(255,255,255,.08); flex-wrap:wrap; }
    .sr-tab { padding:9px 18px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .2s; border:none; background:none; }
    .sr-tab.on { background:var(--sc-glow); color:var(--sc); box-shadow:0 0 0 1px var(--sc); }
    .sr-tab:hover:not(.on) { color:#fff; background:rgba(255,255,255,.06); }

    /* ── the wiki tab ─────────────────────────────────────────────── */
    .sr-facts { border-collapse:collapse; margin-bottom:24px; }
    .sr-facts th { text-align:left; padding:6px 18px 6px 0; color:var(--muted); font-weight:600; font-size:13px; }
    .sr-facts td { padding:6px 0; font-size:14px; }
    .sr-twists { margin:0 0 24px; }
    .sr-twists dt { font-weight:700; color:var(--sc); margin-top:12px; font-size:14px; }
    .sr-twists dd { margin:4px 0 0; font-size:13.5px; line-height:1.65; color:var(--muted); }
    /* The memory wall: everybody who walked in, in the order they walked out.
       Greyed from the week they leave, so it reads as a house emptying. */
    .sr-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; margin-bottom:26px; }
    .sr-wall-cell { display:block; text-align:center; text-decoration:none; padding:8px 4px 10px;
      border:1px solid rgba(255,255,255,.09); border-radius:10px; background:rgba(255,255,255,.03);
      transition:transform .2s,border-color .2s; }
    .sr-wall-cell:hover { transform:translateY(-3px); border-color:var(--sc); }
    .sr-wall-photo { width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; margin-bottom:6px;
      background:rgba(255,255,255,.05); }
    .sr-wall-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-wall-name { font-size:12px; font-weight:700; color:#fff; }
    .sr-wall-fate { font-size:10px; color:var(--muted); margin-top:1px; }
    .sr-wall-cell.is-out .sr-wall-photo img { filter:grayscale(1); opacity:.4; }
    .sr-wall-cell.is-out .sr-wall-name { color:var(--muted); }
    .sr-wall-cell.is-win { border-color:var(--sc); box-shadow:0 0 0 1px var(--sc), 0 0 24px var(--sc-glow); }
    /* The grid scrolls on its own rather than widening the article. */
    .sr-scroll { overflow-x:auto; margin-bottom:10px; }
    .sr-grid { border-collapse:collapse; min-width:max-content; font-size:11.5px; }
    .sr-grid th, .sr-grid td { padding:4px 7px; text-align:center; white-space:nowrap;
      border-bottom:1px solid rgba(255,255,255,.05); }
    .sr-grid thead th { color:var(--muted); font-size:10px; letter-spacing:.06em; }
    .sr-grid tbody th { text-align:left; position:sticky; left:0; background:#12091f;
      font-weight:600; }
    .sr-grid tbody th a { color:#fff; text-decoration:none; }
    .sr-grid tbody th a:hover { color:var(--sc); }
    .sr-grid td.is-hoh { background:rgba(250,204,21,.2); color:#fde68a; font-weight:800; }
    .sr-grid td.is-veto { background:rgba(56,189,248,.18); color:#bae6fd; font-weight:700; }
    .sr-grid td.is-arena { background:rgba(79,191,139,.22); color:#a7f3d0; font-weight:800; }
    .sr-grid td.is-nom { background:rgba(248,113,113,.16); color:#fecaca; }
    .sr-grid td.is-saved { background:rgba(248,113,113,.07); color:#fca5a5; }
    .sr-grid td.is-out { background:rgba(248,113,113,.34); color:#fff; font-weight:800; }
    .sr-grid td.is-gone { background:rgba(255,255,255,.02); }
    .sr-grid-tot { color:var(--muted); font-variant-numeric:tabular-nums; }
    /* ── FACES IN THE GRIDS ───────────────────────────────────────────────
       Both grids are about people and neither drew one. The row header gets
       the houseguest, and every vote cell gets the person they wrote down —
       fifteen columns of names is a table you read, fifteen columns of faces
       is one you scan, which is why the reference wikis carry portraits in
       exactly these two tables. */
    .sr-grid tbody th img { width:20px; height:20px; border-radius:50%; object-fit:cover;
      vertical-align:-6px; margin-right:6px; border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06); }
    .sr-vf { display:inline-flex; align-items:center; gap:4px; justify-content:center; }
    .sr-vf img { width:17px; height:17px; border-radius:50%; object-fit:cover;
      border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); }
    .sr-vf b { font-weight:700; }
    .sr-votes td { padding:3px 6px; }
    /* Evicted, and not back yet: not safe, not in the house. */
    .sr-grid td.is-away { background:repeating-linear-gradient(45deg,
      rgba(255,255,255,.03) 0 4px, transparent 4px 8px); color:rgba(255,255,255,.25); }
    /* The week where nobody goes home. */
    .sr-grid td.is-nowk, .sr-grid th.is-nowk { background:rgba(148,163,184,.09);
      color:var(--muted); }
    .sr-grid td.is-count { font-variant-numeric:tabular-nums; }
    .sr-pow-none-wk td { background:rgba(148,163,184,.06); }
    .sr-nowk-line { font-size:11.5px; color:var(--muted); }
    /* Somebody who left, came back, and left again. */
    .sr-wall-back { font-style:normal; color:#4fbf8b; font-weight:800; margin-left:3px; }
    .sr-key { display:inline-block; padding:1px 5px; border-radius:3px; font-size:10px; font-weight:800; }
    .sr-key.is-hoh { background:rgba(250,204,21,.2); color:#fde68a; }
    .sr-key.is-veto { background:rgba(56,189,248,.18); color:#bae6fd; }
    .sr-key.is-arena { background:rgba(79,191,139,.22); color:#a7f3d0; }
    .sr-key.is-nom { background:rgba(248,113,113,.16); color:#fecaca; }
    .sr-key.is-saved { background:rgba(248,113,113,.07); color:#fca5a5; }
    .sr-key.is-out { background:rgba(248,113,113,.34); color:#fff; }
    .sr-votes td { font-size:11px; }
    .sr-grid td.is-changed { background:rgba(167,139,250,.2); color:#ddd6fe; font-weight:700;
      cursor:help; }
    .sr-grid td.is-tiebreak { background:rgba(250,204,21,.28); color:#fde68a; font-weight:800;
      cursor:help; }
    .sr-key.is-changed { background:rgba(167,139,250,.2); color:#ddd6fe; }
    .sr-key.is-tiebreak { background:rgba(250,204,21,.28); color:#fde68a; }
    .sr-week { display:flex; gap:14px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .sr-week-n { flex:0 0 74px; font-size:11px; font-weight:800; color:var(--sc);
      letter-spacing:.06em; text-transform:uppercase; padding-top:2px; }
    .sr-week-b { flex:1; font-size:13.5px; line-height:1.65; }
    /* A written round: a title, the prose, and the record itself kept
       underneath in small type — the line the section had before, now
       reading as the citation for the paragraph above it. */
    .sr-week-t { font-weight:800; font-size:13px; letter-spacing:.01em; margin-bottom:3px; }
    .sr-week-p { margin:0 0 6px; }
    .sr-week-f { margin:0; font-size:12px; opacity:.62; line-height:1.55;
      padding-left:10px; border-left:2px solid rgba(255,255,255,.09); }
    .sr-trivia { margin:0; padding-left:20px; }
    .sr-trivia li { font-size:13.5px; line-height:1.7; margin-bottom:6px; }
    .sr-thin { font-size:13px; color:var(--muted); line-height:1.7; }
    /* ── the power table ──────────────────────────────────────────
       Who held what, week by week, as faces rather than a name in a cell.
       The voting grid below it answers "what happened to this person"; this
       answers "who ran this week", which is the first thing anybody asks of a
       season they did not watch and the one thing the page never said. */
    .sr-pow { margin-bottom:28px; }
    .sr-pow-scroll { overflow-x:auto; padding-bottom:4px; }
    .sr-pow-t { border-collapse:separate; border-spacing:0 6px; width:100%; min-width:640px; }
    .sr-pow-t thead th { font-size:10px; letter-spacing:.09em; text-transform:uppercase;
      color:var(--muted); font-weight:700; padding:0 10px 4px; text-align:left; }
    .sr-pow-t thead th:first-child { width:64px; }
    .sr-pow-t tbody tr { background:rgba(255,255,255,.028); }
    .sr-pow-t tbody tr:hover { background:rgba(255,255,255,.055); }
    .sr-pow-t td { padding:9px 10px; vertical-align:middle; }
    .sr-pow-t td:first-child { border-radius:12px 0 0 12px; }
    .sr-pow-t td:last-child { border-radius:0 12px 12px 0; }
    .sr-pow-wk { font-size:19px; font-weight:800; color:#fff; line-height:1; }
    .sr-pow-wk span { display:block; font-size:9px; font-weight:700; letter-spacing:.1em;
      color:var(--muted); margin-top:3px; white-space:nowrap; }
    .sr-pow-wk span.is-tied { color:#fbbf24; cursor:help; }
    /* one face + one name, with the ring saying which power it was */
    .sr-chip { display:inline-flex; align-items:center; gap:8px; text-decoration:none; min-width:0; }
    .sr-chip-av { position:relative; width:34px; height:34px; border-radius:50%; overflow:hidden;
      flex:none; background:rgba(255,255,255,.06); box-shadow:0 0 0 2px var(--ring,rgba(255,255,255,.18)); }
    .sr-chip-av img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-chip-n { font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .sr-chip:hover .sr-chip-n { color:var(--sc); }
    .sr-chip.is-hoh   { --ring:#facc15; }
    .sr-chip.is-veto  { --ring:#38bdf8; }
    .sr-chip.is-arena { --ring:#c084fc; }
    .sr-chip.is-out   { --ring:#f87171; }
    .sr-chip.is-out .sr-chip-av img { filter:grayscale(1); opacity:.55; }
    .sr-chip.is-out .sr-chip-n { color:#fca5a5; }
    /* the badge that says which chair it was, for anybody not reading colours */
    .sr-chip-b { position:absolute; right:-1px; bottom:-1px; width:14px; height:14px; border-radius:50%;
      display:grid; place-items:center; font-size:8px; font-weight:900; color:#160c22;
      background:var(--ring); box-shadow:0 0 0 2px #12091f; }
    /* nominees: smaller, and the one who came down is visibly struck out */
    .sr-noms { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .sr-nom { position:relative; width:26px; height:26px; border-radius:50%; overflow:hidden;
      background:rgba(255,255,255,.06); box-shadow:0 0 0 2px rgba(248,113,113,.5); display:block; }
    .sr-nom img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-nom.is-saved { box-shadow:0 0 0 2px rgba(56,189,248,.65); }
    .sr-nom.is-saved img { filter:grayscale(.7); opacity:.6; }
    .sr-nom.is-saved::after { content:''; position:absolute; left:-2px; right:-2px; top:11px; height:2px;
      background:#38bdf8; transform:rotate(-24deg); }
    /* went up after the veto came down — a different way onto the block */
    .sr-nom.is-late { box-shadow:0 0 0 2px rgba(251,146,60,.75); }
    .sr-pow-none { font-size:11.5px; color:rgba(255,255,255,.28); font-style:italic; }
    .sr-pow-key { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:10.5px; color:var(--muted); }
    .sr-pow-key i { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;
      vertical-align:-1px; }
    @media (max-width:700px){ .sr-chip-n { display:none; } .sr-pow-t { min-width:420px; } }

    .sr-panel { display:none; }
    .sr-panel.on { display:block; animation:srIn .3s ease; }
    @keyframes srIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    .sr-sh { display:flex; align-items:center; gap:10px; margin:0 0 16px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.08); }
    .sr-sh h2 { margin:0; font-size:1rem; font-weight:700; font-family:var(--font-samdan,'Samdan',sans-serif); letter-spacing:.05em; color:#fff; }
    .sr-sh-pill { padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; background:var(--sc-glow); border:1px solid var(--sc); color:var(--sc); }

    .sr-moments { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
    .sr-moment { display:flex; align-items:flex-start; gap:12px; padding:12px 16px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); font-size:13px; color:rgba(255,255,255,.85); line-height:1.5; opacity:0; transform:translateX(-8px); animation:momentIn .4s ease forwards; }
    @keyframes momentIn { to{opacity:1;transform:none} }
    .sr-moment-num { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:.8rem; font-weight:700; color:var(--sc); flex-shrink:0; width:22px; text-align:center; margin-top:1px; }

    .sr-records { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin-bottom:28px; }
    .sr-record { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:13px; padding:14px 16px; border-left:3px solid var(--sc); }
    .sr-record-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:5px; }
    .sr-record-val { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:1.1rem; font-weight:700; color:var(--sc); }
    .sr-record-sub { font-size:11px; color:var(--muted); margin-top:2px; }

    .sr-placement-row { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:14px; margin-bottom:8px; overflow:hidden; transition:border-color .2s; }
    .sr-placement-row:hover { border-color:var(--sc); }
    .sr-placement-header { display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer; }
    .sr-p-num { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:1.1rem; font-weight:700; color:var(--sc); width:36px; text-align:center; flex-shrink:0; }
    .sr-p-av { width:44px; height:44px; border-radius:50%; flex-shrink:0; border:2px solid var(--sc); overflow:hidden; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; box-shadow:0 0 10px var(--sc-glow); }
    .sr-p-av img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-p-info { flex:1; min-width:0; }
    .sr-p-name { font-weight:800; font-size:15px; color:#fff; text-decoration:none; display:block; }
    .sr-p-name:hover { color:var(--sc); }
    .sr-p-meta { font-size:11px; color:var(--muted); margin-top:2px; }
    .sr-p-phase { padding:3px 9px; border-radius:10px; font-size:11px; font-weight:700; white-space:nowrap; flex-shrink:0; }
    .sr-p-phase.winner { background:rgba(245,158,11,.18); border:1px solid rgba(245,158,11,.4); color:#f59e0b; }
    .sr-p-phase.finalist { background:rgba(167,139,250,.15); border:1px solid rgba(167,139,250,.4); color:#a78bfa; }
    .sr-p-phase.juror { background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); color:#34d399; }
    .sr-p-phase.pre-merge { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--muted); }
    .sr-p-expand { font-size:14px; color:var(--muted); flex-shrink:0; transition:transform .2s; }
    .sr-placement-row.open .sr-p-expand { transform:rotate(90deg); }
    .sr-placement-body { display:none; padding:0 16px 16px; border-top:1px solid rgba(255,255,255,.06); padding-top:14px; }
    .sr-placement-row.open .sr-placement-body { display:block; }
    .sr-p-story { font-size:13px; color:rgba(255,255,255,.8); line-height:1.7; margin-bottom:12px; }
    .sr-p-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .sr-p-chip { padding:3px 9px; border-radius:10px; font-size:11px; font-weight:600; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#ccc; }
    .sr-p-chip.imm { background:rgba(96,165,250,.1); border-color:rgba(96,165,250,.3); color:#60a5fa; }
    .sr-p-chip.idol { background:rgba(167,139,250,.1); border-color:rgba(167,139,250,.3); color:#a78bfa; }
    .sr-p-chip.votes { background:rgba(255,92,122,.09); border-color:rgba(255,92,122,.3); color:#ff7a96; }
    .sr-p-chip.ally { background:rgba(52,211,153,.09); border-color:rgba(52,211,153,.3); color:#34d399; }
    .sr-p-chip.rival { background:rgba(251,146,60,.09); border-color:rgba(251,146,60,.3); color:#fb923c; }
    .sr-p-moments { font-size:12px; color:var(--muted); margin-top:6px; }
    .sr-p-moment-item { padding:4px 0; border-bottom:1px solid rgba(255,255,255,.04); }
    .sr-p-moment-item:last-child { border-bottom:none; }


    /* Stats table view */
    .sr-view-toggle { display:flex; gap:6px; margin-bottom:14px; }
    .sr-view-btn { padding:5px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); color:var(--muted); cursor:pointer; font-size:12px; font-weight:600; transition:all .15s; }
    .sr-view-btn.on { background:rgba(125,76,255,.2); border-color:rgba(125,76,255,.45); color:#fff; }
    .sr-stats-wrap { overflow-x:auto; margin-bottom:16px; }
    .sr-stats-table { width:100%; border-collapse:collapse; font-size:12px; min-width:500px; }
    .sr-stats-table th { padding:8px 10px; text-align:center; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid rgba(255,255,255,.1); cursor:pointer; user-select:none; white-space:nowrap; }
    .sr-stats-table th:hover { color:#fff; }
