<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Season Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root { --sc: #a78bfa; --sc-glow: rgba(167,139,250,.3); }

    .sr-hero { position:relative; border-radius:22px; overflow:hidden; margin-bottom:28px; min-height:200px; border:1px solid rgba(255,255,255,.1); }
    .sr-hero-photo { position:absolute; inset:0; background-size:cover; background-position:center top; opacity:0; transition:opacity .8s; }
    .sr-hero-overlay { position:absolute; inset:0; background:linear-gradient(135deg,rgba(10,5,25,.97) 0%,rgba(10,5,25,.65) 100%); }
    .sr-hero-body { position:relative; z-index:1; padding:36px 40px 32px; }
    .sr-hero-snum { font-size:11px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--sc); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    .sr-hero-title { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:clamp(1.6rem,4vw,2.8rem); font-weight:700; color:#fff; margin:0 0 6px; line-height:1.15; text-shadow:0 0 40px var(--sc-glow); }
    .sr-hero-sub { font-size:14px; color:var(--muted); margin:0 0 20px; }
    .sr-hero-pills { display:flex; flex-wrap:wrap; gap:8px; }
    .sr-pill { padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.7); }
    .sr-pill.accent { background:rgba(255,255,255,.06); border-color:var(--sc); color:var(--sc); }

    .sr-winner { background:linear-gradient(135deg,rgba(245,158,11,.1) 0%,rgba(255,255,255,.03) 100%); border:1px solid rgba(245,158,11,.3); border-radius:20px; padding:24px 28px; margin-bottom:20px; position:relative; overflow:hidden; }
    .sr-winner::before { content:''; position:absolute; top:-30px; right:-30px; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,rgba(245,158,11,.15),transparent 70%); pointer-events:none; }
    .sr-winner-lbl { font-size:10px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:#f59e0b; margin-bottom:16px; }
    .sr-winner-row { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    /* A ROW WITH PROSE IN IT IS NOT A ROW. The Strategy and Legacy blocks moved
       inside `sr-winner-info` so that a split season draws them under the
       person the singular block actually names — right, and it turns a
       one-line row into a paragraph with a 72px avatar floating in the middle
       of it. Top-aligned only where there is prose, so the fifteen seasons
       without any keep the centred row they have always had. */
    .sr-winner-row.is-tall { align-items:flex-start; }
    .sr-winner-row.is-tall .sr-winner-av { margin-top:4px; }
    /* And the prose gets room to be prose. `min-width:180px` is a floor for a
       name and a tally; a paragraph in a 180px column is a ladder. */
    .sr-winner-row.is-tall .sr-winner-info { min-width:min(100%,320px); }
    .sr-winner-av { width:72px; height:72px; border-radius:50%; flex-shrink:0; border:3px solid rgba(245,158,11,.6); box-shadow:0 0 20px rgba(245,158,11,.3); overflow:hidden; background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:28px; }
    .sr-winner-av img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-winner-info { flex:1; min-width:180px; }
    .sr-winner-name { font-family:var(--font-samdan,'Samdan',sans-serif); font-size:1.7rem; font-weight:700; color:#f59e0b; margin:0 0 3px; }
    .sr-winner-vote { font-size:13px; color:var(--muted); margin-bottom:8px; }
    .sr-finalists { margin-top:20px; }
    .sr-finalists-lbl { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .sr-finalist-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .sr-finalist-name { font-size:13px; font-weight:700; width:90px; flex-shrink:0; }
    .sr-finalist-bar-wrap { flex:1; height:8px; background:rgba(255,255,255,.06); border-radius:20px; overflow:hidden; }
    .sr-finalist-bar { height:100%; border-radius:20px; transition:width 1s cubic-bezier(.22,.61,.36,1); }
    .sr-finalist-votes { font-size:12px; font-weight:700; width:28px; text-align:right; }

    .sr-tabs { display:flex; gap:4px; margin-bottom:24px; background:rgba(255,255,255,.04); padding:4px; border-radius:14px; border:1px solid rgba(255,255,255,.08); flex-wrap:wrap; }
    .sr-tab { padding:9px 18px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .2s; border:none; background:none; }
    .sr-tab.on { background:var(--sc-glow); color:var(--sc); box-shadow:0 0 0 1px var(--sc); }
    .sr-tab:hover:not(.on) { color:#fff; background:rgba(255,255,255,.06); }

    /* ── the wiki tab ─────────────────────────────────────────────── */
    .sr-facts { border-collapse:collapse; margin-bottom:24px; }
    .sr-facts th { text-align:left; padding:6px 18px 6px 0; color:var(--muted); font-weight:600; font-size:13px; }
    .sr-facts td { padding:6px 0; font-size:14px; }
    /* The episode list, laid out the way a season article lays it out:
       a heading per night and a definition list of the night's facts. */
    .sr-eps { display:flex; flex-direction:column; gap:18px; }
    /* NOT .sr-ep -- the voting-history row already owns that name further down
       this file, and being later it won: display:flex + align-items:center
       turned every heading and fact list into centred flex siblings, so each
       block started at a different left edge. */
    .sr-epblk { border-left:3px solid var(--sc); padding:2px 0 2px 14px; }
    .sr-epblk h3 { margin:0 0 8px; font-size:15px; }
    .sr-epfacts { display:grid; grid-template-columns:118px 1fr; gap:3px 14px; margin:0; }
    .sr-epfacts dt { font-weight:700; font-size:12px; color:var(--sc);
      text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; }
    .sr-epfacts dd { margin:0; font-size:13.5px; line-height:1.6; }
    .sr-epface { width:20px; height:20px; border-radius:50%; vertical-align:-5px;
      margin-right:6px; object-fit:cover; }
    /* The part a fandom page cannot carry: what the panel thought before the
       host spoke, and which storylines the edit was running. */
    .sr-epindex { border-collapse:collapse; width:100%; margin:0 0 18px; font-size:13px; }
    .sr-epindex th, .sr-epindex td { border:1px solid var(--line,rgba(0,0,0,.12));
      padding:5px 10px; text-align:left; }
    .sr-epindex th { font-size:11px; letter-spacing:.06em; text-transform:uppercase;
      color:var(--sc); font-weight:700; }
    .sr-epindex th:first-child, .sr-epindex th:nth-child(2),
    .sr-epindex td:first-child, .sr-epindex td:nth-child(2) { width:1%; white-space:nowrap;
      text-align:center; }
    .sr-epindex td:first-child, .sr-epindex td:nth-child(2) { color:var(--muted); }
    .sr-epindex a { color:inherit; text-decoration:none; border-bottom:1px solid currentColor; }
    /* The heading's own link, the way a wiki marks a section you can point
       at: invisible until the block is hovered, so nine of them do not sit
       in the margin shouting. */
    .sr-epanchor { margin-left:8px; font-size:12px; color:var(--sc); opacity:0;
      text-decoration:none; transition:opacity .12s; }
    .sr-epblk:hover .sr-epanchor, .sr-epanchor:focus { opacity:.75; }
    .sr-epblk:target { background:rgba(255,92,122,.06); }
    .sr-epnote { margin:8px 0 0; font-size:12.5px; line-height:1.6;
      color:var(--muted); font-style:italic; }
    @media (max-width:640px) {
      .sr-epfacts { grid-template-columns:1fr; gap:1px; }
      .sr-epfacts dt { margin-top:6px; }
    }
    .sr-twists { margin:0 0 24px; }
    .sr-twists dt { font-weight:700; color:var(--sc); margin-top:12px; font-size:14px; }
    .sr-twists dd { margin:4px 0 0; font-size:13.5px; line-height:1.65; color:var(--muted); }
    /* The memory wall: everybody who walked in, in the order they walked out.
       Greyed from the week they leave, so it reads as a house emptying. */
    /* ── THE PODIUM ───────────────────────────────────────────────────────
       The top three, out of the grid and stood on a podium: second, first,
       third, with the winner raised. */
    .sr-podium { display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:12px;
      align-items:end; margin:2px 0 16px; }
    .sr-pod { display:block; text-decoration:none; text-align:center; padding:10px 8px 12px;
      border-radius:14px; border:1px solid rgba(255,255,255,.1);
      background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
      transition:transform .22s,box-shadow .22s,border-color .22s; }
    .sr-pod:hover { transform:translateY(-4px); }
    /* The status plate across the top of a card. Colour-coded the way the
       reference walls are: the winner's own, silver for the seat beside them,
       purple for the jury, flat for everybody who left before it. */
    .sr-pod-banner { font-size:9.5px; font-weight:900; letter-spacing:.05em;
      text-transform:uppercase; padding:3px 6px; margin:-4px -4px 7px; border-radius:7px;
      background:rgba(255,255,255,.07); color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sr-pod-banner.is-winner { background:linear-gradient(180deg,#fde68a,#f59e0b); color:#231103; }
    .sr-pod-banner.is-runner { background:rgba(226,232,240,.22); color:#e2e8f0; }
    .sr-pod-banner.is-jury { background:rgba(167,139,250,.22); color:#d8ccff; }
    .sr-pod-banner.is-gone { background:rgba(248,113,113,.15); color:#fca5a5; }
    .sr-pod .sr-pod-banner { font-size:10.5px; margin:-6px -8px 9px; border-radius:9px; }
    .sr-pod-photo { position:relative; width:100%; aspect-ratio:1; border-radius:12px;
      overflow:hidden; background:rgba(255,255,255,.05); }
    .sr-pod-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-pod-rank { position:absolute; left:6px; top:6px; padding:2px 8px; border-radius:999px;
      font-size:11px; font-weight:900; letter-spacing:.03em; color:#160c22;
      box-shadow:0 2px 10px rgba(0,0,0,.45); }
    .sr-pod-name { margin-top:8px; font-size:15px; font-weight:800; color:#fff; }
    .sr-pod-fate { font-size:11px; letter-spacing:.06em; text-transform:uppercase;
      font-weight:700; color:var(--muted); margin-top:2px; }
    /* first: raised, lit, and wearing the season's colour */
    .sr-pod.is-1 { border-color:var(--sc); box-shadow:0 0 0 1px var(--sc),0 12px 40px var(--sc-glow);
      background:linear-gradient(180deg,var(--sc-glow),rgba(255,255,255,.02)); }
    .sr-pod.is-1 .sr-pod-photo { box-shadow:inset 0 0 0 2px var(--sc); }
    .sr-pod.is-1 .sr-pod-name { font-size:18px; }
    .sr-pod.is-1 .sr-pod-fate { color:#fde68a; }
    .sr-pod.is-1 .sr-pod-rank { background:linear-gradient(180deg,#fde68a,#f59e0b); }
    .sr-pod.is-2 .sr-pod-rank { background:linear-gradient(180deg,#f1f5f9,#94a3b8); }
    .sr-pod.is-3 .sr-pod-rank { background:linear-gradient(180deg,#f0b27a,#b45309); color:#2a1206; }
    .sr-pod.is-2 { margin-bottom:10px; }
    .sr-pod.is-3 { margin-bottom:20px; }
    @media (max-width:620px) { .sr-podium { grid-template-columns:1fr 1fr 1fr; }
      .sr-pod.is-2, .sr-pod.is-3 { margin-bottom:0; } }
    @media (prefers-reduced-motion:reduce) { .sr-pod, .sr-wall-cell { transition:none; } }
    .sr-wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px; margin-bottom:26px; }
    .sr-wall-cell { display:block; text-align:center; text-decoration:none; padding:8px 4px 10px;
      border:1px solid rgba(255,255,255,.09); border-radius:10px; background:rgba(255,255,255,.03);
      transition:transform .2s,border-color .2s; }
    .sr-wall-cell:hover { transform:translateY(-3px); border-color:var(--sc); }
    .sr-wall-photo { width:100%; aspect-ratio:1; border-radius:8px; overflow:hidden; margin-bottom:6px;
      background:rgba(255,255,255,.05); }
    .sr-wall-photo { position:relative; }
    .sr-wall-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    /* The finish, stamped on the portrait — which leaves the line underneath
       free to say the week they went, the thing a reader is actually after. */
    .sr-wall-rank { position:absolute; left:4px; top:4px; padding:1px 6px; border-radius:999px;
      font-size:9.5px; font-weight:900; color:#fff; background:rgba(12,7,22,.72);
      border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(2px); }
    .sr-wall-name { font-size:12px; font-weight:700; color:#fff; }
    .sr-wall-fate { font-size:10px; color:var(--muted); margin-top:1px; }
    .sr-wall-fate b { color:#fff; font-weight:800; }
    .sr-wall-cell.is-win .sr-wall-fate b { color:var(--sc); }
    .sr-wall-cell.is-win { border-color:var(--sc); box-shadow:0 0 0 1px var(--sc), 0 0 24px var(--sc-glow); }
    /* The grid scrolls on its own rather than widening the article. */
    .sr-scroll { overflow-x:auto; margin-bottom:10px; }
    .sr-grid { border-collapse:collapse; min-width:max-content; font-size:11.5px; }
    .sr-grid th, .sr-grid td { padding:4px 7px; text-align:center; white-space:nowrap;
      border-bottom:1px solid rgba(255,255,255,.05); }
    .sr-grid thead th { color:var(--muted); font-size:10px; letter-spacing:.06em; }
    .sr-grid tbody th { text-align:left; position:sticky; left:0; background:#12091f;
      font-weight:600; }
    .sr-grid tbody th a { color:#fff; text-decoration:none; }
    .sr-grid tbody th a:hover { color:var(--sc); }
    .sr-grid td.is-hoh { background:rgba(250,204,21,.2); color:#fde68a; font-weight:800; }
    .sr-grid td.is-veto { background:rgba(56,189,248,.18); color:#bae6fd; font-weight:700; }
    .sr-grid td.is-arena { background:rgba(79,191,139,.22); color:#a7f3d0; font-weight:800; }
    .sr-grid td.is-nom { background:rgba(248,113,113,.16); color:#fecaca; }
    .sr-grid td.is-saved { background:rgba(248,113,113,.07); color:#fca5a5; }
    .sr-grid td.is-out { background:rgba(248,113,113,.34); color:#fff; font-weight:800; }
    .sr-grid td.is-gone { background:rgba(255,255,255,.02); }
    .sr-grid-tot { color:var(--muted); font-variant-numeric:tabular-nums; }
    /* ── FACES IN THE GRIDS ───────────────────────────────────────────────
       Both grids are about people and neither drew one. The row header gets
       the houseguest, and every vote cell gets the person they wrote down —
       fifteen columns of names is a table you read, fifteen columns of faces
       is one you scan, which is why the reference wikis carry portraits in
       exactly these two tables. */
    .sr-grid tbody th img { width:20px; height:20px; border-radius:50%; object-fit:cover;
      vertical-align:-6px; margin-right:6px; border:1px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.06); }
    .sr-vf { display:inline-flex; align-items:center; gap:4px; justify-content:center; }
    .sr-vf img { width:17px; height:17px; border-radius:50%; object-fit:cover;
      border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.06); }
    .sr-vf b { font-weight:700; }
    .sr-votes td { padding:3px 6px; }
    /* Evicted, and not back yet: not safe, not in the house. */
    .sr-grid td.is-away { background:repeating-linear-gradient(45deg,
      rgba(255,255,255,.03) 0 4px, transparent 4px 8px); color:rgba(255,255,255,.25); }
    /* The week where nobody goes home. */
    .sr-grid td.is-nowk, .sr-grid th.is-nowk { background:rgba(148,163,184,.09);
      color:var(--muted); }
    .sr-grid td.is-count { font-variant-numeric:tabular-nums; }
    .sr-pow-none-wk td { background:rgba(148,163,184,.06); }
    .sr-nowk-line { font-size:11.5px; color:var(--muted); }
    .sr-pow-wk .is-second { display:block; font-size:9px; letter-spacing:.06em;
      color:#fca5a5; font-weight:800; }
    .sr-pow-finale td { background:rgba(250,204,21,.07); }
    .sr-grid th.is-finale { color:#fde68a; }
    .sr-grid th sup { font-size:8px; opacity:.7; }
    /* Somebody who left, came back, and left again. */
    .sr-wall-back { font-style:normal; color:#4fbf8b; font-weight:800; margin-left:3px; }
    .sr-key { display:inline-block; padding:1px 5px; border-radius:3px; font-size:10px; font-weight:800; }
    .sr-key.is-hoh { background:rgba(250,204,21,.2); color:#fde68a; }
    .sr-key.is-veto { background:rgba(56,189,248,.18); color:#bae6fd; }
    .sr-key.is-arena { background:rgba(79,191,139,.22); color:#a7f3d0; }
    .sr-key.is-nom { background:rgba(248,113,113,.16); color:#fecaca; }
    .sr-key.is-saved { background:rgba(248,113,113,.07); color:#fca5a5; }
    .sr-key.is-out { background:rgba(248,113,113,.34); color:#fff; }
    .sr-votes td { font-size:11px; }
    .sr-grid td.is-changed { background:rgba(167,139,250,.2); color:#ddd6fe; font-weight:700;
      cursor:help; }
    .sr-grid td.is-tiebreak { background:rgba(250,204,21,.28); color:#fde68a; font-weight:800;
      cursor:help; }
    .sr-key.is-changed { background:rgba(167,139,250,.2); color:#ddd6fe; }
    .sr-key.is-tiebreak { background:rgba(250,204,21,.28); color:#fde68a; }
    .sr-week { display:flex; gap:14px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); }
    .sr-week-n { flex:0 0 74px; font-size:11px; font-weight:800; color:var(--sc);
      letter-spacing:.06em; text-transform:uppercase; padding-top:2px; }
    .sr-week-b { flex:1; font-size:13.5px; line-height:1.65; }
    /* A written round: a title, the prose, and the record itself kept
       underneath in small type — the line the section had before, now
       reading as the citation for the paragraph above it. */
    .sr-week-t { font-weight:800; font-size:13px; letter-spacing:.01em; margin-bottom:3px; }
    .sr-week-p { margin:0 0 6px; }
    .sr-week-f { margin:0; font-size:12px; opacity:.62; line-height:1.55;
      padding-left:10px; border-left:2px solid rgba(255,255,255,.09); }
    .sr-trivia { margin:0; padding-left:20px; }
    .sr-trivia li { font-size:13.5px; line-height:1.7; margin-bottom:6px; }
    .sr-thin { font-size:13px; color:var(--muted); line-height:1.7; }
    /* ── the power table ──────────────────────────────────────────
       Who held what, week by week, as faces rather than a name in a cell.
       The voting grid below it answers "what happened to this person"; this
       answers "who ran this week", which is the first thing anybody asks of a
       season they did not watch and the one thing the page never said. */
    .sr-pow { margin-bottom:28px; }
    .sr-pow-scroll { overflow-x:auto; padding-bottom:4px; }
    .sr-pow-t { border-collapse:separate; border-spacing:0 6px; width:100%; min-width:640px; }
    .sr-pow-t thead th { font-size:10px; letter-spacing:.09em; text-transform:uppercase;
      color:var(--muted); font-weight:700; padding:0 10px 4px; text-align:left; }
    .sr-pow-t thead th:first-child { width:64px; }
    .sr-pow-t tbody tr { background:rgba(255,255,255,.028); }
    .sr-pow-t tbody tr:hover { background:rgba(255,255,255,.055); }
    .sr-pow-t td { padding:9px 10px; vertical-align:middle; }
    .sr-pow-t td:first-child { border-radius:12px 0 0 12px; }
    .sr-pow-t td:last-child { border-radius:0 12px 12px 0; }
    .sr-pow-wk { font-size:19px; font-weight:800; color:#fff; line-height:1; }
    .sr-pow-wk span { display:block; font-size:9px; font-weight:700; letter-spacing:.1em;
      color:var(--muted); margin-top:3px; white-space:nowrap; }
    .sr-pow-wk span.is-tied { color:#fbbf24; cursor:help; }
    /* one face + one name, with the ring saying which power it was */
    .sr-chip { display:inline-flex; align-items:center; gap:8px; text-decoration:none; min-width:0; }
    .sr-chip-av { position:relative; width:34px; height:34px; border-radius:50%; overflow:hidden;
      flex:none; background:rgba(255,255,255,.06); box-shadow:0 0 0 2px var(--ring,rgba(255,255,255,.18)); }
    .sr-chip-av img { width:100%; height:100%; object-fit:cover; display:block; }
    .sr-chip-n { font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    .sr-chip:hover .sr-chip-n { color:var(--sc); }
    .sr-chip.is-hoh   { --ring:#facc15; }
    .sr-chip.is-veto  { --ring:#38bdf8; }
    .sr-chip.is-arena { --ring:#c084fc; }
    .sr-chip.is-out   { --ring:#f87171; }
    .sr-chip.is-out .sr-chip-av img { filter:grayscale(1); opacity:.55; }
    .sr-chip.is-out .sr-chip-n { color:#fca5a5; }
    /* the badge that says which chair it was, for anybody not reading colours */
    .sr-chip-b { position:absolute; right:-1px; bottom:-1px; width:14px; height:14px; border-radius:50%;
      display:grid; place-items:center; font-size:8px; font-weight:900; color:#160c22;
      background:var(--ring); box-shadow:0 0 0 2px #12091f; }
    /* nominees: smaller, and the one who came down is visibly struck out */
    .sr-noms { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .sr-nom { position:relative; width:26px; height:26px; border-radius:50%; overflow:hidden;
      background:rgba(255,255,255,.06); box-shadow:0 0 0 2px rgba(248,113,113,.5); display:block; }

<!-- The page script below is a classic script, so it cannot import. This pair

<script>

<script type="module">
  /* `showWords`/`exitVerbs`/`roundExits`/`publicBallots` come through with the
     rest because this page WRITES SENTENCES ABOUT A SEASON, and every one of
     them was taking its words from a two-way ternary: "Voted out" over a
     banishment, "Total Drama" in a Traitors infobox, and the murdered never
     leaving the wall at all, because `evicted` is the vote and only the vote. */
  import { parseSeasonRef, seasonId, showName, DEFAULT_FORMAT,
    showWords, exitVerbs, roundExits, publicBallots } from './js/shows.js';
  window.shows = { parseSeasonRef, seasonId, showName, DEFAULT_FORMAT,
    showWords, exitVerbs, roundExits, publicBallots };
  /* The wiki tab is an ARTICLE, and the site already has an article
     stylesheet — the one the character pages use. Borrowing it rather than
     writing a second one is the whole reason the two read as the same
     encyclopaedia rather than as a dashboard with a wiki-shaped tab in it. */
  import { buildWikiTab } from './js/season-wiki-tab.js';
  window.buildWikiTab = buildWikiTab;
  /* The track record chart brings its own stylesheet for the same reason the
     article does: the builder is shared with the character page and the
     viewing party, and a chart whose colours live in one page's <style> block
     draws as a grey table everywhere else. */
  import { TRACK_RECORD_CSS } from './js/dr/grid.js';
  import { WIKI_CSS } from './js/wiki-view.js';
  /* Who won, however many of them there were. `winner{}` is singular and a
     season that ended in a split leaves it null, so reading it directly threw
     on the hero line before the page drew anything at all. */
  import { seasonWinners } from './js/records.js';
  window.seasonWinners = seasonWinners;
  const wkStyle = document.createElement('style');
  wkStyle.textContent = WIKI_CSS + TRACK_RECORD_CSS;
  document.head.appendChild(wkStyle);
  window._showsResolve(window.shows);
</script>

<script>
/* Display names come through window.shows above. The copy that used to sit
   here headed an unlisted show's page with its slug. */
const SEASON_COLORS=['#60a5fa','#a78bfa','#34d399','#f59e0b','#fb923c','#f472b6','#38bdf8','#fbbf24','#e879f9'];

function slugify(n){return(n||'').toLowerCase().replace(/[^a-z0-9]/g,'-');}

/* ── Portraits ──────────────────────────────────────────────────────────
   This is an APPEARANCE page: every row on it is one person in one season,
   and the season recorded which of their portraits it used. Rebuilding the
   path from the slug drew whatever their profile default happens to be TODAY,
   so re-reading an old season after somebody got new art showed the new art.
   Rows written before portraits existed have no avatarFile and still fall back
   to the old convention. */
function _srSafeFile(f){return typeof f==='string'&&!!f&&!/[\/:]/.test(f)&&!f.includes('..')&&/\.(png|webp|jpe?g|gif)$/i.test(f);}
let _srRowsByName=new Map();
/* The episode strip knows an eliminated player only by name, so index the
   season's own placement rows and let a name reach the portrait too. */
function srIndexRows(season){
  _srRowsByName=new Map();
  for(const r of ((season&&season.placements)||[])) if(r&&r.name) _srRowsByName.set(String(r.name).toLowerCase(),r);
}
function srFace(row,fallbackSlug,name){
  if(_srSafeFile(row&&row.avatarFile))return 'assets/avatars/'+row.avatarFile;
  const byName=_srRowsByName.get(String(name||(row&&row.name)||'').toLowerCase());
  if(_srSafeFile(byName&&byName.avatarFile))return 'assets/avatars/'+byName.avatarFile;
  return 'assets/avatars/'+(fallbackSlug||slugify((row&&row.name)||name||''))+'.png';
}
function plink(name,ps){const s=ps||slugify(name);return `<a href="player.html?player=${s}" style="color:var(--sc);font-weight:700">${name}</a>`;}
function phaseClass(p){if(!p)return'pre-merge';const lp=p.toLowerCase();if(lp==='winner')return'winner';if(lp==='finalist')return'finalist';if(lp.includes('juror'))return'juror';return'pre-merge';}


function buildAwardHighlights(awards){
  if(!awards)return'';
  const PICKS=[
    {key:'fanFavorite',    label:'⭐ Fan Favorite'},
    {key:'bestStrategic',  label:'🧠 Best Strategic'},
    {key:'seasonMVP',      label:'👑 Season MVP'},
    {key:'bestPhysical',   label:'💪 Best Physical'},
    {key:'biggestVillain', label:'😈 Biggest Villain'},
    {key:'bestUnderdog',   label:'🔥 Best Underdog'},
    {key:'mostChaotic',    label:'🌀 Most Chaotic'},
    {key:'ironPerson',     label:'🛡️ Iron Person'},
  ];
  return PICKS.map(({key,label})=>{
    const a=awards[key];if(!a)return'';
    const name=a.name||'';if(!name)return'';
    const ps=a.playerSlug||slugify(name);
    const desc=a.description||a.desc||'';
    return`<div class="sr-hl-card">
      <div class="sr-hl-label">${label}</div>
      <div class="sr-hl-row">
        <div class="sr-hl-av">
          <img src="${srFace(a, ps, name)}" onload="this.style.display='block';this.parentElement.querySelector('span').style.display='none'" onerror="this.style.display='none'"/>
          <span>${name.substring(0,2).toUpperCase()}</span>
        </div>
        <div>
          <div class="sr-hl-name">${plink(name,ps)}</div>
          ${desc?`<div class="sr-hl-desc">${desc}</div>`:''}
        </div>
      </div>
    </div>`;
  }).filter(Boolean).join('');
}

function buildRecords(season){
  const st=season.statistics;if(!st)return'';
  const records=[];
  if(st.challengeWins?.mostTotal){const r=st.challengeWins.mostTotal;records.push({label:'Most Ch. Wins',val:r.wins,sub:r.name});}
  if(st.challengeWins?.mostImmunity){const r=st.challengeWins.mostImmunity;records.push({label:'Most Immunity',val:r.wins,sub:r.name});}
  if(st.challengeWins?.longestStreak){const r=st.challengeWins.longestStreak;records.push({label:'Longest Streak',val:r.wins,sub:r.note||r.name});}
  if(st.socialGame?.fewestVotes){const r=Array.isArray(st.socialGame.fewestVotes)?st.socialGame.fewestVotes[0]:st.socialGame.fewestVotes;records.push({label:'Fewest Votes',val:r.votes+' votes',sub:r.name+(r.note?' ('+r.note+')':'')});}
  if(st.socialGame?.mostVotes){const r=st.socialGame.mostVotes;records.push({label:'Most Votes Against',val:r.votes+' votes',sub:r.name});}
  if(st.socialGame?.mostJuryVotes){const r=st.socialGame.mostJuryVotes;records.push({label:'Most Jury Votes',val:r.votes,sub:r.name});}
  if(st.extreme?.closestFinale)records.push({label:'Finale Vote',val:st.extreme.closestFinale,sub:'Final Tribal'});
  if(st.strategic?.longestIdolHold){const r=st.strategic.longestIdolHold;records.push({label:'Longest Idol Hold',val:r.tribals+' tribals',sub:r.name});}
  if(st.extreme?.tieVotes)records.push({label:'Tie Votes',val:st.extreme.tieVotes,sub:'This season'});
  if(st.extreme?.rockDraws)records.push({label:'Rock Draws',val:st.extreme.rockDraws,sub:'Tiebreaker'});
  if(!records.length)return'';
  return`<div class="sr-sh sr-reveal"><h2>Season Records</h2></div>
  <div class="sr-records sr-reveal">${records.map(r=>`<div class="sr-record"><div class="sr-record-lbl">${r.label}</div><div class="sr-record-val">${r.val}</div><div class="sr-record-sub">${r.sub}</div></div>`).join('')}</div>`;
}

(async function(){
  try{
    /* The registry is an enhancement, not a dependency: on file://, or if the
       module 404s, browsers never run it and waiting forever would turn a
       missing nicety into a page that never loads. Without it only bare
       numbers resolve — which is Total Drama, which is what every bookmarked
       link on this site already means. */
    await Promise.race([
      window._showsReady,
      new Promise(resolve=>setTimeout(()=>resolve(null),3000)),
    ]);

    const raw=new URLSearchParams(window.location.search).get('season');
    const shows=window.shows||null;
    const ref=shows
      ? shows.parseSeasonRef(raw)
      : (/^\d+$/.test(String(raw||'').trim()) && Number(raw)>0 ? {format:null,number:Number(raw)} : null);
    if(!ref){document.getElementById('season-content').innerHTML='<div class="hero"><h1>⚠️ No Season Specified</h1><p><a href="seasons.html">← Back to Seasons</a></p></div>';return;}

    const sn=ref.number;
    /* Total Drama keeps the bare filename its fourteen files already use;
       every other show is namespaced by seasonId, exactly as the publish path
       writes them. */
    const isDefault=!shows||ref.format===shows.DEFAULT_FORMAT;
    const file=isDefault?'season'+sn+'-data.json':shows.seasonId(ref.format,sn)+'-data.json';
    /* Links onward carry the same reference they arrived on. */
    const seasonRef=isDefault?String(sn):shows.seasonId(ref.format,sn);

    const resp=await fetch('data/seasons/'+file);
    if(!resp.ok)throw new Error('Season '+sn+' data not found');
    const s=await resp.json();

    // The air window lives on the season's ROW, not in its document — one home
    // for the calendar, so the two cannot drift. Optional: a page that cannot
    // reach the database still renders, just without a date.
    try {
      const db = await fetch('seasons_database.json').then(r => r.ok ? r.json() : null);
      // Matched on the ID and on the number+format, because the reference this
      // page travels on is the BARE number for Total Drama ("12") while the
      // database keys everything as "td-12". Comparing only the id found
      // nothing and the date silently never appeared.
      const rows = db?.seasons || [];
      window.__seasonRow = rows.find(x => x.seasonId === seasonRef)
        || rows.find(x => Number(x.seasonNumber) === Number(sn)
          && (x.format || shows.DEFAULT_FORMAT) === (ref.format || shows.DEFAULT_FORMAT))
        || null;
    } catch { window.__seasonRow = null; }

    /* What this season is CALLED. A bare "S1" titles Big Brother 1 as though it
       were Total Drama's premiere — the same number naming two different

    const showPrefix = isDefaultShow ? 'S' : shows.seasonId(ref.format, sn).split('-')[0].toUpperCase();
    const seasonLabel = isDefaultShow ? `Season ${sn}` : `${shows.showName(ref.format)} ${sn}`;
    document.title = showPrefix + sn + ' — ' + s.title;
    document.getElementById('footer-sub').textContent=s.title+' • '+s.castSize+' players';

    // [AI_FILL] IS A PLACEHOLDER, NOT A VALUE.
    //
    // The export writes it into fields the writer has not filled yet, and every
    // other reader in the project strips it — this page did not, so a season
    // whose emoji had never been written rendered the literal string
    // "[AI_FILL]" in its own headline.
    function _emoji(v) {
      return (!v || v === '[AI_FILL]') ? '📺' : v;
    }
    // When it aired. The season documents do not carry the calendar — it lives
    // on the row in seasons_database.json — so this reads whichever the page
    // was handed and says nothing when neither has it.
    function _aired(sn) {
      const y = sn.airYear || (window.__seasonRow && window.__seasonRow.airYear);
      const slot = sn.airSlot || (window.__seasonRow && window.__seasonRow.airSlot);

          ${placementsHTML||'<p style="color:var(--muted)">No placement data.</p>'}
        </div>
        <div id="sr-table-view" style="display:none;">
          ${buildStatsTable(s.placements||[])}
        </div>
      </div>

      <div id="sr-panel-wiki" class="sr-panel">${wikiHTML}</div>

      <div id="sr-panel-history" class="sr-panel">
        <div class="sr-sh"><h2>Vote History</h2>${s.votingHistory?`<span class="sr-sh-pill">${s.votingHistory.length} episodes</span>`:''}</div>
        <div class="sr-timeline">${historyHTML}</div>
      </div>
    `;

    // Post-render: cast photo
    const photoEl=document.getElementById('sr-hero-photo');
    const probe=new Image();
    /* Namespaced for every show but Total Drama, which keeps the filenames its
       fourteen images already use. Without this a Big Brother season loaded
       Total Drama's cast photograph for the same number. The probe means a show
       with no photo yet simply keeps its plain hero. */
    const castArt = isDefaultShow ? `s${sn}-cast.png` : `${shows.seasonId(ref.format, sn)}-cast.png`;
    probe.onload=()=>{if(photoEl){photoEl.style.backgroundImage=`url('assets/cast/${castArt}')`;setTimeout(()=>{photoEl.style.opacity='.2';},50);}};
    probe.src=`assets/cast/${castArt}`;

    // Finalist bars
    setTimeout(()=>{document.querySelectorAll('.sr-finalist-bar[data-pct]').forEach(el=>{el.style.width=el.dataset.pct+'%';});},120);

    // Scroll reveal
    const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
    document.querySelectorAll('.sr-reveal').forEach(el=>io.observe(el));

  }catch(err){
    console.error(err);
    document.getElementById('season-content').innerHTML=`<div class="hero"><h1>⚠️ Season Not Found</h1><p>${err.message}</p><p><a href="seasons.html">← Back to Seasons</a></p></div>`;
  }
})();

function srTab(id,btn){
  document.querySelectorAll('.sr-panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.sr-tab').forEach(t=>t.classList.remove('on'));
  const panel=document.getElementById('sr-panel-'+id);
  if(panel)panel.classList.add('on');
  if(btn)btn.classList.add('on');
  setTimeout(()=>{
    const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
    document.querySelectorAll('#sr-panel-'+id+' .sr-reveal').forEach(el=>io.observe(el));
  },50);
}

function srToggle(header){
  const row=header.closest('.sr-placement-row');
  if(row)row.classList.toggle('open');
}

// ── Stats table view ──────────────────────────────────────────
function buildStatsTable(placements){
  if(!placements.length) return '<p style="color:var(--muted)">No data.</p>';
  const COLS=[
    {key:'placement',label:'Place',asc:true},
    {key:'name',label:'Player',asc:true,left:true},
    {key:'phase',label:'Phase',asc:true},
    {key:'challengeWins',label:'CW',title:'Challenge Wins',asc:false},
    {key:'immunityWins',label:'IW',title:'Immunity Wins',asc:false},
    {key:'rewardWins',label:'RW',title:'Reward Wins',asc:false},
    {key:'votesReceived',label:'Votes',title:'Votes Against',asc:true},
    {key:'idolsFound',label:'Idols',asc:false},
    {key:'strategicRank',label:'Strat',title:'Strategic Rank',asc:false},
  ];
  const headCells=COLS.map(c=>
    `<th class="${c.left?'left ':''}sortable" data-key="${c.key}" title="${c.title||c.label}"
       onclick="srSortTable(this,'${c.key}',${c.asc})">${c.label} <span class="sr-sort-arrow">⇅</span></th>`
  ).join('');
  const rows=placements.map(p=>{
    const pc=phaseClass(p.phase);
    const sv=p.strategicRank;
    const sn=parseFloat(sv);
    const stratCell=!isNaN(sn)?
      (()=>{const pct=Math.min(sn/10,1);const hue=Math.round(pct*120);return`<span class="sr-strat-dot" style="background:hsla(${hue},60%,45%,.25);color:hsl(${hue},70%,65%)">${sn}</span>`})()
      :(sv?`<span style="font-size:11px;color:var(--muted)">${sv}</span>`:'<span style="color:rgba(255,255,255,.15)">—</span>');
    const num=v=>(v!=null&&v!==''&&v!==0)?`<strong>${v}</strong>`:`<span style="color:rgba(255,255,255,.15)">—</span>`;
    return`<tr>
      <td><strong>${p.placement}</strong></td>
      <td class="left"><div class="sr-st-player">
        <img class="sr-st-av" src="${srFace(p, p.playerSlug)}" alt="" onerror="this.style.display='none'">
        <a class="sr-st-name" href="player.html?player=${p.playerSlug}">${p.name}</a>
      </div></td>
      <td><span class="sr-p-phase ${pc}" style="font-size:10px;padding:2px 7px">${p.phase||'—'}</span></td>
      <td>${num(p.challengeWins)}</td>
      <td>${num(p.immunityWins)}</td>
      <td>${num(p.rewardWins)}</td>
      <td>${num(p.votesReceived)}</td>
      <td>${num(p.idolsFound)}</td>
      <td>${stratCell}</td>
    </tr>`;
  }).join('');
  return`<div class="sr-stats-wrap"><table class="sr-stats-table" id="srStatsTable">
    <thead><tr>${headCells}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

let _srSortAsc=true;
function srSortTable(th,key,defaultAsc){
  const table=document.getElementById('srStatsTable');
  if(!table)return;
  const sorted=th.classList.contains('sorted');
  _srSortAsc=sorted?!_srSortAsc:defaultAsc;
  table.querySelectorAll('th').forEach(h=>{
    h.classList.remove('sorted');
    const arr=h.querySelector('.sr-sort-arrow');
    if(arr)arr.textContent='⇅';
  });
  th.classList.add('sorted');
  const arr=th.querySelector('.sr-sort-arrow');
  if(arr)arr.textContent=_srSortAsc?'▲':'▼';
  const tbody=table.querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b)=>{
    const ai=Array.from(a.parentElement.children).indexOf(a.closest('tr'));
    // get cell index matching th
    const thIdx=Array.from(th.parentElement.children).indexOf(th);
    const av=a.cells[thIdx]?.textContent.trim()||'';
    const bv=b.cells[thIdx]?.textContent.trim()||'';
    const an=parseFloat(av),bn=parseFloat(bv);
    const numericCol=['Place','CW','IW','RW','Votes','Idols','Strat'].includes(th.textContent.replace('⇅','').replace('▲','').replace('▼','').trim());
    if(numericCol){
      const aa=isNaN(an)?Infinity:an,bb=isNaN(bn)?Infinity:bn;
      return _srSortAsc?aa-bb:bb-aa;
    }
    return _srSortAsc?av.localeCompare(bv):bv.localeCompare(av);
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function srView(mode,btn){
  document.querySelectorAll('.sr-view-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('sr-cards-view').style.display=mode==='cards'?'block':'none';
  document.getElementById('sr-table-view').style.display=mode==='table'?'block':'none';
}
