<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Arial, Helvetica, sans-serif">
  <!-- THE COMMON ROOM, camera view: the house sits on one long U sofa round a fire pit; the vote is said out loud here. -->
  <rect width="1920" height="1080" fill="#2b2b2e"/>
  <!-- back wall: big glass doors to the pool deck and the sea at night or day, a graffiti flame mural -->
  <rect x="0" y="0" width="1920" height="560" fill="#3a3a3f"/>
  <rect x="560" y="80" width="800" height="380" fill="#4fb8d8" stroke="#1b1b1b" stroke-width="10"/>
  <g stroke="#1b1b1b" stroke-width="8"><line x1="760" y1="80" x2="760" y2="460"/><line x1="960" y1="80" x2="960" y2="460"/><line x1="1160" y1="80" x2="1160" y2="460"/></g>
  <path d="M60 470 C 120 300, 200 360, 230 200 C 300 330, 380 260, 420 120 C 470 300, 520 380, 500 470 Z" fill="#ff6a1a" opacity="0.85"/>
  <path d="M1500 470 C 1540 330, 1620 380, 1650 220 C 1720 330, 1780 280, 1820 160 C 1880 330, 1900 400, 1880 470 Z" fill="#ff6a1a" opacity="0.85"/>
  <rect x="600" y="20" width="720" height="44" fill="#111"/><text x="960" y="52" font-size="26" fill="#ff8a3d" text-anchor="middle" font-weight="800">neon sign over the glass (no readable text needed)</text>
  <!-- floor -->
  <rect x="0" y="560" width="1920" height="520" fill="#5a4a3e"/>
  <!-- the U sofa (sunken): back row across the room, two arms coming toward the camera -->
  <path d="M260 560 L 1660 560 L 1660 640 L 340 640 Z" fill="#c8431f"/>
  <path d="M260 560 L 340 640 L 260 1000 L 120 1000 Z" fill="#b53a1a"/>
  <path d="M1660 560 L 1580 640 L 1660 1000 L 1800 1000 Z" fill="#b53a1a"/>
  <!-- seats: where people sit (S = seat). 10 across the back, 5 on each arm. -->
  <g fill="#ffd64a" font-size="18" font-weight="800" text-anchor="middle">
    <g id="back"><circle cx="400" cy="600" r="16"/><circle cx="530" cy="600" r="16"/><circle cx="660" cy="600" r="16"/><circle cx="790" cy="600" r="16"/><circle cx="920" cy="600" r="16"/>
      <circle cx="1050" cy="600" r="16"/><circle cx="1180" cy="600" r="16"/><circle cx="1310" cy="600" r="16"/><circle cx="1440" cy="600" r="16"/><circle cx="1560" cy="600" r="16"/></g>
    <circle cx="270" cy="680" r="16"/><circle cx="250" cy="760" r="16"/><circle cx="230" cy="840" r="16"/><circle cx="210" cy="920" r="16"/><circle cx="195" cy="985" r="16"/>
    <circle cx="1650" cy="680" r="16"/><circle cx="1670" cy="760" r="16"/><circle cx="1690" cy="840" r="16"/><circle cx="1710" cy="920" r="16"/><circle cx="1725" cy="985" r="16"/>
  </g>
  <!-- the fire pit in the middle, and where the one speaking stands -->
  <ellipse cx="960" cy="800" rx="230" ry="70" fill="#444"/><ellipse cx="960" cy="790" rx="170" ry="45" fill="#ff8a1a"/>
  <circle cx="960" cy="690" r="18" fill="#3fd0ff"/><text x="960" y="672" font-size="18" fill="#3fd0ff" text-anchor="middle" font-weight="800">SPEAKER STANDS</text>
  <circle cx="960" cy="1010" r="20" fill="#fff"/><text x="1000" y="1018" font-size="22" fill="#fff" font-weight="800">TJ (open side, facing the house)</text>
  <text x="40" y="1060" font-size="20" fill="#ddd">Yellow dots = seats (20). Keep the sofa seats empty and visible; nobody painted in.</text>
</svg>
