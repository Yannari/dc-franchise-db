<!doctype html>
<html><head><meta charset="utf-8"><title>Who Should Go Home — mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2d55;--pink:#ff7bc8;--gold:#ffd66b}
body{margin:0;background:#0b0208;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.wsg{position:relative;width:1080px;height:560px;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -20px #000,inset 0 0 0 1px rgba(255,45,85,.3)}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,0,8,.55),rgba(20,0,8,.85)),url(../assets/sets/dr/lipsync.webp) center 35%/cover;filter:saturate(.8)}
.wash{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0,rgba(255,45,85,.35),transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.title{position:absolute;top:18px;left:0;right:0;text-align:center;font:400 46px/1 Anton,Impact,sans-serif;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 6px var(--red),0 0 22px var(--red),0 0 44px rgba(255,45,85,.6);animation:flick 5s infinite}
.title small{display:block;margin-top:6px;font:600 11px/1 system-ui;letter-spacing:.4em;color:#ffb3c4;text-shadow:none}
@keyframes flick{0%,94%,100%{opacity:1}95%{opacity:.4}96.5%{opacity:1}97.5%{opacity:.6}}
.host{position:absolute;top:18px;right:20px;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:rgba(0,0,0,.5);border:1px solid rgba(255,214,107,.5);font:600 10px system-ui;letter-spacing:.2em}
.host i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe9a8,#c9932b);box-shadow:0 0 14px rgba(255,214,107,.7)}
.line{position:absolute;left:60px;right:60px;bottom:150px;display:flex;justify-content:space-between;align-items:flex-end}
.q{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:120px;transition:transform .6s cubic-bezier(.2,1.3,.4,1),filter .5s}
.q img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:center 20%;background:#2a0a18;box-shadow:0 0 0 3px rgba(255,255,255,.25),0 12px 30px rgba(0,0,0,.7)}
.q b{font:400 15px/1 Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.q.dim{filter:brightness(.45) saturate(.6)}
.q.up{transform:translateY(-34px) scale(1.18);filter:none;z-index:3}
.q.up img{box-shadow:0 0 0 4px #fff,0 0 40px 8px rgba(255,255,255,.55)}
.q.up::before{content:'';position:absolute;bottom:-60px;left:50%;width:240px;height:420px;transform:translateX(-50%);z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 80%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.q.hit{animation:hit .5s 2}
.q.hit img{box-shadow:0 0 0 4px var(--red),0 0 40px 8px rgba(255,45,85,.7)}
@keyframes hit{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pips{position:absolute;top:-20px;display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:2px;background:var(--red);box-shadow:0 0 8px var(--red);transform:rotate(45deg);animation:pip .5s backwards}
@keyframes pip{from{transform:rotate(45deg) scale(3);opacity:0}}
.tag{position:absolute;top:-46px;padding:3px 10px;border:3px solid var(--red);border-radius:6px;color:var(--red);font:400 16px/1 Anton,Impact;letter-spacing:.12em;transform:rotate(-8deg);background:rgba(0,0,0,.6);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}}
svg.laser{position:absolute;inset:0;pointer-events:none;z-index:4}
svg.laser path{stroke:var(--red);stroke-width:4;fill:none;filter:drop-shadow(0 0 6px var(--red));stroke-dasharray:900;stroke-dashoffset:900;animation:draw .7s .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card{position:absolute;left:50%;bottom:22px;width:760px;transform:translateX(-50%);padding:14px 20px;border-radius:14px;background:rgba(10,0,6,.85);
  border:1px solid rgba(255,45,85,.45);box-shadow:0 0 30px rgba(255,45,85,.25)}
.card .who{font:600 10px/1 system-ui;letter-spacing:.3em;color:#ff9db3;text-transform:uppercase}
.card p{margin:6px 0 0;font:500 19px/1.35 Georgia,serif}
.card .chip{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;background:var(--red);font:700 10px system-ui;letter-spacing:.2em;text-transform:uppercase}
.board{position:absolute;inset:110px 140px 120px;display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:center}
.board .top{text-align:center}
.board .top img{width:160px;height:160px;border-radius:50%;object-fit:cover;object-position:center 20%;box-shadow:0 0 0 5px var(--red),0 0 60px 14px rgba(255,45,85,.6)}
.board .top b{display:block;margin-top:10px;font:400 26px Anton,Impact;letter-spacing:.06em}
.board .top span{font:400 64px/1 Anton,Impact;color:var(--red);text-shadow:0 0 20px var(--red)}
.board .rows{display:flex;flex-direction:column;gap:10px}
.board .row{display:flex;align-items:center;gap:10px}
.board .row img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.board .row .bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.board .row .bar i{display:block;height:100%;background:linear-gradient(90deg,#a3002a,var(--red));box-shadow:0 0 12px var(--red)}
.board .row small{font:12px system-ui;color:#ffb3c4;width:230px}
</style></head><body>
<div class="wsg" id="s"></div>
<script>
const A = n => `../assets/avatars/${n}.png`;
const Q = ['heather', 'gwen', 'courtney', 'lindsay', 'duncan', 'alejandro'];
const N = n => n[0].toUpperCase() + n.slice(1);
const states = {
  ask: { up: 'heather', card: ['The host', '"Heather. Who should go home tonight, and why?"'], pips: {} },
  name: { up: 'heather', hit: 'gwen', laser: ['heather', 'gwen'], card: ['Heather', '"Gwen. That was not a runway look, that was a costume someone forgot to finish."', 'her runway look'], pips: { gwen: 1 } },
  react: { up: 'gwen', card: ['Gwen', '"Wow. Okay. Noted, Heather."'], pips: { gwen: 1 }, tag: 'gwen' },
  board: { board: true },
};
function draw(k) {
  const st = states[k];
  const el = document.getElementById('s');
  const idx = n => Q.indexOf(n);
  const x = n => 60 + 60 + idx(n) * ((1080 - 240) / (Q.length - 1));
  el.innerHTML = `<div class="bg"></div><div class="wash"></div>
    <div class="title">WHO SHOULD GO HOME?<small>the host asks the room, out loud</small></div>
    <div class="host"><i></i>THE HOST</div>
    ${st.board ? `<div class="board"><div class="top"><img src="${A('gwen')}"><b>GWEN</b><span>3</span></div>
      <div class="rows">${[['gwen', 3, 'her runway look'], ['lindsay', 2, 'her performance in the challenge'], ['duncan', 1, 'she is my biggest competition']].map(([n, c, w]) =>
        `<div class="row"><img src="${A(n)}"><div class="bar"><i style="width:${c / 3 * 100}%"></i></div><b>${c}</b><small>${w}</small></div>`).join('')}</div></div>
      <div class="card"><div class="who">The host</div><p>"Thank you, ladies. The judges and I will now deliberate."</p></div>`
    : `<div class="line">${Q.map(n => `<div class="q ${st.up === n ? 'up' : st.hit === n ? 'hit' : 'dim'}">
        ${st.pips[n] ? `<span class="pips">${'<i></i>'.repeat(st.pips[n])}</span>` : ''}
        ${st.tag === n ? '<span class="tag">NAMED</span>' : ''}
        <img src="${A(n)}"><b>${N(n)}</b></div>`).join('')}</div>
      ${st.laser ? `<svg class="laser" viewBox="0 0 1080 560"><path d="M${x(st.laser[0])} 330 Q ${(x(st.laser[0]) + x(st.laser[1])) / 2} 170 ${x(st.laser[1])} 330"/></svg>` : ''}
      <div class="card"><div class="who">${st.card[0]}</div><p>${st.card[1]}</p>${st.card[2] ? `<span class="chip">${st.card[2]}</span>` : ''}</div>`}`;
}
draw(new URLSearchParams(location.search).get('s') || 'ask');
</script></body></html>
